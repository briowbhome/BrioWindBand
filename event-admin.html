  document.getElementById('rosterSelectAllBtn').addEventListener('click', function(){
    (approvedMembers || []).forEach(function(m){ rosterDraftSet[m.uid] = true; });
    renderRosterChecklist();
    updateRosterCounter();
  });

  document.getElementById('rosterClearAllBtn').addEventListener('click', function(){
    rosterDraftSet = {};
    renderRosterChecklist();
    updateRosterCounter();
  });

  rosterSaveBtn.addEventListener('click', function(){
    if (!openRosterEventId) return;
    var eventId = openRosterEventId;
    var members = Object.keys(rosterDraftSet);
    var isNew = !rostersById[eventId];
    var payload = { members: members, updatedAt: serverTimestamp() };
    if (isNew) payload.createdBy = currentAdminUid;
    rosterSaveBtn.disabled = true;
    setDoc(doc(db, 'eventRosters', eventId), payload, { merge: true }).then(function(){
      // 保險：搶在 eventRosters 的 onSnapshot 回來前，先用剛存的結果更新本地資料，
      // 讓緊接著呼叫的 showRosterView() 不會顯示存檔前的舊人數；手動編輯不寫入 sourceTemplateId／
      // surveyOpenedAt 這兩個欄位（merge 寫入不會動到它們），本地快取也保留原值，不讓「來源範本」
      // 資訊列或「調查進行中」狀態因為手動存名單而閃爍消失
      rostersById[eventId] = {
        members: members,
        sourceTemplateId: (rostersById[eventId] && rostersById[eventId].sourceTemplateId) || null,
        surveyOpenedAt: (rostersById[eventId] && rostersById[eventId].surveyOpenedAt) || null
      };
      showRosterView(); // 存檔後回到唯讀摘要，不關閉整個活動明細 sheet，方便接著切去其他分頁
    }).catch(function(err){
      alert('儲存失敗：' + err.code);
      rosterSaveBtn.disabled = false;
    });
  });

  document.getElementById('rosterCancelBtn').addEventListener('click', function(){
    showRosterView(); // 取消名單編輯，回到唯讀摘要，不關閉整個 sheet
  });
  document.getElementById('rosterSheetClose').addEventListener('click', closeRosterSheet);
  rosterSheetOverlay.addEventListener('click', function(e){
    if (e.target === rosterSheetOverlay) closeRosterSheet();
  });


  // ---------- 簽到分頁（原 checkin-admin.html，併入後只服務目前開啟的這一場活動，
  // 不再監聽整個 checkinSessions collection——sheet 開啟/切分頁時才一次性抓當下這場活動的資料，
  // 操作後重新抓一次同一份文件重繪，不需要處理監聽器的訂閱/取消訂閱生命週期） ----------
  var CHECKIN_WINDOW_MINUTES = 30;
  // 簽到名單的遲到門檻，之後想調整標準改這兩個數字就好（跟原本 checkin-admin.html 的門檻一致）
  var CHECKIN_LATE_MINUTES = 15;
  var CHECKIN_VERY_LATE_MINUTES = 30;

  var checkinSessionSlot = document.getElementById('checkinSessionSlot');
  var checkinListSlot = document.getElementById('checkinListSlot');
  var qrZoomOverlay = document.getElementById('qrZoomOverlay');
  var qrZoomImg = document.getElementById('qrZoomImg');

  // 手動新增簽到（多選）：跟 rosterDraftSet 同樣的草稿物件模式，但獨立一組狀態，不共用 roster 那份
  var checkinAvailableMembers = []; // 目前尚未簽到的已核准團員，loadCheckinList() 抓完 checkins 後算出來
  var checkinAddDraftSet = {}; // {uid: true}
  var checkinAddToggleBtn = document.getElementById('checkinAddToggleBtn');
  var checkinAddPanel = document.getElementById('checkinAddPanel');
  var checkinAddChecklist = document.getElementById('checkinAddChecklist');
  var checkinAddCounter = document.getElementById('checkinAddCounter');
  var checkinAddConfirmBtn = document.getElementById('checkinAddConfirmBtn');

  document.getElementById('tabCheckin').addEventListener('click', function(){
    if (!openRosterEventId) return;
    if (editingId) enterCreateMode(); // 放棄任何還沒存檔的活動資訊編輯草稿
    showRosterView(); // 保險：確保離開「名單調整」時放棄任何未存檔的草稿
    setSheetTab('checkin');
    loadCheckinTab(openRosterEventId);
  });

  function qrDataUrl(text){
    var qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    return qr.createDataURL(6, 8);
  }

  function checkinUrl(eventId, code){
    return location.origin + location.pathname.replace(/event-admin\.html$/, '') +
      'checkin.html?event=' + encodeURIComponent(eventId) + '&code=' + encodeURIComponent(code);
  }

  function renderCheckinSession(eventId, session){
    if (!session){
      checkinSessionSlot.innerHTML =
        '<div class="checkin-start">' +
          '<p>這場活動還沒開放簽到</p>' +
          '<button type="button" class="btn-checkin-start" id="checkinStartBtn">產生 QR</button>' +
        '</div>';
      return;
    }
    var windowEnd = session.windowEnd && session.windowEnd.toDate ? session.windowEnd.toDate() : new Date(0);
    var isExpired = windowEnd <= new Date();
    var expiryLabel = isExpired
      ? '已於 ' + windowEnd.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false }) + ' 過期'
      : '開放至 ' + windowEnd.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false });

    checkinSessionSlot.innerHTML = (
      '<div class="qr-panel' + (isExpired ? ' expired-style' : '') + '">' +
        '<div class="staff-bg"></div>' +
        '<div class="qr-panel-inner">' +
          '<div class="qr-status-row">' +
            '<span class="status-chip ' + (isExpired ? 'expired' : 'active') + '">' + (isExpired ? '已過期' : expiryLabel) + '</span>' +
          '</div>' +
          (isExpired ? '' :
            '<div class="qr-wrap"><img src="' + qrDataUrl(checkinUrl(eventId, session.code)) + '" alt="簽到 QR Code"></div>'
          ) +
          '<div class="qr-actions">' +
            '<button type="button" class="btn-reopen" data-checkin-reopen>重設 30 分鐘</button>' +
            '<button type="button" class="btn-regen" data-checkin-regen>產生新的 QR</button>' +
            '<button type="button" class="btn-end" data-checkin-end>✕ 結束</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function randomCheckinCode(){
    return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }

  async function startCheckinSession(eventId){
    await setDoc(doc(db, 'checkinSessions', eventId), {
      code: randomCheckinCode(),
      windowEnd: Timestamp.fromMillis(Date.now() + CHECKIN_WINDOW_MINUTES * 60000),
      generatedAt: serverTimestamp(),
      generatedBy: currentAdminUid
    });
  }

  async function reopenCheckinSession(eventId){
    var ref = doc(db, 'checkinSessions', eventId);
    var snap = await getDoc(ref);
    if (!snap.exists()){
      await startCheckinSession(eventId);
      return;
    }
    await setDoc(ref, {
      windowEnd: Timestamp.fromMillis(Date.now() + CHECKIN_WINDOW_MINUTES * 60000),
      generatedAt: serverTimestamp(),
      generatedBy: currentAdminUid
    }, { merge: true });
  }

  async function endCheckinSession(eventId){
    await deleteDoc(doc(db, 'checkinSessions', eventId));
  }

  // 只在第一次點進「簽到」分頁時使用（會先清空成「載入中…」，這時面板本來就是空的，不會有跳動問題）
  async function loadCheckinTab(eventId){
    checkinSessionSlot.innerHTML = '<div class="survey-empty">載入中…</div>';
    await refreshCheckinSession(eventId);
    loadCheckinList(eventId);
  }

  // 產生/延長/重新產生/結束操作後的刷新用這個——不清空成「載入中…」，直接拿新資料換掉舊內容，
  // 避免「先清空再填回」造成的版面跳動；這幾個操作也不會動到 checkins，所以不連帶重抓簽到名單
  async function refreshCheckinSession(eventId){
    try {
      var snap = await getDoc(doc(db, 'checkinSessions', eventId));
      if (openRosterEventId !== eventId) return;
      renderCheckinSession(eventId, snap.exists() ? snap.data() : null);
    } catch (err) {
      if (openRosterEventId === eventId) checkinSessionSlot.innerHTML = '<div class="survey-empty">載入失敗（' + err.code + '）</div>';
    }
  }

  checkinSessionSlot.addEventListener('click', function(e){
    var eventId = openRosterEventId;
    if (!eventId) return;

    var img = e.target.closest('.qr-wrap img');
    if (img){
      qrZoomImg.src = img.src;
      qrZoomOverlay.classList.add('active');
      return;
    }

    var startBtn = e.target.closest('#checkinStartBtn');
    if (startBtn){
      var evt = eventsById[eventId];
      var ok = confirm('確定要幫「' + (evt ? evt.title : '這場活動') + '」開啟簽到嗎？');
      if (!ok) return;
      startBtn.disabled = true;
      startCheckinSession(eventId).then(function(){
        if (openRosterEventId === eventId) refreshCheckinSession(eventId);
      }).catch(function(err){
        alert('產生失敗：' + err.code);
        startBtn.disabled = false;
      });
      return;
    }

    var reopenBtn = e.target.closest('[data-checkin-reopen]');
    if (reopenBtn){
      reopenBtn.disabled = true;
      reopenCheckinSession(eventId).then(function(){
        if (openRosterEventId === eventId) refreshCheckinSession(eventId);
      }).catch(function(err){
        alert('操作失敗：' + err.code);
        reopenBtn.disabled = false;
      });
      return;
    }

    var regenBtn = e.target.closest('[data-checkin-regen]');
    if (regenBtn){
      regenBtn.disabled = true;
      startCheckinSession(eventId).then(function(){
        if (openRosterEventId === eventId) refreshCheckinSession(eventId);
      }).catch(function(err){
        alert('操作失敗：' + err.code);
        regenBtn.disabled = false;
      });
      return;
    }

    var endBtn = e.target.closest('[data-checkin-end]');
    if (endBtn){
      endBtn.disabled = true;
      endCheckinSession(eventId).then(function(){
        if (openRosterEventId === eventId) refreshCheckinSession(eventId);
      }).catch(function(err){
        alert('操作失敗：' + err.code);
        endBtn.disabled = false;
      });
      return;
    }
  });

  qrZoomOverlay.addEventListener('click', function(){
    qrZoomOverlay.classList.remove('active');
  });

  function formatCheckinTime(checkedInAt, eventDate){
    var label = checkedInAt.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false });
    if (!eventDate) return { label: label, cls: 'ontime' };
    var lateMinutes = (checkedInAt.getTime() - eventDate.getTime()) / 60000;
    var cls = lateMinutes <= CHECKIN_LATE_MINUTES ? 'ontime' : (lateMinutes <= CHECKIN_VERY_LATE_MINUTES ? 'late' : 'verylate');
    return { label: label, cls: cls };
  }

  async function loadCheckinList(eventId){
    checkinListSlot.innerHTML = '<div class="survey-empty">載入中…</div>';
    hideCheckinAddPanel(); // 名單要重新整理了，先收合新增面板，避免殘留上一次的勾選草稿或過期的可選名單
    try {
      var snap = await getDocs(query(collection(db, 'checkins'), where('eventId', '==', eventId)));
      if (openRosterEventId !== eventId) return;

      var rows = snap.docs.map(function(docSnap){ return Object.assign({ checkinId: docSnap.id }, docSnap.data()); });
      rows.sort(function(a, b){
        var ta = a.checkedInAt && a.checkedInAt.toDate ? a.checkedInAt.toDate().getTime() : 0;
        var tb = b.checkedInAt && b.checkedInAt.toDate ? b.checkedInAt.toDate().getTime() : 0;
        return ta - tb;
      });

      var evt = eventsById[eventId];
      var eventDate = evt ? evt.date : null;
      var checkedInUids = {};
      rows.forEach(function(r){ checkedInUids[r.uid] = true; });

      var rowsHtml = rows.length === 0
        ? '<div class="ci-empty">目前還沒有人簽到</div>'
        : '<div class="ci-summary"><span>已簽到</span><span>' + rows.length + ' 人</span></div>' +
          rows.map(function(r){
            var checkedInAt = r.checkedInAt && r.checkedInAt.toDate ? r.checkedInAt.toDate() : null;
            var timeInfo = checkedInAt ? formatCheckinTime(checkedInAt, eventDate) : { label: '—', cls: 'ontime' };
            var methodLabel = r.method === 'manual' ? '手動補登' : '掃碼';
            return (
              '<div class="ci-row">' +
                '<div style="flex:1;min-width:0;">' +
                  '<div class="ci-name">' + escapeHtml(r.name || r.account || '未知') + '</div>' +
                  '<div class="ci-sub">' + escapeHtml(r.account || '') + ' · ' + methodLabel + '</div>' +
                '</div>' +
                '<div class="ci-time ' + timeInfo.cls + '">' + timeInfo.label + '</div>' +
                '<button type="button" class="ci-remove" data-checkin-remove="' + r.checkinId + '" aria-label="移除">×</button>' +
              '</div>'
            );
          }).join('');

      var members = await ensureApprovedMembers();
      if (openRosterEventId !== eventId) return;
      checkinAvailableMembers = members.filter(function(m){ return !checkedInUids[m.uid]; });

      checkinListSlot.innerHTML = rowsHtml;
    } catch (err) {
      if (openRosterEventId === eventId) checkinListSlot.innerHTML = '<div class="ci-empty">載入失敗（' + err.code + '）</div>';
    }
  }

  async function addManualCheckin(eventId, targetUid){
    var member = (approvedMembers || []).find(function(m){ return m.uid === targetUid; });
    if (!member) return;
    var checkinId = eventId + '_' + targetUid;
    await setDoc(doc(db, 'checkins', checkinId), {
      eventId: eventId,
      uid: targetUid,
      account: member.account,
      name: member.name,
      checkedInAt: serverTimestamp(),
      method: 'manual',
      recordedBy: currentAdminUid
    });
  }

  checkinListSlot.addEventListener('click', function(e){
    var eventId = openRosterEventId;
    if (!eventId) return;

    var removeBtn = e.target.closest('[data-checkin-remove]');
    if (removeBtn){
      var checkinId = removeBtn.getAttribute('data-checkin-remove');
      var ok = confirm('確定要移除這筆簽到紀錄嗎？此動作無法復原。');
      if (!ok) return;
      removeBtn.disabled = true;
      deleteDoc(doc(db, 'checkins', checkinId)).then(function(){
        if (openRosterEventId === eventId) loadCheckinList(eventId);
      }).catch(function(err){
        alert('移除失敗：' + err.code);
        removeBtn.disabled = false;
      });
      return;
    }
  });

  // ---------- 手動新增簽到（多選勾選清單，比照 rosterDraftSet/renderRosterChecklist 那套既有模式） ----------
  function hideCheckinAddPanel(){
    checkinAddPanel.classList.add('hidden');
    checkinAddDraftSet = {};
  }

  function renderCheckinAddChecklist(){
    checkinAddChecklist.innerHTML = checkinAvailableMembers.map(function(m){
      var on = !!checkinAddDraftSet[m.uid];
      return (
        '<div class="check-row">' +
          '<button type="button" class="checkbox' + (on ? ' on' : '') + '" data-checkin-add-uid="' + m.uid + '">' + (on ? '✓' : '') + '</button>' +
          '<button type="button" class="check-text" data-checkin-add-uid="' + m.uid + '">' + escapeHtml(m.name) + '（' + escapeHtml(m.account) + '）</button>' +
        '</div>'
      );
    }).join('');
  }

  function updateCheckinAddCounter(){
    var count = Object.keys(checkinAddDraftSet).length;
    checkinAddCounter.textContent = '已選 ' + count + ' 人';
    checkinAddConfirmBtn.disabled = count === 0;
  }

  checkinAddToggleBtn.addEventListener('click', function(){
    if (!openRosterEventId) return;
    if (checkinAvailableMembers.length === 0){
      alert('目前已經沒有可以手動新增的人了');
      return;
    }
    checkinAddDraftSet = {};
    renderCheckinAddChecklist();
    updateCheckinAddCounter();
    checkinAddPanel.classList.remove('hidden');
  });

  document.getElementById('checkinAddCancelBtn').addEventListener('click', hideCheckinAddPanel);

  document.getElementById('checkinAddSelectAllBtn').addEventListener('click', function(){
    checkinAvailableMembers.forEach(function(m){ checkinAddDraftSet[m.uid] = true; });
    renderCheckinAddChecklist();
    updateCheckinAddCounter();
  });

  document.getElementById('checkinAddClearAllBtn').addEventListener('click', function(){
    checkinAddDraftSet = {};
    renderCheckinAddChecklist();
    updateCheckinAddCounter();
  });

  checkinAddChecklist.addEventListener('click', function(e){
    var btn = e.target.closest('[data-checkin-add-uid]');
    if (!btn) return;
    var uid = btn.getAttribute('data-checkin-add-uid');
    if (checkinAddDraftSet[uid]) delete checkinAddDraftSet[uid]; else checkinAddDraftSet[uid] = true;
    var row = btn.closest('.check-row');
    var checkboxEl = row.querySelector('.checkbox');
    var on = !!checkinAddDraftSet[uid];
    checkboxEl.classList.toggle('on', on);
    checkboxEl.textContent = on ? '✓' : '';
    updateCheckinAddCounter();
  });

  checkinAddConfirmBtn.addEventListener('click', function(){
    var eventId = openRosterEventId;
    if (!eventId) return;
    var uids = Object.keys(checkinAddDraftSet);
    if (uids.length === 0) return;
    checkinAddConfirmBtn.disabled = true;
    Promise.all(uids.map(function(uid){ return addManualCheckin(eventId, uid); })).then(function(){
      hideCheckinAddPanel();
      if (openRosterEventId === eventId) loadCheckinList(eventId);
    }).catch(function(err){
      alert('新增失敗：' + err.code);
      checkinAddConfirmBtn.disabled = false;
    });
  });

  // ---------- 手動新增出缺席回報（多選勾選清單＋出席/請假選擇，比照「手動新增簽到」
  // 那套既有模式，差別是回報還要多選一個狀態，選單只列「應到名單內、還沒回報」的人，
  // 跟 renderReportsSlot() 的 notReported 同一套邏輯，這裡另外算一次含姓名/帳號的版本 ----------
  var reportAddStatus = 'attending';
  var reportAddDraftSet = {}; // {uid: true}
  var reportAvailableMembers = []; // 目前尚未回報、且還在應到名單內的已核准團員
  var reportAddToggleBtn = document.getElementById('reportAddToggleBtn');
  var reportAddPanel = document.getElementById('reportAddPanel');
  var reportAddChecklist = document.getElementById('reportAddChecklist');
  var reportAddCounter = document.getElementById('reportAddCounter');
  var reportAddConfirmBtn = document.getElementById('reportAddConfirmBtn');
  var reportAddReasonInput = document.getElementById('reportAddReasonInput');
  var reportAddStatusPicker = document.getElementById('reportAddStatusPicker');

  function computeReportAvailableMembers(eventId){
    var roster = rostersById[eventId];
    var reports = reportsByEvent[eventId] || [];
    var reportedUids = {};
    reports.forEach(function(r){ reportedUids[r.uid] = true; });
    var namesByUid = {};
    (approvedMembers || []).forEach(function(m){ namesByUid[m.uid] = m; });
    return (roster ? roster.members : [])
      .filter(function(uid){ return !reportedUids[uid]; })
      .map(function(uid){
        var m = namesByUid[uid];
        return { uid: uid, name: m ? m.name : uid, account: m ? m.account : '' };
      });
  }

  function resetReportAddStatusPicker(){
    reportAddStatus = 'attending';
    reportAddReasonInput.value = '';
    reportAddReasonInput.classList.add('hidden');
    reportAddStatusPicker.querySelectorAll('[data-report-add-status]').forEach(function(btn){
      btn.classList.toggle('selected', btn.getAttribute('data-report-add-status') === 'attending');
    });
  }

  function hideReportAddPanel(){
    reportAddPanel.classList.add('hidden');
    reportAddDraftSet = {};
    resetReportAddStatusPicker();
  }

  function renderReportAddChecklist(){
    reportAddChecklist.innerHTML = reportAvailableMembers.map(function(m){
      var on = !!reportAddDraftSet[m.uid];
      return (
        '<div class="check-row">' +
          '<button type="button" class="checkbox' + (on ? ' on' : '') + '" data-report-add-uid="' + m.uid + '">' + (on ? '✓' : '') + '</button>' +
          '<button type="button" class="check-text" data-report-add-uid="' + m.uid + '">' + escapeHtml(m.name) + '（' + escapeHtml(m.account) + '）</button>' +
        '</div>'
      );
    }).join('');
  }

  function updateReportAddCounter(){
    var count = Object.keys(reportAddDraftSet).length;
    reportAddCounter.textContent = '已選 ' + count + ' 人';
    reportAddConfirmBtn.disabled = count === 0;
  }

  reportAddToggleBtn.addEventListener('click', function(){
    var eventId = openRosterEventId;
    if (!eventId) return;
    reportAvailableMembers = computeReportAvailableMembers(eventId);
    if (reportAvailableMembers.length === 0){
      alert('應到名單內的人都已經回報過了，沒有可以手動新增的對象');
      return;
    }
    reportAddDraftSet = {};
    resetReportAddStatusPicker();
    renderReportAddChecklist();
    updateReportAddCounter();
    reportAddPanel.classList.remove('hidden');
  });

  document.getElementById('reportAddCancelBtn').addEventListener('click', hideReportAddPanel);

  document.getElementById('reportAddSelectAllBtn').addEventListener('click', function(){
    reportAvailableMembers.forEach(function(m){ reportAddDraftSet[m.uid] = true; });
    renderReportAddChecklist();
    updateReportAddCounter();
  });

  document.getElementById('reportAddClearAllBtn').addEventListener('click', function(){
    reportAddDraftSet = {};
    renderReportAddChecklist();
    updateReportAddCounter();
  });

  reportAddChecklist.addEventListener('click', function(e){
    var btn = e.target.closest('[data-report-add-uid]');
    if (!btn) return;
    var uid = btn.getAttribute('data-report-add-uid');
    if (reportAddDraftSet[uid]) delete reportAddDraftSet[uid]; else reportAddDraftSet[uid] = true;
    var row = btn.closest('.check-row');
    var checkboxEl = row.querySelector('.checkbox');
    var on = !!reportAddDraftSet[uid];
    checkboxEl.classList.toggle('on', on);
    checkboxEl.textContent = on ? '✓' : '';
    updateReportAddCounter();
  });

  reportAddStatusPicker.addEventListener('click', function(e){
    var btn = e.target.closest('[data-report-add-status]');
    if (!btn) return;
    reportAddStatus = btn.getAttribute('data-report-add-status');
    reportAddStatusPicker.querySelectorAll('[data-report-add-status]').forEach(function(b){
      b.classList.toggle('selected', b === btn);
    });
    reportAddReasonInput.classList.toggle('hidden', reportAddStatus !== 'leave');
  });

  async function addManualReport(eventId, targetUid, status, reason){
    var member = (approvedMembers || []).find(function(m){ return m.uid === targetUid; });
    await setDoc(doc(db, 'attendanceReports', eventId + '_' + targetUid), {
      eventId: eventId,
      uid: targetUid,
      account: member ? member.account : '',
      name: member ? member.name : '',
      status: status,
      reason: status === 'leave' ? reason : '',
      respondedAt: serverTimestamp()
    });
  }

  reportAddConfirmBtn.addEventListener('click', function(){
    var eventId = openRosterEventId;
    if (!eventId) return;
    var uids = Object.keys(reportAddDraftSet);
    if (uids.length === 0) return;
    var status = reportAddStatus;
    var reason = reportAddReasonInput.value.trim();
    reportAddConfirmBtn.disabled = true;
    Promise.all(uids.map(function(uid){ return addManualReport(eventId, uid, status, reason); })).then(function(){
      hideReportAddPanel();
      if (openRosterEventId === eventId) loadReports(eventId);
    }).catch(function(err){
      alert('新增失敗：' + err.code);
      reportAddConfirmBtn.disabled = false;
    });
  });

  async function loadReports(eventId){
    hideReportAddPanel(); // 資料要重新整理了，先收合新增面板，避免殘留上一次的勾選草稿或過期的可選名單
    try {
      var snap = await getDocs(query(collection(db, 'attendanceReports'), where('eventId', '==', eventId)));
      reportsByEvent[eventId] = snap.docs.map(function(d){ return d.data(); });
      if (openRosterEventId === eventId){ renderReportsSlot(); renderSurveyToggle(); }
    } catch (err) {
      if (openRosterEventId === eventId) rosterReportsSlot.innerHTML = '<div class="survey-empty">載入失敗（' + err.code + '）</div>';
    }
  }

  // 幹部手動發起/關閉出缺席調查：名單存在不等於調查已發起，兩者刻意拆成獨立狀態，
  // 首頁的橫幅/通知中心只看 surveyOpenedAt，不看名單本身存不存在。
  // 按鈕位置比照「簽到」分頁「簽到名單」標題旁的「＋ 手動新增簽到」，跟標題同一列靠右
  // （沿用既有的 .survey-section-row/.add-btn，不用自己兜版型，也不會再有對不齊的問題）
  function renderSurveyToggle(){
    var eventId = openRosterEventId;
    if (!eventId) return;
    var slot = document.getElementById('surveyToggleSlot');
    var hint = document.getElementById('surveyToggleHint');
    var roster = rostersById[eventId];

    if (roster && roster.surveyOpenedAt){
      var d = roster.surveyOpenedAt;
      var timeText = (d.getMonth() + 1) + '/' + d.getDate() + ' ' +
        d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
      slot.innerHTML = '<button type="button" class="add-btn" id="surveyCloseBtn">關閉調查</button>';
      hint.textContent = '已於 ' + timeText + ' 發起';
      hint.classList.remove('hidden');
      document.getElementById('surveyCloseBtn').addEventListener('click', function(){
        // 單純的開關，隨時可以再重新發起，不是不可逆動作，不需要 confirm 擋一次
        setDoc(doc(db, 'eventRosters', eventId), { surveyOpenedAt: null }, { merge: true })
          .catch(function(err){ alert('關閉失敗（' + err.code + '），請再試一次'); });
      });
    } else {
      slot.innerHTML = '<button type="button" class="add-btn" id="surveyStartBtn">發起調查</button>';
      hint.classList.add('hidden');
      hint.textContent = '';
      document.getElementById('surveyStartBtn').addEventListener('click', function(){
        if (!roster || !roster.members || roster.members.length === 0){
          alert('請先到「參與名單」分頁建立名單後再發起調查');
          return;
        }
        setDoc(doc(db, 'eventRosters', eventId), { surveyOpenedAt: serverTimestamp() }, { merge: true })
          .catch(function(err){ alert('發起失敗（' + err.code + '），請再試一次'); });
      });
    }
  }

  function renderReportEditForm(r){
    var draft = reportEditDraft;
    return (
      '<div class="survey-edit-form">' +
        '<div class="status-picker">' +
          '<button type="button" class="status-chip-btn attending' + (draft.status === 'attending' ? ' selected' : '') + '" data-edit-status="attending">出席</button>' +
          '<button type="button" class="status-chip-btn leave' + (draft.status === 'leave' ? ' selected' : '') + '" data-edit-status="leave">請假</button>' +
        '</div>' +
        '<textarea data-edit-reason placeholder="請假原因（選填）">' + escapeHtml(draft.reason) + '</textarea>' +
        '<div class="survey-edit-actions">' +
          '<button type="button" data-edit-cancel>取消</button>' +
          '<button type="button" class="btn-save" data-edit-save="' + r.uid + '">儲存</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderReportsSlot(){
    var eventId = openRosterEventId;
    if (!eventId) return;
    var roster = rostersById[eventId];
    var reports = reportsByEvent[eventId] || [];
    var rosterSet = {};
    (roster ? roster.members : []).forEach(function(uid){ rosterSet[uid] = true; });
    var reportedUids = {};
    reports.forEach(function(r){ reportedUids[r.uid] = true; });

    var attendingCount = reports.filter(function(r){ return r.status === 'attending'; }).length;
    var leaveCount = reports.filter(function(r){ return r.status === 'leave'; }).length;
    var notReported = (roster ? roster.members : []).filter(function(uid){ return !reportedUids[uid]; });

    var namesByUid = {};
    (approvedMembers || []).forEach(function(m){ namesByUid[m.uid] = m; });

    var summaryHtml = '<div class="survey-summary"><span>出席 ' + attendingCount + '</span><span>請假 ' + leaveCount + '</span><span>未回報 ' + notReported.length + '</span></div>';

    var listHtml = reports.length === 0 ? '<div class="survey-empty">目前還沒有人回報</div>' :
      '<div class="survey-list">' + reports.map(function(r){
        var outOfRoster = !rosterSet[r.uid];
        var isEditing = editingReportUid === r.uid;
        return (
          '<div class="survey-row" data-report-row="' + r.uid + '">' +
            '<div class="survey-row-top">' +
              '<div style="flex:1;min-width:0;">' +
                '<div class="survey-name">' + escapeHtml(r.name || r.account || '未知') + (outOfRoster ? '<span class="survey-tag">已不在名單內</span>' : '') + '</div>' +
                (r.status === 'leave' && r.reason ? '<div class="survey-reason">' + escapeHtml(r.reason) + '</div>' : '') +
              '</div>' +
              '<span class="survey-status ' + r.status + '">' + (r.status === 'attending' ? '出席' : '請假') + '</span>' +
              '<button type="button" class="survey-edit-btn" data-edit-report="' + r.uid + '" aria-label="代改回報">✎</button>' +
              '<button type="button" class="survey-edit-btn" data-delete-report="' + r.uid + '" aria-label="刪除回報">×</button>' +
            '</div>' +
            (isEditing ? renderReportEditForm(r) : '') +
          '</div>'
        );
      }).join('') + '</div>';

    var notReportedHtml = notReported.length === 0 ? '' :
      '<div class="survey-subhead">尚未回報</div>' +
      '<div class="survey-namelist">' + notReported.map(function(uid){
        var m = namesByUid[uid];
        return escapeHtml(m ? m.name : uid);
      }).join('、') + '</div>';

    rosterReportsSlot.innerHTML = summaryHtml + listHtml + notReportedHtml;
  }

  function openReportEdit(uid){
    var reports = reportsByEvent[openRosterEventId] || [];
    var r = reports.find(function(x){ return x.uid === uid; });
    if (!r) return;
    editingReportUid = uid;
    reportEditDraft = { status: r.status, reason: r.reason || '' };
    renderReportsSlot();
  }

  function closeReportEdit(){
    editingReportUid = null;
    reportEditDraft = null;
    renderReportsSlot();
  }

  rosterReportsSlot.addEventListener('input', function(e){
    if (e.target.matches('[data-edit-reason]') && reportEditDraft){
      reportEditDraft.reason = e.target.value;
    }
  });

  rosterReportsSlot.addEventListener('click', function(e){
    var editBtn = e.target.closest('[data-edit-report]');
    var deleteBtn = e.target.closest('[data-delete-report]');
    var statusBtn = e.target.closest('[data-edit-status]');
    var cancelBtn = e.target.closest('[data-edit-cancel]');
    var saveBtn = e.target.closest('[data-edit-save]');

    if (editBtn){
      openReportEdit(editBtn.getAttribute('data-edit-report'));
      return;
    }
    if (deleteBtn){
      var deleteUid = deleteBtn.getAttribute('data-delete-report');
      var eventIdForDelete = openRosterEventId;
      if (!eventIdForDelete) return;
      var reportsForDelete = reportsByEvent[eventIdForDelete] || [];
      var reportToDelete = reportsForDelete.find(function(x){ return x.uid === deleteUid; });
      var ok = confirm('確定要刪除「' + (reportToDelete ? (reportToDelete.name || reportToDelete.account) : '這筆') + '」的出缺席回報嗎？此動作無法復原。');
      if (!ok) return;
      deleteBtn.disabled = true;
      deleteDoc(doc(db, 'attendanceReports', eventIdForDelete + '_' + deleteUid)).then(function(){
        if (editingReportUid === deleteUid) { editingReportUid = null; reportEditDraft = null; }
        loadReports(eventIdForDelete);
      }).catch(function(err){
        alert('刪除失敗：' + err.code);
        deleteBtn.disabled = false;
      });
      return;
    }
    if (statusBtn){
      reportEditDraft.status = statusBtn.getAttribute('data-edit-status');
      renderReportsSlot();
      return;
    }
    if (cancelBtn){
      closeReportEdit();
      return;
    }
    if (saveBtn){
      var uid = saveBtn.getAttribute('data-edit-save');
      var reason = reportEditDraft.reason.trim();
      var eventId = openRosterEventId;
      saveBtn.disabled = true;
      setDoc(doc(db, 'attendanceReports', eventId + '_' + uid), {
        eventId: eventId,
        uid: uid,
        status: reportEditDraft.status,
        reason: reportEditDraft.status === 'leave' ? reason : '',
        respondedAt: serverTimestamp()
      }, { merge: true }).then(function(){
        closeReportEdit();
        loadReports(eventId);
      }).catch(function(err){
        alert('儲存失敗：' + err.code);
        saveBtn.disabled = false;
      });
    }
  });

  function renderTypeSelect(){
    var select = document.getElementById('eventType');
    var current = select.value;
    select.innerHTML = eventTypesList.map(function(t){
      return '<option value="' + t.id + '">' + t.label + '</option>';
    }).join('');
    if (eventTypesById[current]) select.value = current;
  }

  function renderColorPicker(){
    var picker = document.getElementById('colorPicker');
    picker.innerHTML = Object.keys(COLOR_THEMES).map(function(key){
      var theme = COLOR_THEMES[key];
      return '<button type="button" class="swatch' + (key === selectedColorKey ? ' selected' : '') +
        '" data-color="' + key + '" style="background:' + theme.bg + ';" aria-label="' + key + '"></button>';
    }).join('');
  }

  document.getElementById('colorPicker').addEventListener('click', function(e){
    var btn = e.target.closest('[data-color]');
    if (!btn) return;
    selectedColorKey = btn.getAttribute('data-color');
    renderColorPicker();
  });

  var typeForm = document.getElementById('typeForm');
  var typeFormError = document.getElementById('typeFormError');
  var typeSubmitBtn = document.getElementById('typeSubmitBtn');

  function enterTypeCreateMode(){
    editingTypeId = null;
    typeForm.reset();
    selectedColorKey = 'sage';
    renderColorPicker();
    typeSubmitBtn.disabled = false;
    typeSubmitBtn.textContent = '新增類型';
    typeFormError.textContent = '';
    typeFormError.classList.remove('show');
  }

  typeForm.addEventListener('submit', function(e){
    e.preventDefault();
    var label = document.getElementById('newTypeLabel').value.trim();
    if (!label){
      typeFormError.textContent = '請輸入類型名稱';
      typeFormError.classList.add('show');
      return;
    }
    var duplicate = eventTypesList.some(function(t){
      return t.label === label && t.id !== editingTypeId;
    });
    if (duplicate){
      typeFormError.textContent = '已經有一個叫「' + label + '」的類型了，請改用別的名稱，或直接編輯既有類型';
      typeFormError.classList.add('show');
      return;
    }
    typeSubmitBtn.disabled = true;

    var payload = {
      label: label,
      colorKey: selectedColorKey,
      homeHighlight: document.getElementById('typeHomeHighlight').checked
    };
    var task = editingTypeId
      ? updateDoc(doc(db, 'eventTypes', editingTypeId), payload)
      : addDoc(collection(db, 'eventTypes'), Object.assign({}, payload, {
          order: eventTypesList.length + 1,
          createdBy: currentAdminUid,
          createdAt: serverTimestamp()
        }));

    task.then(function(){
      typeSubmitBtn.disabled = false;
      enterTypeCreateMode();
    }).catch(function(err){
      typeSubmitBtn.disabled = false;
      typeFormError.textContent = '操作失敗（' + err.code + '）';
      typeFormError.classList.add('show');
    });
  });

  function renderTypesList(){
    var list = document.getElementById('typesList');
    if (eventTypesList.length === 0){
      list.innerHTML = '<div class="empty">目前沒有任何活動類型</div>';
      return;
    }
    list.innerHTML = eventTypesList.map(function(t){
      var theme = COLOR_THEMES[t.colorKey] || COLOR_THEMES.slate;
      return (
        '<div class="type-item">' +
          '<span class="type-swatch" style="background:' + theme.bg + ';"></span>' +
          '<span class="type-label">' + t.label + (t.homeHighlight ? ' <span title="首頁焦點類型">★</span>' : '') + '</span>' +
          '<div class="type-actions">' +
            '<button type="button" data-edit-type="' + t.id + '">編輯</button>' +
            '<button type="button" class="btn-type-delete" data-delete-type="' + t.id + '">刪除</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  document.getElementById('typesList').addEventListener('click', function(e){
    var editBtn = e.target.closest('[data-edit-type]');
    var deleteBtn = e.target.closest('[data-delete-type]');

    if (editBtn){
      var editId = editBtn.getAttribute('data-edit-type');
      var editType = eventTypesById[editId];
      if (!editType) return;
      editingTypeId = editId;
      document.getElementById('newTypeLabel').value = editType.label;
      selectedColorKey = editType.colorKey;
      renderColorPicker();
      document.getElementById('typeHomeHighlight').checked = !!editType.homeHighlight;
      typeSubmitBtn.textContent = '儲存變更';
      typeForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    if (deleteBtn){
      var delId = deleteBtn.getAttribute('data-delete-type');
      var delType = eventTypesById[delId];
      var ok = confirm(
        '確定要刪除「' + (delType ? delType.label : '這個類型') + '」嗎？\n' +
        '如果還有活動使用這個類型，畫面會顯示找不到對應名稱，不會自動改到別的類型。'
      );
      if (!ok) return;
      deleteDoc(doc(db, 'eventTypes', delId)).then(function(){
        if (editingTypeId === delId) enterTypeCreateMode();
      }).catch(function(err){
        alert('刪除失敗：' + err.code);
      });
    }
  });

  var currentAdminUid = null;

  requireAdmin().then(function(result){
    if (!result) return;
    currentAdminUid = result.uid;

    var avatarBtn = document.getElementById('avatarBtn');
    avatarBtn.textContent = result.profile.name ? result.profile.name.charAt(0) : '?';
    avatarBtn.classList.remove('skel');
    initAccountMenu(result.profile.name);

    var canManageTypes = result.profile.role === 'owner' ||
      (result.profile.permissions && result.profile.permissions.canManageEventTypes === true);

    if (canManageTypes){
      document.getElementById('typesSectionLabel').classList.remove('hidden');
      typeForm.classList.remove('hidden');
      document.getElementById('typesList').classList.remove('hidden');
    }

    renderColorPicker();

    // 活動類型跟活動本身是兩份分開即時更新的資料，先等類型資料到齊過一次，
    // 才開始畫活動列表/下拉選單，避免出現「類型還沒載入時顯示原始 ID」的畫面，
    // 也避免使用者在那個空窗期點編輯，選單選不到正確值卡住的問題
    var typesLoaded = false;
    var eventsLoaded = false;
    var rostersLoaded = false;

    function maybeRender(){
      if (typesLoaded && eventsLoaded && rostersLoaded) render();
    }

    subscribeEventTypes(db, function(types){
      eventTypesList = types;
      eventTypesById = {};
      types.forEach(function(t){ eventTypesById[t.id] = t; });
      typesLoaded = true;
      renderTypeSelect();
      renderTypesList();
      maybeRender();
    }, canManageTypes ? currentAdminUid : null, renderEventsAdminError);

    onSnapshot(collection(db, 'events'), function(snap){
      eventsById = {};
      snap.forEach(function(docSnap){
        var data = docSnap.data();
        eventsById[docSnap.id] = {
          title: data.title,
          type: data.type,
          date: data.date && data.date.toDate ? data.date.toDate() : null,
          allDay: !!data.allDay,
          endTime: data.endTime && data.endTime.toDate ? data.endTime.toDate() : null,
          location: data.location
        };
      });
      eventsLoaded = true;
      maybeRender();
    }, renderEventsAdminError);

    onSnapshot(collection(db, 'concerts'), function(snap){
      concertsById = {};
      concertsList = [];
      snap.forEach(function(docSnap){
        var data = docSnap.data();
        var c = {
          id: docSnap.id,
          title: data.title,
          startDate: data.startDate && data.startDate.toDate ? data.startDate.toDate() : null,
          endDate: data.endDate && data.endDate.toDate ? data.endDate.toDate() : null,
          description: data.description || ''
        };
        concertsById[docSnap.id] = c;
        concertsList.push(c);
      });
      concertsList.sort(function(a, b){
        var ta = a.startDate ? a.startDate.getTime() : 0;
        var tb = b.startDate ? b.startDate.getTime() : 0;
        return tb - ta;
      });
      renderConcertList();
    }, function(err){ console.error('concerts 監聽失敗', err); });

    onSnapshot(collection(db, 'eventRosters'), function(snap){
      rostersById = {};
      snap.forEach(function(docSnap){
        var data = docSnap.data();
        rostersById[docSnap.id] = {
          members: data.members || [],
          sourceTemplateId: data.sourceTemplateId || null,
          surveyOpenedAt: data.surveyOpenedAt && data.surveyOpenedAt.toDate ? data.surveyOpenedAt.toDate() : null
        };
      });
      rostersLoaded = true;
      maybeRender();
      if (openRosterEventId && activeSheetTab === 'attendance') renderSurveyToggle();
    }, function(err){ console.error('eventRosters 監聽失敗', err); });

    // 名單範本（roster-admin.html 管理）：只影響「建立活動」跟「名單調整」分頁的兩個下拉選單，
    // 不影響活動列表本身能不能畫出來，不用加進 maybeRender() 的載入旗標比對
    onSnapshot(collection(db, 'rosterTemplates'), function(snap){
      rosterTemplatesById = {};
      rosterTemplatesList = [];
      snap.forEach(function(docSnap){
        var data = Object.assign({ id: docSnap.id }, docSnap.data());
        rosterTemplatesById[docSnap.id] = data;
        rosterTemplatesList.push(data);
      });
      rosterTemplatesList.sort(function(a, b){ return (a.name || '').localeCompare(b.name || '', 'zh-Hant'); });
      renderRosterTemplateSelects();
    }, function(err){ console.error('rosterTemplates 監聽失敗', err); });

    setDefaultEventDate();
  });
</script>
</body>
</html>
