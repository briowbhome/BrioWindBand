<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>布利歐管樂團｜活動管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F2EFE5">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<script src="./pwa-register.js" defer></script>
<style>
  :root{
    --ink:#20242F;
    --ink-soft:#4A4F5C;
    --paper:#F2EFE5;
    --paper-raised:#FBFAF4;
    --line:#DAD3BE;
    --brass:#B8863A;
    --brass-deep:#8F6A2C;
    --burgundy:#7A2331;
    --burgundy-deep:#5C1A26;
    --sage:#5F6E58;
    --sage-bg:#E7EBDF;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-card: 0 1px 2px rgba(32,36,47,.06), 0 8px 24px -12px rgba(32,36,47,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #EFE9D6 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding: 0 0 calc(48px + env(safe-area-inset-bottom));
  }

  button, a, input{ -webkit-tap-highlight-color: transparent; font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--brass-deep); outline-offset:2px; border-radius:6px; }

  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
  }

  .hidden{ display:none !important; }

  /* ---------- Skeleton placeholders ---------- */
  @keyframes skel-pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  .skel{ background:var(--line); animation:skel-pulse 1.4s ease-in-out infinite; }
  .avatar.skel{ animation:skel-pulse 1.4s ease-in-out infinite; }
  .skel-bar{ display:inline-block; border-radius:5px; }
  @media (prefers-reduced-motion: reduce){
    .skel, .avatar.skel{ animation:none; opacity:.75; }
  }
  .ev-skel-date{ flex:none; width:44px; height:32px; border-radius:6px; }
  .ev-skel-lines{ flex:1; display:flex; flex-direction:column; gap:7px; padding-top:2px; }

  .appbar{ display:flex; align-items:center; gap:12px; padding:18px 20px 14px; }
  .mark{ width:38px; height:38px; flex:none; object-fit:cover; border-radius:50%; }
  .brandtext{ display:flex; flex-direction:column; line-height:1.1; }
  .brandtext .name{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:19px; letter-spacing:.02em; }
  .brandtext .sub{ font-family:'Roboto Mono',monospace; font-size:10.5px; letter-spacing:.14em; color:var(--ink-soft); margin-top:3px; text-transform:uppercase; }
  .appbar .spacer{ flex:1; }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px;
    border:2px solid var(--paper-raised); box-shadow:0 0 0 1.5px var(--line);
    padding:0; cursor:pointer;
  }

  .back-btn{
    width:30px; height:30px; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); text-decoration:none;
  }
  .brand-link{ display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }

  .staff{
    height:16px; margin:0 20px 6px;
    background-image: repeating-linear-gradient(var(--line), var(--line) 1px, transparent 1px, transparent 4px);
    opacity:.9;
  }


  .section-label{ display:flex; align-items:baseline; gap:8px; margin:20px 20px 4px; }
  .section-label .tw{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:15.5px; }
  .section-label .en{ font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }
  .collapse-toggle{
    margin-left:auto; background:none; border:none; padding:4px; cursor:pointer;
    color:var(--ink-soft); display:flex; align-items:center; align-self:center;
  }
  .collapse-toggle .chev{ transition:transform .18s ease; }
  .collapse-toggle.open .chev{ transform:rotate(180deg); }
  #typesBody.collapsed{ display:none; }

  /* ---------- Event form ---------- */
  .card{
    margin:14px 20px 20px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:16px;
  }
  .field{ margin-top:12px; display:flex; flex-direction:column; gap:6px; }
  .field:first-child{ margin-top:0; }
  .field label{
    font-family:'Roboto Mono',monospace; font-size:10.5px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);
  }
  .field input, .field select{
    border:1px solid var(--line); background:var(--paper);
    border-radius:var(--radius-sm); padding:11px 13px;
    font-size:14px; color:var(--ink); width:100%;
  }
  .field-checkbox{ margin-top:12px; display:flex; align-items:center; gap:8px; }
  .field-checkbox input{ width:16px; height:16px; accent-color:var(--brass-deep); }
  .field-checkbox label{
    font-family:'Noto Sans TC','Noto Sans',sans-serif; font-size:13px; font-weight:500;
    letter-spacing:normal; text-transform:none; color:var(--ink);
  }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; min-width:0; margin-top:12px; }

  .form-buttons{ display:flex; gap:10px; margin-top:16px; }
  .cta-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--brass); color:var(--ink); border:none;
    border-radius:var(--radius-md); padding:14px 16px;
    font-weight:700; font-size:14.5px; cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .cta-btn:hover{ background:#C7963F; }
  .cta-btn:active{ transform:scale(.98); background:var(--brass-deep); }
  .cta-btn:disabled{ opacity:.55; cursor:default; transform:none; }
  .cancel-btn{
    flex:none;
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    border-radius:var(--radius-md); padding:14px 18px;
    font-weight:700; font-size:14px; cursor:pointer;
  }

  .form-error{
    margin-top:12px; font-size:12.5px; color:var(--burgundy);
    background:#FBF3F3; border:1px solid #EFD4D8; border-radius:var(--radius-sm);
    padding:10px 12px; display:none;
  }
  .form-error.show{ display:block; }

  /* ---------- Event list ---------- */
  .list{
    margin:0 20px 24px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .event-item{ padding:14px 16px; }
  .event-item + .event-item{ border-top:1px solid var(--line); }

  .event-top{ display:flex; align-items:flex-start; gap:10px; }
  .event-date{
    flex:none; width:44px; text-align:center;
  }
  .event-date .d{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:19px; line-height:1.05; color:var(--ink); }
  .event-date .m{ font-family:'Roboto Mono',monospace; font-size:9.5px; color:var(--ink-soft); letter-spacing:.05em; }

  .event-body{ flex:1; min-width:0; }
  .event-title{ font-weight:700; font-size:13.5px; color:var(--ink); display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .kind{
    font-family:'Roboto Mono',monospace; font-size:9.5px; letter-spacing:.05em;
    padding:1.5px 6px; border-radius:5px; font-weight:600;
  }
  .event-meta{ margin-top:4px; font-size:12px; color:var(--ink-soft); line-height:1.5; }

  .event-actions{ display:flex; gap:8px; margin-top:10px; margin-left:54px; }
  .event-actions button{
    flex:none;
    border-radius:var(--radius-sm); padding:7px 14px;
    font-weight:700; font-size:11.5px; cursor:pointer;
  }
  .btn-edit{ background:none; border:1px solid var(--line); color:var(--ink-soft); }
  .btn-edit:active{ background:var(--paper); }
  .btn-delete{ background:none; border:1px solid var(--line); color:var(--burgundy-deep); }
  .btn-delete:active{ background:#F6EDEE; }

  .empty{ padding:36px 20px; text-align:center; font-size:13px; color:var(--ink-soft); }

  /* ---------- Event type manager ---------- */
  .swatch-picker{ display:flex; flex-wrap:wrap; gap:10px; }
  .swatch{
    width:30px; height:30px; border-radius:50%; flex:none;
    border:2px solid transparent; cursor:pointer; padding:0;
  }
  .swatch.selected{ border-color:var(--ink); }
  .type-item{ display:flex; align-items:center; gap:10px; padding:12px 16px; }
  .type-item + .type-item{ border-top:1px solid var(--line); }
  .type-swatch{ width:18px; height:18px; border-radius:50%; flex:none; }
  .type-label{ flex:1; font-weight:600; font-size:13.5px; color:var(--ink); }
  .type-actions{ display:flex; gap:6px; }
  .type-actions button{
    flex:none; border-radius:var(--radius-sm); padding:5px 10px;
    font-weight:700; font-size:11px; cursor:pointer;
    background:none; border:1px solid var(--line); color:var(--ink-soft);
  }
  .btn-type-delete{ color:var(--burgundy-deep); }

  /* ---------- Attendance roster button ---------- */
  .event-actions{ flex-wrap:wrap; row-gap:6px; }
  .btn-roster{ background:none; border:1px solid var(--line); color:var(--brass-deep); }
  .btn-roster:active{ background:var(--paper); }

  /* ---------- 出缺席名單 Bottom Sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0; z-index:80;
    background:rgba(32,36,47,.45);
    display:none; align-items:flex-end; justify-content:center;
  }
  .sheet-overlay.active{ display:flex; }
  .sheet{
    width:100%; max-width:460px; max-height:85vh;
    background:var(--paper-raised);
    border-radius:20px 20px 0 0;
    display:flex; flex-direction:column;
    box-shadow:0 -10px 30px rgba(32,36,47,.3);
  }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:999px; margin:10px auto 2px; }
  .sheet-header{ position:relative; padding:6px 44px 12px 20px; border-bottom:1px solid var(--line); }
  .sheet-header .name{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:16px; }
  .sheet-header .account{ font-family:'Roboto Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .sheet-close{
    position:absolute; top:4px; right:10px;
    width:30px; height:30px; border-radius:50%; border:none; background:none;
    color:var(--ink-soft); font-size:19px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .sheet-close:active{ background:var(--paper); }
  .sheet-body{ overflow-y:auto; padding:14px 20px 8px; }
  .sheet-footer{
    display:flex; gap:10px;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .cta-btn-secondary{ background:var(--paper); color:var(--ink-soft); border:1px solid var(--line); }
  .cta-btn-secondary:hover{ background:var(--paper-raised); }
  .cta-btn-secondary:active{ transform:scale(.98); background:var(--paper); }

  .survey-section-label{
    font-family:'Roboto Mono',monospace; font-size:10.5px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);
    margin:16px 0 8px;
  }
  .survey-section-label:first-child{ margin-top:0; }
  .survey-bulk-row{ display:flex; gap:8px; margin-bottom:8px; }
  .survey-bulk-row button{
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    border-radius:999px; padding:5px 12px; font-size:11px; font-weight:700; cursor:pointer;
  }
  .survey-bulk-row button:active{ background:var(--sage-bg); color:var(--sage); }

  .check-list{ display:flex; flex-direction:column; gap:2px; max-height:240px; overflow-y:auto; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); padding:4px 10px; }
  .check-row{ display:flex; align-items:center; gap:10px; padding:7px 2px; }
  .check-row + .check-row{ border-top:1px solid var(--line); }
  .checkbox{
    width:18px; height:18px; border-radius:5px; border:1.5px solid var(--line);
    flex:none; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:#fff; cursor:pointer; background:none; padding:0;
  }
  .checkbox.on{ background:var(--brass); border-color:var(--brass); }
  .check-text{ flex:1; font-size:12.5px; color:var(--ink); cursor:pointer; background:none; border:none; text-align:left; padding:0; }

  .survey-empty{ padding:10px 2px; text-align:center; font-size:12px; color:var(--ink-soft); }
  .survey-summary{
    display:flex; gap:10px;
    padding:9px 12px; background:var(--sage-bg); color:var(--sage);
    font-size:11.5px; font-weight:700; border-radius:var(--radius-sm);
  }
  .survey-list{ margin-top:8px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
  .survey-row{ padding:9px 12px; font-size:12px; }
  .survey-row + .survey-row{ border-top:1px solid var(--line); }
  .survey-row-top{ display:flex; align-items:flex-start; gap:10px; }
  .survey-name{ font-weight:500; color:var(--ink); }
  .survey-reason{ font-size:11px; color:var(--ink-soft); margin-top:2px; white-space:pre-wrap; }
  .survey-tag{
    font-size:9.5px; font-weight:700; color:var(--burgundy-deep);
    background:#FBF3F3; border:1px solid #EFD4D8; border-radius:999px; padding:1px 6px; margin-left:4px;
  }
  .survey-status{ flex:none; font-family:'Roboto Mono',monospace; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; }
  .survey-status.attending{ background:var(--sage-bg); color:var(--sage); }
  .survey-status.leave{ background:#EFE1E3; color:var(--burgundy-deep); }
  .survey-edit-btn{
    flex:none; width:22px; height:22px; border-radius:50%; border:none; background:none;
    color:var(--ink-soft); cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center;
  }
  .survey-edit-btn:active{ color:var(--brass-deep); }
  .survey-subhead{ margin-top:12px; font-size:11.5px; font-weight:700; color:var(--ink-soft); }
  .survey-namelist{ margin-top:4px; font-size:12px; color:var(--ink); line-height:1.7; }

  .survey-edit-form{ margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .status-picker{ display:flex; gap:8px; }
  .status-chip-btn{
    flex:1; text-align:center; padding:8px 4px;
    border-radius:var(--radius-sm); border:1px solid var(--line);
    font-size:12px; font-weight:700; color:var(--ink-soft); background:var(--paper); cursor:pointer;
  }
  .status-chip-btn.selected.attending{ background:var(--sage); color:#F2EFE5; border-color:var(--sage); }
  .status-chip-btn.selected.leave{ background:var(--burgundy); color:#F2EFE5; border-color:var(--burgundy); }
  .survey-edit-form textarea{
    margin-top:8px; border:1px solid var(--line); background:var(--paper);
    border-radius:var(--radius-sm); padding:9px 11px;
    font-size:13px; color:var(--ink); width:100%; font-family:inherit; resize:vertical; min-height:56px;
  }
  .survey-edit-actions{ display:flex; gap:8px; margin-top:8px; }
  .survey-edit-actions button{
    border-radius:var(--radius-sm); padding:7px 12px; font-size:11.5px; font-weight:700; cursor:pointer;
    border:1px solid var(--line); background:var(--paper);
  }
  .survey-edit-actions .btn-save{ background:var(--brass); color:var(--ink); border:none; }
  .survey-edit-actions .btn-save:disabled{ opacity:.5; }
</style>
</head>
<body>
<div class="app" id="appRoot">

  <div class="appbar">
    <a class="back-btn" href="admin-index.html" aria-label="回控制台首頁">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="brand-link" href="index.html">
      <img class="mark" src="assets/BrioLogo.jpg" alt="布利歐管樂團 Logo">
      <div class="brandtext">
        <div class="name">布利歐管樂團</div>
        <div class="sub">Brio Wind Band</div>
      </div>
    </a>
    <div class="spacer"></div>
    <button class="avatar skel" id="avatarBtn" type="button" aria-label="帳號選單"></button>
  </div>

  <div class="staff"></div>

  <div class="section-label hidden" id="typesSectionLabel">
    <span class="tw">活動類型管理</span>
    <span class="en">Event Types</span>
    <button type="button" class="collapse-toggle" id="typesCollapseToggle" aria-label="展開/收合活動類型管理">
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div id="typesBody">
    <form class="card hidden" id="typeForm">
      <div class="field">
        <label>新增/編輯類型名稱</label>
        <input type="text" id="newTypeLabel" placeholder="例如：社遊">
      </div>
      <div class="field">
        <label>顏色</label>
        <div class="swatch-picker" id="colorPicker"></div>
      </div>
      <div class="field-checkbox">
        <input type="checkbox" id="typeHomeHighlight">
        <label for="typeHomeHighlight">首頁「下一次團練」卡片將顯示這個類型的活動</label>
      </div>
      <p class="form-error" id="typeFormError"></p>
      <div class="form-buttons">
        <button type="submit" class="cta-btn" id="typeSubmitBtn">新增類型</button>
      </div>
    </form>

    <div class="list hidden" id="typesList"></div>
  </div>

  <div class="section-label">
    <span class="tw" id="formTitle">建立活動</span>
    <span class="en">Events</span>
  </div>

  <form class="card" id="eventForm">
    <div class="field">
      <label>活動標題</label>
      <input type="text" id="eventTitle" placeholder="例如：團練、重奏演出" required>
    </div>
    <div class="field">
      <label>類型</label>
      <select id="eventType"></select>
    </div>
    <div class="field">
      <label>日期</label>
      <input type="date" id="eventDate" required>
    </div>
    <div class="field-checkbox">
      <input type="checkbox" id="eventAllDay">
      <label for="eventAllDay">全天活動（無明確開始/結束時間點）</label>
    </div>
    <div class="field-row" id="eventTimeFields">
      <div class="field">
        <label>開始時間</label>
        <input type="time" id="eventStartTime">
      </div>
      <div class="field">
        <label>結束時間（選填）</label>
        <input type="time" id="eventEndTime">
      </div>
    </div>
    <div class="field">
      <label>地點</label>
      <input type="text" id="eventLocation" placeholder="例如：體育館一樓-舞台">
    </div>
    <p class="form-error" id="eventFormError"></p>
    <div class="form-buttons">
      <button type="submit" class="cta-btn" id="eventSubmitBtn">建立活動</button>
      <button type="button" class="cancel-btn hidden" id="eventCancelBtn">取消</button>
    </div>
  </form>

  <div class="section-label">
    <span class="tw">所有活動</span>
    <span class="en">All Events</span>
  </div>

  <div class="list" id="eventList"></div>

</div>

<!-- 出缺席名單 Bottom Sheet -->
<div class="sheet-overlay" id="rosterSheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <button type="button" class="sheet-close" id="rosterSheetClose" aria-label="關閉">×</button>
      <div class="name" id="rosterSheetTitle">—</div>
      <div class="account" id="rosterSheetMeta">—</div>
    </div>
    <div class="sheet-body">
      <div class="survey-section-label" id="rosterCounterLabel">應到名單</div>
      <div class="survey-bulk-row">
        <button type="button" id="rosterSelectAllBtn">全選</button>
        <button type="button" id="rosterClearAllBtn">全部取消</button>
      </div>
      <div class="check-list" id="rosterChecklist"></div>

      <div class="survey-section-label">回報狀況</div>
      <div id="rosterReportsSlot"><div class="survey-empty">載入中…</div></div>
    </div>
    <div class="sheet-footer">
      <button type="button" class="cta-btn cta-btn-secondary" id="rosterCancelBtn">關閉</button>
      <button type="button" class="cta-btn" id="rosterSaveBtn" disabled>儲存名單變更</button>
    </div>
  </div>
</div>

<script type="module">
  import { requireAdmin, peekCachedProfile } from './auth-guard.js';
  import { db } from './firebase-init.js';
  import { initAccountMenu } from './account-menu.js';
  import { subscribeEventTypes, COLOR_THEMES, badgeStyle } from './event-types.js';
  import {
    collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot,
    serverTimestamp, Timestamp, getDocs, query, where, setDoc
  } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // 活動類型管理用到的次數不多，預設收合、之後記住使用者上次的展開/收合狀態
  var TYPES_COLLAPSE_KEY = 'brio_event_types_collapsed';
  var typesBody = document.getElementById('typesBody');
  var typesCollapseToggle = document.getElementById('typesCollapseToggle');

  function setTypesCollapsed(collapsed){
    typesBody.classList.toggle('collapsed', collapsed);
    typesCollapseToggle.classList.toggle('open', !collapsed);
    try { localStorage.setItem(TYPES_COLLAPSE_KEY, collapsed ? 'true' : 'false'); } catch (e) {}
  }

  var storedTypesCollapsed = (function(){
    try { return localStorage.getItem(TYPES_COLLAPSE_KEY); } catch (e) { return null; }
  })();
  setTypesCollapsed(storedTypesCollapsed === null ? true : storedTypesCollapsed === 'true');

  typesCollapseToggle.addEventListener('click', function(){
    setTypesCollapsed(!typesBody.classList.contains('collapsed'));
  });

  var eventsById = {};
  var editingId = null;

  var eventTypesList = [];
  var eventTypesById = {};
  var editingTypeId = null;
  var selectedColorKey = 'sage';

  var SKELETON_ROWS_HTML = function(count){
    var rows = [];
    for (var i = 0; i < count; i++){
      rows.push(
        '<div class="event-item">' +
          '<div class="event-top">' +
            '<span class="skel ev-skel-date"></span>' +
            '<div class="ev-skel-lines">' +
              '<span class="skel skel-bar" style="width:55%;height:13px;"></span>' +
              '<span class="skel skel-bar" style="width:35%;height:10px;"></span>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }
    return rows.join('');
  };

  var cachedProfile = peekCachedProfile();
  if (cachedProfile && cachedProfile.name){
    var avatarBtnEl = document.getElementById('avatarBtn');
    avatarBtnEl.textContent = cachedProfile.name.charAt(0);
    avatarBtnEl.classList.remove('skel');
  }

  var eventForm = document.getElementById('eventForm');
  var eventFormError = document.getElementById('eventFormError');
  var eventSubmitBtn = document.getElementById('eventSubmitBtn');
  var eventCancelBtn = document.getElementById('eventCancelBtn');
  var formTitle = document.getElementById('formTitle');
  var eventList = document.getElementById('eventList');
  eventList.innerHTML = SKELETON_ROWS_HTML(3);
  document.getElementById('typesList').innerHTML = SKELETON_ROWS_HTML(2);

  function showEventFormError(message){
    eventFormError.textContent = message;
    eventFormError.classList.toggle('show', !!message);
  }

  function pad2(n){ return n < 10 ? '0' + n : '' + n; }

  function toDateValue(date){
    return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
  }

  function toTimeValue(date){
    return pad2(date.getHours()) + ':' + pad2(date.getMinutes());
  }

  function updateTimeFieldsVisibility(){
    var allDay = document.getElementById('eventAllDay').checked;
    document.getElementById('eventTimeFields').classList.toggle('hidden', allDay);
    document.getElementById('eventStartTime').required = !allDay;
  }

  document.getElementById('eventAllDay').addEventListener('change', updateTimeFieldsVisibility);

  function setDefaultEventDate(){
    var defaultDate = new Date(Date.now() + 60 * 60000);
    defaultDate.setMinutes(Math.round(defaultDate.getMinutes() / 15) * 15, 0, 0);
    document.getElementById('eventDate').value = toDateValue(defaultDate);
    document.getElementById('eventStartTime').value = toTimeValue(defaultDate);
    document.getElementById('eventEndTime').value = '';
  }

  function enterCreateMode(){
    editingId = null;
    eventForm.reset();
    setDefaultEventDate();
    updateTimeFieldsVisibility();
    formTitle.textContent = '建立活動';
    eventSubmitBtn.disabled = false;
    eventSubmitBtn.textContent = '建立活動';
    eventCancelBtn.classList.add('hidden');
    showEventFormError('');
  }

  function enterEditMode(eventId){
    var evt = eventsById[eventId];
    if (!evt) return;
    editingId = eventId;
    document.getElementById('eventTitle').value = evt.title || '';
    document.getElementById('eventType').value = evt.type || 'rehearsal';
    document.getElementById('eventDate').value = evt.date ? toDateValue(evt.date) : '';
    document.getElementById('eventAllDay').checked = !!evt.allDay;
    document.getElementById('eventStartTime').value = evt.date && !evt.allDay ? toTimeValue(evt.date) : '';
    document.getElementById('eventEndTime').value = evt.endTime ? toTimeValue(evt.endTime) : '';
    document.getElementById('eventLocation').value = evt.location || '';
    updateTimeFieldsVisibility();
    formTitle.textContent = '編輯活動';
    eventSubmitBtn.disabled = false;
    eventSubmitBtn.textContent = '儲存變更';
    eventCancelBtn.classList.remove('hidden');
    showEventFormError('');
    eventForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  eventCancelBtn.addEventListener('click', enterCreateMode);

  eventForm.addEventListener('submit', function(e){
    e.preventDefault();
    showEventFormError('');

    var title = document.getElementById('eventTitle').value.trim();
    var type = document.getElementById('eventType').value;
    var dateVal = document.getElementById('eventDate').value;
    var allDay = document.getElementById('eventAllDay').checked;
    var startTimeVal = document.getElementById('eventStartTime').value;
    var endTimeVal = document.getElementById('eventEndTime').value;
    var location = document.getElementById('eventLocation').value.trim();

    if (!title || !dateVal || (!allDay && !startTimeVal)){
      showEventFormError('請填寫活動標題、日期，以及開始時間（若非全天活動）');
      return;
    }

    eventSubmitBtn.disabled = true;
    eventSubmitBtn.textContent = editingId ? '儲存中…' : '建立中…';

    var payload = {
      title: title,
      type: type,
      date: Timestamp.fromDate(new Date(dateVal + 'T' + (allDay ? '00:00' : startTimeVal))),
      allDay: allDay,
      endTime: (!allDay && endTimeVal) ? Timestamp.fromDate(new Date(dateVal + 'T' + endTimeVal)) : null,
      location: location
    };

    var task = editingId
      ? updateDoc(doc(db, 'events', editingId), payload)
      : addDoc(collection(db, 'events'), Object.assign({}, payload, {
          createdBy: currentAdminUid,
          createdAt: serverTimestamp()
        }));

    task.then(function(){
      enterCreateMode();
    }).catch(function(error){
      eventSubmitBtn.disabled = false;
      eventSubmitBtn.textContent = editingId ? '儲存變更' : '建立活動';
      showEventFormError('操作失敗（' + error.code + '）');
    });
  });

  function formatEventTime(evt){
    if (!evt.date) return '';
    if (evt.allDay) return '全天';
    var start = evt.date.toLocaleString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false });
    if (!evt.endTime) return start;
    var end = evt.endTime.toLocaleString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false });
    return start + '–' + end;
  }

  function typeBadge(typeId){
    var t = eventTypesById[typeId];
    var label = t ? t.label : typeId;
    return '<span class="kind" style="' + badgeStyle(t ? t.colorKey : null) + '">' + label + '</span>';
  }

  // 網路壅塞等原因導致監聽失敗時呼叫，清掉骨架屏並明確告知，不要讓畫面卡住不動
  function renderEventsAdminError(){
    eventList.innerHTML = '<div class="empty">讀取失敗，請重新整理再試一次</div>';
    document.getElementById('typesList').innerHTML = '<div class="empty">讀取失敗，請重新整理再試一次</div>';
  }

  function render(){
    var ids = Object.keys(eventsById);
    if (ids.length === 0){
      eventList.innerHTML = '<div class="empty">目前沒有任何活動</div>';
      return;
    }

    ids.sort(function(a, b){
      var da = eventsById[a].date ? eventsById[a].date.getTime() : 0;
      var db_ = eventsById[b].date ? eventsById[b].date.getTime() : 0;
      return db_ - da;
    });

    eventList.innerHTML = ids.map(function(eventId){
      var evt = eventsById[eventId];
      var d = evt.date;
      var roster = rostersById[eventId];
      var rosterLabel = roster ? ('出缺席名單（' + roster.members.length + ' 人）') : '設定出缺席名單';
      return (
        '<div class="event-item" data-event="' + eventId + '">' +
          '<div class="event-top">' +
            '<div class="event-date">' +
              '<div class="d">' + (d ? d.getDate() : '—') + '</div>' +
              '<div class="m">' + (d ? (d.getMonth() + 1) + '月' : '') + '</div>' +
            '</div>' +
            '<div class="event-body">' +
              '<div class="event-title">' + evt.title + typeBadge(evt.type) + '</div>' +
              '<div class="event-meta">' + formatEventTime(evt) + (evt.location ? ' · ' + evt.location : '') + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="event-actions">' +
            '<button type="button" class="btn-edit" data-edit="' + eventId + '">編輯</button>' +
            '<button type="button" class="btn-roster" data-open-roster="' + eventId + '">' + rosterLabel + '</button>' +
            '<button type="button" class="btn-delete" data-delete="' + eventId + '">刪除</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  eventList.addEventListener('click', function(e){
    var editBtn = e.target.closest('[data-edit]');
    var deleteBtn = e.target.closest('[data-delete]');
    var rosterBtn = e.target.closest('[data-open-roster]');

    if (editBtn){
      enterEditMode(editBtn.getAttribute('data-edit'));
    }
    if (rosterBtn){
      openRosterSheet(rosterBtn.getAttribute('data-open-roster'));
    }
    if (deleteBtn){
      var eventId = deleteBtn.getAttribute('data-delete');
      var evt = eventsById[eventId];
      var ok = confirm(
        '確定要刪除「' + (evt ? evt.title : '這場活動') + '」嗎？\n' +
        '如果這場活動已經有簽到紀錄，刪除後將找不到對應的活動資料。\n' +
        '此動作無法復原。'
      );
      if (!ok) return;
      deleteBtn.disabled = true;
      Promise.all([
        deleteDoc(doc(db, 'events', eventId)),
        deleteDoc(doc(db, 'checkinSessions', eventId)).catch(function(){}),
        deleteDoc(doc(db, 'eventRosters', eventId)).catch(function(){})
      ]).then(function(){
        if (editingId === eventId) enterCreateMode();
      }).catch(function(err){
        alert('刪除失敗：' + err.code);
        deleteBtn.disabled = false;
      });
    }
  });

  // ---------- 出缺席名單 Bottom Sheet ----------
  var rostersById = {}; // eventId -> { members: [uid...] }
  var approvedMembers = null;
  var openRosterEventId = null;
  var rosterDraftSet = null; // {uid: true}
  var reportsByEvent = {}; // eventId -> array<report>
  var editingReportUid = null;
  var reportEditDraft = null; // { status, reason }

  var rosterSheetOverlay = document.getElementById('rosterSheetOverlay');
  var rosterChecklist = document.getElementById('rosterChecklist');
  var rosterCounterLabel = document.getElementById('rosterCounterLabel');
  var rosterSaveBtn = document.getElementById('rosterSaveBtn');
  var rosterReportsSlot = document.getElementById('rosterReportsSlot');

  async function ensureApprovedMembers(){
    if (approvedMembers) return approvedMembers;
    var snap = await getDocs(query(collection(db, 'users'), where('status', '==', 'approved')));
    approvedMembers = snap.docs.map(function(docSnap){
      var data = docSnap.data();
      return { uid: docSnap.id, name: data.name, account: data.account };
    });
    return approvedMembers;
  }

  function rosterDirty(){
    var roster = rostersById[openRosterEventId];
    var saved = roster ? roster.members : [];
    var draft = Object.keys(rosterDraftSet || {});
    if (draft.length !== saved.length) return true;
    return draft.some(function(uid){ return saved.indexOf(uid) === -1; });
  }

  function updateRosterCounter(){
    var total = (approvedMembers || []).length;
    var count = Object.keys(rosterDraftSet || {}).length;
    rosterCounterLabel.textContent = '應到名單（' + count + ' / ' + total + ' 人）';
    rosterSaveBtn.disabled = !rosterDirty();
  }

  function renderRosterChecklist(){
    rosterChecklist.innerHTML = (approvedMembers || []).map(function(m){
      var on = !!rosterDraftSet[m.uid];
      return (
        '<div class="check-row">' +
          '<button type="button" class="checkbox' + (on ? ' on' : '') + '" data-uid="' + m.uid + '">' + (on ? '✓' : '') + '</button>' +
          '<button type="button" class="check-text" data-uid="' + m.uid + '">' + escapeHtml(m.name) + '（' + escapeHtml(m.account) + '）</button>' +
        '</div>'
      );
    }).join('');
  }

  async function openRosterSheet(eventId){
    var evt = eventsById[eventId];
    if (!evt) return;
    openRosterEventId = eventId;
    editingReportUid = null;
    reportEditDraft = null;
    document.getElementById('rosterSheetTitle').textContent = evt.title;
    document.getElementById('rosterSheetMeta').textContent =
      (evt.date ? (evt.date.getMonth() + 1) + '/' + evt.date.getDate() : '') + (evt.location ? ' · ' + evt.location : '');

    rosterChecklist.innerHTML = '<div class="survey-empty">載入中…</div>';
    rosterReportsSlot.innerHTML = '<div class="survey-empty">載入中…</div>';
    rosterSaveBtn.disabled = true;
    rosterSheetOverlay.classList.add('active');

    var members = await ensureApprovedMembers();
    var roster = rostersById[eventId];
    var initial = roster ? roster.members : members.map(function(m){ return m.uid; });
    rosterDraftSet = {};
    initial.forEach(function(uid){ rosterDraftSet[uid] = true; });
    renderRosterChecklist();
    updateRosterCounter();

    loadReports(eventId);
  }

  function closeRosterSheet(){
    rosterSheetOverlay.classList.remove('active');
    openRosterEventId = null;
    rosterDraftSet = null;
    editingReportUid = null;
    reportEditDraft = null;
  }

  rosterChecklist.addEventListener('click', function(e){
    var btn = e.target.closest('[data-uid]');
    if (!btn) return;
    var uid = btn.getAttribute('data-uid');
    if (rosterDraftSet[uid]) delete rosterDraftSet[uid]; else rosterDraftSet[uid] = true;
    var row = btn.closest('.check-row');
    var checkboxEl = row.querySelector('.checkbox');
    var on = !!rosterDraftSet[uid];
    checkboxEl.classList.toggle('on', on);
    checkboxEl.textContent = on ? '✓' : '';
    updateRosterCounter();
  });

  document.getElementById('rosterSelectAllBtn').addEventListener('click', function(){
    (approvedMembers || []).forEach(function(m){ rosterDraftSet[m.uid] = true; });
    renderRosterChecklist();
    updateRosterCounter();
  });

  document.getElementById('rosterClearAllBtn').addEventListener('click', function(){
    rosterDraftSet = {};
    renderRosterChecklist();
    updateRosterCounter();
  });

  rosterSaveBtn.addEventListener('click', function(){
    if (!openRosterEventId) return;
    var eventId = openRosterEventId;
    var members = Object.keys(rosterDraftSet);
    var isNew = !rostersById[eventId];
    var payload = { members: members, updatedAt: serverTimestamp() };
    if (isNew) payload.createdBy = currentAdminUid;
    rosterSaveBtn.disabled = true;
    setDoc(doc(db, 'eventRosters', eventId), payload, { merge: true }).then(function(){
      closeRosterSheet();
    }).catch(function(err){
      alert('儲存失敗：' + err.code);
      rosterSaveBtn.disabled = false;
    });
  });

  document.getElementById('rosterCancelBtn').addEventListener('click', closeRosterSheet);
  document.getElementById('rosterSheetClose').addEventListener('click', closeRosterSheet);
  rosterSheetOverlay.addEventListener('click', function(e){
    if (e.target === rosterSheetOverlay) closeRosterSheet();
  });

  async function loadReports(eventId){
    try {
      var snap = await getDocs(query(collection(db, 'attendanceReports'), where('eventId', '==', eventId)));
      reportsByEvent[eventId] = snap.docs.map(function(d){ return d.data(); });
      if (openRosterEventId === eventId) renderReportsSlot();
    } catch (err) {
      if (openRosterEventId === eventId) rosterReportsSlot.innerHTML = '<div class="survey-empty">載入失敗（' + err.code + '）</div>';
    }
  }

  function renderReportEditForm(r){
    var draft = reportEditDraft;
    return (
      '<div class="survey-edit-form">' +
        '<div class="status-picker">' +
          '<button type="button" class="status-chip-btn attending' + (draft.status === 'attending' ? ' selected' : '') + '" data-edit-status="attending">出席</button>' +
          '<button type="button" class="status-chip-btn leave' + (draft.status === 'leave' ? ' selected' : '') + '" data-edit-status="leave">請假</button>' +
        '</div>' +
        '<textarea data-edit-reason placeholder="請假原因">' + escapeHtml(draft.reason) + '</textarea>' +
        '<div class="survey-edit-actions">' +
          '<button type="button" data-edit-cancel>取消</button>' +
          '<button type="button" class="btn-save" data-edit-save="' + r.uid + '">儲存</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderReportsSlot(){
    var eventId = openRosterEventId;
    if (!eventId) return;
    var roster = rostersById[eventId];
    var reports = reportsByEvent[eventId] || [];
    var rosterSet = {};
    (roster ? roster.members : []).forEach(function(uid){ rosterSet[uid] = true; });
    var reportedUids = {};
    reports.forEach(function(r){ reportedUids[r.uid] = true; });

    var attendingCount = reports.filter(function(r){ return r.status === 'attending'; }).length;
    var leaveCount = reports.filter(function(r){ return r.status === 'leave'; }).length;
    var notReported = (roster ? roster.members : []).filter(function(uid){ return !reportedUids[uid]; });

    var namesByUid = {};
    (approvedMembers || []).forEach(function(m){ namesByUid[m.uid] = m; });

    var summaryHtml = '<div class="survey-summary"><span>出席 ' + attendingCount + '</span><span>請假 ' + leaveCount + '</span><span>未回報 ' + notReported.length + '</span></div>';

    var listHtml = reports.length === 0 ? '<div class="survey-empty">目前還沒有人回報</div>' :
      '<div class="survey-list">' + reports.map(function(r){
        var outOfRoster = !rosterSet[r.uid];
        var isEditing = editingReportUid === r.uid;
        return (
          '<div class="survey-row" data-report-row="' + r.uid + '">' +
            '<div class="survey-row-top">' +
              '<div style="flex:1;min-width:0;">' +
                '<div class="survey-name">' + escapeHtml(r.name || r.account || '未知') + (outOfRoster ? '<span class="survey-tag">已不在名單內</span>' : '') + '</div>' +
                (r.status === 'leave' && r.reason ? '<div class="survey-reason">' + escapeHtml(r.reason) + '</div>' : '') +
              '</div>' +
              '<span class="survey-status ' + r.status + '">' + (r.status === 'attending' ? '出席' : '請假') + '</span>' +
              '<button type="button" class="survey-edit-btn" data-edit-report="' + r.uid + '" aria-label="代改回報">✎</button>' +
            '</div>' +
            (isEditing ? renderReportEditForm(r) : '') +
          '</div>'
        );
      }).join('') + '</div>';

    var notReportedHtml = notReported.length === 0 ? '' :
      '<div class="survey-subhead">尚未回報</div>' +
      '<div class="survey-namelist">' + notReported.map(function(uid){
        var m = namesByUid[uid];
        return escapeHtml(m ? m.name : uid);
      }).join('、') + '</div>';

    rosterReportsSlot.innerHTML = summaryHtml + listHtml + notReportedHtml;
  }

  function openReportEdit(uid){
    var reports = reportsByEvent[openRosterEventId] || [];
    var r = reports.find(function(x){ return x.uid === uid; });
    if (!r) return;
    editingReportUid = uid;
    reportEditDraft = { status: r.status, reason: r.reason || '' };
    renderReportsSlot();
  }

  function closeReportEdit(){
    editingReportUid = null;
    reportEditDraft = null;
    renderReportsSlot();
  }

  rosterReportsSlot.addEventListener('input', function(e){
    if (e.target.matches('[data-edit-reason]') && reportEditDraft){
      reportEditDraft.reason = e.target.value;
    }
  });

  rosterReportsSlot.addEventListener('click', function(e){
    var editBtn = e.target.closest('[data-edit-report]');
    var statusBtn = e.target.closest('[data-edit-status]');
    var cancelBtn = e.target.closest('[data-edit-cancel]');
    var saveBtn = e.target.closest('[data-edit-save]');

    if (editBtn){
      openReportEdit(editBtn.getAttribute('data-edit-report'));
      return;
    }
    if (statusBtn){
      reportEditDraft.status = statusBtn.getAttribute('data-edit-status');
      renderReportsSlot();
      return;
    }
    if (cancelBtn){
      closeReportEdit();
      return;
    }
    if (saveBtn){
      var uid = saveBtn.getAttribute('data-edit-save');
      var reason = reportEditDraft.reason.trim();
      if (reportEditDraft.status === 'leave' && !reason){
        alert('請填寫請假原因');
        return;
      }
      var eventId = openRosterEventId;
      saveBtn.disabled = true;
      setDoc(doc(db, 'attendanceReports', eventId + '_' + uid), {
        eventId: eventId,
        uid: uid,
        status: reportEditDraft.status,
        reason: reportEditDraft.status === 'leave' ? reason : '',
        respondedAt: serverTimestamp()
      }, { merge: true }).then(function(){
        closeReportEdit();
        loadReports(eventId);
      }).catch(function(err){
        alert('儲存失敗：' + err.code);
        saveBtn.disabled = false;
      });
    }
  });

  function renderTypeSelect(){
    var select = document.getElementById('eventType');
    var current = select.value;
    select.innerHTML = eventTypesList.map(function(t){
      return '<option value="' + t.id + '">' + t.label + '</option>';
    }).join('');
    if (eventTypesById[current]) select.value = current;
  }

  function renderColorPicker(){
    var picker = document.getElementById('colorPicker');
    picker.innerHTML = Object.keys(COLOR_THEMES).map(function(key){
      var theme = COLOR_THEMES[key];
      return '<button type="button" class="swatch' + (key === selectedColorKey ? ' selected' : '') +
        '" data-color="' + key + '" style="background:' + theme.bg + ';" aria-label="' + key + '"></button>';
    }).join('');
  }

  document.getElementById('colorPicker').addEventListener('click', function(e){
    var btn = e.target.closest('[data-color]');
    if (!btn) return;
    selectedColorKey = btn.getAttribute('data-color');
    renderColorPicker();
  });

  var typeForm = document.getElementById('typeForm');
  var typeFormError = document.getElementById('typeFormError');
  var typeSubmitBtn = document.getElementById('typeSubmitBtn');

  function enterTypeCreateMode(){
    editingTypeId = null;
    typeForm.reset();
    selectedColorKey = 'sage';
    renderColorPicker();
    typeSubmitBtn.disabled = false;
    typeSubmitBtn.textContent = '新增類型';
    typeFormError.textContent = '';
    typeFormError.classList.remove('show');
  }

  typeForm.addEventListener('submit', function(e){
    e.preventDefault();
    var label = document.getElementById('newTypeLabel').value.trim();
    if (!label){
      typeFormError.textContent = '請輸入類型名稱';
      typeFormError.classList.add('show');
      return;
    }
    var duplicate = eventTypesList.some(function(t){
      return t.label === label && t.id !== editingTypeId;
    });
    if (duplicate){
      typeFormError.textContent = '已經有一個叫「' + label + '」的類型了，請改用別的名稱，或直接編輯既有類型';
      typeFormError.classList.add('show');
      return;
    }
    typeSubmitBtn.disabled = true;

    var payload = {
      label: label,
      colorKey: selectedColorKey,
      homeHighlight: document.getElementById('typeHomeHighlight').checked
    };
    var task = editingTypeId
      ? updateDoc(doc(db, 'eventTypes', editingTypeId), payload)
      : addDoc(collection(db, 'eventTypes'), Object.assign({}, payload, {
          order: eventTypesList.length + 1,
          createdBy: currentAdminUid,
          createdAt: serverTimestamp()
        }));

    task.then(function(){
      typeSubmitBtn.disabled = false;
      enterTypeCreateMode();
    }).catch(function(err){
      typeSubmitBtn.disabled = false;
      typeFormError.textContent = '操作失敗（' + err.code + '）';
      typeFormError.classList.add('show');
    });
  });

  function renderTypesList(){
    var list = document.getElementById('typesList');
    if (eventTypesList.length === 0){
      list.innerHTML = '<div class="empty">目前沒有任何活動類型</div>';
      return;
    }
    list.innerHTML = eventTypesList.map(function(t){
      var theme = COLOR_THEMES[t.colorKey] || COLOR_THEMES.slate;
      return (
        '<div class="type-item">' +
          '<span class="type-swatch" style="background:' + theme.bg + ';"></span>' +
          '<span class="type-label">' + t.label + (t.homeHighlight ? ' <span title="首頁焦點類型">★</span>' : '') + '</span>' +
          '<div class="type-actions">' +
            '<button type="button" data-edit-type="' + t.id + '">編輯</button>' +
            '<button type="button" class="btn-type-delete" data-delete-type="' + t.id + '">刪除</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  document.getElementById('typesList').addEventListener('click', function(e){
    var editBtn = e.target.closest('[data-edit-type]');
    var deleteBtn = e.target.closest('[data-delete-type]');

    if (editBtn){
      var editId = editBtn.getAttribute('data-edit-type');
      var editType = eventTypesById[editId];
      if (!editType) return;
      editingTypeId = editId;
      document.getElementById('newTypeLabel').value = editType.label;
      selectedColorKey = editType.colorKey;
      renderColorPicker();
      document.getElementById('typeHomeHighlight').checked = !!editType.homeHighlight;
      typeSubmitBtn.textContent = '儲存變更';
      typeForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    if (deleteBtn){
      var delId = deleteBtn.getAttribute('data-delete-type');
      var delType = eventTypesById[delId];
      var ok = confirm(
        '確定要刪除「' + (delType ? delType.label : '這個類型') + '」嗎？\n' +
        '如果還有活動使用這個類型，畫面會顯示找不到對應名稱，不會自動改到別的類型。'
      );
      if (!ok) return;
      deleteDoc(doc(db, 'eventTypes', delId)).then(function(){
        if (editingTypeId === delId) enterTypeCreateMode();
      }).catch(function(err){
        alert('刪除失敗：' + err.code);
      });
    }
  });

  var currentAdminUid = null;

  requireAdmin().then(function(result){
    if (!result) return;
    currentAdminUid = result.uid;

    var avatarBtn = document.getElementById('avatarBtn');
    avatarBtn.textContent = result.profile.name ? result.profile.name.charAt(0) : '?';
    avatarBtn.classList.remove('skel');
    initAccountMenu(result.profile.name);

    var canManageTypes = result.profile.role === 'owner' ||
      (result.profile.permissions && result.profile.permissions.canManageEventTypes === true);

    if (canManageTypes){
      document.getElementById('typesSectionLabel').classList.remove('hidden');
      typeForm.classList.remove('hidden');
      document.getElementById('typesList').classList.remove('hidden');
    }

    renderColorPicker();

    // 活動類型跟活動本身是兩份分開即時更新的資料，先等類型資料到齊過一次，
    // 才開始畫活動列表/下拉選單，避免出現「類型還沒載入時顯示原始 ID」的畫面，
    // 也避免使用者在那個空窗期點編輯，選單選不到正確值卡住的問題
    var typesLoaded = false;
    var eventsLoaded = false;
    var rostersLoaded = false;

    function maybeRender(){
      if (typesLoaded && eventsLoaded && rostersLoaded) render();
    }

    subscribeEventTypes(db, function(types){
      eventTypesList = types;
      eventTypesById = {};
      types.forEach(function(t){ eventTypesById[t.id] = t; });
      typesLoaded = true;
      renderTypeSelect();
      renderTypesList();
      maybeRender();
    }, canManageTypes ? currentAdminUid : null, renderEventsAdminError);

    onSnapshot(collection(db, 'events'), function(snap){
      eventsById = {};
      snap.forEach(function(docSnap){
        var data = docSnap.data();
        eventsById[docSnap.id] = {
          title: data.title,
          type: data.type,
          date: data.date && data.date.toDate ? data.date.toDate() : null,
          allDay: !!data.allDay,
          endTime: data.endTime && data.endTime.toDate ? data.endTime.toDate() : null,
          location: data.location
        };
      });
      eventsLoaded = true;
      maybeRender();
    }, renderEventsAdminError);

    onSnapshot(collection(db, 'eventRosters'), function(snap){
      rostersById = {};
      snap.forEach(function(docSnap){
        rostersById[docSnap.id] = { members: docSnap.data().members || [] };
      });
      rostersLoaded = true;
      maybeRender();
    }, function(err){ console.error('eventRosters 監聽失敗', err); });

    setDefaultEventDate();
  });
</script>
</body>
</html>
