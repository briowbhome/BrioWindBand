<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>布利歐管樂團｜意見回饋管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F2EFE5">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<script src="./pwa-register.js" defer></script>
<style>
  :root{
    --ink:#20242F;
    --ink-soft:#4A4F5C;
    --paper:#F2EFE5;
    --paper-raised:#FBFAF4;
    --line:#DAD3BE;
    --brass:#B8863A;
    --brass-deep:#8F6A2C;
    --burgundy:#7A2331;
    --burgundy-deep:#5C1A26;
    --sage:#5F6E58;
    --sage-bg:#E7EBDF;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-card: 0 1px 2px rgba(32,36,47,.06), 0 8px 24px -12px rgba(32,36,47,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #EFE9D6 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding: 0 0 calc(48px + env(safe-area-inset-bottom));
  }

  button, a, input, textarea, select{ -webkit-tap-highlight-color: transparent; font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--brass-deep); outline-offset:2px; border-radius:6px; }

  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
  }

  .hidden{ display:none !important; }

  .appbar{ display:flex; align-items:center; gap:12px; padding:18px 20px 14px; }
  /* 原本這顆按鈕的樣式只靠 admin-nav.js 的 initAdminNav() 注入，要等身分驗證的非同步
     請求回來才會執行，剛進頁面時會先看到瀏覽器原生按鈕外觀再跳成正確圓形圖示。
     直接在這裡定義同一份樣式，讓按鈕從第一次畫面繪製就是正確樣式 */
  .admin-nav-btn{ width:30px; height:30px; flex:none; border:none; background:none; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer; padding:0; }
  .admin-nav-btn:active{ background:rgba(32,36,47,.06); }
  .mark{ width:38px; height:38px; flex:none; object-fit:cover; border-radius:50%; }
  .brandtext{ display:flex; flex-direction:column; line-height:1.1; }
  .brandtext .name{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:19px; letter-spacing:.02em; }
  .brandtext .sub{ font-family:'Roboto Mono',monospace; font-size:10.5px; letter-spacing:.14em; color:var(--ink-soft); margin-top:3px; text-transform:uppercase; }
  .appbar .spacer{ flex:1; }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px;
    border:2px solid var(--paper-raised); box-shadow:0 0 0 1.5px var(--line);
    padding:0; cursor:pointer;
  }
  .back-btn{
    width:30px; height:30px; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); text-decoration:none;
  }
  .brand-link{ display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }

  @keyframes skel-pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  .skel{ background:var(--line); animation:skel-pulse 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .skel{ animation:none; opacity:.75; } }

  .section-label{ display:flex; align-items:baseline; gap:8px; margin:20px 20px 4px; }
  .section-label .tw{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:15.5px; }
  .section-label .en{ font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }
  .lede{ margin:6px 20px 10px; font-size:12.5px; line-height:1.6; color:var(--ink-soft); }

  .filter-row{ display:flex; gap:6px; overflow-x:auto; margin:0 20px 14px; }
  .filter-row::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex:none; border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft);
    border-radius:999px; padding:6px 13px; font-size:11.5px; font-weight:600; cursor:pointer;
  }
  .filter-chip.active{ background:var(--ink); border-color:var(--ink); color:var(--paper-raised); }

  .fb-card{
    margin:0 20px 14px; background:var(--paper-raised); border:1px solid var(--line);
    border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:14px 16px;
  }
  .fb-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .fb-type-badge{
    display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px;
    font-size:10.5px; font-weight:700; flex:none;
  }
  .fb-type-badge.bug{ background:rgba(122,35,49,.1); color:var(--burgundy); }
  .fb-type-badge.feature{ background:rgba(184,134,58,.14); color:var(--brass-deep); }
  .fb-date{ font-family:'Roboto Mono',monospace; font-size:10px; color:var(--ink-soft); }
  .fb-title{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px; margin-top:6px; }
  .fb-desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin-top:4px; white-space:pre-wrap; }
  .fb-shot{ width:100%; max-width:160px; border-radius:var(--radius-sm); border:1px solid var(--line); margin-top:8px; display:block; cursor:zoom-in; }
  .fb-meta{ margin-top:10px; padding-top:8px; border-top:1px solid var(--line); font-family:'Roboto Mono',monospace; font-size:10px; color:var(--ink-soft); line-height:1.7; word-break:break-all; }
  .fb-note{
    width:100%; margin-top:8px; min-height:50px; resize:vertical;
    border:1px solid var(--line); background:var(--paper); border-radius:var(--radius-sm);
    padding:8px; font-size:12px; color:var(--ink); line-height:1.6; font-family:inherit;
  }
  .fb-actions{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .fb-status-select{
    flex:1; border:1px solid var(--line); background:var(--paper); border-radius:var(--radius-sm);
    padding:8px 10px; font-size:12.5px; color:var(--ink); font-family:inherit;
  }
  .fb-delete-btn{
    border:none; background:none; color:var(--burgundy); font-size:12px; font-weight:700; cursor:pointer;
    padding:8px 6px;
  }
  .fb-empty{ margin:0 20px; padding:24px 16px; text-align:center; color:var(--ink-soft); font-size:12.5px; border:1px dashed var(--line); border-radius:var(--radius-md); }

  .qr-zoom-overlay{
    position:fixed; inset:0; z-index:85;
    background:rgba(32,36,47,.82);
    display:none; align-items:center; justify-content:center;
    padding:32px; cursor:zoom-out;
  }
  .qr-zoom-overlay.active{ display:flex; }
  .qr-zoom-overlay img{
    width:min(84vw, 360px); max-height:80vh; object-fit:contain;
    background:#fff; border-radius:var(--radius-lg); padding:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
</style>
</head>
<body>
<div class="app" id="appRoot">

  <div class="appbar">
    <button class="admin-nav-btn" id="adminNavBtn" type="button" aria-label="開啟後台導覽選單">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="back-btn" href="admin-index.html" aria-label="回控制台首頁">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="brand-link" href="index.html">
      <img class="mark" src="assets/BrioLogo.jpg" alt="布利歐管樂團 Logo">
      <div class="brandtext">
        <div class="name">布利歐管樂團</div>
        <div class="sub">Brio Wind Band</div>
      </div>
    </a>
    <div class="spacer"></div>
    <button class="avatar skel" id="avatarBtn" type="button" aria-label="帳號選單"></button>
  </div>

  <div class="section-label">
    <span class="tw">意見回饋管理</span>
    <span class="en">Feedback</span>
  </div>
  <p class="lede">團員送出的 bug 回報／功能建議，只有這裡看得到（包含提交者本人也看不到自己送出的內容）。</p>

  <div class="filter-row" id="filterRow"></div>
  <div id="feedbackList"></div>
  <div class="fb-empty hidden" id="feedbackEmpty">目前沒有符合條件的回報。</div>

</div>

<div class="qr-zoom-overlay" id="shotZoomOverlay">
  <img id="shotZoomImg" alt="截圖放大">
</div>

<script type="module">
  import { initAdminNav } from './admin-nav.js';
  import { showToast } from './toast.js';
  import { requireAdmin } from './auth-guard.js';
  import { db } from './firebase-init.js';
  import { initAccountMenu } from './account-menu.js';
  import {
    collection, doc, getDocs, setDoc, deleteDoc, serverTimestamp
  } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  var TYPE_LABEL = { bug: 'Bug 回報', feature: '功能建議' };
  var STATUS_LABEL = { pending: '待處理', in_progress: '處理中', done: '已完成', rejected: '不採用' };
  var STATUS_ORDER = ['pending', 'in_progress', 'done', 'rejected'];

  var allItems = [];
  var activeFilter = 'all';

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function formatDate(ts){
    if (!ts || !ts.toDate) return '';
    var d = ts.toDate();
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.toLocaleString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false });
  }

  function loadFeedbackItems(){
    return getDocs(collection(db, 'feedbackItems')).then(function(snap){
      allItems = [];
      snap.forEach(function(docSnap){
        var data = docSnap.data();
        allItems.push({
          id: docSnap.id,
          type: data.type,
          title: data.title || '',
          description: data.description || '',
          screenshotDataUrl: data.screenshotDataUrl || null,
          deviceInfo: data.deviceInfo || '',
          pageUrl: data.pageUrl || '',
          submitterName: data.submitterName || '',
          submitterAccount: data.submitterAccount || '',
          status: data.status || 'pending',
          adminNote: data.adminNote || '',
          createdAt: data.createdAt
        });
      });
      allItems.sort(function(a, b){
        var at = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
        var bt = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
        return bt - at;
      });
      renderFeedbackList();
    });
  }

  function updateFeedbackStatus(id, status){
    return setDoc(doc(db, 'feedbackItems', id), { status: status, updatedAt: serverTimestamp() }, { merge: true });
  }

  function updateFeedbackNote(id, note){
    return setDoc(doc(db, 'feedbackItems', id), { adminNote: note, updatedAt: serverTimestamp() }, { merge: true });
  }

  function deleteFeedbackItem(id){
    return deleteDoc(doc(db, 'feedbackItems', id));
  }

  function renderFilterChips(){
    var chips = ['all'].concat(STATUS_ORDER);
    document.getElementById('filterRow').innerHTML = chips.map(function(key){
      var label = key === 'all' ? '全部' : STATUS_LABEL[key];
      return '<button type="button" class="filter-chip' + (activeFilter === key ? ' active' : '') + '" data-filter="' + key + '">' + label + '</button>';
    }).join('');
  }

  function renderFeedbackList(){
    renderFilterChips();
    var visible = activeFilter === 'all' ? allItems : allItems.filter(function(it){ return it.status === activeFilter; });
    var listEl = document.getElementById('feedbackList');
    var emptyEl = document.getElementById('feedbackEmpty');
    if (visible.length === 0){ listEl.innerHTML = ''; emptyEl.classList.remove('hidden'); return; }
    emptyEl.classList.add('hidden');
    listEl.innerHTML = visible.map(function(it){
      var statusOptions = STATUS_ORDER.map(function(s){
        return '<option value="' + s + '"' + (it.status === s ? ' selected' : '') + '>' + STATUS_LABEL[s] + '</option>';
      }).join('');
      return (
        '<div class="fb-card">' +
          '<div class="fb-card-top">' +
            '<span class="fb-type-badge ' + it.type + '">' + escapeHtml(TYPE_LABEL[it.type] || it.type) + '</span>' +
            '<span class="fb-date">' + formatDate(it.createdAt) + '</span>' +
          '</div>' +
          '<div class="fb-title">' + escapeHtml(it.title) + '</div>' +
          '<div class="fb-desc">' + escapeHtml(it.description) + '</div>' +
          (it.screenshotDataUrl ? '<img class="fb-shot" src="' + it.screenshotDataUrl + '" data-shot-zoom>' : '') +
          '<div class="fb-meta">' +
            '送出者：' + escapeHtml(it.submitterName) + '（' + escapeHtml(it.submitterAccount) + '）<br>' +
            '裝置：' + escapeHtml(it.deviceInfo) + '<br>' +
            '頁面：' + escapeHtml(it.pageUrl) +
          '</div>' +
          '<textarea class="fb-note" data-note-for="' + it.id + '" placeholder="內部備註（選填，離開輸入框時自動儲存）">' + escapeHtml(it.adminNote) + '</textarea>' +
          '<div class="fb-actions">' +
            '<select class="fb-status-select" data-status-for="' + it.id + '">' + statusOptions + '</select>' +
            '<button type="button" class="fb-delete-btn" data-delete="' + it.id + '">刪除</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  document.getElementById('filterRow').addEventListener('click', function(e){
    var chip = e.target.closest('[data-filter]');
    if (!chip) return;
    activeFilter = chip.getAttribute('data-filter');
    renderFeedbackList();
  });

  var shotZoomOverlay = document.getElementById('shotZoomOverlay');
  var shotZoomImg = document.getElementById('shotZoomImg');
  document.getElementById('feedbackList').addEventListener('click', function(e){
    var img = e.target.closest('[data-shot-zoom]');
    if (img){
      shotZoomImg.src = img.src;
      shotZoomOverlay.classList.add('active');
      return;
    }
    var delBtn = e.target.closest('[data-delete]');
    if (delBtn){
      var ok = confirm('確定要刪除這筆回報嗎？');
      if (!ok) return;
      var id = delBtn.getAttribute('data-delete');
      deleteFeedbackItem(id).then(function(){
        return loadFeedbackItems();
      }).catch(function(err){
        showToast('刪除失敗：' + err.code, 'error');
      });
    }
  });
  shotZoomOverlay.addEventListener('click', function(){
    shotZoomOverlay.classList.remove('active');
  });

  document.getElementById('feedbackList').addEventListener('change', function(e){
    var sel = e.target.closest('[data-status-for]');
    if (!sel) return;
    var id = sel.getAttribute('data-status-for');
    updateFeedbackStatus(id, sel.value).then(function(){
      return loadFeedbackItems();
    }).catch(function(err){
      showToast('更新狀態失敗：' + err.code, 'error');
    });
  });

  document.getElementById('feedbackList').addEventListener('blur', function(e){
    var textarea = e.target.closest('[data-note-for]');
    if (!textarea) return;
    var id = textarea.getAttribute('data-note-for');
    var item = allItems.filter(function(x){ return x.id === id; })[0];
    if (!item || textarea.value === item.adminNote) return;
    updateFeedbackNote(id, textarea.value).then(function(){
      if (item) item.adminNote = textarea.value;
    }).catch(function(err){
      showToast('儲存備註失敗：' + err.code, 'error');
    });
  }, true);

  requireAdmin().then(function(result){
    if (!result) return;

    var avatarBtn = document.getElementById('avatarBtn');
    avatarBtn.textContent = result.profile.name ? result.profile.name.charAt(0) : '?';
    avatarBtn.classList.remove('skel');
    initAccountMenu(result.profile.name);
    initAdminNav('feedback');

    loadFeedbackItems().catch(function(err){
      console.error('載入意見回饋失敗', err);
      showToast('載入失敗，請重新整理', 'error');
    });
  });
</script>
</body>
</html>
