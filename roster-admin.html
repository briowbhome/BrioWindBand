<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>布利歐管樂團｜名單管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F2EFE5">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<script src="./pwa-register.js" defer></script>
<script src="./pull-refresh.js" defer></script>
<link rel="stylesheet" href="./theme.css">
<style>

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #EFE9D6 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding: 0 0 calc(48px + env(safe-area-inset-bottom));
  }

  button, a, input{ -webkit-tap-highlight-color: transparent; font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--brass-deep); outline-offset:2px; border-radius:6px; }

  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
  }

  .hidden{ display:none !important; }

  /* ---------- Skeleton placeholders ---------- */
  @keyframes skel-pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  .skel{ background:var(--line); animation:skel-pulse 1.4s ease-in-out infinite; }
  .avatar.skel{ animation:skel-pulse 1.4s ease-in-out infinite; }
  .skel-bar{ display:inline-block; border-radius:5px; }
  @media (prefers-reduced-motion: reduce){
    .skel, .avatar.skel{ animation:none; opacity:.75; }
  }
  .rt-skel-lines{ flex:1; display:flex; flex-direction:column; gap:7px; padding-top:2px; }

  .appbar{ display:flex; align-items:center; gap:12px; padding:18px 20px 14px; }
  /* 原本這顆按鈕的樣式只靠 admin-nav.js 的 initAdminNav() 注入，要等身分驗證的非同步
     請求回來才會執行，剛進頁面時會先看到瀏覽器原生按鈕外觀（方框）再跳成正確圓形圖示。
     直接在這裡定義同一份樣式，讓按鈕從第一次畫面繪製就是正確樣式 */
  .admin-nav-btn{ width:30px; height:30px; flex:none; border:none; background:none; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer; padding:0; }
  .admin-nav-btn:active{ background:rgba(32,36,47,.06); }
  .mark{ width:38px; height:38px; flex:none; object-fit:cover; border-radius:50%; }
  /* 團徽只在「真的擁擠」時才隱藏：實測過 conductorBtn 單獨顯示時其實空間還很寬裕（因為它是固定 34px），
     真正會擠的只有雙團籍徽章 team-badge 出現的時候（它是寬度不固定的元素），所以只看這一個條件就夠：
     大部分單團籍帳號（包括單團籍的指揮/管理員）在手機上其實還有空間放團徽，不需要被這條規則改到。
     :has() 不支援的舊瀏覽器會整條規則失效（這比現在還安全，因為回到團徽常駐顯示） */
  @media (max-width: 899px){
    .appbar:has(.team-badge:not(.hidden)) .mark{ display:none; }
  }
  .brandtext{ display:flex; flex-direction:column; line-height:1.1; }
  .brandtext .name{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:19px; letter-spacing:.02em; }
  .brandtext .sub{ font-family:'Roboto Mono',monospace; font-size:10.5px; letter-spacing:.14em; color:var(--ink-soft); margin-top:3px; text-transform:uppercase; }
  .appbar .spacer{ flex:1; }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px;
    border:2px solid var(--paper-raised); box-shadow:0 0 0 1.5px var(--line);
    padding:0; cursor:pointer; flex:none;
  }
  .back-btn{
    width:30px; height:30px; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); text-decoration:none;
  }
  .brand-link{ display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }

  .staff{
    height:16px; margin:0 20px 6px;
    background-image: repeating-linear-gradient(var(--line), var(--line) 1px, transparent 1px, transparent 4px);
    opacity:.9;
  }

  .section-label{ display:flex; align-items:baseline; gap:8px; margin:20px 20px 4px; }
  .section-label .tw{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:15.5px; }
  .section-label .en{ font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }
  .lede{ margin:6px 20px 10px; font-size:12.5px; line-height:1.6; color:var(--ink-soft); }
  .add-btn{
    margin-left:auto; align-self:center;
    border:1px solid var(--line); background:var(--paper); color:var(--brass-deep);
    border-radius:999px; padding:6px 14px; font-size:11.5px; font-weight:700; cursor:pointer;
  }
  .add-btn:active{ background:var(--sage-bg); }

  /* ---------- Template list ---------- */
  .list{
    margin:0 20px 24px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .rt-item{ padding:10px 10px 10px 16px; display:flex; align-items:center; gap:4px; }
  .rt-item + .rt-item{ border-top:1px solid var(--line); }
  .rt-open{ flex:1; min-width:0; background:none; border:none; padding:8px 0; text-align:left; cursor:pointer; }
  .rt-open:active{ opacity:.7; }
  .rt-name{ font-weight:700; font-size:13.5px; color:var(--ink); }
  .rt-meta{ margin-top:3px; font-size:11.5px; color:var(--ink-soft); }
  .empty{ padding:36px 20px; text-align:center; font-size:13px; color:var(--ink-soft); }

  /* ---------- Sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0; z-index:80;
    background:rgba(32,36,47,.45);
    display:none; align-items:flex-end; justify-content:center;
  }
  .sheet-overlay.active{ display:flex; }
  .sheet{
    width:100%; max-width:460px; max-height:85vh;
    background:var(--paper-raised);
    border-radius:20px 20px 0 0;
    display:flex; flex-direction:column;
    box-shadow:0 -10px 30px rgba(32,36,47,.3);
  }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:999px; margin:10px auto 2px; }
  .sheet-header{ position:relative; padding:6px 44px 12px 20px; border-bottom:1px solid var(--line); }
  .sheet-header .name{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:16px; }
  .sheet-close{
    position:absolute; top:4px; right:10px;
    width:30px; height:30px; border-radius:50%; border:none; background:none;
    color:var(--ink-soft); font-size:19px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .sheet-close:active{ background:var(--paper); }
  .sheet-body{ overflow-y:auto; padding:14px 20px 8px; }

  .field{ margin-top:12px; display:flex; flex-direction:column; gap:6px; }
  .field:first-child{ margin-top:0; }
  .field label{
    font-family:'Roboto Mono',monospace; font-size:10.5px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);
  }
  .field input{
    border:1px solid var(--line); background:var(--paper);
    border-radius:var(--radius-sm); padding:11px 13px;
    font-size:14px; color:var(--ink); width:100%;
  }

  /* ---------- 唯讀檢視 + 編輯觸發（比照 event-admin.html 活動資訊/名單調整分頁的既有模式） ---------- */
  .info-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:9px 0; font-size:13px; border-bottom:1px solid var(--line); }
  .info-row .k{ flex:none; color:var(--ink-soft); font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.05em; }
  .info-row .v{ font-weight:500; color:var(--ink); text-align:right; }
  .survey-namelist{ margin-top:4px; font-size:12px; color:var(--ink); line-height:1.7; }
  .tpl-preview-group{ margin-top:10px; }
  .tpl-preview-group:first-child{ margin-top:4px; }
  .tpl-preview-label{
    font-family:'Roboto Mono',monospace; font-size:10px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:var(--brass-deep); margin-bottom:2px;
  }
  .info-edit-btn{
    border:1px solid var(--line); background:var(--paper); color:var(--brass-deep);
    border-radius:999px; padding:8px 18px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .info-edit-btn:active{ background:var(--sage-bg); }
  .info-edit-row{ display:flex; gap:8px; margin-top:14px; }
  #templateDeleteBtn{ color:var(--burgundy-deep); border-color:#EFD4D8; }

  .survey-section-label{
    font-family:'Roboto Mono',monospace; font-size:10.5px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);
    margin:16px 0 8px;
  }
  .survey-bulk-row{ display:flex; gap:8px; margin-bottom:8px; }
  .survey-bulk-row button{
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    border-radius:999px; padding:5px 12px; font-size:11px; font-weight:700; cursor:pointer;
  }
  .survey-bulk-row button:active{ background:var(--sage-bg); color:var(--sage); }

  .check-list{ display:flex; flex-direction:column; gap:2px; max-height:320px; overflow-y:auto; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); padding:4px 10px; }
  .check-row{ display:flex; align-items:center; gap:10px; padding:7px 2px; }
  .check-row + .check-row{ border-top:1px solid var(--line); }
  .checkbox{
    width:18px; height:18px; border-radius:5px; border:1.5px solid var(--line);
    flex:none; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:#fff; cursor:pointer; background:none; padding:0;
  }
  .checkbox.on{ background:var(--brass); border-color:var(--brass); }
  .check-text{ flex:1; font-size:12.5px; color:var(--ink); cursor:pointer; background:none; border:none; text-align:left; padding:0; }

  .form-error{
    margin-top:12px; font-size:12.5px; color:var(--burgundy);
    background:#FBF3F3; border:1px solid #EFD4D8; border-radius:var(--radius-sm);
    padding:10px 12px; display:none;
  }
  .form-error.show{ display:block; }

  .sheet-footer{
    display:flex; gap:10px;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .cta-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--brass); color:var(--ink); border:none;
    border-radius:var(--radius-md); padding:14px 16px;
    font-weight:700; font-size:14.5px; cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .cta-btn:active{ transform:scale(.98); background:var(--brass-deep); }
  .cta-btn:disabled{ opacity:.55; cursor:default; transform:none; }
  .cta-btn-secondary{ background:var(--paper); color:var(--ink-soft); border:1px solid var(--line); }
  .cta-btn-secondary:active{ transform:scale(.98); background:var(--paper); }
</style>
</head>
<body>
<div class="app" id="appRoot">

  <div class="appbar">
    <button class="admin-nav-btn" id="adminNavBtn" type="button" aria-label="開啟後台導覽選單">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="back-btn" href="admin-index.html" aria-label="回控制台首頁">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="brand-link" href="index.html">
      <img class="mark" src="assets/BrioLogo.jpg" alt="布利歐管樂團 Logo">
      <div class="brandtext">
        <div class="name">布利歐管樂團</div>
        <div class="sub">Brio Wind Band</div>
      </div>
    </a>
    <div class="spacer"></div>
    <span class="team-badge hidden" id="teamBadge"></span>
    <button class="avatar skel" id="avatarBtn" type="button" aria-label="帳號選單"></button>
  </div>

  <div class="staff"></div>

  <div class="section-label">
    <span class="tw">名單管理</span>
    <span class="en">Roster Templates</span>
    <button type="button" class="add-btn" id="createTemplateBtn">＋ 新增名單</button>
  </div>
  <p class="lede">建立可重複套用的參與名單範本，建立/編輯活動時可以直接套用。</p>

  <div class="list" id="templateList"></div>

</div>

<div class="sheet-overlay" id="templateSheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <button type="button" class="sheet-close" id="templateSheetClose" aria-label="關閉">×</button>
      <div class="name" id="templateSheetTitle">新增名單</div>
    </div>
    <div class="sheet-body">
      <div id="templateViewMode" class="hidden">
        <div class="info-row"><span class="k">成員</span><span class="v" id="templateViewCount">—</span></div>
        <div class="survey-namelist" id="templateViewNames"></div>
        <div class="info-edit-row">
          <button type="button" class="info-edit-btn" id="templateEditBtn">✎ 編輯</button>
          <button type="button" class="info-edit-btn" id="templateApplyBtn">套用到…</button>
          <button type="button" class="info-edit-btn" id="templateDeleteBtn">刪除</button>
        </div>
      </div>
      <div id="templateEditForm">
        <div class="field">
          <label>名單名稱</label>
          <input type="text" id="templateName" placeholder="例如：第六屆校友團" required>
        </div>

        <div class="survey-section-label">成員</div>
        <div class="survey-bulk-row">
          <button type="button" id="templateSelectAllBtn">全選</button>
          <button type="button" id="templateClearAllBtn">全部取消</button>
        </div>
        <div class="check-list" id="templateChecklist"></div>

        <p class="form-error" id="templateFormError"></p>
      </div>
    </div>
    <div class="sheet-footer" id="templateFormFooter">
      <button type="button" class="cta-btn cta-btn-secondary hidden" id="templateCancelBtn">取消</button>
      <button type="button" class="cta-btn" id="templateSaveBtn">建立名單</button>
    </div>
  </div>
</div>

<div class="sheet-overlay" id="applySheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <button type="button" class="sheet-close" id="applySheetClose" aria-label="關閉">×</button>
      <div class="name" id="applySheetTitle">套用到活動/音樂會</div>
    </div>
    <div class="sheet-body">
      <p class="lede" style="margin:0 0 10px;">勾選要套用這份名單的活動，已經套用過的項目預設勾選；確定後會把選中項目目前的名單整份覆蓋成目前的內容。</p>
      <div id="applyTargetsLoading" class="empty">讀取中…</div>
      <div id="applyTargetsBody" class="hidden">
        <div class="survey-bulk-row">
          <button type="button" id="applySelectAllBtn">全選</button>
          <button type="button" id="applyClearAllBtn">全部取消</button>
        </div>
        <div class="survey-section-label">即將到來</div>
        <div class="check-list" id="applyUpcomingList"></div>
        <button type="button" class="info-edit-btn" id="applyTogglePastBtn" style="margin-top:10px;"></button>
        <div class="hidden" id="applyPastWrap">
          <div class="survey-section-label">已結束</div>
          <p class="lede" style="margin:0 0 8px;">已結束的活動預設不勾選。</p>
          <div class="check-list" id="applyPastList"></div>
        </div>
      </div>
      <p class="form-error" id="applyFormError"></p>
    </div>
    <div class="sheet-footer">
      <button type="button" class="cta-btn cta-btn-secondary" id="applyCancelBtn">取消</button>
      <button type="button" class="cta-btn" id="applyConfirmBtn" disabled>套用</button>
    </div>
  </div>
</div>

<script type="module">
  import { initAdminNav } from './admin-nav.js';
  import { showToast } from './toast.js';
  import { showConfirm } from './dialog.js';
  import { MESSAGES } from './messages.js';
  import { requireAdminOrTeamAdmin, peekCachedProfile } from './auth-guard.js';
  import { db } from './firebase-init.js';
  import { initAccountMenu } from './account-menu.js';
  import { initTeamSwitcher } from './team-switcher.js';
  import { applyTemplateToEventRoster, applyTemplateToConcertRoster, diffTemplateMembers } from './roster-templates.js';
  import {
    collection, addDoc, doc, getDoc, updateDoc, deleteDoc, onSnapshot,
    serverTimestamp, getDocs, query, where, documentId
  } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  var SKELETON_ROWS_HTML = [1, 2, 3].map(function(){
    return (
      '<div class="rt-item"><div class="rt-skel-lines">' +
        '<span class="skel skel-bar" style="width:45%;height:13px;"></span>' +
        '<span class="skel skel-bar" style="width:25%;height:10px;"></span>' +
      '</div></div>'
    );
  }).join('');

  var cachedProfile = peekCachedProfile();
  if (cachedProfile && cachedProfile.name){
    var avatarBtnEl = document.getElementById('avatarBtn');
    avatarBtnEl.textContent = cachedProfile.name.charAt(0);
    avatarBtnEl.classList.remove('skel');
  }

  var currentAdminUid = null;
  var activeTeam = null;
  var templatesById = {};
  var templatesList = [];
  var templatesLoaded = false;
  var approvedMembers = null;
  var editingTemplateId = null; // null = 新增模式
  var draftSet = {}; // {uid: true}

  var templateList = document.getElementById('templateList');
  templateList.innerHTML = SKELETON_ROWS_HTML;

  function renderTemplateAdminError(){
    templateList.innerHTML = '<div class="empty">讀取失敗，請重新整理再試一次</div>';
  }

  function renderTemplateList(){
    if (!templatesLoaded) return;
    if (templatesList.length === 0){
      templateList.innerHTML = '<div class="empty">目前還沒有任何名單</div>';
      return;
    }
    templateList.innerHTML = templatesList.map(function(t){
      return (
        '<div class="rt-item">' +
          '<button type="button" class="rt-open" data-open-template="' + t.id + '">' +
            '<div class="rt-name">' + escapeHtml(t.name) + '</div>' +
            '<div class="rt-meta">' + (t.members || []).length + ' 人</div>' +
          '</button>' +
        '</div>'
      );
    }).join('');
  }

  async function ensureApprovedMembers(){
    if (approvedMembers) return approvedMembers;
    // 9/22 修正：漏加 teamIds 篩選，之前建立名單的勾選清單會把兩團成員混在一起顯示。
    // instruments 是「套用到活動/音樂會」批次套用音樂會參與名單時，比照 event-admin.html
    // 既有邏輯抓「新加入的人預設帶入 users.instruments[0]」要用的
    var snap = await getDocs(query(collection(db, 'users'), where('status', '==', 'approved'), where('teamIds', 'array-contains', activeTeam)));
    approvedMembers = snap.docs.map(function(docSnap){
      var data = docSnap.data();
      return { uid: docSnap.id, name: data.name, account: data.account, instruments: data.instruments || [] };
    });
    return approvedMembers;
  }

  // 樂器清單快取，兩處要用：①套用到音樂會參與名單時，範本裡全新加入、而且自己資料裡也沒
  // 設定任何樂器的人，最後備援抓清單第一筆（跟 event-admin.html 的
  // applyTemplateToConcertRosterUI 同一個規則）；②名單預覽依樂器分區顯示的排序依據
  var instrumentsListCache;
  async function ensureInstrumentsList(){
    if (instrumentsListCache) return instrumentsListCache;
    var snap = await getDoc(doc(db, 'settings', 'instruments'));
    instrumentsListCache = snap.exists() ? (snap.data().list || []) : [];
    return instrumentsListCache;
  }

  // 依樂器清單順序（家族分類→清單原順序）把 uid 分區，跟 checkin-stats-admin.html 的
  // groupCheckinsByInstrument 同一套規則：一人可能同時列在多個分區（樂器不分主副修，本來
  // 就是多選），沒設定樂器的人歸進「未設定樂器」，空分區不顯示（跟簽到統計那邊不同——
  // 這裡是名單預覽，不是「全團這個樂器有幾人」的統計描述，空分區只會是純噪音）
  function groupUidsByInstrument(uids){
    var namesByUid = {};
    (approvedMembers || []).forEach(function(m){ namesByUid[m.uid] = m; });
    var byInstrument = {};
    uids.forEach(function(uid){
      var member = namesByUid[uid];
      var instruments = (member && member.instruments && member.instruments.length) ? member.instruments : ['未設定樂器'];
      instruments.forEach(function(name){
        if (!byInstrument[name]) byInstrument[name] = [];
        // 同一個人有多個樂器身分時，會在好幾個分區都出現——不加註記的話容易被誤會成
        // 名單重複列了同一個人，或看不出跟另一個分區裡同名的人是不是同一位。在每個分區
        // 的名字後面帶出「這個人在這份名單裡的其他樂器身分」，就地說明，不用另外查
        var label = member ? member.name : uid;
        var others = instruments.filter(function(n){ return n !== name; });
        if (others.length) label += '（' + others.join('、') + '）';
        byInstrument[name].push(label);
      });
    });
    var orderedNames = (instrumentsListCache || []).map(function(inst){ return inst.name; });
    if (byInstrument['未設定樂器']) orderedNames.push('未設定樂器');
    return orderedNames
      .filter(function(name){ return byInstrument[name] && byInstrument[name].length; })
      .map(function(name){ return { name: name, names: byInstrument[name] }; });
  }

  function renderChecklist(){
    var checklist = document.getElementById('templateChecklist');
    checklist.innerHTML = (approvedMembers || []).map(function(m){
      var on = !!draftSet[m.uid];
      return (
        '<div class="check-row">' +
          '<button type="button" class="checkbox' + (on ? ' on' : '') + '" data-uid="' + m.uid + '">' + (on ? '✓' : '') + '</button>' +
          '<button type="button" class="check-text" data-uid="' + m.uid + '">' + escapeHtml(m.name) + '（' + escapeHtml(m.account) + '）</button>' +
        '</div>'
      );
    }).join('');
  }

  function showFormError(message){
    var el = document.getElementById('templateFormError');
    el.textContent = message;
    el.classList.toggle('show', !!message);
  }

  var templateSheetOverlay = document.getElementById('templateSheetOverlay');
  var templateNameInput = document.getElementById('templateName');
  var templateSaveBtn = document.getElementById('templateSaveBtn');
  var templateDeleteBtn = document.getElementById('templateDeleteBtn');
  var templateCancelBtn = document.getElementById('templateCancelBtn');
  var templateViewMode = document.getElementById('templateViewMode');
  var templateEditForm = document.getElementById('templateEditForm');
  var templateFormFooter = document.getElementById('templateFormFooter');
  var templateViewCount = document.getElementById('templateViewCount');
  var templateViewNames = document.getElementById('templateViewNames');

  // 唯讀摘要（只有編輯既有名單才會用到，新增名單沒有「唯讀」狀態可看，直接進表單）；
  // 名單名稱顯示在 sheet 標題（見 openEditSheet），摘要內容不用重複顯示一次。
  // 9/22 修正：原本整份名單條列一長串名字很不直觀，改成依樂器分區（跟簽到統計等既有頁面
  // 同一套排序邏輯），大名單也能一眼看出分部人數/構成
  function showTemplateView(t){
    templateViewMode.classList.remove('hidden');
    templateEditForm.classList.add('hidden');
    templateFormFooter.classList.add('hidden');
    document.getElementById('templateSheetTitle').textContent = t.name || '—';
    var members = t.members || [];
    templateViewCount.textContent = members.length + ' 人';
    if (members.length === 0){
      templateViewNames.innerHTML = '（無）';
      return;
    }
    var groups = groupUidsByInstrument(members);
    templateViewNames.innerHTML = groups.map(function(g){
      return (
        '<div class="tpl-preview-group">' +
          '<div class="tpl-preview-label">' + escapeHtml(g.name) + '（' + g.names.length + '）</div>' +
          '<div>' + g.names.map(escapeHtml).join('、') + '</div>' +
        '</div>'
      );
    }).join('');
  }

  function showTemplateEditForm(){
    templateViewMode.classList.add('hidden');
    templateEditForm.classList.remove('hidden');
    templateFormFooter.classList.remove('hidden');
  }

  async function openCreateSheet(){
    editingTemplateId = null;
    draftSet = {};
    templateNameInput.value = '';
    document.getElementById('templateSheetTitle').textContent = '新增名單';
    templateSaveBtn.textContent = '建立名單';
    templateCancelBtn.classList.add('hidden'); // 新增沒有「唯讀」畫面可以取消回去，只有關閉整個 sheet
    showFormError('');
    await ensureApprovedMembers();
    renderChecklist();
    showTemplateEditForm();
    templateSheetOverlay.classList.add('active');
  }

  // 點清單裡的名單，先看唯讀摘要，點「✎ 編輯」才進勾選畫面，不會一點開就是可編輯狀態
  async function openEditSheet(templateId){
    var t = templatesById[templateId];
    if (!t) return;
    editingTemplateId = templateId;
    templateSaveBtn.textContent = '儲存變更';
    templateCancelBtn.classList.remove('hidden');
    showFormError('');
    await Promise.all([ensureApprovedMembers(), ensureInstrumentsList()]);
    showTemplateView(t);
    templateSheetOverlay.classList.add('active');
  }

  document.getElementById('templateEditBtn').addEventListener('click', function(){
    if (!editingTemplateId) return;
    var t = templatesById[editingTemplateId];
    if (!t) return;
    draftSet = {};
    (t.members || []).forEach(function(uid){ draftSet[uid] = true; });
    templateNameInput.value = t.name || '';
    renderChecklist();
    showTemplateEditForm();
  });

  templateCancelBtn.addEventListener('click', function(){
    if (!editingTemplateId) return;
    var t = templatesById[editingTemplateId];
    if (t) showTemplateView(t); // 放棄未存檔的草稿，回到唯讀摘要
  });

  function closeTemplateSheet(){
    templateSheetOverlay.classList.remove('active');
  }

  document.getElementById('createTemplateBtn').addEventListener('click', openCreateSheet);
  document.getElementById('templateSheetClose').addEventListener('click', closeTemplateSheet);
  templateSheetOverlay.addEventListener('click', function(e){
    if (e.target === templateSheetOverlay) closeTemplateSheet();
  });

  templateList.addEventListener('click', function(e){
    var openBtn = e.target.closest('[data-open-template]');
    if (openBtn) openEditSheet(openBtn.getAttribute('data-open-template'));
  });

  document.getElementById('templateChecklist').addEventListener('click', function(e){
    var btn = e.target.closest('[data-uid]');
    if (!btn) return;
    var uid = btn.getAttribute('data-uid');
    if (draftSet[uid]) delete draftSet[uid]; else draftSet[uid] = true;
    var row = btn.closest('.check-row');
    var checkboxEl = row.querySelector('.checkbox');
    var on = !!draftSet[uid];
    checkboxEl.classList.toggle('on', on);
    checkboxEl.textContent = on ? '✓' : '';
  });

  document.getElementById('templateSelectAllBtn').addEventListener('click', function(){
    (approvedMembers || []).forEach(function(m){ draftSet[m.uid] = true; });
    renderChecklist();
  });
  document.getElementById('templateClearAllBtn').addEventListener('click', function(){
    draftSet = {};
    renderChecklist();
  });

  templateSaveBtn.addEventListener('click', function(){
    var name = templateNameInput.value.trim();
    if (!name){
      showFormError('請輸入名單名稱');
      return;
    }
    var duplicate = templatesList.some(function(t){
      return t.name === name && t.id !== editingTemplateId;
    });
    if (duplicate){
      showFormError('已經有一個叫「' + name + '」的名單了，請改用別的名稱，或直接編輯既有名單');
      return;
    }
    showFormError('');
    var members = Object.keys(draftSet);
    templateSaveBtn.disabled = true;

    var task = editingTemplateId
      ? updateDoc(doc(db, 'rosterTemplates', editingTemplateId), {
          name: name, members: members, updatedAt: serverTimestamp()
        })
      : addDoc(collection(db, 'rosterTemplates'), {
          name: name, members: members, team: activeTeam,
          createdBy: currentAdminUid, createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        });

    task.then(function(){
      templateSaveBtn.disabled = false;
      closeTemplateSheet();
    }).catch(function(err){
      templateSaveBtn.disabled = false;
      showFormError('操作失敗（' + err.code + '）');
    });
  });

  templateDeleteBtn.addEventListener('click', async function(){
    if (!editingTemplateId) return;
    var t = templatesById[editingTemplateId];
    var ok = await showConfirm(MESSAGES.deleteRosterTemplate(t ? t.name : ''), { danger: true });
    if (!ok) return;
    templateDeleteBtn.disabled = true;
    deleteDoc(doc(db, 'rosterTemplates', editingTemplateId)).then(function(){
      templateDeleteBtn.disabled = false;
      closeTemplateSheet();
    }).catch(function(err){
      templateDeleteBtn.disabled = false;
      showToast('刪除失敗：' + err.code, 'error');
    });
  });

  // ---------- 套用到活動/音樂會（9/22 新增）：不像「編輯活動/音樂會」裡的單一套用入口
  // 要等已經套用過的項目自己找過來，這裡反過來從範本這邊列出目前這團所有活動/音樂會，
  // 勾選要（重新）套用的項目，一次批次送出——已經套用過這份範本的項目預設勾選，方便
  // 「編完範本、同步到既有活動」這個最常見的用途；也可以額外勾選還沒套用過的項目，
  // 一次把範本套到新地方，隨時可用，不綁在剛編輯完範本之後才能點 ----------
  var applySheetOverlay = document.getElementById('applySheetOverlay');
  var applyConfirmBtn = document.getElementById('applyConfirmBtn');
  var applyTemplateId = null;
  var applyEventsCache = null; // [{id, kind:'event', title, sortDate}]
  var applyConcertsCache = null; // 同上，kind:'concert'
  var applyRostersByTarget = {}; // key `${kind}:${id}` -> { memberUids, sourceTemplateId, existed }
  var applySelected = {}; // key -> true

  function chunkArray(arr, size){
    var out = [];
    for (var i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }

  // Firestore `in` 查詢一次最多 30 個值，活動/音樂會數量理論上可能超過，切成多批平行查詢
  async function fetchRostersByIds(collectionName, ids){
    var result = {};
    await Promise.all(chunkArray(ids, 30).map(async function(idsChunk){
      if (idsChunk.length === 0) return;
      var snap = await getDocs(query(collection(db, collectionName), where(documentId(), 'in', idsChunk)));
      snap.forEach(function(docSnap){ result[docSnap.id] = docSnap.data(); });
    }));
    return result;
  }

  // 活動/音樂會清單只在第一次打開「套用到」sheet 時查一次、快取起來——這是幹部偶爾才會用
  // 的批次動作，不是常駐畫面，沒必要維持常駐監聽增加負擔，跟 ensureApprovedMembers() 同一種取捨
  async function ensureEventsAndConcerts(){
    if (applyEventsCache && applyConcertsCache) return;
    var pair = await Promise.all([
      getDocs(query(collection(db, 'events'), where('team', 'array-contains', activeTeam))),
      getDocs(query(collection(db, 'concerts'), where('team', 'array-contains', activeTeam)))
    ]);
    applyEventsCache = pair[0].docs.map(function(d){
      var data = d.data();
      return { id: d.id, kind: 'event', title: data.title || '（未命名活動）', sortDate: data.date ? data.date.toDate() : null };
    });
    applyConcertsCache = pair[1].docs.map(function(d){
      var data = d.data();
      var sortDate = data.endDate ? data.endDate.toDate() : (data.startDate ? data.startDate.toDate() : null);
      return { id: d.id, kind: 'concert', title: data.title || '（未命名音樂會）', sortDate: sortDate };
    });
  }

  function applyRowHtml(item){
    var key = item.kind + ':' + item.id;
    var on = !!applySelected[key];
    var dateLabel = item.sortDate ? item.sortDate.toLocaleDateString('zh-TW') : '日期未定';
    var kindLabel = item.kind === 'event' ? '活動' : '音樂會';
    var target = applyRostersByTarget[key];
    var appliedNote = (target && target.sourceTemplateId === applyTemplateId) ? '・已套用這份名單' : '';
    return (
      '<div class="check-row">' +
        '<button type="button" class="checkbox' + (on ? ' on' : '') + '" data-target="' + key + '">' + (on ? '✓' : '') + '</button>' +
        '<button type="button" class="check-text" data-target="' + key + '">' + escapeHtml(item.title) +
          '<br><span style="color:var(--ink-soft);font-size:11px;">' + kindLabel + '・' + dateLabel + appliedNote + '</span>' +
        '</button>' +
      '</div>'
    );
  }

  function updateApplyConfirmState(){
    applyConfirmBtn.disabled = Object.keys(applySelected).filter(function(k){ return applySelected[k]; }).length === 0;
  }

  function renderApplyTargets(){
    var now = new Date();
    var all = applyEventsCache.concat(applyConcertsCache).sort(function(a, b){
      return (a.sortDate ? a.sortDate.getTime() : 0) - (b.sortDate ? b.sortDate.getTime() : 0);
    });
    var upcoming = all.filter(function(item){ return !item.sortDate || item.sortDate >= now; });
    var past = all.filter(function(item){ return item.sortDate && item.sortDate < now; });

    document.getElementById('applyUpcomingList').innerHTML = upcoming.length
      ? upcoming.map(applyRowHtml).join('')
      : '<div class="empty" style="padding:16px;">目前沒有即將到來的活動</div>';

    var toggleBtn = document.getElementById('applyTogglePastBtn');
    toggleBtn.textContent = '顯示已結束的活動（' + past.length + '）';
    toggleBtn.classList.toggle('hidden', past.length === 0);
    document.getElementById('applyPastList').innerHTML = past.map(applyRowHtml).join('');

    document.getElementById('applyTargetsLoading').classList.add('hidden');
    document.getElementById('applyTargetsBody').classList.remove('hidden');
    updateApplyConfirmState();
  }

  async function openApplySheet(templateId){
    var t = templatesById[templateId];
    if (!t) return;
    applyTemplateId = templateId;
    applySelected = {};
    document.getElementById('applySheetTitle').textContent = '套用「' + (t.name || '') + '」到…';
    document.getElementById('applyFormError').classList.remove('show');
    document.getElementById('applyPastWrap').classList.add('hidden');
    document.getElementById('applyTargetsBody').classList.add('hidden');
    var loadingEl = document.getElementById('applyTargetsLoading');
    loadingEl.textContent = '讀取中…';
    loadingEl.classList.remove('hidden');
    applyConfirmBtn.disabled = true;
    applySheetOverlay.classList.add('active');

    try {
      await ensureEventsAndConcerts();
      var eventIds = applyEventsCache.map(function(e){ return e.id; });
      var concertIds = applyConcertsCache.map(function(c){ return c.id; });
      var rosterPair = await Promise.all([
        fetchRostersByIds('eventRosters', eventIds),
        fetchRostersByIds('concertRosters', concertIds)
      ]);
      var eventRosters = rosterPair[0], concertRosters = rosterPair[1];
      applyRostersByTarget = {};
      applyEventsCache.forEach(function(e){
        var r = eventRosters[e.id];
        applyRostersByTarget['event:' + e.id] = {
          memberUids: r ? (r.members || []) : [],
          sourceTemplateId: r ? (r.sourceTemplateId || null) : null,
          existed: !!r
        };
      });
      applyConcertsCache.forEach(function(c){
        var r = concertRosters[c.id];
        applyRostersByTarget['concert:' + c.id] = {
          memberUids: r ? (r.members || []).map(function(m){ return m.uid; }) : [],
          sourceTemplateId: r ? (r.sourceTemplateId || null) : null
        };
      });
      // 預設勾選：目前已經套用這份範本的「即將到來」項目，方便「同步」這個最常見用途。
      // 已結束的項目即使套用過也不預設勾選——回頭覆蓋已經發生過的活動的名單是特例操作，
      // 不該是預設行為，需要的話在「已結束」區塊手動勾選，或用上面「全選」一次選取
      var now = new Date();
      applyEventsCache.concat(applyConcertsCache).forEach(function(item){
        var key = item.kind + ':' + item.id;
        var isPast = item.sortDate && item.sortDate < now;
        if (!isPast && applyRostersByTarget[key].sourceTemplateId === templateId) applySelected[key] = true;
      });
      renderApplyTargets();
    } catch (err){
      loadingEl.textContent = '讀取失敗，請關閉重新開一次（' + (err.code || err.message) + '）';
    }
  }

  function closeApplySheet(){
    applySheetOverlay.classList.remove('active');
  }

  document.getElementById('templateApplyBtn').addEventListener('click', function(){
    if (editingTemplateId) openApplySheet(editingTemplateId);
  });
  document.getElementById('applySheetClose').addEventListener('click', closeApplySheet);
  document.getElementById('applyCancelBtn').addEventListener('click', closeApplySheet);
  applySheetOverlay.addEventListener('click', function(e){
    if (e.target === applySheetOverlay) closeApplySheet();
  });
  document.getElementById('applyTogglePastBtn').addEventListener('click', function(){
    document.getElementById('applyPastWrap').classList.toggle('hidden');
  });
  document.getElementById('applySelectAllBtn').addEventListener('click', function(){
    applyEventsCache.concat(applyConcertsCache).forEach(function(item){
      applySelected[item.kind + ':' + item.id] = true;
    });
    renderApplyTargets();
  });
  document.getElementById('applyClearAllBtn').addEventListener('click', function(){
    applySelected = {};
    renderApplyTargets();
  });
  document.getElementById('applyTargetsBody').addEventListener('click', function(e){
    var btn = e.target.closest('[data-target]');
    if (!btn) return;
    var key = btn.getAttribute('data-target');
    if (applySelected[key]) delete applySelected[key]; else applySelected[key] = true;
    var checkboxEl = btn.closest('.check-row').querySelector('.checkbox');
    var on = !!applySelected[key];
    checkboxEl.classList.toggle('on', on);
    checkboxEl.textContent = on ? '✓' : '';
    updateApplyConfirmState();
  });

  applyConfirmBtn.addEventListener('click', async function(){
    var template = templatesById[applyTemplateId];
    if (!template) return;
    var selectedKeys = Object.keys(applySelected).filter(function(k){ return applySelected[k]; });
    if (selectedKeys.length === 0) return;
    var eventKeys = selectedKeys.filter(function(k){ return k.indexOf('event:') === 0; });
    var concertKeys = selectedKeys.filter(function(k){ return k.indexOf('concert:') === 0; });

    var itemsByKey = {};
    applyEventsCache.concat(applyConcertsCache).forEach(function(item){
      itemsByKey[item.kind + ':' + item.id] = item;
    });

    var totalAdded = 0, totalRemoved = 0;
    var eventLabels = [], concertLabels = [];
    selectedKeys.forEach(function(key){
      var current = (applyRostersByTarget[key] && applyRostersByTarget[key].memberUids) || [];
      var diff = diffTemplateMembers(current, template.members);
      totalAdded += diff.added;
      totalRemoved += diff.removed;
      var item = itemsByKey[key];
      // 只留月/日不帶年份——確認彈窗欄位窄，年份對「即將到來/剛結束」這種短期範圍的
      // 活動不太有辨識度，帶了反而更容易讓標題那行折成兩行
      var dateLabel = item.sortDate ? item.sortDate.toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' }) : '日期未定';
      var label = item.title + '（' + dateLabel + '）';
      (item.kind === 'event' ? eventLabels : concertLabels).push(label);
    });

    var msg = MESSAGES.applyRosterTemplateBatch(template.name, eventLabels, concertLabels, totalAdded, totalRemoved);
    if (!(await showConfirm(msg, { confirmText: '套用' }))) return;

    applyConfirmBtn.disabled = true;
    applyConfirmBtn.textContent = '套用中…';

    // 只有選到音樂會才需要查成員清單/樂器備援——單純套活動應到名單不需要這些資料
    var membersLookup = {};
    var fallbackInstrument = null;
    if (concertKeys.length){
      (await ensureApprovedMembers()).forEach(function(m){ membersLookup[m.uid] = m; });
      var instList = await ensureInstrumentsList();
      fallbackInstrument = instList[0] ? instList[0].name : null;
    }

    var results = await Promise.allSettled(selectedKeys.map(function(key){
      var id = key.slice(key.indexOf(':') + 1);
      if (key.indexOf('event:') === 0){
        return applyTemplateToEventRoster(db, id, template, currentAdminUid, applyRostersByTarget[key].existed);
      }
      return applyTemplateToConcertRoster(db, id, template, membersLookup, fallbackInstrument, currentAdminUid);
    }));

    var failed = results.filter(function(r){ return r.status === 'rejected'; }).length;
    applyConfirmBtn.disabled = false;
    applyConfirmBtn.textContent = '套用';
    closeApplySheet();
    // 單一項目失敗不擋其他項目繼續套用（信任幹部、不做連鎖擋下的既有原則），只在最後回報結果
    if (failed === 0){
      showToast('已套用到 ' + selectedKeys.length + ' 個項目');
    } else {
      showToast('套用完成，但有 ' + failed + ' 個項目失敗，請到個別活動/音樂會的名單調整分頁重新套用一次', 'error');
    }
  });

  requireAdminOrTeamAdmin().then(function(result){
    if (!result) return;
    currentAdminUid = result.uid;
    activeTeam = result.activeTeam;

    var avatarBtn = document.getElementById('avatarBtn');
    avatarBtn.textContent = result.profile.name ? result.profile.name.charAt(0) : '?';
    avatarBtn.classList.remove('skel');
    initAccountMenu(result.profile.name);
    initTeamSwitcher(result.profile);
    initAdminNav('roster', result.profile, activeTeam);

    onSnapshot(query(collection(db, 'rosterTemplates'), where('team', '==', activeTeam)), function(snap){
      templatesById = {};
      templatesList = [];
      snap.forEach(function(docSnap){
        var data = Object.assign({ id: docSnap.id }, docSnap.data());
        templatesById[docSnap.id] = data;
        templatesList.push(data);
      });
      templatesList.sort(function(a, b){ return (a.name || '').localeCompare(b.name || '', 'zh-Hant'); });
      templatesLoaded = true;
      renderTemplateList();
    }, renderTemplateAdminError);
  });
</script>
