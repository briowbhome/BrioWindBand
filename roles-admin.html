<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>布利歐管樂團｜權限管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F2EFE5">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<script src="./pwa-register.js" defer></script>
<style>
  :root{
    --ink:#20242F;
    --ink-soft:#4A4F5C;
    --paper:#F2EFE5;
    --paper-raised:#FBFAF4;
    --line:#DAD3BE;
    --brass:#B8863A;
    --brass-deep:#8F6A2C;
    --burgundy:#7A2331;
    --burgundy-deep:#5C1A26;
    --sage:#5F6E58;
    --sage-bg:#E7EBDF;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-card: 0 1px 2px rgba(32,36,47,.06), 0 8px 24px -12px rgba(32,36,47,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #EFE9D6 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding: 0 0 calc(48px + env(safe-area-inset-bottom));
  }

  button, a, input, select{ -webkit-tap-highlight-color: transparent; font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--brass-deep); outline-offset:2px; border-radius:6px; }

  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
  }

  .hidden{ display:none !important; }
  .auth-loading{
    min-height:100vh; width:100%; max-width:460px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; color:var(--ink-soft); font-size:13px;
  }
  .auth-loading .spinner{
    width:22px; height:22px; border-radius:50%;
    border:2.5px solid var(--line); border-top-color:var(--brass);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .appbar{ display:flex; align-items:center; gap:12px; padding:18px 20px 14px; }
  .mark{ width:38px; height:38px; flex:none; object-fit:cover; border-radius:50%; }
  .brandtext{ display:flex; flex-direction:column; line-height:1.1; }
  .brandtext .name{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:19px; letter-spacing:.02em; }
  .brandtext .sub{ font-family:'Roboto Mono',monospace; font-size:10.5px; letter-spacing:.14em; color:var(--ink-soft); margin-top:3px; text-transform:uppercase; }
  .appbar .spacer{ flex:1; }
  .hamburger-btn{
    width:36px; height:36px; flex:none;
    background:none; border:1px solid var(--line); border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .hamburger-btn:active{ background:var(--paper-raised); }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px;
    border:2px solid var(--paper-raised); box-shadow:0 0 0 1.5px var(--line);
    padding:0; cursor:pointer;
  }

  .staff{
    height:16px; margin:0 20px 6px;
    background-image: repeating-linear-gradient(var(--line), var(--line) 1px, transparent 1px, transparent 4px);
    opacity:.9;
  }

  /* ---------- Admin drawer ---------- */
  .drawer-overlay{
    position:fixed; inset:0; z-index:70;
    background:rgba(32,36,47,.5);
    display:none;
  }
  .drawer-overlay.active{ display:block; }
  .drawer-panel{
    position:absolute; top:0; left:0; bottom:0;
    width:78%; max-width:300px;
    background:var(--paper-raised);
    box-shadow:8px 0 30px rgba(0,0,0,.25);
    padding:env(safe-area-inset-top) 0 calc(20px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
    transform:translateX(-100%);
    transition:transform .22s ease;
  }
  .drawer-overlay.active .drawer-panel{ transform:translateX(0); }
  .drawer-header{ padding:20px 20px 14px; border-bottom:1px solid var(--line); }
  .drawer-header .name{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:16px; }
  .drawer-home{
    display:flex; align-items:center; gap:9px;
    padding:14px 20px; font-size:13.5px; font-weight:700; color:var(--ink-soft);
    text-decoration:none; border-bottom:1px solid var(--line);
  }
  .drawer-section-label{
    padding:16px 20px 6px; font-family:'Roboto Mono',monospace; font-size:10px;
    letter-spacing:.1em; color:var(--ink-soft); text-transform:uppercase;
  }
  .drawer-link{
    display:flex; align-items:center;
    padding:12px 20px; font-size:13.5px; font-weight:600; color:var(--ink);
    text-decoration:none;
  }
  .drawer-link.active{ background:var(--sage-bg); color:var(--sage); font-weight:700; }

  .section-label{ display:flex; align-items:baseline; gap:8px; margin:20px 20px 4px; }
  .section-label .tw{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:15.5px; }
  .section-label .en{ font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }
  .lede{ margin:6px 20px 10px; font-size:12.5px; line-height:1.6; color:var(--ink-soft); }

  /* ---------- Member list ---------- */
  .list{
    margin:0 20px 24px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .member-item{ }
  .member-item + .member-item{ border-top:1px solid var(--line); }
  .member-row{
    display:flex; align-items:center; gap:10px; padding:12px 16px;
    cursor:pointer;
  }
  .member-row.locked{ cursor:default; opacity:.6; }
  .m-avatar{
    width:34px; height:34px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:13px; flex:none;
  }
  .m-name{ font-size:13.5px; font-weight:600; color:var(--ink); }
  .m-account{ font-size:10.5px; color:var(--ink-soft); font-family:'Roboto Mono',monospace; }
  .role-badge{
    margin-left:auto; font-family:'Roboto Mono',monospace; font-size:9.5px; font-weight:700;
    padding:3px 9px; border-radius:999px; flex:none;
  }
  .role-badge.owner{ background:var(--ink); color:var(--paper); }
  .role-badge.admin{ background:var(--burgundy); color:#F2EFE5; }
  .role-badge.conductor{ background:#EFE7D2; color:var(--brass-deep); }
  .role-badge.member{ background:var(--sage-bg); color:var(--sage); }
  .lock-ico{ font-size:12px; color:var(--ink-soft); margin-left:6px; flex:none; }

  /* ---------- Edit panel ---------- */
  .edit-panel{ padding:0 16px 16px; }
  .field{ margin-top:12px; display:flex; flex-direction:column; gap:6px; }
  .field:first-child{ margin-top:0; }
  .field label{
    font-family:'Roboto Mono',monospace; font-size:10.5px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);
  }
  .field input, .field select{
    border:1px solid var(--line); background:var(--paper);
    border-radius:var(--radius-sm); padding:11px 13px;
    font-size:14px; color:var(--ink); width:100%;
  }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; margin-top:12px; }

  .role-picker{ display:flex; gap:8px; }
  .role-chip{
    flex:1; text-align:center; padding:9px 4px;
    border-radius:var(--radius-sm); border:1px solid var(--line);
    font-size:12px; font-weight:700; color:var(--ink-soft); background:var(--paper);
    cursor:pointer;
  }
  .role-chip.selected{ background:var(--burgundy); color:#F2EFE5; border-color:var(--burgundy); }

  .check-list{ display:flex; flex-direction:column; gap:2px; }
  .check-row{ display:flex; align-items:center; gap:10px; padding:8px 2px; }
  .check-row + .check-row{ border-top:1px solid var(--line); }
  .checkbox{
    width:18px; height:18px; border-radius:5px; border:1.5px solid var(--line);
    flex:none; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:#fff; cursor:pointer;
  }
  .checkbox.on{ background:var(--brass); border-color:var(--brass); }
  .check-text{ flex:1; font-size:12.5px; color:var(--ink); cursor:pointer; }

  .form-buttons{ display:flex; gap:10px; margin-top:16px; }
  .cta-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--brass); color:var(--ink); border:none;
    border-radius:var(--radius-md); padding:14px 16px;
    font-weight:700; font-size:14.5px; cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .cta-btn:hover{ background:#C7963F; }
  .cta-btn:active{ transform:scale(.98); background:var(--brass-deep); }
  .cta-btn:disabled{ opacity:.55; cursor:default; transform:none; }

  .card{
    margin:14px 20px 20px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:16px;
  }
  .form-error{
    margin-top:12px; font-size:12.5px; color:var(--burgundy);
    background:#FBF3F3; border:1px solid #EFD4D8; border-radius:var(--radius-sm);
    padding:10px 12px; display:none;
  }
  .form-error.show{ display:block; }

  /* ---------- Instrument list ---------- */
  .inst-group-label{
    padding:10px 16px 4px; font-family:'Roboto Mono',monospace; font-size:10px;
    letter-spacing:.08em; color:var(--ink-soft); text-transform:uppercase;
    background:var(--paper);
  }
  .inst-row{ display:flex; align-items:center; gap:10px; padding:9px 16px; }
  .inst-row + .inst-row{ border-top:1px solid var(--line); }
  .inst-name{ flex:1; font-size:13px; color:var(--ink); font-weight:500; }
  .inst-remove{
    flex:none; width:22px; height:22px; border-radius:50%; border:none; background:none;
    color:var(--ink-soft); cursor:pointer; font-size:15px; line-height:1;
  }
  .inst-remove:active{ color:var(--burgundy-deep); }

  .empty{ padding:36px 20px; text-align:center; font-size:13px; color:var(--ink-soft); }
</style>
</head>
<body>
<div id="authLoading" class="auth-loading">
  <div class="spinner"></div>
  <p>驗證登入狀態中…</p>
</div>
<div class="app hidden" id="appRoot">

  <div class="appbar">
    <button class="hamburger-btn" id="adminMenuBtn" type="button" aria-label="選單">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="#20242F" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <img class="mark" src="assets/BrioLogo.jpg" alt="布利歐管樂團 Logo">
    <div class="brandtext">
      <div class="name">布利歐管樂團</div>
      <div class="sub">Brio Wind Band</div>
    </div>
    <div class="spacer"></div>
    <button class="avatar" id="avatarBtn" type="button" aria-label="帳號選單"></button>
  </div>

  <div class="staff"></div>

  <div class="section-label">
    <span class="tw">團員權限</span>
    <span class="en">Roles</span>
  </div>
  <p class="lede">點擊團員調整角色與權限。Owner 無法透過這裡調整。</p>

  <div class="list" id="memberList"></div>

  <div class="section-label">
    <span class="tw">樂器/聲部清單</span>
    <span class="en">Instruments</span>
  </div>
  <p class="lede">這裡管理的清單會同步用在註冊頁的樂器選項，以及上面「分部長」的指派選項。</p>

  <form class="card" id="instForm">
    <div class="field-row">
      <div class="field">
        <label>樂器名稱</label>
        <input type="text" id="instName" placeholder="例如：低音長笛">
      </div>
      <div class="field">
        <label>類別</label>
        <select id="instFamily">
          <option value="woodwind">木管</option>
          <option value="brass">銅管</option>
          <option value="percussion">打擊</option>
        </select>
      </div>
    </div>
    <p class="form-error" id="instFormError"></p>
    <div class="form-buttons">
      <button type="submit" class="cta-btn">新增樂器</button>
    </div>
  </form>

  <div class="list" id="instList"></div>

</div>

<div class="drawer-overlay" id="drawerOverlay">
  <nav class="drawer-panel" id="drawerPanel"></nav>
</div>

<script type="module">
  import { requireAdmin } from './auth-guard.js';
  import { db } from './firebase-init.js';
  import { initAdminNav } from './admin-nav.js';
  import { initAccountMenu } from './account-menu.js';
  import { subscribeInstruments, addInstrument, removeInstrument, FAMILY_LABELS, FAMILY_ORDER } from './instruments.js';
  import {
    collection, query, where, onSnapshot, doc, updateDoc
  } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  initAdminNav('roles-admin.html');

  var ROLE_LABELS = { member: '團員', conductor: '指揮', admin: '幹部', owner: 'Owner' };
  var ROLE_WEIGHT = { owner: 0, admin: 1, conductor: 2, member: 3 };
  var PERMISSION_DEFS = [
    { key: 'canManageRoles', label: '可調整他人角色/權限' },
    { key: 'canDeleteAccounts', label: '可軟刪除現役帳號' },
    { key: 'canManageSheetMusic', label: '可管理樂譜資料夾' },
    { key: 'canManageEventTypes', label: '可管理活動類型' }
  ];

  var membersById = {};
  var instrumentsList = [];
  var openMemberId = null;
  var draftRole = null;
  var draftPermissions = {};
  var draftSections = [];

  var memberList = document.getElementById('memberList');
  var instForm = document.getElementById('instForm');
  var instFormError = document.getElementById('instFormError');
  var instList = document.getElementById('instList');

  function showInstError(message){
    instFormError.textContent = message;
    instFormError.classList.toggle('show', !!message);
  }

  function renderMembers(){
    var ids = Object.keys(membersById);
    if (ids.length === 0){
      memberList.innerHTML = '<div class="empty">目前沒有已核准的團員</div>';
      return;
    }

    ids.sort(function(a, b){
      var ra = membersById[a], rb = membersById[b];
      var wa = ROLE_WEIGHT[ra.role] != null ? ROLE_WEIGHT[ra.role] : 9;
      var wb = ROLE_WEIGHT[rb.role] != null ? ROLE_WEIGHT[rb.role] : 9;
      if (wa !== wb) return wa - wb;
      return (ra.name || '').localeCompare(rb.name || '');
    });

    memberList.innerHTML = ids.map(function(uid){
      var m = membersById[uid];
      var locked = m.role === 'owner';
      var rowHtml =
        '<div class="member-row' + (locked ? ' locked' : '') + '"' + (locked ? '' : ' data-toggle="' + uid + '"') + '>' +
          '<div class="m-avatar">' + (m.name ? m.name.charAt(0) : '?') + '</div>' +
          '<div><div class="m-name">' + (m.name || '—') + '</div><div class="m-account">' + (m.account || '') + '</div></div>' +
          '<span class="role-badge ' + m.role + '">' + (ROLE_LABELS[m.role] || m.role) + '</span>' +
          (locked ? '<span class="lock-ico">🔒</span>' : '') +
        '</div>';

      var panelHtml = (!locked && openMemberId === uid) ? renderEditPanel(uid) : '';

      return '<div class="member-item" data-member-item="' + uid + '">' + rowHtml + panelHtml + '</div>';
    }).join('');
  }

  function renderEditPanel(uid){
    var m = membersById[uid];
    var roles = ['member', 'conductor', 'admin'];

    var roleChips = roles.map(function(r){
      return '<div class="role-chip' + (draftRole === r ? ' selected' : '') + '" data-role-chip="' + r + '">' + ROLE_LABELS[r] + '</div>';
    }).join('');

    var permRows = PERMISSION_DEFS.map(function(p){
      var on = !!draftPermissions[p.key];
      return (
        '<div class="check-row">' +
          '<div class="checkbox' + (on ? ' on' : '') + '" data-perm-toggle="' + p.key + '">' + (on ? '✓' : '') + '</div>' +
          '<div class="check-text" data-perm-toggle="' + p.key + '">' + p.label + '</div>' +
        '</div>'
      );
    }).join('');

    var sectionRows = instrumentsList.length === 0
      ? '<div class="empty">目前沒有樂器清單，先在下面新增</div>'
      : instrumentsList.map(function(inst){
          var on = draftSections.indexOf(inst.name) !== -1;
          return (
            '<div class="check-row">' +
              '<div class="checkbox' + (on ? ' on' : '') + '" data-section-toggle="' + inst.name + '">' + (on ? '✓' : '') + '</div>' +
              '<div class="check-text" data-section-toggle="' + inst.name + '">' + inst.name + '</div>' +
            '</div>'
          );
        }).join('');

    return (
      '<div class="edit-panel">' +
        '<div class="field">' +
          '<label>角色</label>' +
          '<div class="role-picker">' + roleChips + '</div>' +
        '</div>' +
        '<div class="field">' +
          '<label>額外權限</label>' +
          '<div class="check-list">' + permRows + '</div>' +
        '</div>' +
        '<div class="field">' +
          '<label>分部長（選填）</label>' +
          '<div class="check-list">' + sectionRows + '</div>' +
        '</div>' +
        '<p class="form-error" id="memberFormError"></p>' +
        '<div class="form-buttons">' +
          '<button type="button" class="cta-btn" id="saveMemberBtn" data-save-member="' + uid + '">儲存變更</button>' +
        '</div>' +
      '</div>'
    );
  }

  memberList.addEventListener('click', function(e){
    var toggle = e.target.closest('[data-toggle]');
    var roleChip = e.target.closest('[data-role-chip]');
    var permToggle = e.target.closest('[data-perm-toggle]');
    var sectionToggle = e.target.closest('[data-section-toggle]');
    var saveBtn = e.target.closest('[data-save-member]');

    if (toggle){
      var uid = toggle.getAttribute('data-toggle');
      if (openMemberId === uid){
        openMemberId = null;
      } else {
        var m = membersById[uid];
        openMemberId = uid;
        draftRole = m.role;
        draftPermissions = Object.assign({}, m.permissions || {});
        draftSections = (m.sectionLeaderFor || []).slice();
      }
      renderMembers();
      return;
    }
    if (roleChip){
      draftRole = roleChip.getAttribute('data-role-chip');
      renderMembers();
      return;
    }
    if (permToggle){
      var key = permToggle.getAttribute('data-perm-toggle');
      draftPermissions[key] = !draftPermissions[key];
      renderMembers();
      return;
    }
    if (sectionToggle){
      var name = sectionToggle.getAttribute('data-section-toggle');
      var idx = draftSections.indexOf(name);
      if (idx === -1) draftSections.push(name); else draftSections.splice(idx, 1);
      renderMembers();
      return;
    }
    if (saveBtn){
      var saveUid = saveBtn.getAttribute('data-save-member');
      saveBtn.disabled = true;
      saveBtn.textContent = '儲存中…';
      updateDoc(doc(db, 'users', saveUid), {
        role: draftRole,
        permissions: Object.assign(
          { canManageRoles: false, canDeleteAccounts: false, canManageSheetMusic: false, canManageEventTypes: false },
          draftPermissions
        ),
        sectionLeaderFor: draftSections
      }).then(function(){
        openMemberId = null;
      }).catch(function(err){
        var errEl = document.getElementById('memberFormError');
        if (errEl){
          errEl.textContent = '儲存失敗（' + err.code + '）';
          errEl.classList.add('show');
        }
        saveBtn.disabled = false;
        saveBtn.textContent = '儲存變更';
      });
    }
  });

  function renderInstruments(){
    if (instrumentsList.length === 0){
      instList.innerHTML = '<div class="empty">目前沒有任何樂器</div>';
      return;
    }
    var byFamily = {};
    instrumentsList.forEach(function(inst, idx){
      if (!byFamily[inst.family]) byFamily[inst.family] = [];
      byFamily[inst.family].push(idx);
    });
    var families = FAMILY_ORDER.filter(function(f){ return byFamily[f]; })
      .concat(Object.keys(byFamily).filter(function(f){ return FAMILY_ORDER.indexOf(f) === -1; }));

    instList.innerHTML = families.map(function(family){
      return (
        '<div class="inst-group-label">' + (FAMILY_LABELS[family] || family) + '</div>' +
        byFamily[family].map(function(idx){
          var inst = instrumentsList[idx];
          return (
            '<div class="inst-row">' +
              '<span class="inst-name">' + inst.name + '</span>' +
              '<button type="button" class="inst-remove" data-inst-remove="' + idx + '" aria-label="刪除">×</button>' +
            '</div>'
          );
        }).join('')
      );
    }).join('');
  }

  instForm.addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('instName').value.trim();
    var family = document.getElementById('instFamily').value;
    if (!name){
      showInstError('請輸入樂器名稱');
      return;
    }
    if (instrumentsList.some(function(i){ return i.name === name; })){
      showInstError('已經有「' + name + '」了');
      return;
    }
    showInstError('');
    addInstrument(db, name, family).then(function(){
      instForm.reset();
    }).catch(function(err){
      showInstError('新增失敗（' + err.code + '）');
    });
  });

  instList.addEventListener('click', function(e){
    var btn = e.target.closest('[data-inst-remove]');
    if (!btn) return;
    var idx = Number(btn.getAttribute('data-inst-remove'));
    var target = instrumentsList[idx];
    if (!target) return;
    var ok = confirm('確定要刪除「' + target.name + '」嗎？已經選這個樂器的團員資料不會被清掉，只是清單裡不會再出現這個選項。');
    if (!ok) return;
    removeInstrument(db, target).catch(function(err){
      alert('刪除失敗：' + err.code);
    });
  });

  requireAdmin().then(function(result){
    if (!result) return;

    var isOwner = result.profile.role === 'owner';
    var canManage = isOwner || (result.profile.permissions && result.profile.permissions.canManageRoles === true);
    if (!canManage){
      location.href = 'admin-index.html';
      return;
    }

    document.getElementById('avatarBtn').textContent = result.profile.name ? result.profile.name.charAt(0) : '?';
    document.getElementById('authLoading').classList.add('hidden');
    document.getElementById('appRoot').classList.remove('hidden');
    initAccountMenu(result.profile.name);

    onSnapshot(query(collection(db, 'users'), where('status', '==', 'approved')), function(snap){
      membersById = {};
      snap.forEach(function(docSnap){
        var data = docSnap.data();
        membersById[docSnap.id] = {
          name: data.name,
          account: data.account,
          role: data.role,
          permissions: data.permissions || {},
          sectionLeaderFor: data.sectionLeaderFor || []
        };
      });
      renderMembers();
    });

    subscribeInstruments(db, function(list){
      instrumentsList = list;
      renderInstruments();
      renderMembers();
    }, true);
  });
</script>
</body>
</html>
