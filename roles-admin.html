<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>布利歐管樂團｜權限管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F2EFE5">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<script src="./pwa-register.js" defer></script>
<script src="./pull-refresh.js" defer></script>
<link rel="stylesheet" href="./theme.css">
<style>

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #EFE9D6 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding: 0 0 calc(48px + env(safe-area-inset-bottom));
  }

  button, a, input, select{ -webkit-tap-highlight-color: transparent; font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--brass-deep); outline-offset:2px; border-radius:6px; }

  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
  }

  .hidden{ display:none !important; }

  /* ---------- Skeleton placeholders ---------- */
  @keyframes skel-pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  .skel{ background:var(--line); animation:skel-pulse 1.4s ease-in-out infinite; }
  .avatar.skel{ animation:skel-pulse 1.4s ease-in-out infinite; }
  .skel-bar{ display:inline-block; border-radius:5px; }
  @media (prefers-reduced-motion: reduce){
    .skel, .avatar.skel{ animation:none; opacity:.75; }
  }
  .m-skel-lines{ flex:1; display:flex; flex-direction:column; gap:7px; padding-top:2px; }

  .appbar{ display:flex; align-items:center; gap:12px; padding:18px 20px 14px; }
  /* 這頁沒有用 .hidden 讓漢堡按鈕先隱藏（requireAdmin() 通過的人一定看得到這顆按鈕，
     不像 finance-admin.html 那種雙模式頁面需要依角色決定要不要顯示），原本靠
     admin-nav.js 的 initAdminNav() 才會注入這顆按鈕的樣式（border:none 等），但那要
     等身分驗證的非同步請求回來才會執行——驗證回來前這顆按鈕會先用瀏覽器原生按鈕外觀
     （有邊框的方框）顯示，剛進頁面時會看到一下不對的樣式再跳成正確的圓形圖示。
     直接在這裡定義同一份樣式，讓按鈕從第一次畫面繪製就是正確樣式，不用等 JS 跑完 */
  .admin-nav-btn{ width:30px; height:30px; flex:none; border:none; background:none; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer; padding:0; }
  .admin-nav-btn:active{ background:rgba(32,36,47,.06); }
  .mark{ width:38px; height:38px; flex:none; object-fit:cover; border-radius:50%; }
  /* 團徽只在「真的擁擠」時才隱藏：實測過 conductorBtn 單獨顯示時其實空間還很寬裕（因為它是固定 34px），
     真正會擠的只有雙團籍徽章 team-badge 出現的時候（它是寬度不固定的元素），所以只看這一個條件就夠：
     大部分單團籍帳號（包括單團籍的指揮/管理員）在手機上其實還有空間放團徽，不需要被這條規則改到。
     :has() 不支援的舊瀏覽器會整條規則失效（這比現在還安全，因為回到團徽常駐顯示） */
  @media (max-width: 899px){
    .appbar:has(.team-badge:not(.hidden)) .mark{ display:none; }
  }
  .brandtext{ display:flex; flex-direction:column; line-height:1.1; }
  .brandtext .name{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:19px; letter-spacing:.02em; }
  .brandtext .sub{ font-family:'Roboto Mono',monospace; font-size:10.5px; letter-spacing:.14em; color:var(--ink-soft); margin-top:3px; text-transform:uppercase; }
  .appbar .spacer{ flex:1; }
  .back-btn{
    width:30px; height:30px; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); text-decoration:none;
  }
  .brand-link{ display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px;
    border:2px solid var(--paper-raised); box-shadow:0 0 0 1.5px var(--line);
    padding:0; cursor:pointer;
  }

  .staff{
    height:16px; margin:0 20px 6px;
    background-image: repeating-linear-gradient(var(--line), var(--line) 1px, transparent 1px, transparent 4px);
    opacity:.9;
  }


  .section-label{ display:flex; align-items:baseline; gap:8px; margin:20px 20px 4px; }
  .section-label .tw{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:15.5px; }
  .section-label .en{ font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }
  .lede{ margin:6px 20px 10px; font-size:12.5px; line-height:1.6; color:var(--ink-soft); }

  /* ---------- Member list ---------- */
  .list{
    margin:0 20px 24px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .member-item{ }
  .member-item + .member-item{ border-top:1px solid var(--line); }
  .member-row{
    display:flex; align-items:center; gap:10px; padding:12px 16px;
    cursor:pointer;
  }
  .member-row.locked{ cursor:default; opacity:.6; }
  .m-avatar{
    width:34px; height:34px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:13px; flex:none;
  }
  .m-name{ font-size:13.5px; font-weight:600; color:var(--ink); }
  .m-account{ font-size:10.5px; color:var(--ink-soft); font-family:'Roboto Mono',monospace; }
  .role-badge{
    margin-left:auto; font-family:'Roboto Mono',monospace; font-size:9.5px; font-weight:700;
    padding:3px 9px; border-radius:999px; flex:none;
  }
  .role-badge.owner{ background:var(--ink); color:var(--paper); }
  .role-badge.admin{ background:var(--burgundy); color:#F2EFE5; }
  .role-badge.conductor{ background:#EFE7D2; color:var(--brass-deep); }
  .role-badge.member{ background:var(--sage-bg); color:var(--sage); }
  .lock-ico{ font-size:12px; color:var(--ink-soft); margin-left:6px; flex:none; }

  /* ---------- Member edit sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0; z-index:80;
    background:rgba(32,36,47,.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .sheet-overlay.active{ display:flex; }
  .sheet{
    width:100%; max-width:460px;
    max-height:85vh;
    background:var(--paper-raised);
    border-radius:20px 20px 0 0;
    display:flex; flex-direction:column;
    box-shadow:0 -10px 30px rgba(32,36,47,.3);
  }
  .sheet-handle{
    width:36px; height:4px;
    background:var(--line);
    border-radius:999px;
    margin:10px auto 2px;
  }
  .sheet-header{ position:relative; padding:6px 44px 12px 20px; border-bottom:1px solid var(--line); }
  .sheet-header .name{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:16px; }
  .sheet-header .account{ font-family:'Roboto Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .sheet-close{
    position:absolute; top:4px; right:10px;
    width:30px; height:30px; border-radius:50%; border:none; background:none;
    color:var(--ink-soft); font-size:19px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .sheet-close:active{ background:var(--paper); }
  .sheet-body{ overflow-y:auto; padding:14px 20px 8px; }
  .sheet-footer{
    display:flex; gap:10px;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .cta-btn-secondary{ background:var(--paper); color:var(--ink-soft); border:1px solid var(--line); }
  .cta-btn-secondary:hover{ background:var(--paper-raised); }
  .cta-btn-secondary:active{ transform:scale(.98); background:var(--paper); }

  .field{ margin-top:12px; display:flex; flex-direction:column; gap:6px; }
  .field:first-child{ margin-top:0; }
  .field label{
    font-family:'Roboto Mono',monospace; font-size:10.5px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);
  }
  .field input, .field select{
    border:1px solid var(--line); background:var(--paper);
    border-radius:var(--radius-sm); padding:11px 13px;
    font-size:14px; color:var(--ink); width:100%;
  }
  .field-row{ display:flex; gap:10px; }
  .part-add-row{ display:flex; gap:8px; }
  .part-add-row select{
    flex:1; border:1px solid var(--line); background:var(--paper);
    border-radius:var(--radius-sm); padding:9px 10px; font-size:13px; color:var(--ink);
  }
  .part-add-btn{
    flex:none; border:1px solid var(--line); background:var(--paper); color:var(--brass-deep);
    border-radius:var(--radius-sm); padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .part-add-btn:active{ background:var(--sage-bg); }
  .field-row .field{ flex:1; min-width:0; margin-top:12px; }
  .field-checkbox{ margin-top:12px; display:flex; align-items:center; gap:8px; }
  .field-checkbox input{ width:16px; height:16px; accent-color:var(--brass-deep); }
  .field-checkbox label{ font-size:13px; font-weight:500; color:var(--ink); }

  .role-picker{ display:flex; gap:8px; }
  .role-chip{
    flex:1; text-align:center; padding:9px 4px;
    border-radius:var(--radius-sm); border:1px solid var(--line);
    font-size:12px; font-weight:700; color:var(--ink-soft); background:var(--paper);
    cursor:pointer;
  }
  .role-chip.selected{ background:var(--burgundy); color:#F2EFE5; border-color:var(--burgundy); }

  .team-tabs{ display:flex; gap:8px; }
  .team-tab{
    flex:1; padding:8px; border-radius:9px; border:1.4px solid var(--line);
    background:var(--paper); color:var(--ink-soft); font-weight:700; font-size:12.5px; cursor:pointer;
  }
  .team-tab.active{ background:var(--burgundy); color:#F2EFE5; border-color:var(--burgundy); }

  .check-list{ display:flex; flex-direction:column; gap:2px; }
  .check-list.collapsed{ display:none; }
  .check-row{ display:flex; align-items:center; gap:10px; padding:8px 2px; }
  .check-row + .check-row{ border-top:1px solid var(--line); }

  /* 9/19：樂器/聲部改成預設收合＋摘要列，跟 event-admin.html 的活動類型收合是同一套既有樣式 */
  .inst-summary-toggle{ display:flex; align-items:center; gap:8px; cursor:pointer; }
  .inst-summary-toggle label{ margin:0; cursor:pointer; }
  .collapse-toggle{
    margin-left:auto; background:none; border:none; padding:4px; cursor:pointer;
    color:var(--ink-soft); display:flex; align-items:center;
  }
  .collapse-toggle .chev{ transition:transform .18s ease; }
  .collapse-toggle.open .chev{ transform:rotate(180deg); }
  .inst-summary-text{ margin:0; font-size:12.5px; color:var(--ink-soft); }
  .checkbox{
    width:18px; height:18px; border-radius:5px; border:1.5px solid var(--line);
    flex:none; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:#fff; cursor:pointer;
  }
  .checkbox.on{ background:var(--brass); border-color:var(--brass); }
  .check-text{ flex:1; font-size:12.5px; color:var(--ink); cursor:pointer; }

  .form-buttons{ display:flex; gap:10px; margin-top:16px; }
  .cta-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--brass); color:var(--ink); border:none;
    border-radius:var(--radius-md); padding:14px 16px;
    font-weight:700; font-size:14.5px; cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .cta-btn:hover{ background:#C7963F; }
  .cta-btn:active{ transform:scale(.98); background:var(--brass-deep); }
  .cta-btn:disabled{ opacity:.55; cursor:default; transform:none; }

  .card{
    margin:14px 20px 20px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:16px;
  }
  .form-error{
    margin-top:12px; font-size:12.5px; color:var(--burgundy);
    background:#FBF3F3; border:1px solid #EFD4D8; border-radius:var(--radius-sm);
    padding:10px 12px; display:none;
  }
  .form-error.show{ display:block; }

  /* ---------- 重設密碼（成員編輯 sheet 內的獨立小區塊，跟角色/權限的儲存流程分開） ---------- */
  .reset-pw-wrap input{
    border:1px solid var(--line); background:var(--paper);
    border-radius:var(--radius-sm); padding:11px 13px;
    font-size:14px; color:var(--ink); width:100%;
  }
  .reset-pw-trigger{
    border:1px solid var(--line); background:var(--paper); color:var(--burgundy);
    border-radius:var(--radius-sm); padding:9px 14px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .reset-pw-trigger:active{ background:var(--paper-raised); }
  .reset-pw-actions{ display:flex; gap:8px; margin-top:8px; }
  .reset-pw-actions button{
    flex:1; border:none; border-radius:var(--radius-sm); padding:10px 14px;
    font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .reset-pw-confirm{ background:var(--brass); color:var(--ink); }
  .reset-pw-confirm:disabled{ opacity:.5; cursor:default; }
  .reset-pw-cancel{ background:none; color:var(--ink-soft); border:1px solid var(--line) !important; }

  /* ---------- Instrument list ---------- */
  .inst-group-label{
    padding:10px 16px 4px; font-family:'Roboto Mono',monospace; font-size:10px;
    letter-spacing:.08em; color:var(--ink-soft); text-transform:uppercase;
    background:var(--paper);
  }
  .inst-row{ display:flex; align-items:center; gap:10px; padding:9px 16px; }
  .inst-row + .inst-row{ border-top:1px solid var(--line); }
  .inst-name{ flex:1; font-size:13px; color:var(--ink); font-weight:500; }
  .inst-move{ display:flex; flex-direction:column; gap:1px; flex:none; }
  .inst-move-btn{
    width:20px; height:16px; border:none; background:none;
    color:var(--ink-soft); cursor:pointer; font-size:9px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .inst-move-btn:disabled{ opacity:.25; cursor:default; }
  .inst-move-btn:active:not(:disabled){ color:var(--brass-deep); }
  .inst-remove{
    flex:none; width:22px; height:22px; border-radius:50%; border:none; background:none;
    color:var(--ink-soft); cursor:pointer; font-size:15px; line-height:1;
  }
  .inst-remove:active{ color:var(--burgundy-deep); }
  .seat-row-input{
    flex:none; width:38px; text-align:center; font-size:12px; padding:4px 2px;
    border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink);
  }

  .empty{ padding:36px 20px; text-align:center; font-size:13px; color:var(--ink-soft); }
</style>
</head>
<body>
<div class="app" id="appRoot">

  <div class="appbar">
    <button class="admin-nav-btn" id="adminNavBtn" type="button" aria-label="開啟後台導覽選單">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="back-btn" href="admin-index.html" aria-label="回控制台首頁">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="brand-link" href="index.html">
      <img class="mark" src="assets/BrioLogo.jpg" alt="布利歐管樂團 Logo">
      <div class="brandtext">
        <div class="name">布利歐管樂團</div>
        <div class="sub">Brio Wind Band</div>
      </div>
    </a>
    <div class="spacer"></div>
    <span class="team-badge hidden" id="teamBadge"></span>
    <button class="avatar skel" id="avatarBtn" type="button" aria-label="帳號選單"></button>
  </div>

  <div class="staff"></div>

  <div class="section-label">
    <span class="tw">成員權限</span>
    <span class="en">Roles</span>
  </div>
  <p class="lede">點擊成員調整角色與權限。</p>

  <div class="list" id="memberList"></div>

  <div class="section-label">
    <span class="tw">樂器/聲部清單</span>
    <span class="en">Instruments</span>
  </div>
  <p class="lede">此清單會同步用在註冊頁的樂器選項，以及「分部長」的指派選項。</p>

  <form class="card" id="instForm">
    <div class="field-row">
      <div class="field">
        <label>樂器名稱</label>
        <input type="text" id="instName" placeholder="例如：低音長笛">
      </div>
      <div class="field">
        <label>類別</label>
        <select id="instFamily">
          <option value="woodwind">木管</option>
          <option value="brass">銅管</option>
          <option value="percussion">打擊</option>
          <option value="strings">弦樂</option>
        </select>
      </div>
    </div>
    <p class="form-error" id="instFormError"></p>
    <div class="form-buttons">
      <button type="submit" class="cta-btn">新增樂器</button>
    </div>
  </form>

  <div class="list" id="instList"></div>

  <div id="seatSectionWrap" class="hidden">
    <div class="section-label">
      <span class="tw">座位圖分區設定</span>
      <span class="en">Seating Chart</span>
    </div>
    <p class="lede">指揮頁面座位圖用，決定哪個分區對應哪個樂器、在第幾排、同排內的左右順序跟寬度。「排」是離指揮的遠近，1 是最靠近指揮那排，數字越大越後排；「寬度權重」預設 1（同排平均分配），數字越大這塊佔的角度越寬；同一個樂器可以新增多個分區（例如分兩排坐）。</p>

    <form class="card" id="seatForm">
      <div class="field-row">
        <div class="field">
          <label>對應樂器</label>
          <select id="seatInstrument"></select>
        </div>
        <div class="field">
          <label>第幾排</label>
          <input type="number" id="seatRow" min="1" value="1">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>分區文字（選填）</label>
          <input type="text" id="seatLabel" placeholder="例如：單簧管（第一排）">
        </div>
        <div class="field">
          <label>寬度權重</label>
          <input type="number" id="seatWeight" min="1" value="1">
        </div>
      </div>
      <div class="field-checkbox">
        <input type="checkbox" id="seatPercussion">
        <label for="seatPercussion">打擊樂矩形區塊（固定在最後方，不用選排數/權重）</label>
      </div>
      <p class="form-error" id="seatFormError"></p>
      <div class="form-buttons">
        <button type="submit" class="cta-btn">新增分區</button>
      </div>
    </form>

    <div class="list" id="seatList"></div>
  </div>

</div>

<!-- 成員編輯 Bottom Sheet -->
<div class="sheet-overlay" id="memberSheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <button type="button" class="sheet-close" id="memberSheetClose" aria-label="關閉">×</button>
      <div class="name" id="sheetMemberName">—</div>
      <div class="account" id="sheetMemberAccount">—</div>
    </div>
    <div class="sheet-body" id="memberSheetBody"></div>
    <!-- 重設密碼獨立於 memberSheetBody 之外，避免角色/權限的每次勾選重繪把已經打開的
         表單／已輸入的密碼一起清掉——只有 Owner／canManageRoles 才進得了這頁，這裡不用
         再重複判斷權限，伺服器端（Cloud Function）還是會再驗證一次 -->
    <div class="reset-pw-wrap hidden" id="resetPasswordWrap" style="padding:0 20px 14px;">
      <label style="display:block;font-family:'Roboto Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;">帳號安全</label>
      <button type="button" class="reset-pw-trigger" id="resetPasswordBtn">重設密碼</button>
      <div id="resetPasswordForm" class="hidden" style="margin-top:10px;">
        <input type="password" id="resetPasswordInput" placeholder="輸入新密碼（至少 6 碼）">
        <div class="reset-pw-actions">
          <button type="button" class="reset-pw-cancel" id="resetPasswordCancelBtn">取消</button>
          <button type="button" class="reset-pw-confirm" id="resetPasswordConfirmBtn">確認重設</button>
        </div>
        <p class="form-error" id="resetPasswordError"></p>
      </div>
    </div>
    <!-- 團別身分：9/17 新增，獨立於 memberSheetBody 之外，理由跟上面 resetPasswordWrap
         的既有註解一樣——避免既有角色/權限欄位的每次重繪把這裡的草稿也一起清掉 -->
    <div class="team-roles-wrap" style="padding:0 20px 14px; max-height:38vh; overflow-y:auto;">
      <label style="display:block;font-family:'Roboto Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;">團別</label>
      <div class="team-tabs" id="teamTabs"></div>
      <div id="teamRolesBody" style="margin-top:12px;"></div>
      <button type="button" class="cta-btn hidden" id="saveTeamRolesBtn" style="margin-top:10px;" disabled>儲存這團的變更</button>
      <p class="form-error" id="teamRolesError"></p>
    </div>
    <div class="sheet-footer">
      <button type="button" class="cta-btn cta-btn-secondary" id="cancelMemberBtn">取消</button>
      <button type="button" class="cta-btn" id="saveMemberBtn" disabled>儲存變更</button>
    </div>
  </div>
</div>

<script type="module">
  import { initAdminNav } from './admin-nav.js';
  import { showToast } from './toast.js';
  import { showConfirm } from './dialog.js';
  import { MESSAGES } from './messages.js';
  import { requireCanManageRoles, peekCachedProfile, getActiveTeam } from './auth-guard.js';
  import { db, functions } from './firebase-init.js';
  import { initAccountMenu } from './account-menu.js';
  import { initTeamSwitcher } from './team-switcher.js';
  import { subscribeInstruments, addInstrument, removeInstrument, setInstrumentsOrder, FAMILY_LABELS, FAMILY_ORDER } from './instruments.js';
  import { subscribeSeatingSections, setSeatingSections } from './seating-chart.js';
  import {
    collection, query, where, onSnapshot, doc, updateDoc
  } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
  import { httpsCallable } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js';

  var resetMemberPasswordFn = httpsCallable(functions, 'resetMemberPassword');

  var MEMBER_SKELETON_HTML = [1, 2, 3].map(function(){
    return (
      '<div class="member-row">' +
        '<span class="skel m-avatar" style="background:var(--line);"></span>' +
        '<div class="m-skel-lines">' +
          '<span class="skel skel-bar" style="width:45%;height:13px;"></span>' +
          '<span class="skel skel-bar" style="width:60%;height:10px;"></span>' +
        '</div>' +
      '</div>'
    );
  }).join('');

  var INST_SKELETON_HTML = [1, 2, 3].map(function(){
    return (
      '<div class="inst-row">' +
        '<span class="skel skel-bar" style="width:40%;height:13px;"></span>' +
      '</div>'
    );
  }).join('');

  var SEAT_SKELETON_HTML = [1, 2, 3].map(function(){
    return (
      '<div class="inst-row">' +
        '<span class="skel skel-bar" style="width:40%;height:13px;"></span>' +
      '</div>'
    );
  }).join('');

  var ROLE_LABELS = { member: '團員', conductor: '指揮', admin: '管理員', owner: 'Owner' };
  var ROLE_WEIGHT = { owner: 0, admin: 1, conductor: 2, member: 3 };

  // 9/19 收尾計畫：角色/權限全部收斂成團別版，只有 Owner 是全域角色。這三個旗標
  // （canManageSheetMusic/canViewAllSheetMusic/canManageEventTypes）雖然管的是兩團共用
  // 資源，但「誰被信任管理」改成各團自己決定，搬進 TEAM_PERMISSION_DEFS
  var TEAM_PERMISSION_DEFS = [
    { key: 'canManageRoles', label: '可調整他人角色/權限（該團）' },
    { key: 'canDeleteAccounts', label: '可軟刪除現役帳號（該團）' },
    { key: 'canManageFinance', label: '可管理財務記帳（該團）' },
    { key: 'canManageSheetMusic', label: '可管理樂譜資料夾（該團）' },
    { key: 'canViewAllSheetMusic', label: '可檢視全部分部樂譜（該團）' },
    { key: 'canManageEventTypes', label: '可管理活動類型（該團）' }
  ];

  // 職位範本：交接時負責轉移的人不用記得「這個職位要打勾哪幾個旗標」，選職位名稱
  // 直接把對應的權限旗標打勾好。套用只影響本地草稿，不會自動反選沒列在這個職位裡的
  // 其他旗標。9/19 收尾計畫：原本全域的「譜務」「財務」都搬進團別身分區塊
  var TEAM_POSITION_PRESETS = [
    { key: 'repertoire', label: '譜務', permissions: { canManageSheetMusic: true } },
    { key: 'finance', label: '財務', permissions: { canManageFinance: true } }
  ];
  var TEAM_LABELS = { alumni: '校友團', school: '校內團' };

  var membersById = {};
  var membersLoaded = false;
  var instrumentsList = [];
  var instrumentsLoaded = false;
  var seatSectionsList = [];
  var seatSectionsLoaded = false;
  var openMemberId = null;
  var currentAdminUid = null;
  var activeTeam = null;
  var draftInstruments = [];
  var initialInstrumentsKey = '';
  var instListExpanded = false; // 樂器/聲部很少變動，預設收合成摘要列，展開/收合只是顯示狀態，不影響儲存

  var editingTeam = 'alumni'; // 團別身分區塊目前顯示哪一團
  var teamDraftRole = null;
  var teamDraftPermissions = {};
  var teamDraftSections = [];
  var teamDraftPositionPresets = [];
  var teamInitialKey = '';

  function permissionsKey(perms, defs){
    return defs.map(function(p){ return p.key + ':' + (!!perms[p.key]); }).sort().join('|');
  }
  function sectionsKey(arr){
    return arr.slice().sort().join('|');
  }

  var memberList = document.getElementById('memberList');
  var instForm = document.getElementById('instForm');
  var instFormError = document.getElementById('instFormError');
  var instList = document.getElementById('instList');
  var seatForm = document.getElementById('seatForm');
  var seatFormError = document.getElementById('seatFormError');
  var seatList = document.getElementById('seatList');
  var seatInstrumentSelect = document.getElementById('seatInstrument');
  var memberSheetOverlay = document.getElementById('memberSheetOverlay');
  var memberSheetBody = document.getElementById('memberSheetBody');
  var saveMemberBtn = document.getElementById('saveMemberBtn');
  var teamTabsEl = document.getElementById('teamTabs');
  var teamRolesBodyEl = document.getElementById('teamRolesBody');
  var saveTeamRolesBtn = document.getElementById('saveTeamRolesBtn');
  var teamRolesErrorEl = document.getElementById('teamRolesError');

  function teamDraftKey(){
    return JSON.stringify({
      role: teamDraftRole,
      perms: permissionsKey(teamDraftPermissions, TEAM_PERMISSION_DEFS),
      sections: sectionsKey(teamDraftSections),
      presets: sectionsKey(teamDraftPositionPresets)
    });
  }
  var resetPasswordWrap = document.getElementById('resetPasswordWrap');
  var resetPasswordForm = document.getElementById('resetPasswordForm');
  var resetPasswordInput = document.getElementById('resetPasswordInput');
  var resetPasswordError = document.getElementById('resetPasswordError');
  var resetPasswordConfirmBtn = document.getElementById('resetPasswordConfirmBtn');

  function resetResetPasswordForm(){
    resetPasswordForm.classList.add('hidden');
    resetPasswordInput.value = '';
    resetPasswordError.classList.remove('show');
    resetPasswordError.textContent = '';
    resetPasswordConfirmBtn.disabled = false;
    resetPasswordConfirmBtn.textContent = '確認重設';
  }

  document.getElementById('resetPasswordBtn').addEventListener('click', function(){
    resetResetPasswordForm();
    resetPasswordForm.classList.remove('hidden');
    resetPasswordInput.focus();
  });

  document.getElementById('resetPasswordCancelBtn').addEventListener('click', resetResetPasswordForm);

  resetPasswordConfirmBtn.addEventListener('click', function(){
    var newPassword = resetPasswordInput.value;
    if (newPassword.length < 6){
      resetPasswordError.textContent = '新密碼至少要 6 碼';
      resetPasswordError.classList.add('show');
      return;
    }
    if (!openMemberId) return;

    resetPasswordError.classList.remove('show');
    resetPasswordConfirmBtn.disabled = true;
    resetPasswordConfirmBtn.textContent = '重設中…';

    resetMemberPasswordFn({ uid: openMemberId, newPassword: newPassword }).then(function(){
      resetPasswordConfirmBtn.textContent = '✓ 已重設';
      resetPasswordInput.value = '';
      setTimeout(function(){
        resetResetPasswordForm();
      }, 1200);
    }).catch(function(err){
      resetPasswordConfirmBtn.disabled = false;
      resetPasswordConfirmBtn.textContent = '確認重設';
      resetPasswordError.textContent = (err && err.message) ? err.message : '重設失敗，請稍後再試';
      resetPasswordError.classList.add('show');
    });
  });
  memberList.innerHTML = MEMBER_SKELETON_HTML;
  instList.innerHTML = INST_SKELETON_HTML;
  seatList.innerHTML = SEAT_SKELETON_HTML;

  var cachedProfile = peekCachedProfile();
  if (cachedProfile && cachedProfile.name){
    var avatarBtnEl = document.getElementById('avatarBtn');
    avatarBtnEl.textContent = cachedProfile.name.charAt(0);
    avatarBtnEl.classList.remove('skel');
  }

  function showInstError(message){
    instFormError.textContent = message;
    instFormError.classList.toggle('show', !!message);
  }

  function showSeatError(message){
    seatFormError.textContent = message;
    seatFormError.classList.toggle('show', !!message);
  }

  // 網路壅塞等原因導致監聽失敗時呼叫，清掉骨架屏並明確告知，不要讓畫面卡住不動
  function renderMembersError(){
    memberList.innerHTML = '<div class="empty">讀取失敗，請重新整理再試一次</div>';
  }

  function renderMembers(){
    if (!membersLoaded){
      memberList.innerHTML = MEMBER_SKELETON_HTML;
      return;
    }

    var ids = Object.keys(membersById);
    if (ids.length === 0){
      memberList.innerHTML = '<div class="empty">目前沒有已核准的成員</div>';
      return;
    }

    ids.sort(function(a, b){
      var ra = membersById[a], rb = membersById[b];
      var wa = ROLE_WEIGHT[ra.role] != null ? ROLE_WEIGHT[ra.role] : 9;
      var wb = ROLE_WEIGHT[rb.role] != null ? ROLE_WEIGHT[rb.role] : 9;
      if (wa !== wb) return wa - wb;
      return (ra.name || '').localeCompare(rb.name || '');
    });

    memberList.innerHTML = ids.map(function(uid){
      var m = membersById[uid];
      var isSelfOwner = m.role === 'owner' && uid === currentAdminUid;
      var locked = m.role === 'owner' && !isSelfOwner;
      var rowHtml =
        '<div class="member-row' + (locked ? ' locked' : '') + '"' + (locked ? '' : ' data-open-member="' + uid + '"') + '>' +
          '<div class="m-avatar">' + (m.name ? m.name.charAt(0) : '?') + '</div>' +
          '<div><div class="m-name">' + (m.name || '—') + '</div><div class="m-account">' + (m.account || '') + '</div></div>' +
          '<span class="role-badge ' + m.role + '">' + (ROLE_LABELS[m.role] || m.role) + '</span>' +
          (locked ? '<span class="lock-ico">🔒</span>' : '') +
        '</div>';

      return '<div class="member-item" data-member-item="' + uid + '">' + rowHtml + '</div>';
    }).join('');
  }

  function isMemberDirty(){
    return sectionsKey(draftInstruments) !== initialInstrumentsKey;
  }

  function renderTeamTabs(){
    teamTabsEl.innerHTML = ['alumni', 'school'].map(function(team){
      return (
        '<button type="button" class="team-tab' + (editingTeam === team ? ' active' : '') + '" data-edit-team="' + team + '">' +
          TEAM_LABELS[team] +
        '</button>'
      );
    }).join('');
  }

  function renderTeamRolesBody(){
    var m = membersById[openMemberId];
    var teamData = m.teams && m.teams[editingTeam];

    if (!teamData){
      teamRolesBodyEl.innerHTML =
        '<p class="lede" style="margin:0 0 10px;">這個人還沒有' + TEAM_LABELS[editingTeam] + '的團籍。</p>' +
        '<button type="button" class="cta-btn cta-btn-secondary" id="grantTeamBtn" data-grant-team="' + editingTeam + '">加入這團（預設一般團員）</button>';
      saveTeamRolesBtn.classList.add('hidden');
      return;
    }

    teamDraftRole = teamData.role;
    teamDraftPermissions = Object.assign({}, teamData.permissions || {});
    teamDraftSections = (teamData.sectionLeaderFor || []).slice();
    teamDraftPositionPresets = (teamData.positionPresets || []).slice();
    teamInitialKey = teamDraftKey();

    var roles = ['member', 'conductor', 'admin'];
    var roleChips = roles.map(function(r){
      return '<div class="role-chip' + (teamDraftRole === r ? ' selected' : '') + '" data-team-role-chip="' + r + '">' + ROLE_LABELS[r] + '</div>';
    }).join('');

    var permRows = TEAM_PERMISSION_DEFS.map(function(p){
      var on = !!teamDraftPermissions[p.key];
      return (
        '<div class="check-row">' +
          '<div class="checkbox' + (on ? ' on' : '') + '" data-team-perm-toggle="' + p.key + '">' + (on ? '✓' : '') + '</div>' +
          '<div class="check-text" data-team-perm-toggle="' + p.key + '">' + p.label + '</div>' +
        '</div>'
      );
    }).join('');

    var sectionRows = instrumentsList.length === 0
      ? '<div class="empty">目前沒有樂器清單</div>'
      : instrumentsList.map(function(inst){
          var on = teamDraftSections.indexOf(inst.name) !== -1;
          return (
            '<div class="check-row">' +
              '<div class="checkbox' + (on ? ' on' : '') + '" data-team-section-toggle="' + inst.name + '">' + (on ? '✓' : '') + '</div>' +
              '<div class="check-text" data-team-section-toggle="' + inst.name + '">' + inst.name + '</div>' +
            '</div>'
          );
        }).join('');

    var teamPresetOptionsHtml = '<option value="">選擇職位套用權限…</option>' +
      TEAM_POSITION_PRESETS.map(function(preset){
        return '<option value="' + preset.key + '">' + preset.label + '</option>';
      }).join('');
    var teamPositionPresetField =
      '<div class="field">' +
        '<label>職位範本（選填，快速套用對應權限）</label>' +
        '<div class="part-add-row">' +
          '<select id="teamPositionPresetSelect">' + teamPresetOptionsHtml + '</select>' +
          '<button type="button" class="part-add-btn" id="teamPositionPresetApplyBtn">套用</button>' +
        '</div>' +
      '</div>';

    teamRolesBodyEl.innerHTML =
      '<div class="field"><label>身分組</label><div class="role-picker">' + roleChips + '</div></div>' +
      '<div class="field"><label>額外權限</label><div class="check-list">' + permRows + '</div></div>' +
      teamPositionPresetField +
      '<div class="field"><label>分部長（選填）</label><div class="check-list">' + sectionRows + '</div></div>';

    saveTeamRolesBtn.classList.remove('hidden');
    saveTeamRolesBtn.disabled = true;
  }

  function renderMemberSheetBody(){
    var instRows = instrumentsList.length === 0
      ? '<div class="empty">目前沒有樂器清單，請先在下面新增</div>'
      : instrumentsList.map(function(inst){
          var on = draftInstruments.indexOf(inst.name) !== -1;
          return (
            '<div class="check-row">' +
              '<div class="checkbox' + (on ? ' on' : '') + '" data-member-inst-toggle="' + inst.name + '">' + (on ? '✓' : '') + '</div>' +
              '<div class="check-text" data-member-inst-toggle="' + inst.name + '">' + inst.name + '</div>' +
            '</div>'
          );
        }).join('');

    var instSummary = draftInstruments.length === 0 ? '尚未設定' : draftInstruments.join('、');

    memberSheetBody.innerHTML =
      '<div class="field">' +
        '<div class="inst-summary-toggle" data-inst-toggle-expand>' +
          '<label>樂器/聲部</label>' +
          '<button type="button" class="collapse-toggle' + (instListExpanded ? ' open' : '') + '" aria-label="展開/收合樂器聲部">' +
            '<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '</button>' +
        '</div>' +
        '<p class="inst-summary-text">' + instSummary + '</p>' +
        '<div class="check-list' + (instListExpanded ? '' : ' collapsed') + '">' + instRows + '</div>' +
      '</div>' +
      '<p class="form-error" id="memberFormError"></p>';

    saveMemberBtn.disabled = !isMemberDirty();
  }

  function openMemberSheet(uid){
    var m = membersById[uid];
    if (!m) return;
    openMemberId = uid;
    draftInstruments = (m.instruments || []).slice();
    initialInstrumentsKey = sectionsKey(draftInstruments);
    instListExpanded = false; // 每次重新打開都從收合狀態開始

    document.getElementById('sheetMemberName').textContent = m.name || '—';
    document.getElementById('sheetMemberAccount').textContent = '@' + (m.account || '');
    saveMemberBtn.textContent = '儲存變更';
    renderMemberSheetBody();
    editingTeam = 'alumni'; // 每次重新打開都從校友團開始
    renderTeamTabs();
    renderTeamRolesBody();
    resetPasswordWrap.classList.toggle('hidden', uid === currentAdminUid || m.role === 'owner');
    resetResetPasswordForm();
    memberSheetOverlay.classList.add('active');
  }

  function closeMemberSheet(){
    memberSheetOverlay.classList.remove('active');
    openMemberId = null;
    resetResetPasswordForm();
  }

  memberList.addEventListener('click', function(e){
    var openBtn = e.target.closest('[data-open-member]');
    if (!openBtn) return;
    openMemberSheet(openBtn.getAttribute('data-open-member'));
  });

  memberSheetBody.addEventListener('click', function(e){
    if (e.target.closest('[data-inst-toggle-expand]')){
      instListExpanded = !instListExpanded;
      renderMemberSheetBody();
      return;
    }
    var instToggle = e.target.closest('[data-member-inst-toggle]');
    if (instToggle){
      var iname = instToggle.getAttribute('data-member-inst-toggle');
      var iidx = draftInstruments.indexOf(iname);
      if (iidx === -1) draftInstruments.push(iname); else draftInstruments.splice(iidx, 1);
      renderMemberSheetBody();
      return;
    }
  });

  teamTabsEl.addEventListener('click', function(e){
    var tab = e.target.closest('[data-edit-team]');
    if (!tab) return;
    editingTeam = tab.getAttribute('data-edit-team');
    renderTeamTabs();
    renderTeamRolesBody();
  });

  teamRolesBodyEl.addEventListener('click', function(e){
    // 角色 chip／權限/分部長 checkbox 都只切換 class、更新 draft 變數，不重新呼叫
    // renderTeamRolesBody()——那個函式一開頭會重新從 teamData（資料庫目前的值，不是草稿）
    // 覆寫 teamDraftRole 等變數，儲存前呼叫它會把剛勾選、還沒送出的變更蓋掉
    var roleChip = e.target.closest('[data-team-role-chip]');
    if (roleChip){
      teamDraftRole = roleChip.getAttribute('data-team-role-chip');
      roleChip.parentElement.querySelectorAll('.role-chip').forEach(function(el){
        el.classList.toggle('selected', el === roleChip);
      });
      saveTeamRolesBtn.disabled = teamDraftKey() === teamInitialKey;
      return;
    }
    var permToggle = e.target.closest('[data-team-perm-toggle]');
    if (permToggle){
      var pkey = permToggle.getAttribute('data-team-perm-toggle');
      teamDraftPermissions[pkey] = !teamDraftPermissions[pkey];
      permToggle.parentElement.querySelectorAll('[data-team-perm-toggle="' + pkey + '"].checkbox').forEach(function(el){
        el.classList.toggle('on', teamDraftPermissions[pkey]);
        el.textContent = teamDraftPermissions[pkey] ? '✓' : '';
      });
      saveTeamRolesBtn.disabled = teamDraftKey() === teamInitialKey;
      return;
    }
    var sectionToggle = e.target.closest('[data-team-section-toggle]');
    if (sectionToggle){
      var sname = sectionToggle.getAttribute('data-team-section-toggle');
      var sidx = teamDraftSections.indexOf(sname);
      if (sidx === -1) teamDraftSections.push(sname); else teamDraftSections.splice(sidx, 1);
      saveTeamRolesBtn.disabled = teamDraftKey() === teamInitialKey;
      return;
    }
    if (e.target.closest('#teamPositionPresetApplyBtn')){
      var teamPresetKey = document.getElementById('teamPositionPresetSelect').value;
      if (!teamPresetKey) return;
      var teamPreset = TEAM_POSITION_PRESETS.filter(function(p){ return p.key === teamPresetKey; })[0];
      if (!teamPreset) return;
      // 套用只更新草稿變數＋就地改對應 checkbox 的樣式，不能整個重新呼叫
      // renderTeamRolesBody()——那個函式一開頭會用資料庫目前的值覆寫 teamDraftPermissions，
      // 會把剛套用的變更蓋掉（跟角色 chip／checkbox toggle 同一個既有限制，見上面註解）
      Object.keys(teamPreset.permissions).forEach(function(permKey){
        teamDraftPermissions[permKey] = teamPreset.permissions[permKey];
        teamRolesBodyEl.querySelectorAll('[data-team-perm-toggle="' + permKey + '"].checkbox').forEach(function(el){
          el.classList.toggle('on', teamDraftPermissions[permKey]);
          el.textContent = teamDraftPermissions[permKey] ? '✓' : '';
        });
      });
      if (teamDraftPositionPresets.indexOf(teamPresetKey) === -1) teamDraftPositionPresets.push(teamPresetKey);
      saveTeamRolesBtn.disabled = teamDraftKey() === teamInitialKey;
      return;
    }
    var grantBtn = e.target.closest('[data-grant-team]');
    if (grantBtn){
      var grantTeam = grantBtn.getAttribute('data-grant-team');
      grantBtn.disabled = true;
      var newTeams = Object.assign({}, membersById[openMemberId].teams || {}, {
        [grantTeam]: { role: 'member', permissions: {}, sectionLeaderFor: [], positionPresets: [] }
      });
      // 9/17 修正：teamIds 一定要跟 teams 的鍵值同步（見 9/16 設計文件），漏寫這行會讓
      // 團別切換器誤判成單團籍（切換器/配色判斷依據是 teamIds，不是 teams 有幾把鍵）
      var newTeamIds = Object.keys(newTeams);
      updateDoc(doc(db, 'users', openMemberId), { teams: newTeams, teamIds: newTeamIds }).then(function(){
        membersById[openMemberId].teams = newTeams; // 本地同步，不用等下一次 onSnapshot 回來
        membersById[openMemberId].teamIds = newTeamIds;
        renderTeamRolesBody();
      }).catch(function(err){
        teamRolesErrorEl.textContent = '加入失敗（' + err.code + '）';
        teamRolesErrorEl.classList.add('show');
        grantBtn.disabled = false;
      });
      return;
    }
  });

  saveTeamRolesBtn.addEventListener('click', function(){
    if (!openMemberId) return;
    var saveUid = openMemberId;
    var team = editingTeam;
    saveTeamRolesBtn.disabled = true;
    saveTeamRolesBtn.textContent = '儲存中…';
    teamRolesErrorEl.classList.remove('show');

    var m = membersById[saveUid];
    var payload = {
      teams: Object.assign({}, m.teams || {}, {
        [team]: {
          role: teamDraftRole,
          permissions: Object.assign(
            { canManageRoles: false, canDeleteAccounts: false, canManageFinance: false,
              canManageSheetMusic: false, canViewAllSheetMusic: false, canManageEventTypes: false },
            teamDraftPermissions
          ),
          sectionLeaderFor: teamDraftSections,
          positionPresets: teamDraftPositionPresets
        }
      })
    };

    updateDoc(doc(db, 'users', saveUid), payload).then(function(){
      membersById[saveUid].teams = payload.teams;
      teamInitialKey = teamDraftKey();
      saveTeamRolesBtn.textContent = '儲存這團的變更';
    }).catch(function(err){
      teamRolesErrorEl.textContent = '儲存失敗（' + err.code + '）';
      teamRolesErrorEl.classList.add('show');
      saveTeamRolesBtn.disabled = false;
      saveTeamRolesBtn.textContent = '儲存這團的變更';
    });
  });

  document.getElementById('memberSheetClose').addEventListener('click', closeMemberSheet);
  document.getElementById('cancelMemberBtn').addEventListener('click', closeMemberSheet);
  memberSheetOverlay.addEventListener('click', function(e){
    if (e.target === memberSheetOverlay) closeMemberSheet();
  });

  saveMemberBtn.addEventListener('click', function(){
    if (!openMemberId) return;
    var saveUid = openMemberId;
    saveMemberBtn.disabled = true;
    saveMemberBtn.textContent = '儲存中…';
    updateDoc(doc(db, 'users', saveUid), { instruments: draftInstruments }).then(function(){
      closeMemberSheet();
    }).catch(function(err){
      var errEl = document.getElementById('memberFormError');
      if (errEl){
        errEl.textContent = '儲存失敗（' + err.code + '）';
        errEl.classList.add('show');
      }
      saveMemberBtn.disabled = false;
      saveMemberBtn.textContent = '儲存變更';
    });
  });

  // 網路壅塞等原因導致監聽失敗時呼叫，清掉骨架屏並明確告知，不要讓畫面卡住不動
  function renderInstrumentsError(){
    instList.innerHTML = '<div class="empty">讀取失敗，請重新整理再試一次</div>';
  }

  function renderInstruments(){
    if (!instrumentsLoaded){
      instList.innerHTML = INST_SKELETON_HTML;
      return;
    }
    if (instrumentsList.length === 0){
      instList.innerHTML = '<div class="empty">目前沒有任何樂器</div>';
      return;
    }
    var byFamily = {};
    instrumentsList.forEach(function(inst, idx){
      if (!byFamily[inst.family]) byFamily[inst.family] = [];
      byFamily[inst.family].push(idx);
    });
    var families = FAMILY_ORDER.filter(function(f){ return byFamily[f]; })
      .concat(Object.keys(byFamily).filter(function(f){ return FAMILY_ORDER.indexOf(f) === -1; }));

    instList.innerHTML = families.map(function(family){
      var idxs = byFamily[family];
      return (
        '<div class="inst-group-label">' + (FAMILY_LABELS[family] || family) + '</div>' +
        idxs.map(function(idx, i){
          var inst = instrumentsList[idx];
          var isFirst = i === 0;
          var isLast = i === idxs.length - 1;
          return (
            '<div class="inst-row">' +
              '<span class="inst-name">' + inst.name + '</span>' +
              '<div class="inst-move">' +
                '<button type="button" class="inst-move-btn" data-inst-up="' + idx + '"' + (isFirst ? ' disabled' : '') + ' aria-label="上移">▲</button>' +
                '<button type="button" class="inst-move-btn" data-inst-down="' + idx + '"' + (isLast ? ' disabled' : '') + ' aria-label="下移">▼</button>' +
              '</div>' +
              '<button type="button" class="inst-remove" data-inst-remove="' + idx + '" aria-label="刪除">×</button>' +
            '</div>'
          );
        }).join('')
      );
    }).join('');
  }

  function moveInstrument(idx, direction){
    var inst = instrumentsList[idx];
    if (!inst) return;
    var groupIdxs = [];
    instrumentsList.forEach(function(item, i){ if (item.family === inst.family) groupIdxs.push(i); });
    var pos = groupIdxs.indexOf(idx);
    var swapPos = direction === 'up' ? pos - 1 : pos + 1;
    if (swapPos < 0 || swapPos >= groupIdxs.length) return;
    var otherIdx = groupIdxs[swapPos];

    var newList = instrumentsList.slice();
    var tmp = newList[idx];
    newList[idx] = newList[otherIdx];
    newList[otherIdx] = tmp;

    setInstrumentsOrder(db, newList).catch(function(err){
      showToast('調整順序失敗：' + err.code, 'error');
    });
  }

  instForm.addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('instName').value.trim();
    var family = document.getElementById('instFamily').value;
    if (!name){
      showInstError('請輸入樂器名稱');
      return;
    }
    if (instrumentsList.some(function(i){ return i.name === name; })){
      showInstError('已經有「' + name + '」了');
      return;
    }
    showInstError('');
    addInstrument(db, name, family).then(function(){
      instForm.reset();
    }).catch(function(err){
      showInstError('新增失敗（' + err.code + '）');
    });
  });

  instList.addEventListener('click', async function(e){
    var upBtn = e.target.closest('[data-inst-up]');
    var downBtn = e.target.closest('[data-inst-down]');
    if (upBtn){ moveInstrument(Number(upBtn.getAttribute('data-inst-up')), 'up'); return; }
    if (downBtn){ moveInstrument(Number(downBtn.getAttribute('data-inst-down')), 'down'); return; }

    var btn = e.target.closest('[data-inst-remove]');
    if (!btn) return;
    var idx = Number(btn.getAttribute('data-inst-remove'));
    var target = instrumentsList[idx];
    if (!target) return;
    var ok = await showConfirm(MESSAGES.deleteInstrument(target.name), { danger: true });
    if (!ok) return;
    removeInstrument(db, target).catch(function(err){
      showToast('刪除失敗：' + err.code, 'error');
    });
  });

  // ---------- 座位圖分區設定 ----------
  // 下拉選單的樂器選項要跟著 instrumentsList 一起更新（在 subscribeInstruments 的回呼裡一併呼叫）
  function renderSeatInstrumentOptions(){
    var current = seatInstrumentSelect.value;
    seatInstrumentSelect.innerHTML = instrumentsList.map(function(inst){
      return '<option value="' + inst.name + '">' + inst.name + '</option>';
    }).join('');
    if (current && instrumentsList.some(function(i){ return i.name === current; })){
      seatInstrumentSelect.value = current;
    }
  }

  function renderSeatSectionsError(){
    seatList.innerHTML = '<div class="empty">讀取失敗，請重新整理再試一次</div>';
  }

  // 分區清單依「排」分組顯示（percussion 各自獨立一組，永遠排在最後，因為不參與排數），
  // 群組內的上下移動只在同一排內交換相鄰兩項，做法比照 moveInstrument() 依家族分組的邏輯，
  // 分組鍵從「家族」換成「排數」
  function seatGroupKey(sec){
    return sec.percussion ? 'percussion' : ('row:' + sec.row);
  }

  function renderSeatSections(){
    if (!seatSectionsLoaded){
      seatList.innerHTML = SEAT_SKELETON_HTML;
      return;
    }
    if (seatSectionsList.length === 0){
      seatList.innerHTML = '<div class="empty">目前沒有任何分區</div>';
      return;
    }
    var byGroup = {};
    seatSectionsList.forEach(function(sec, idx){
      var key = seatGroupKey(sec);
      if (!byGroup[key]) byGroup[key] = [];
      byGroup[key].push(idx);
    });
    var rowKeys = Object.keys(byGroup).filter(function(k){ return k !== 'percussion'; })
      .sort(function(a, b){ return Number(a.split(':')[1]) - Number(b.split(':')[1]); });
    if (byGroup.percussion) rowKeys.push('percussion');

    seatList.innerHTML = rowKeys.map(function(key){
      var idxs = byGroup[key];
      var groupLabel = key === 'percussion' ? '打擊樂區塊' : ('第 ' + key.split(':')[1] + ' 排');
      return (
        '<div class="inst-group-label">' + groupLabel + '</div>' +
        idxs.map(function(idx, i){
          var sec = seatSectionsList[idx];
          var isFirst = i === 0;
          var isLast = i === idxs.length - 1;
          var displayName = sec.label || sec.instrumentName;
          var rowInputHtml = sec.percussion ? '' :
            '<input type="number" class="seat-row-input" min="1" value="' + sec.row + '" data-seat-row-input="' + idx + '" aria-label="調整排數" title="第幾排">';
          var weightInputHtml = sec.percussion ? '' :
            '<input type="number" class="seat-row-input" min="1" value="' + (sec.weight || 1) + '" data-seat-weight-input="' + idx + '" aria-label="調整寬度權重" title="寬度權重">';
          return (
            '<div class="inst-row">' +
              '<span class="inst-name">' + displayName + '</span>' +
              rowInputHtml +
              weightInputHtml +
              '<div class="inst-move">' +
                '<button type="button" class="inst-move-btn" data-seat-up="' + idx + '"' + (isFirst ? ' disabled' : '') + ' aria-label="上移">▲</button>' +
                '<button type="button" class="inst-move-btn" data-seat-down="' + idx + '"' + (isLast ? ' disabled' : '') + ' aria-label="下移">▼</button>' +
              '</div>' +
              '<button type="button" class="inst-remove" data-seat-remove="' + idx + '" aria-label="刪除">×</button>' +
            '</div>'
          );
        }).join('')
      );
    }).join('');
  }

  function moveSeatSection(idx, direction){
    var sec = seatSectionsList[idx];
    if (!sec) return;
    var key = seatGroupKey(sec);
    var groupIdxs = [];
    seatSectionsList.forEach(function(item, i){ if (seatGroupKey(item) === key) groupIdxs.push(i); });
    var pos = groupIdxs.indexOf(idx);
    var swapPos = direction === 'up' ? pos - 1 : pos + 1;
    if (swapPos < 0 || swapPos >= groupIdxs.length) return;
    var otherIdx = groupIdxs[swapPos];

    var newList = seatSectionsList.slice();
    var tmp = newList[idx];
    newList[idx] = newList[otherIdx];
    newList[otherIdx] = tmp;
    setSeatingSections(db, activeTeam, newList).catch(function(err){
      showToast('調整順序失敗：' + err.code, 'error');
    });
  }

  function changeSeatSectionRow(idx, newRow){
    var sec = seatSectionsList[idx];
    if (!sec || sec.percussion) return;
    if (!newRow || newRow < 1) return;
    var newList = seatSectionsList.slice();
    newList[idx] = Object.assign({}, sec, { row: newRow });
    setSeatingSections(db, activeTeam, newList).catch(function(err){
      showToast('調整排數失敗：' + err.code, 'error');
    });
  }

  function changeSeatSectionWeight(idx, newWeight){
    var sec = seatSectionsList[idx];
    if (!sec || sec.percussion) return;
    if (!newWeight || newWeight < 1) return;
    var newList = seatSectionsList.slice();
    newList[idx] = Object.assign({}, sec, { weight: newWeight });
    setSeatingSections(db, activeTeam, newList).catch(function(err){
      showToast('調整寬度權重失敗：' + err.code, 'error');
    });
  }

  seatForm.addEventListener('submit', function(e){
    e.preventDefault();
    var instrumentName = seatInstrumentSelect.value;
    if (!instrumentName){
      showSeatError('請先在上面新增至少一個樂器');
      return;
    }
    showSeatError('');
    var isPercussion = document.getElementById('seatPercussion').checked;
    var newSection = {
      zoneId: 'z' + Date.now(),
      instrumentName: instrumentName,
      label: document.getElementById('seatLabel').value.trim(),
      percussion: isPercussion,
      row: isPercussion ? null : Math.max(1, Number(document.getElementById('seatRow').value) || 1),
      weight: isPercussion ? null : Math.max(1, Number(document.getElementById('seatWeight').value) || 1)
    };
    setSeatingSections(db, activeTeam, seatSectionsList.concat([newSection])).then(function(){
      seatForm.reset();
    }).catch(function(err){
      showSeatError('新增失敗（' + err.code + '）');
    });
  });

  seatList.addEventListener('click', async function(e){
    var upBtn = e.target.closest('[data-seat-up]');
    var downBtn = e.target.closest('[data-seat-down]');
    if (upBtn){ moveSeatSection(Number(upBtn.getAttribute('data-seat-up')), 'up'); return; }
    if (downBtn){ moveSeatSection(Number(downBtn.getAttribute('data-seat-down')), 'down'); return; }

    var btn = e.target.closest('[data-seat-remove]');
    if (!btn) return;
    var idx = Number(btn.getAttribute('data-seat-remove'));
    var target = seatSectionsList[idx];
    if (!target) return;
    var ok = await showConfirm(MESSAGES.deleteSeatingSection(), { danger: true });
    if (!ok) return;
    var newList = seatSectionsList.slice();
    newList.splice(idx, 1);
    setSeatingSections(db, activeTeam, newList).catch(function(err){
      showToast('刪除失敗：' + err.code, 'error');
    });
  });

  seatList.addEventListener('change', function(e){
    var rowInput = e.target.closest('[data-seat-row-input]');
    if (rowInput){ changeSeatSectionRow(Number(rowInput.getAttribute('data-seat-row-input')), Number(rowInput.value)); return; }
    var weightInput = e.target.closest('[data-seat-weight-input]');
    if (weightInput){ changeSeatSectionWeight(Number(weightInput.getAttribute('data-seat-weight-input')), Number(weightInput.value)); return; }
  });

  requireCanManageRoles().then(function(result){
    if (!result) return;

    currentAdminUid = result.uid;
    activeTeam = getActiveTeam(result.profile);
    var avatarBtn = document.getElementById('avatarBtn');
    avatarBtn.textContent = result.profile.name ? result.profile.name.charAt(0) : '?';
    avatarBtn.classList.remove('skel');
    initAccountMenu(result.profile.name);
    initTeamSwitcher(result.profile);
    initAdminNav('roles');

    onSnapshot(query(collection(db, 'users'), where('status', '==', 'approved')), function(snap){
      membersById = {};
      snap.forEach(function(docSnap){
        var data = docSnap.data();
        membersById[docSnap.id] = {
          name: data.name,
          account: data.account,
          role: data.role,
          permissions: data.permissions || {},
          sectionLeaderFor: data.sectionLeaderFor || [],
          instruments: data.instruments || [],
          teams: data.teams || {} // 9/17 新增：團別身分區塊要讀這個，之前漏加，一律預設空物件
        };
      });
      membersLoaded = true;
      renderMembers();
    }, renderMembersError);

    subscribeInstruments(db, function(list){
      instrumentsList = list;
      instrumentsLoaded = true;
      renderInstruments();
      renderMembers();
      renderSeatInstrumentOptions();
    }, true, renderInstrumentsError);

    // 座位圖分區設定只有 Owner 看得到/能用（8/19 使用者要求暫時不開放其他人編輯座位圖），
    // 不是 Owner 就整個區塊連 DOM 都不顯示，也不去訂閱這份資料
    if (!isOwner) return;
    document.getElementById('seatSectionWrap').classList.remove('hidden');

    subscribeSeatingSections(db, activeTeam, function(sections){
      seatSectionsList = sections;
      seatSectionsLoaded = true;
      renderSeatSections();
    }, true, renderSeatSectionsError);
  });
</script>
</body>
</html>
