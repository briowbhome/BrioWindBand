<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>布利歐管樂團｜簽到管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F2EFE5">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<script src="./pwa-register.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root{
    --ink:#20242F;
    --ink-soft:#4A4F5C;
    --paper:#F2EFE5;
    --paper-raised:#FBFAF4;
    --line:#DAD3BE;
    --brass:#B8863A;
    --brass-deep:#8F6A2C;
    --burgundy:#7A2331;
    --burgundy-deep:#5C1A26;
    --sage:#5F6E58;
    --sage-bg:#E7EBDF;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-card: 0 1px 2px rgba(32,36,47,.06), 0 8px 24px -12px rgba(32,36,47,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #EFE9D6 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding: 0 0 calc(48px + env(safe-area-inset-bottom));
  }

  button, a, input, select{ -webkit-tap-highlight-color: transparent; font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--brass-deep); outline-offset:2px; border-radius:6px; }

  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
  }

  .hidden{ display:none !important; }
  .auth-loading{
    min-height:100vh; width:100%; max-width:460px; margin:0 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; color:var(--ink-soft); font-size:13px;
  }
  .auth-loading .spinner{
    width:22px; height:22px; border-radius:50%;
    border:2.5px solid var(--line); border-top-color:var(--brass);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- App Bar ---------- */
  .appbar{ display:flex; align-items:center; gap:12px; padding:18px 20px 14px; }
  .mark{ width:38px; height:38px; flex:none; object-fit:cover; border-radius:50%; }
  .brandtext{ display:flex; flex-direction:column; line-height:1.1; }
  .brandtext .name{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:19px; letter-spacing:.02em; }
  .brandtext .sub{ font-family:'Roboto Mono',monospace; font-size:10.5px; letter-spacing:.14em; color:var(--ink-soft); margin-top:3px; text-transform:uppercase; }
  .appbar .spacer{ flex:1; }
  .hamburger-btn{
    width:36px; height:36px; flex:none;
    background:none; border:1px solid var(--line); border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .hamburger-btn:active{ background:var(--paper-raised); }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px;
    border:2px solid var(--paper-raised); box-shadow:0 0 0 1.5px var(--line);
    padding:0; cursor:pointer;
  }

  .staff{
    height:16px; margin:0 20px 6px;
    background-image: repeating-linear-gradient(var(--line), var(--line) 1px, transparent 1px, transparent 4px);
    opacity:.9;
  }

  /* ---------- Admin drawer ---------- */
  .drawer-overlay{
    position:fixed; inset:0; z-index:70;
    background:rgba(32,36,47,.5);
    display:none;
  }
  .drawer-overlay.active{ display:block; }
  .drawer-panel{
    position:absolute; top:0; left:0; bottom:0;
    width:78%; max-width:300px;
    background:var(--paper-raised);
    box-shadow:8px 0 30px rgba(0,0,0,.25);
    padding:env(safe-area-inset-top) 0 calc(20px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
    transform:translateX(-100%);
    transition:transform .22s ease;
  }
  .drawer-overlay.active .drawer-panel{ transform:translateX(0); }
  .drawer-header{
    padding:20px 20px 14px; border-bottom:1px solid var(--line);
  }
  .drawer-header .name{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:16px; }
  .drawer-home{
    display:flex; align-items:center; gap:9px;
    padding:14px 20px; font-size:13.5px; font-weight:700; color:var(--ink-soft);
    text-decoration:none; border-bottom:1px solid var(--line);
  }
  .drawer-section-label{
    padding:16px 20px 6px; font-family:'Roboto Mono',monospace; font-size:10px;
    letter-spacing:.1em; color:var(--ink-soft); text-transform:uppercase;
  }
  .drawer-link{
    display:flex; align-items:center;
    padding:12px 20px; font-size:13.5px; font-weight:600; color:var(--ink);
    text-decoration:none;
  }
  .drawer-link.active{ background:var(--sage-bg); color:var(--sage); font-weight:700; }

  .section-label{ display:flex; align-items:baseline; gap:8px; margin:20px 20px 4px; }
  .section-label .tw{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:15.5px; }
  .section-label .en{ font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }
  .lede{ margin:6px 20px 10px; font-size:12.5px; line-height:1.6; color:var(--ink-soft); }

  /* ---------- Time range filter ---------- */
  .filter-row{
    display:flex; align-items:center; justify-content:space-between;
    margin:0 20px 14px;
  }
  .filter-row label{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .filter-row select{
    border:1px solid var(--line); background:var(--paper-raised);
    border-radius:999px; padding:6px 14px; font-size:12px; color:var(--ink);
    font-weight:700;
  }

  .list-error{
    margin:0 20px 14px;
    font-size:12.5px; color:var(--burgundy);
    background:#FBF3F3; border:1px solid #EFD4D8; border-radius:var(--radius-sm);
    padding:10px 12px; display:none;
  }
  .list-error.show{ display:block; }

  /* ---------- Unified event list ---------- */
  .list{
    margin:0 20px 24px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .event-item{ padding:14px 16px; }
  .event-item + .event-item{ border-top:1px solid var(--line); }
  .event-row{ display:flex; align-items:center; gap:12px; }
  .event-date{ flex:none; width:40px; text-align:center; }
  .event-date .d{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:18px; color:var(--ink); line-height:1.05; }
  .event-date .m{ font-family:'Roboto Mono',monospace; font-size:9px; color:var(--ink-soft); letter-spacing:.04em; }
  .event-body{ flex:1; min-width:0; }
  .event-title{ font-weight:700; font-size:13.5px; color:var(--ink); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .kind{
    font-family:'Roboto Mono',monospace; font-size:9.5px; letter-spacing:.05em;
    padding:1.5px 6px; border-radius:5px; font-weight:600;
  }
  .event-meta{ margin-top:3px; font-size:11.5px; color:var(--ink-soft); }

  .btn-start{
    flex:none;
    background:var(--brass); color:var(--ink); border:none;
    border-radius:var(--radius-sm); padding:9px 12px;
    font-weight:700; font-size:11.5px; cursor:pointer;
  }
  .btn-start:active{ background:var(--brass-deep); }
  .btn-start:disabled{ opacity:.5; }

  .qr-toggle{
    flex:none; width:38px; height:38px; border-radius:var(--radius-sm);
    border:1px solid var(--line); background:var(--paper);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--ink-soft); padding:0;
  }
  .qr-toggle.active{ border-color:var(--sage); color:var(--sage); background:var(--sage-bg); }
  .qr-toggle.expired{ color:var(--burgundy-deep); border-color:#EFD4D8; background:#FBF3F3; }

  /* ---------- QR panel (expands within a row) ---------- */
  .qr-panel{
    margin-top:12px; background:var(--ink); color:var(--paper);
    border-radius:var(--radius-md); padding:16px; position:relative; overflow:hidden;
  }
  .qr-panel.expired-style{ background:var(--paper); color:var(--ink-soft); border:1px solid var(--line); }
  .qr-panel .staff-bg{
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(rgba(242,239,229,.09), rgba(242,239,229,.09) 1px, transparent 1px, transparent 9px);
    pointer-events:none;
  }
  .qr-panel.expired-style .staff-bg{ display:none; }
  .qr-panel-inner{ position:relative; }
  .qr-status-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .status-chip{
    font-family:'Roboto Mono',monospace; font-weight:600; font-size:10.5px;
    padding:3px 9px; border-radius:999px; flex:none;
  }
  .status-chip.active{ background:var(--sage); color:#F2EFE5; }
  .status-chip.expired{ background:#EFE1E3; color:var(--burgundy-deep); }

  .qr-wrap{
    margin-top:14px; background:#fff; border-radius:var(--radius-md);
    padding:14px; display:flex; align-items:center; justify-content:center;
  }
  .qr-wrap img{ width:180px; height:180px; display:block; cursor:zoom-in; }

  .qr-zoom-overlay{
    position:fixed; inset:0; z-index:60;
    background:rgba(32,36,47,.82);
    display:none; align-items:center; justify-content:center;
    padding:32px; cursor:zoom-out;
  }
  .qr-zoom-overlay.active{ display:flex; }
  .qr-zoom-overlay img{
    width:min(84vw, 360px); height:min(84vw, 360px);
    background:#fff; border-radius:var(--radius-lg); padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }

  .qr-actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .qr-actions button{
    flex:1; min-width:100px;
    border-radius:var(--radius-sm); padding:10px 8px;
    font-weight:700; font-size:12px; cursor:pointer;
    transition:transform .12s ease;
  }
  .qr-actions button:active{ transform:scale(.97); }
  .btn-reopen{ background:var(--brass); color:var(--ink); border:none; }
  .btn-regen{ background:none; border:1px solid rgba(242,239,229,.4); color:var(--paper); }
  .qr-panel.expired-style .btn-regen{ border-color:var(--line); color:var(--ink-soft); }
  .btn-end{ background:none; border:1px solid rgba(242,239,229,.4); color:#E8B4BC; }
  .qr-panel.expired-style .btn-end{ border-color:var(--line); color:var(--burgundy-deep); }

  /* ---------- Attendance (簽到名單) ---------- */
  .att-toggle{
    display:flex; align-items:center; gap:6px;
    margin-top:12px; background:none; border:none; padding:0;
    font-size:12px; font-weight:700; color:var(--brass-deep); cursor:pointer;
  }
  .att-toggle .chev{ transition:transform .15s ease; }
  .att-toggle.open .chev{ transform:rotate(180deg); }
  .att-panel{
    margin-top:10px; background:var(--paper); color:var(--ink);
    border:1px solid var(--line);
    border-radius:var(--radius-md); overflow:hidden;
  }
  .att-summary{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 12px; background:var(--sage-bg); color:var(--sage);
    font-size:11.5px; font-weight:700;
  }
  .att-row{ display:flex; align-items:center; gap:10px; padding:8px 12px; font-size:12px; }
  .att-row + .att-row{ border-top:1px solid var(--line); }
  .att-name{ font-weight:500; color:var(--ink); }
  .att-sub{ font-size:10px; color:var(--ink-soft); font-family:'Roboto Mono',monospace; margin-top:1px; }
  .att-time{ flex:none; font-family:'Roboto Mono',monospace; font-size:11px; font-weight:700; }
  .att-time.ontime{ color:var(--sage); }
  .att-time.late{ color:var(--brass-deep); }
  .att-time.verylate{ color:var(--burgundy-deep); }
  .att-empty{ padding:16px 12px; text-align:center; font-size:12px; color:var(--ink-soft); }
  .att-remove{
    flex:none; width:22px; height:22px; border-radius:50%; border:none; background:none;
    color:var(--ink-soft); cursor:pointer; font-size:15px; line-height:1;
  }
  .att-remove:active{ color:var(--burgundy-deep); }
  .att-add-row{ display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line); }
  .att-add-row select{
    flex:1; min-width:0; border:1px solid var(--line); background:var(--paper-raised);
    border-radius:var(--radius-sm); padding:7px 9px; font-size:12px; color:var(--ink);
  }
  .att-add-row button{
    flex:none; background:var(--brass); color:var(--ink); border:none;
    border-radius:var(--radius-sm); padding:7px 14px; font-weight:700; font-size:12px; cursor:pointer;
  }
  .att-add-row button:disabled{ opacity:.5; }

  .empty{ padding:36px 20px; text-align:center; font-size:13px; color:var(--ink-soft); }
</style>
</head>
<body>
<div id="authLoading" class="auth-loading">
  <div class="spinner"></div>
  <p>驗證登入狀態中…</p>
</div>
<div class="app hidden" id="appRoot">

  <div class="appbar">
    <button class="hamburger-btn" id="adminMenuBtn" type="button" aria-label="選單">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="#20242F" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <img class="mark" src="assets/BrioLogo.jpg" alt="布利歐管樂團 Logo">
    <div class="brandtext">
      <div class="name">布利歐管樂團</div>
      <div class="sub">Brio Wind Band</div>
    </div>
    <div class="spacer"></div>
    <button class="avatar" id="avatarBtn" type="button" aria-label="帳號選單"></button>
  </div>

  <div class="staff"></div>

  <div class="section-label">
    <span class="tw">簽到管理</span>
    <span class="en">Check-in</span>
  </div>
  <p class="lede">產生簽到 QR Code、查看簽到名單。找不到活動請先到「活動管理」建立。</p>

  <div class="filter-row">
    <label for="rangeFilter">顯示範圍（未來活動一律顯示）</label>
    <select id="rangeFilter">
      <option value="7">最近 7 天</option>
      <option value="30" selected>最近 1 個月</option>
      <option value="90">最近 3 個月</option>
      <option value="all">全部</option>
    </select>
  </div>

  <p class="list-error" id="listError"></p>

  <div class="list" id="eventList"></div>

</div>

<div class="qr-zoom-overlay" id="qrZoomOverlay">
  <img id="qrZoomImg" alt="簽到 QR Code 放大">
</div>

<div class="drawer-overlay" id="drawerOverlay">
  <nav class="drawer-panel" id="drawerPanel"></nav>
</div>

<script type="module">
  import { requireAdmin } from './auth-guard.js';
  import { db } from './firebase-init.js';
  import { initAdminNav } from './admin-nav.js';
  import { initAccountMenu } from './account-menu.js';
  import { subscribeEventTypes, badgeStyle } from './event-types.js';
  import {
    collection, doc, setDoc, getDoc, getDocs, deleteDoc, onSnapshot,
    query, where, serverTimestamp, Timestamp
  } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  initAdminNav('checkin-admin.html');

  var WINDOW_MINUTES = 30;
  // 簽到名單的遲到門檻，之後想調整標準改這兩個數字就好
  var LATE_MINUTES = 15;
  var VERY_LATE_MINUTES = 30;
  var eventTypesById = {};

  function typeBadge(typeId){
    var t = eventTypesById[typeId];
    var label = t ? t.label : typeId;
    return '<span class="kind" style="' + badgeStyle(t ? t.colorKey : null) + '">' + label + '</span>';
  }

  var currentAdminUid = null;

  // eventId -> { title, type, date, location }
  var eventsById = {};
  // eventId -> { code, windowEnd(Date), generatedAt }
  var sessionsById = {};
  // 展開中的 QR / 簽到名單面板，重繪列表後要恢復展開狀態
  var openQrPanels = {};
  var openAttPanels = {};
  // 已核准團員清單，手動補登簽到用，第一次要用到時才抓、抓過快取
  var approvedMembers = null;

  var eventList = document.getElementById('eventList');
  var listError = document.getElementById('listError');
  var rangeFilter = document.getElementById('rangeFilter');

  function showListError(message){
    listError.textContent = message;
    listError.classList.toggle('show', !!message);
  }

  function qrDataUrl(text){
    var qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    return qr.createDataURL(6, 8);
  }

  function checkinUrl(eventId, code){
    return location.origin + location.pathname.replace(/checkin-admin\.html$/, '') +
      'checkin.html?event=' + encodeURIComponent(eventId) + '&code=' + encodeURIComponent(code);
  }

  function qrPanelHtml(eventId){
    var evt = eventsById[eventId];
    var session = sessionsById[eventId];
    var now = new Date();

    if (!session){
      return '';
    }

    var isExpired = session.windowEnd <= now;
    var expiryLabel = isExpired
      ? '已於 ' + session.windowEnd.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false }) + ' 過期'
      : '開放至 ' + session.windowEnd.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false });

    return (
      '<div class="qr-panel' + (isExpired ? ' expired-style' : '') + '">' +
        '<div class="staff-bg"></div>' +
        '<div class="qr-panel-inner">' +
          '<div class="qr-status-row">' +
            '<span class="status-chip ' + (isExpired ? 'expired' : 'active') + '">' + (isExpired ? '已過期' : expiryLabel) + '</span>' +
          '</div>' +
          (isExpired ? '' :
            '<div class="qr-wrap"><img src="' + qrDataUrl(checkinUrl(eventId, session.code)) + '" alt="簽到 QR Code"></div>'
          ) +
          '<div class="qr-actions">' +
            '<button type="button" class="btn-reopen" data-reopen="' + eventId + '">' + (isExpired ? '重新開放' : '延長 30 分') + '</button>' +
            '<button type="button" class="btn-regen" data-regen="' + eventId + '">產生新的 QR</button>' +
            '<button type="button" class="btn-end" data-end="' + eventId + '">✕ 結束</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderEventList(){
    var rangeVal = rangeFilter.value;
    var cutoff = rangeVal === 'all' ? -Infinity : Date.now() - Number(rangeVal) * 86400000;

    var ids = Object.keys(eventsById).filter(function(id){
      var evt = eventsById[id];
      if (!evt.date) return false;
      var t = evt.date.getTime();
      return t >= Date.now() || t >= cutoff; // 未來活動一律顯示，篩選只影響過去的邊界
    });

    if (ids.length === 0){
      eventList.innerHTML = '<div class="empty">這個範圍內沒有活動</div>';
      return;
    }

    ids.sort(function(a, b){ return eventsById[b].date.getTime() - eventsById[a].date.getTime(); });

    eventList.innerHTML = ids.map(function(eventId){
      var evt = eventsById[eventId];
      var d = evt.date;
      var dateLabel = d.toLocaleString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false });
      var session = sessionsById[eventId];
      var qrOpen = !!openQrPanels[eventId];
      var attOpen = !!openAttPanels[eventId];

      var qrControl = session
        ? '<button type="button" class="qr-toggle ' + (session.windowEnd > new Date() ? 'active' : 'expired') + '" data-qr-toggle="' + eventId + '" aria-label="簽到 QR Code">' +
            '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/><path d="M14 14h3v3h-3zM19 14h2v2h-2zM14 19h2v2h-2zM19 19h2v2h-2z" fill="currentColor"/></svg>' +
          '</button>'
        : '<button type="button" class="btn-start" data-start="' + eventId + '">產生 QR</button>';

      return (
        '<div class="event-item" data-event="' + eventId + '">' +
          '<div class="event-row">' +
            '<div class="event-date"><div class="d">' + d.getDate() + '</div><div class="m">' + (d.getMonth() + 1) + '月</div></div>' +
            '<div class="event-body">' +
              '<div class="event-title">' + evt.title + typeBadge(evt.type) + '</div>' +
              '<div class="event-meta">' + dateLabel + (evt.location ? ' · ' + evt.location : '') + '</div>' +
            '</div>' +
            qrControl +
          '</div>' +
          '<div class="qr-panel-slot' + (qrOpen ? '' : ' hidden') + '" id="qrPanel-' + eventId + '">' + (session ? qrPanelHtml(eventId) : '') + '</div>' +
          '<button type="button" class="att-toggle' + (attOpen ? ' open' : '') + '" data-att-toggle="' + eventId + '">' +
            '<svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            '簽到名單' +
          '</button>' +
          '<div class="att-panel' + (attOpen ? '' : ' hidden') + '" id="attPanel-' + eventId + '"></div>' +
        '</div>'
      );
    }).join('');

    Object.keys(openAttPanels).forEach(function(eventId){
      if (openAttPanels[eventId] && eventsById[eventId]) loadAttendance(eventId);
    });
  }

  function randomCode(){
    return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }

  async function startSession(eventId){
    await setDoc(doc(db, 'checkinSessions', eventId), {
      code: randomCode(),
      windowEnd: Timestamp.fromMillis(Date.now() + WINDOW_MINUTES * 60000),
      generatedAt: serverTimestamp(),
      generatedBy: currentAdminUid
    });
    openQrPanels[eventId] = true;
  }

  async function reopenSession(eventId){
    var ref = doc(db, 'checkinSessions', eventId);
    var snap = await getDoc(ref);
    if (!snap.exists()){
      await startSession(eventId);
      return;
    }
    await setDoc(ref, {
      windowEnd: Timestamp.fromMillis(Date.now() + WINDOW_MINUTES * 60000),
      generatedAt: serverTimestamp(),
      generatedBy: currentAdminUid
    }, { merge: true });
  }

  async function endSession(eventId){
    await deleteDoc(doc(db, 'checkinSessions', eventId));
    delete openQrPanels[eventId];
  }

  function formatAttTime(checkedInAt, eventDate){
    var label = checkedInAt.toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false });
    if (!eventDate) return { label: label, cls: 'ontime' };
    var lateMinutes = (checkedInAt.getTime() - eventDate.getTime()) / 60000;
    var cls = lateMinutes <= LATE_MINUTES ? 'ontime' : (lateMinutes <= VERY_LATE_MINUTES ? 'late' : 'verylate');
    return { label: label, cls: cls };
  }

  async function ensureApprovedMembers(){
    if (approvedMembers) return approvedMembers;
    var snap = await getDocs(query(collection(db, 'users'), where('status', '==', 'approved')));
    approvedMembers = snap.docs.map(function(docSnap){
      var data = docSnap.data();
      return { uid: docSnap.id, name: data.name, account: data.account };
    });
    return approvedMembers;
  }

  async function loadAttendance(eventId){
    var panel = document.getElementById('attPanel-' + eventId);
    if (!panel) return;
    panel.innerHTML = '<div class="att-empty">載入中…</div>';

    try {
      var snap = await getDocs(query(collection(db, 'checkins'), where('eventId', '==', eventId)));
      var rows = snap.docs.map(function(docSnap){ return Object.assign({ checkinId: docSnap.id }, docSnap.data()); });

      rows.sort(function(a, b){
        var ta = a.checkedInAt && a.checkedInAt.toDate ? a.checkedInAt.toDate().getTime() : 0;
        var tb = b.checkedInAt && b.checkedInAt.toDate ? b.checkedInAt.toDate().getTime() : 0;
        return ta - tb;
      });

      var evt = eventsById[eventId];
      var eventDate = evt ? evt.date : null;
      var checkedInUids = {};
      rows.forEach(function(r){ checkedInUids[r.uid] = true; });

      var rowsHtml = rows.length === 0
        ? '<div class="att-empty">目前還沒有人簽到</div>'
        : '<div class="att-summary"><span>已簽到</span><span>' + rows.length + ' 人</span></div>' +
          rows.map(function(r){
            var checkedInAt = r.checkedInAt && r.checkedInAt.toDate ? r.checkedInAt.toDate() : null;
            var timeInfo = checkedInAt ? formatAttTime(checkedInAt, eventDate) : { label: '—', cls: 'ontime' };
            var methodLabel = r.method === 'manual' ? '手動補登' : '掃碼';
            return (
              '<div class="att-row">' +
                '<div style="flex:1;min-width:0;">' +
                  '<div class="att-name">' + (r.name || r.account || '未知') + '</div>' +
                  '<div class="att-sub">' + (r.account || '') + ' · ' + methodLabel + '</div>' +
                '</div>' +
                '<div class="att-time ' + timeInfo.cls + '">' + timeInfo.label + '</div>' +
                '<button type="button" class="att-remove" data-att-remove="' + r.checkinId + '" aria-label="移除">×</button>' +
              '</div>'
            );
          }).join('');

      var members = await ensureApprovedMembers();
      var available = members.filter(function(m){ return !checkedInUids[m.uid]; });
      var addRowHtml = '<div class="att-add-row">' +
        '<select id="attAddSelect-' + eventId + '"' + (available.length === 0 ? ' disabled' : '') + '>' +
        (available.length === 0
          ? '<option>所有已核准團員都簽到了</option>'
          : available.map(function(m){ return '<option value="' + m.uid + '">' + m.name + '（' + m.account + '）</option>'; }).join('')) +
        '</select>' +
        '<button type="button" data-att-add="' + eventId + '"' + (available.length === 0 ? ' disabled' : '') + '>手動新增</button>' +
      '</div>';

      panel.innerHTML = rowsHtml + addRowHtml;
    } catch (err) {
      panel.innerHTML = '<div class="att-empty">載入失敗（' + err.code + '）</div>';
    }
  }

  async function addManualCheckin(eventId, targetUid){
    var member = (approvedMembers || []).find(function(m){ return m.uid === targetUid; });
    if (!member) return;
    var checkinId = eventId + '_' + targetUid;
    await setDoc(doc(db, 'checkins', checkinId), {
      eventId: eventId,
      uid: targetUid,
      account: member.account,
      name: member.name,
      checkedInAt: serverTimestamp(),
      method: 'manual',
      recordedBy: currentAdminUid
    });
  }

  eventList.addEventListener('click', function(e){
    var startBtn = e.target.closest('[data-start]');
    var qrToggle = e.target.closest('[data-qr-toggle]');
    var attToggle = e.target.closest('[data-att-toggle]');
    var reopenBtn = e.target.closest('[data-reopen]');
    var regenBtn = e.target.closest('[data-regen]');
    var endBtn = e.target.closest('[data-end]');
    var addBtn = e.target.closest('[data-att-add]');
    var removeBtn = e.target.closest('[data-att-remove]');
    var img = e.target.closest('.qr-wrap img');

    if (img){
      qrZoomImg.src = img.src;
      qrZoomOverlay.classList.add('active');
      return;
    }

    if (startBtn){
      var startId = startBtn.getAttribute('data-start');
      var evt = eventsById[startId];
      var ok = confirm('確定要幫「' + (evt ? evt.title : '這場活動') + '」開啟簽到嗎？');
      if (!ok) return;
      showListError('');
      startBtn.disabled = true;
      startSession(startId).then(function(){
        renderEventList();
      }).catch(function(err){
        showListError('產生失敗（' + err.code + '）');
        startBtn.disabled = false;
      });
      return;
    }

    if (qrToggle){
      var qrEventId = qrToggle.getAttribute('data-qr-toggle');
      openQrPanels[qrEventId] = !openQrPanels[qrEventId];
      renderEventList();
      return;
    }

    if (attToggle){
      var attEventId = attToggle.getAttribute('data-att-toggle');
      openAttPanels[attEventId] = !openAttPanels[attEventId];
      renderEventList();
      return;
    }

    if (reopenBtn){
      reopenBtn.disabled = true;
      reopenSession(reopenBtn.getAttribute('data-reopen')).then(function(){ renderEventList(); }).catch(function(err){ alert('操作失敗：' + err.code); reopenBtn.disabled = false; });
    }
    if (regenBtn){
      regenBtn.disabled = true;
      startSession(regenBtn.getAttribute('data-regen')).then(function(){ renderEventList(); }).catch(function(err){ alert('操作失敗：' + err.code); regenBtn.disabled = false; });
    }
    if (endBtn){
      endBtn.disabled = true;
      endSession(endBtn.getAttribute('data-end')).then(function(){ renderEventList(); }).catch(function(err){ alert('操作失敗：' + err.code); endBtn.disabled = false; });
    }
    if (addBtn){
      var addEventId = addBtn.getAttribute('data-att-add');
      var select = document.getElementById('attAddSelect-' + addEventId);
      if (!select || !select.value) return;
      addBtn.disabled = true;
      addManualCheckin(addEventId, select.value).then(function(){
        loadAttendance(addEventId);
      }).catch(function(err){
        alert('新增失敗：' + err.code);
        addBtn.disabled = false;
      });
    }
    if (removeBtn){
      var checkinId = removeBtn.getAttribute('data-att-remove');
      var ok2 = confirm('確定要移除這筆簽到紀錄嗎？此動作無法復原。');
      if (!ok2) return;
      var eventIdForRow = checkinId.split('_')[0];
      removeBtn.disabled = true;
      deleteDoc(doc(db, 'checkins', checkinId)).then(function(){
        loadAttendance(eventIdForRow);
      }).catch(function(err){
        alert('移除失敗：' + err.code);
        removeBtn.disabled = false;
      });
    }
  });

  rangeFilter.addEventListener('change', renderEventList);

  var qrZoomOverlay = document.getElementById('qrZoomOverlay');
  var qrZoomImg = document.getElementById('qrZoomImg');

  qrZoomOverlay.addEventListener('click', function(){
    qrZoomOverlay.classList.remove('active');
  });

  requireAdmin().then(function(result){
    if (!result) return;
    currentAdminUid = result.uid;

    document.getElementById('avatarBtn').textContent = result.profile.name ? result.profile.name.charAt(0) : '?';
    document.getElementById('authLoading').classList.add('hidden');
    document.getElementById('appRoot').classList.remove('hidden');
    initAccountMenu(result.profile.name);

    // 活動類型跟活動本身是兩份分開即時更新的資料，先等類型資料到齊過一次才開始畫，
    // 避免類型還沒載入時先顯示原始 ID 的畫面
    var typesLoaded = false;

    subscribeEventTypes(db, function(types){
      eventTypesById = {};
      types.forEach(function(t){ eventTypesById[t.id] = t; });
      typesLoaded = true;
      renderEventList();
    });

    onSnapshot(collection(db, 'events'), function(snap){
      eventsById = {};
      snap.forEach(function(docSnap){
        var data = docSnap.data();
        eventsById[docSnap.id] = {
          title: data.title,
          type: data.type,
          date: data.date && data.date.toDate ? data.date.toDate() : null,
          location: data.location
        };
      });
      if (typesLoaded) renderEventList();
    });

    onSnapshot(collection(db, 'checkinSessions'), function(snap){
      sessionsById = {};
      snap.forEach(function(docSnap){
        var data = docSnap.data();
        sessionsById[docSnap.id] = {
          code: data.code,
          windowEnd: data.windowEnd && data.windowEnd.toDate ? data.windowEnd.toDate() : new Date(0),
          generatedAt: data.generatedAt && data.generatedAt.toDate ? data.generatedAt.toDate() : null
        };
      });
      if (typesLoaded) renderEventList();
    });
  });
</script>
</body>
</html>
