<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>布利歐管樂團｜團員審核</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F2EFE5">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<script src="./pwa-register.js" defer></script>
<style>
  :root{
    --ink:#20242F;
    --ink-soft:#4A4F5C;
    --paper:#F2EFE5;
    --paper-raised:#FBFAF4;
    --line:#DAD3BE;
    --brass:#B8863A;
    --brass-deep:#8F6A2C;
    --burgundy:#7A2331;
    --burgundy-deep:#5C1A26;
    --sage:#5F6E58;
    --sage-bg:#E7EBDF;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-card: 0 1px 2px rgba(32,36,47,.06), 0 8px 24px -12px rgba(32,36,47,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #EFE9D6 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding: 0 0 calc(48px + env(safe-area-inset-bottom));
  }

  button, a, input, textarea{ -webkit-tap-highlight-color: transparent; font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--brass-deep); outline-offset:2px; border-radius:6px; }

  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
  }

  /* ---------- App Bar ---------- */
  .appbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:18px 20px 14px;
  }
  /* 原本這顆按鈕的樣式只靠 admin-nav.js 的 initAdminNav() 注入，要等身分驗證的非同步
     請求回來才會執行，剛進頁面時會先看到瀏覽器原生按鈕外觀（方框）再跳成正確圓形圖示。
     直接在這裡定義同一份樣式，讓按鈕從第一次畫面繪製就是正確樣式 */
  .admin-nav-btn{ width:30px; height:30px; flex:none; border:none; background:none; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer; padding:0; }
  .admin-nav-btn:active{ background:rgba(32,36,47,.06); }
  .mark{ width:38px; height:38px; flex:none; object-fit:cover; border-radius:50%; }
  .brandtext{ display:flex; flex-direction:column; line-height:1.1; }
  .brandtext .name{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:19px;
    letter-spacing:.02em;
  }
  .brandtext .sub{
    font-family:'Roboto Mono',monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    color:var(--ink-soft);
    margin-top:3px;
    text-transform:uppercase;
  }
  .appbar .spacer{ flex:1; }
  .back-btn{
    width:30px; height:30px; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); text-decoration:none;
  }
  .brand-link{ display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }

  /* ---------- Staff-line divider ---------- */
  .staff{
    height:16px;
    margin:0 20px 6px;
    background-image: repeating-linear-gradient(
      var(--line), var(--line) 1px, transparent 1px, transparent 4px
    );
    opacity:.9;
  }


  /* ---------- Section label ---------- */
  .section-label{
    display:flex; align-items:baseline; gap:8px;
    margin:20px 20px 4px;
  }
  .section-label .tw{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:15.5px;
  }
  .section-label .en{
    font-family:'Roboto Mono',monospace;
    font-size:10px;
    letter-spacing:.12em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }

  .lede{
    margin:6px 20px 0;
    font-size:12.5px;
    line-height:1.6;
    color:var(--ink-soft);
  }
  #tabNote{ margin-bottom:14px; }

  /* ---------- Segmented filter ---------- */
  .segmented{
    display:flex;
    margin:16px 20px 14px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    box-shadow:var(--shadow-card);
  }
  .segmented button{
    flex:1;
    border:none;
    background:none;
    padding:9px 4px;
    border-radius:999px;
    font-weight:700;
    font-size:12px;
    color:var(--ink-soft);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .segmented button .count{
    font-family:'Roboto Mono',monospace;
    font-weight:600;
    font-size:10.5px;
    padding:1px 6px;
    border-radius:999px;
    background:var(--paper);
    color:var(--ink-soft);
  }
  .segmented button.active{ background:var(--ink); color:var(--paper); }
  .segmented button.active .count{ background:rgba(242,239,229,.16); color:var(--paper); }

  /* ---------- Review list ---------- */
  .list{
    margin:0 20px 24px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .item{
    padding:16px;
  }
  .item + .item{ border-top:1px solid var(--line); }

  .item-top{
    display:flex; align-items:flex-start; gap:12px;
  }
  .icon-remove{
    flex:none;
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-size:12px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease, color .12s ease;
  }
  .icon-remove:active{ transform:scale(.92); background:#F6EDEE; color:var(--burgundy-deep); }
  .avatar{
    flex:none;
    width:38px; height:38px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px;
    border:2px solid var(--paper);
    box-shadow:0 0 0 1.5px var(--line);
  }
  #avatarBtn{ padding:0; cursor:pointer; }
  .item-id{ flex:1; min-width:0; }
  .item-name{
    font-weight:700; font-size:14.5px; color:var(--ink);
    display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  }
  .item-account{
    font-family:'Roboto Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .status-tag{
    font-family:'Roboto Mono',monospace;
    font-size:9.5px; letter-spacing:.05em;
    padding:1.5px 7px; border-radius:5px;
    font-weight:600;
    flex:none;
  }
  .status-tag.pending{ background:#F2E7D2; color:var(--brass-deep); }
  .status-tag.approved{ background:var(--sage-bg); color:var(--sage); }
  .status-tag.rejected{ background:#EFE1E3; color:var(--burgundy-deep); }

  .item-instruments{
    display:flex; flex-wrap:wrap; gap:6px;
    margin:10px 0 0 50px;
  }
  .tag-chip{
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:999px;
    padding:3px 10px;
    font-size:11px;
    color:var(--ink-soft);
  }

  .item-meta{
    margin:8px 0 0 50px;
    font-family:'Roboto Mono',monospace;
    font-size:10.5px;
    color:var(--ink-soft);
  }

  .item-actions{
    display:flex; gap:8px;
    margin:12px 0 0 50px;
  }
  .btn-approve, .btn-reject{
    flex:1;
    border-radius:var(--radius-sm);
    padding:10px 0;
    font-weight:700;
    font-size:12.5px;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .btn-approve{
    background:var(--brass);
    color:var(--ink);
    border:none;
  }
  .btn-approve:active{ transform:scale(.97); background:var(--brass-deep); }
  .btn-reject{
    background:none;
    border:1px solid var(--line);
    color:var(--burgundy-deep);
  }
  .btn-reject:active{ transform:scale(.97); background:#F6EDEE; }

  /* ---------- Empty state ---------- */
  .empty{
    padding:44px 20px;
    text-align:center;
  }
  .empty .ico{ width:34px; height:34px; opacity:.35; margin-bottom:10px; }
  .empty .txt{ font-size:13px; color:var(--ink-soft); }

  .list-error{
    margin:0 20px 14px;
    font-size:12.5px;
    color:var(--burgundy);
    background:#FBF3F3;
    border:1px solid #EFD4D8;
    border-radius:var(--radius-sm);
    padding:10px 12px;
    display:none;
  }
  .list-error.show{ display:block; }

  .hidden{ display:none !important; }

  /* ---------- Skeleton placeholders ---------- */
  @keyframes skel-pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  .skel{ background:var(--line); animation:skel-pulse 1.4s ease-in-out infinite; }
  .avatar.skel{ animation:skel-pulse 1.4s ease-in-out infinite; }
  .count.skel{ color:transparent; }
  .skel-bar{ display:inline-block; border-radius:5px; }
  @media (prefers-reduced-motion: reduce){
    .skel, .avatar.skel{ animation:none; opacity:.75; }
  }
  .item-skel-top{ display:flex; align-items:center; gap:12px; }
  .item-skel-avatar{ flex:none; width:38px; height:38px; border-radius:50%; }
  .item-skel-lines{ flex:1; display:flex; flex-direction:column; gap:7px; }
</style>
</head>
<body>
<div class="app" id="appRoot">

  <!-- App Bar -->
  <div class="appbar">
    <button class="admin-nav-btn" id="adminNavBtn" type="button" aria-label="開啟後台導覽選單">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="back-btn" href="admin-index.html" aria-label="回控制台首頁">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="brand-link" href="index.html">
      <img class="mark" src="assets/BrioLogo.jpg" alt="布利歐管樂團 Logo">
      <div class="brandtext">
        <div class="name">布利歐管樂團</div>
        <div class="sub">Brio Wind Band</div>
      </div>
    </a>
    <div class="spacer"></div>
    <button class="avatar skel" id="avatarBtn" type="button" aria-label="帳號選單"></button>
  </div>

  <div class="staff"></div>

  <div class="section-label">
    <span class="tw">團員審核</span>
    <span class="en">Member Approval</span>
  </div>
  <p class="lede">審核新申請帳號的團員，確認身份與樂器/聲部後即可核准。</p>

  <div class="segmented">
    <button type="button" class="active" data-status="pending">待審核 <span class="count skel" id="countPending">0</span></button>
    <button type="button" data-status="approved">已核准 <span class="count skel" id="countApproved">0</span></button>
    <button type="button" data-status="rejected">已拒絕 <span class="count skel" id="countRejected">0</span></button>
  </div>

  <p class="lede" id="tabNote"></p>
  <p class="list-error" id="listError"></p>

  <div class="list" id="listContainer"></div>

</div>

<script type="module">
  import { initAdminNav } from './admin-nav.js';
  import { requireAdmin, peekCachedProfile } from './auth-guard.js';
  import { db } from './firebase-init.js';
  import { initAccountMenu } from './account-menu.js';
  import {
    collection, query, where, onSnapshot,
    doc, updateDoc, deleteDoc, serverTimestamp, Timestamp
  } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  var APPROVED_WINDOW_DAYS = 30;
  var REJECTED_TTL_DAYS = 30;

  var applicantsByStatus = { pending: [], approved: [], rejected: [] };
  var statusLoaded = { pending: false, approved: false, rejected: false };
  var currentTab = 'pending';
  var currentAdminUid = null;

  var SKELETON_ITEMS_HTML = [1, 2, 3].map(function(){
    return (
      '<div class="item">' +
        '<div class="item-skel-top">' +
          '<span class="skel item-skel-avatar"></span>' +
          '<div class="item-skel-lines">' +
            '<span class="skel skel-bar" style="width:55%;height:13px;"></span>' +
            '<span class="skel skel-bar" style="width:35%;height:10px;"></span>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }).join('');

  var cachedProfile = peekCachedProfile();
  if (cachedProfile && cachedProfile.name){
    var avatarBtnEl = document.getElementById('avatarBtn');
    avatarBtnEl.textContent = cachedProfile.name.charAt(0);
    avatarBtnEl.classList.remove('skel');
  }

  var listContainer = document.getElementById('listContainer');
  var tabNote = document.getElementById('tabNote');
  var listError = document.getElementById('listError');
  listContainer.innerHTML = SKELETON_ITEMS_HTML;

  function initial(name){ return name ? name.charAt(0) : '?'; }

  function toDate(ts){ return ts && ts.toDate ? ts.toDate() : null; }

  function relativeTime(date){
    if (!date) return '—';
    var minutes = Math.floor((Date.now() - date.getTime()) / 60000);
    if (minutes < 1) return '剛剛';
    if (minutes < 60) return minutes + ' 分鐘前';
    var hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + ' 小時前';
    var days = Math.floor(hours / 24);
    if (days === 1) return '昨天';
    if (days < 7) return days + ' 天前';
    return Math.floor(days / 7) + ' 週前';
  }

  function daysSince(date){
    if (!date) return Infinity;
    return Math.floor((Date.now() - date.getTime()) / 86400000);
  }

  function showListError(message){
    listError.textContent = message;
    listError.classList.toggle('show', !!message);
  }

  function statusLabel(status){
    if (status === 'pending') return { text:'待審核', cls:'pending' };
    if (status === 'approved') return { text:'已核准', cls:'approved' };
    return { text:'已拒絕', cls:'rejected' };
  }

  var TAB_NOTES = {
    pending: '',
    approved: '僅顯示最近 ' + APPROVED_WINDOW_DAYS + ' 天內核准的申請。',
    rejected: '已拒絕的申請將於 30 天後自動清除，也可點右上角 ✕ 立即移除。'
  };

  function subscribeStatus(status){
    var q = query(collection(db, 'users'), where('status', '==', status));
    onSnapshot(q, function(snap){
      var rows = [];
      snap.forEach(function(docSnap){
        var data = docSnap.data();
        rows.push({
          id: docSnap.id,
          account: data.account,
          name: data.name,
          instruments: data.instruments || [],
          createdAt: toDate(data.createdAt),
          approvedAt: toDate(data.approvedAt),
          status: data.status
        });
      });
      rows.sort(function(a, b){
        var ta = a.createdAt ? a.createdAt.getTime() : 0;
        var tb = b.createdAt ? b.createdAt.getTime() : 0;
        return tb - ta;
      });
      applicantsByStatus[status] = rows;
      statusLoaded[status] = true;
      render();
    }, function(error){
      showListError('讀取' + statusLabel(status).text + '清單失敗（' + error.code + '）');
    });
  }

  function updateCounts(){
    if (statusLoaded.pending){
      var pendingEl = document.getElementById('countPending');
      pendingEl.classList.remove('skel');
      pendingEl.textContent = applicantsByStatus.pending.length;
    }
    if (statusLoaded.approved){
      var approvedEl = document.getElementById('countApproved');
      approvedEl.classList.remove('skel');
      approvedEl.textContent = applicantsByStatus.approved.filter(function(a){ return daysSince(a.approvedAt) <= APPROVED_WINDOW_DAYS; }).length;
    }
    if (statusLoaded.rejected){
      var rejectedEl = document.getElementById('countRejected');
      rejectedEl.classList.remove('skel');
      rejectedEl.textContent = applicantsByStatus.rejected.length;
    }
  }

  function render(){
    updateCounts();
    tabNote.textContent = TAB_NOTES[currentTab];

    if (!statusLoaded[currentTab]){
      listContainer.innerHTML = SKELETON_ITEMS_HTML;
      return;
    }

    var rows = applicantsByStatus[currentTab].filter(function(a){
      if (currentTab === 'approved') return daysSince(a.approvedAt) <= APPROVED_WINDOW_DAYS;
      return true;
    });

    if (rows.length === 0){
      listContainer.innerHTML =
        '<div class="empty">' +
          '<svg class="ico" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4" stroke="#20242F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="#20242F" stroke-width="1.4"/></svg>' +
          '<div class="txt">目前沒有' + statusLabel(currentTab).text + '的申請</div>' +
        '</div>';
      return;
    }

    listContainer.innerHTML = rows.map(function(a){
      var tag = statusLabel(a.status);
      var tagsHtml = a.instruments.map(function(name){ return '<span class="tag-chip">' + name + '</span>'; }).join('');
      var removeIconHtml = a.status === 'rejected'
        ? '<button type="button" class="icon-remove" data-remove="' + a.id + '" aria-label="立即移除">' +
            '<svg viewBox="0 0 24 24" fill="none" width="12" height="12"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>' +
          '</button>'
        : '';
      var actionsHtml = '';
      if (a.status === 'pending'){
        actionsHtml =
          '<div class="item-actions">' +
            '<button type="button" class="btn-approve" data-approve="' + a.id + '">核准</button>' +
            '<button type="button" class="btn-reject" data-reject="' + a.id + '">拒絕</button>' +
          '</div>';
      }

      return (
        '<div class="item" data-id="' + a.id + '">' +
          '<div class="item-top">' +
            '<span class="avatar">' + initial(a.name) + '</span>' +
            '<div class="item-id">' +
              '<div class="item-name">' + a.name + '<span class="status-tag ' + tag.cls + '">' + tag.text + '</span></div>' +
              '<div class="item-account">@' + a.account + '</div>' +
            '</div>' +
            removeIconHtml +
          '</div>' +
          '<div class="item-instruments">' + tagsHtml + '</div>' +
          '<div class="item-meta">申請時間 · ' + relativeTime(a.createdAt) + '</div>' +
          actionsHtml +
        '</div>'
      );
    }).join('');
  }

  document.querySelectorAll('.segmented button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.segmented button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      currentTab = btn.getAttribute('data-status');
      render();
    });
  });

  async function approveApplicant(uid){
    await updateDoc(doc(db, 'users', uid), {
      status: 'approved',
      approvedAt: serverTimestamp(),
      approvedBy: currentAdminUid
    });
  }

  async function rejectApplicant(uid){
    var expiresAt = Timestamp.fromMillis(Date.now() + REJECTED_TTL_DAYS * 86400000);
    await updateDoc(doc(db, 'users', uid), {
      status: 'rejected',
      expiresAt: expiresAt
    });
  }

  async function removeApplicant(uid){
    await deleteDoc(doc(db, 'users', uid));
  }

  listContainer.addEventListener('click', function(e){
    var approveBtn = e.target.closest('[data-approve]');
    var rejectBtn = e.target.closest('[data-reject]');
    var removeBtn = e.target.closest('[data-remove]');

    showListError('');

    if (approveBtn){
      approveBtn.disabled = true;
      approveApplicant(approveBtn.getAttribute('data-approve')).catch(function(error){
        showListError('核准失敗（' + error.code + '）');
        approveBtn.disabled = false;
      });
    }
    if (rejectBtn){
      rejectBtn.disabled = true;
      rejectApplicant(rejectBtn.getAttribute('data-reject')).catch(function(error){
        showListError('拒絕失敗（' + error.code + '）');
        rejectBtn.disabled = false;
      });
    }
    if (removeBtn){
      removeBtn.disabled = true;
      removeApplicant(removeBtn.getAttribute('data-remove')).catch(function(error){
        showListError('移除失敗（' + error.code + '）');
        removeBtn.disabled = false;
      });
    }
  });

  requireAdmin().then(function(result){
    if (!result) return; // 未通過驗證，requireAdmin 已經處理導轉
    var profile = result.profile;
    currentAdminUid = result.uid;

    var avatarBtn = document.getElementById('avatarBtn');
    avatarBtn.textContent = profile.name ? profile.name.charAt(0) : '?';
    avatarBtn.classList.remove('skel');

    initAccountMenu(profile.name);
    initAdminNav('review');

    subscribeStatus('pending');
    subscribeStatus('approved');
    subscribeStatus('rejected');
  });
</script>
</body>
</html>
