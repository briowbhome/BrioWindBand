<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>布利歐管樂團｜控制台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F2EFE5">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<script src="./pwa-register.js" defer></script>
<script src="./pull-refresh.js" defer></script>
<style>
  :root{
    --ink:#20242F;
    --ink-soft:#4A4F5C;
    --paper:#F2EFE5;
    --paper-raised:#FBFAF4;
    --line:#DAD3BE;
    --brass:#B8863A;
    --brass-deep:#8F6A2C;
    --burgundy:#7A2331;
    --burgundy-deep:#5C1A26;
    --sage:#5F6E58;
    --sage-bg:#E7EBDF;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-card: 0 1px 2px rgba(32,36,47,.06), 0 8px 24px -12px rgba(32,36,47,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #EFE9D6 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding: 0 0 calc(48px + env(safe-area-inset-bottom));
  }

  button, a{ -webkit-tap-highlight-color: transparent; font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--brass-deep); outline-offset:2px; border-radius:6px; }

  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
  }

  .hidden{ display:none !important; }

  /* ---------- Skeleton placeholders ---------- */
  @keyframes skel-pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  .avatar.skel{ background:var(--line); animation:skel-pulse 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){
    .avatar.skel{ animation:none; opacity:.75; }
  }

  .appbar{ display:flex; align-items:center; gap:12px; padding:18px 20px 14px; }
  .mark{ width:38px; height:38px; flex:none; object-fit:cover; border-radius:50%; }
  .brandtext{ display:flex; flex-direction:column; line-height:1.1; }
  .brandtext .name{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:19px; letter-spacing:.02em; }
  .brandtext .sub{ font-family:'Roboto Mono',monospace; font-size:10.5px; letter-spacing:.14em; color:var(--ink-soft); margin-top:3px; text-transform:uppercase; }
  .appbar .spacer{ flex:1; }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px;
    border:2px solid var(--paper-raised); box-shadow:0 0 0 1.5px var(--line);
    padding:0; cursor:pointer;
  }

  .back-btn{
    width:30px; height:30px; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); text-decoration:none;
  }
  .brand-link{ display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }

  .staff{
    height:16px; margin:0 20px 6px;
    background-image: repeating-linear-gradient(var(--line), var(--line) 1px, transparent 1px, transparent 4px);
    opacity:.9;
  }

  .section-label{ display:flex; align-items:baseline; gap:8px; margin:20px 20px 4px; }
  .section-label .tw{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:15.5px; }
  .section-label .en{ font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }
  .lede{ margin:6px 20px 0; font-size:12.5px; line-height:1.6; color:var(--ink-soft); }

  /* ---------- Dashboard cards（分組，資料來自 admin-pages.js） ---------- */
  .group-label{ display:flex; align-items:center; gap:10px; margin:22px 20px 10px; }
  .group-label:first-child{ margin-top:4px; }
  .group-label .g-tw{ font-family:'Noto Sans TC','Noto Sans',sans-serif; font-weight:700; font-size:13px; color:var(--ink); }
  .group-label .g-en{ font-family:'Roboto Mono',monospace; font-size:9.5px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }
  .group-staff{
    flex:1; height:12px;
    background-image: repeating-linear-gradient(var(--line), var(--line) 1px, transparent 1px, transparent 4px);
    opacity:.75;
  }
  .dash-container{ padding-bottom:14px; }
  .dash-grid{ display:flex; flex-direction:column; gap:12px; margin:0 20px; }
  .dash-card{
    display:flex; align-items:center; gap:14px;
    background:var(--paper-raised); border:1px solid var(--line);
    border-radius:var(--radius-lg); box-shadow:var(--shadow-card);
    padding:18px 16px; text-decoration:none; color:var(--ink);
  }
  .dash-card:active{ background:var(--sage-bg); }
  .dash-icon{
    width:46px; height:46px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .dash-icon.sage{ background:var(--sage-bg); color:var(--sage); }
  .dash-icon.brass{ background:#EFE7D2; color:var(--brass-deep); }
  .dash-icon.burgundy{ background:var(--burgundy); color:#F2EFE5; }
  .dash-icon.navy{ background:#E4E9F2; color:#33507D; }
  .dash-icon.plum{ background:#F0E3EE; color:#7C3F6C; }
  .dash-icon.teal{ background:#DFF0ED; color:#2E7268; }
  .dash-icon.mustard{ background:#F7EACD; color:#8F6D12; }
  .dash-icon.rose{ background:#F5E1E4; color:#9C4A5C; }
  .dash-body{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .dash-title{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:15px; }
  .dash-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .dash-arrow{ flex:none; color:var(--ink-soft); }
</style>
</head>
<body>
<div class="app" id="appRoot">

  <div class="appbar">
    <a class="back-btn" href="index.html" aria-label="回團員首頁">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 11 12 4l8 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </a>
    <a class="brand-link" href="index.html">
      <img class="mark" src="assets/BrioLogo.jpg" alt="布利歐管樂團 Logo">
      <div class="brandtext">
        <div class="name">布利歐管樂團</div>
        <div class="sub">Brio Wind Band</div>
      </div>
    </a>
    <div class="spacer"></div>
    <button class="avatar skel" id="avatarBtn" type="button" aria-label="帳號選單"></button>
  </div>

  <div class="staff"></div>

  <div class="section-label">
    <span class="tw">控制台</span>
    <span class="en">Console</span>
  </div>
  <p class="lede">選擇要管理的項目。</p>

  <div class="dash-container" id="dashContainer"></div>

</div>

<script type="module">
  import { requireAdmin, peekCachedProfile } from './auth-guard.js';
  import { initAccountMenu } from './account-menu.js';
  import { GROUPS, PAGES } from './admin-pages.js';

  document.getElementById('dashContainer').innerHTML = GROUPS.map(function(g){
    var cardsHtml = PAGES.filter(function(p){ return p.group === g.key; }).map(function(p){
      return (
        '<a class="dash-card" href="' + p.href + '">' +
          '<span class="dash-icon ' + p.color + '">' +
            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none">' + p.icon + '</svg>' +
          '</span>' +
          '<span class="dash-body">' +
            '<span class="dash-title">' + p.label + '</span>' +
            '<span class="dash-sub">' + p.sub + '</span>' +
          '</span>' +
          '<svg class="dash-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</a>'
      );
    }).join('');
    return (
      '<div class="group-label"><span class="g-tw">' + g.label + '</span><span class="g-en">' + g.en + '</span><span class="group-staff"></span></div>' +
      '<div class="dash-grid">' + cardsHtml + '</div>'
    );
  }).join('');

  var cachedProfile = peekCachedProfile();
  if (cachedProfile && cachedProfile.name){
    var avatarBtnEl = document.getElementById('avatarBtn');
    avatarBtnEl.textContent = cachedProfile.name.charAt(0);
    avatarBtnEl.classList.remove('skel');
  }

  requireAdmin().then(function(result){
    if (!result) return;

    var avatarBtn = document.getElementById('avatarBtn');
    avatarBtn.textContent = result.profile.name ? result.profile.name.charAt(0) : '?';
    avatarBtn.classList.remove('skel');
    initAccountMenu(result.profile.name);
  });
</script>
</body>
</html>
