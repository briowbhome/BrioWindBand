<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>布利歐管樂團｜成員資料</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F2EFE5">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<script src="./pwa-register.js" defer></script>
<style>
  :root{
    --ink:#20242F;
    --ink-soft:#4A4F5C;
    --paper:#F2EFE5;
    --paper-raised:#FBFAF4;
    --line:#DAD3BE;
    --brass:#B8863A;
    --brass-deep:#8F6A2C;
    --burgundy:#7A2331;
    --burgundy-deep:#5C1A26;
    --sage:#5F6E58;
    --sage-bg:#E7EBDF;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-card: 0 1px 2px rgba(32,36,47,.06), 0 8px 24px -12px rgba(32,36,47,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #EFE9D6 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding: 0 0 calc(48px + env(safe-area-inset-bottom));
  }

  button, a, input{ -webkit-tap-highlight-color: transparent; font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--brass-deep); outline-offset:2px; border-radius:6px; }

  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
  }

  .hidden{ display:none !important; }

  /* ---------- Skeleton placeholders ---------- */
  @keyframes skel-pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  .skel{ background:var(--line); animation:skel-pulse 1.4s ease-in-out infinite; }
  .avatar.skel{ animation:skel-pulse 1.4s ease-in-out infinite; }
  .count.skel{ color:transparent; }
  .skel-bar{ display:inline-block; border-radius:5px; }
  @media (prefers-reduced-motion: reduce){
    .skel, .avatar.skel{ animation:none; opacity:.75; }
  }
  .m-skel-lines{ flex:1; display:flex; flex-direction:column; gap:7px; padding-top:2px; }

  .appbar{ display:flex; align-items:center; gap:12px; padding:18px 20px 14px; }
  .mark{ width:38px; height:38px; flex:none; object-fit:cover; border-radius:50%; }
  .brandtext{ display:flex; flex-direction:column; line-height:1.1; }
  .brandtext .name{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:19px; letter-spacing:.02em; }
  .brandtext .sub{ font-family:'Roboto Mono',monospace; font-size:10.5px; letter-spacing:.14em; color:var(--ink-soft); margin-top:3px; text-transform:uppercase; }
  .appbar .spacer{ flex:1; }
  .back-btn{
    width:30px; height:30px; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); text-decoration:none;
  }
  .brand-link{ display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px;
    border:2px solid var(--paper-raised); box-shadow:0 0 0 1.5px var(--line);
    padding:0; cursor:pointer;
  }

  .staff{
    height:16px; margin:0 20px 6px;
    background-image: repeating-linear-gradient(var(--line), var(--line) 1px, transparent 1px, transparent 4px);
    opacity:.9;
  }


  .section-label{ display:flex; align-items:baseline; gap:8px; margin:20px 20px 4px; }
  .section-label .tw{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:15.5px; }
  .section-label .en{ font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }
  .lede{ margin:6px 20px 14px; font-size:12.5px; line-height:1.6; color:var(--ink-soft); }

  /* ---------- Search + filter ---------- */
  .search-row{ margin:0 20px 12px; position:relative; }
  .search-row input{
    width:100%; border:1px solid var(--line); background:var(--paper-raised);
    border-radius:999px; padding:10px 14px 10px 38px; font-size:13px; color:var(--ink);
  }
  .search-row input::placeholder{ color:#B4AD97; }
  .search-row svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.5; }

  .segmented{ display:flex; gap:6px; margin:0 20px 16px; overflow-x:auto; padding-bottom:2px; }
  .segmented::-webkit-scrollbar{ display:none; }
  .seg-btn{
    flex:none; border:1px solid var(--line); background:var(--paper-raised);
    padding:7px 13px; border-radius:999px; font-weight:700; font-size:11.5px; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px; cursor:pointer;
  }
  .seg-btn .count{
    font-family:'Roboto Mono',monospace; font-weight:600; font-size:10px;
    padding:1px 6px; border-radius:999px; background:var(--paper); color:var(--ink-soft);
  }
  .seg-btn.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .seg-btn.active .count{ background:rgba(242,239,229,.16); color:var(--paper); }

  /* ---------- Member list ---------- */
  .list{
    margin:0 20px 24px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .m-row{ padding:13px 16px; display:flex; gap:12px; }
  .m-row + .m-row{ border-top:1px solid var(--line); }
  .m-avatar{
    flex:none; width:36px; height:36px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:13.5px;
  }
  .m-body{ flex:1; min-width:0; }
  .m-top{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .m-name{ font-weight:700; font-size:14px; color:var(--ink); }
  .role-badge{
    font-family:'Roboto Mono',monospace; font-size:9px; font-weight:700;
    padding:2.5px 8px; border-radius:999px; flex:none; letter-spacing:.02em;
  }
  .role-badge.owner{ background:var(--ink); color:var(--paper); }
  .role-badge.admin{ background:var(--burgundy); color:#F2EFE5; }
  .role-badge.conductor{ background:#EFE7D2; color:var(--brass-deep); }
  .role-badge.member{ background:var(--sage-bg); color:var(--sage); }
  .section-badge{
    font-family:'Roboto Mono',monospace; font-size:9px; font-weight:600;
    padding:2.5px 8px; border-radius:999px; background:var(--paper); border:1px solid var(--line); color:var(--brass-deep);
  }
  .m-account{ font-family:'Roboto Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-top:2px; }

  .m-instruments{ display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .tag-chip{
    border:1px solid var(--line); background:var(--paper); border-radius:999px;
    padding:3px 9px; font-size:10.5px; color:var(--ink-soft);
  }

  .m-meta{
    display:flex; flex-wrap:wrap; column-gap:14px; row-gap:4px;
    margin-top:8px; font-family:'Roboto Mono',monospace; font-size:10.5px; color:var(--ink-soft);
  }
  .m-meta span{ display:inline-flex; align-items:center; gap:4px; }
  .m-meta svg{ opacity:.55; flex:none; }

  .empty{ padding:40px 20px; text-align:center; font-size:13px; color:var(--ink-soft); }
</style>
</head>
<body>
<div class="app" id="appRoot">

  <div class="appbar">
    <button class="admin-nav-btn" id="adminNavBtn" type="button" aria-label="開啟後台導覽選單">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="back-btn" href="admin-index.html" aria-label="回控制台首頁">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="brand-link" href="index.html">
      <img class="mark" src="assets/BrioLogo.jpg" alt="布利歐管樂團 Logo">
      <div class="brandtext">
        <div class="name">布利歐管樂團</div>
        <div class="sub">Brio Wind Band</div>
      </div>
    </a>
    <div class="spacer"></div>
    <button class="avatar skel" id="avatarBtn" type="button" aria-label="帳號選單"></button>
  </div>

  <div class="staff"></div>

  <div class="section-label">
    <span class="tw">成員資料</span>
    <span class="en">Members</span>
  </div>
  <p class="lede">檢視全部成員資料。此頁僅供檢視，調整角色/權限/樂器請至「權限管理」。</p>

  <div class="search-row">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#4A4F5C" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="#4A4F5C" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input type="text" id="searchInput" placeholder="搜尋姓名、帳號或樂器/聲部">
  </div>

  <div class="segmented" id="roleFilter">
    <button type="button" class="seg-btn active" data-role="all">全部 <span class="count skel" id="cAll">0</span></button>
    <button type="button" class="seg-btn" data-role="admin">管理員 <span class="count skel" id="cAdmin">0</span></button>
    <button type="button" class="seg-btn" data-role="conductor">指揮 <span class="count skel" id="cConductor">0</span></button>
    <button type="button" class="seg-btn" data-role="member">團員 <span class="count skel" id="cMember">0</span></button>
  </div>

  <div class="list" id="memberList"></div>

</div>

<script type="module">
  import { initAdminNav } from './admin-nav.js';
  import { requireAdmin, peekCachedProfile } from './auth-guard.js';
  import { db } from './firebase-init.js';
  import { initAccountMenu } from './account-menu.js';
  import { collection, query, where, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  var ROLE_LABELS = { member: '團員', conductor: '指揮', admin: '管理員', owner: 'Owner' };
  var ROLE_WEIGHT = { owner: 0, admin: 1, conductor: 2, member: 3 };

  var membersById = {};
  var membersLoaded = false;
  var currentRole = 'all';
  var currentQuery = '';

  var SKELETON_ROWS_HTML = [1, 2, 3, 4].map(function(){
    return (
      '<div class="m-row">' +
        '<span class="skel m-avatar" style="background:var(--line);"></span>' +
        '<div class="m-skel-lines">' +
          '<span class="skel skel-bar" style="width:45%;height:13px;"></span>' +
          '<span class="skel skel-bar" style="width:60%;height:10px;"></span>' +
        '</div>' +
      '</div>'
    );
  }).join('');

  var cachedProfile = peekCachedProfile();
  if (cachedProfile && cachedProfile.name){
    var avatarBtnEl = document.getElementById('avatarBtn');
    avatarBtnEl.textContent = cachedProfile.name.charAt(0);
    avatarBtnEl.classList.remove('skel');
  }

  var memberList = document.getElementById('memberList');
  memberList.innerHTML = SKELETON_ROWS_HTML;

  function initial(name){ return name ? name.charAt(0) : '?'; }

  function formatBirthday(iso){
    if (!iso) return null;
    var parts = iso.split('-');
    if (parts.length !== 3) return iso;
    return parts[0] + '/' + parts[1] + '/' + parts[2];
  }

  function updateCounts(){
    if (!membersLoaded) return;
    var all = Object.keys(membersById).map(function(uid){ return membersById[uid]; });
    ['cAll', 'cAdmin', 'cConductor', 'cMember'].forEach(function(id){
      document.getElementById(id).classList.remove('skel');
    });
    document.getElementById('cAll').textContent = all.length;
    document.getElementById('cAdmin').textContent = all.filter(function(m){ return m.role === 'admin'; }).length;
    document.getElementById('cConductor').textContent = all.filter(function(m){ return m.role === 'conductor'; }).length;
    document.getElementById('cMember').textContent = all.filter(function(m){ return m.role === 'member'; }).length;
  }

  function matchesQuery(m, q){
    if (!q) return true;
    var hay = (m.name + ' ' + m.account + ' ' + m.instruments.join(' ')).toLowerCase();
    return hay.indexOf(q.toLowerCase()) !== -1;
  }

  // 網路壅塞等原因導致監聽失敗時呼叫，清掉骨架屏並明確告知，不要讓畫面卡住不動
  function renderMembersError(){
    memberList.innerHTML = '<div class="empty">讀取失敗，請重新整理再試一次</div>';
  }

  function render(){
    updateCounts();

    if (!membersLoaded){
      memberList.innerHTML = SKELETON_ROWS_HTML;
      return;
    }

    var ids = Object.keys(membersById).filter(function(uid){
      var m = membersById[uid];
      if (currentRole !== 'all' && m.role !== currentRole) return false;
      return matchesQuery(m, currentQuery);
    });

    if (ids.length === 0){
      memberList.innerHTML = '<div class="empty">找不到符合的成員</div>';
      return;
    }

    ids.sort(function(a, b){
      var ra = membersById[a], rb = membersById[b];
      var wa = ROLE_WEIGHT[ra.role] != null ? ROLE_WEIGHT[ra.role] : 9;
      var wb = ROLE_WEIGHT[rb.role] != null ? ROLE_WEIGHT[rb.role] : 9;
      if (wa !== wb) return wa - wb;
      return (ra.name || '').localeCompare(rb.name || '');
    });

    memberList.innerHTML = ids.map(function(uid){
      var m = membersById[uid];
      var instTags = m.instruments.length
        ? m.instruments.map(function(i){ return '<span class="tag-chip">' + i + '</span>'; }).join('')
        : '<span class="tag-chip">—</span>';
      var sectionBadge = m.sectionLeaderFor.length
        ? '<span class="section-badge">分部長 · ' + m.sectionLeaderFor.join('、') + '</span>'
        : '';
      var birthdayLabel = formatBirthday(m.birthday);

      var metaParts = [];
      if (m.phone){
        metaParts.push('<span><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.6 21 3 12.4 3 2c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1L6.6 10.8z" stroke="#4A4F5C" stroke-width="1.4" stroke-linejoin="round"/></svg>' + m.phone + '</span>');
      }
      if (birthdayLabel){
        metaParts.push('<span><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="#4A4F5C" stroke-width="1.6"/><path d="M3 10h18M8 3v4M16 3v4" stroke="#4A4F5C" stroke-width="1.6" stroke-linecap="round"/></svg>' + birthdayLabel + '</span>');
      }
      if (m.licensePlate){
        metaParts.push('<span><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="10" rx="2" stroke="#4A4F5C" stroke-width="1.6"/><path d="M3 11h18" stroke="#4A4F5C" stroke-width="1.6"/></svg>' + m.licensePlate + '</span>');
      }
      var metaHtml = metaParts.length ? '<div class="m-meta">' + metaParts.join('') + '</div>' : '';

      return (
        '<div class="m-row">' +
          '<div class="m-avatar">' + initial(m.name) + '</div>' +
          '<div class="m-body">' +
            '<div class="m-top">' +
              '<span class="m-name">' + (m.name || '—') + '</span>' +
              '<span class="role-badge ' + m.role + '">' + (ROLE_LABELS[m.role] || m.role) + '</span>' +
              sectionBadge +
            '</div>' +
            '<div class="m-account">@' + (m.account || '') + '</div>' +
            '<div class="m-instruments">' + instTags + '</div>' +
            metaHtml +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  document.getElementById('roleFilter').addEventListener('click', function(e){
    var btn = e.target.closest('.seg-btn');
    if (!btn) return;
    document.querySelectorAll('#roleFilter .seg-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    currentRole = btn.getAttribute('data-role');
    render();
  });

  document.getElementById('searchInput').addEventListener('input', function(e){
    currentQuery = e.target.value.trim();
    render();
  });

  requireAdmin().then(function(result){
    if (!result) return;

    var avatarBtn = document.getElementById('avatarBtn');
    avatarBtn.textContent = result.profile.name ? result.profile.name.charAt(0) : '?';
    avatarBtn.classList.remove('skel');
    initAccountMenu(result.profile.name);
    initAdminNav('members');

    onSnapshot(query(collection(db, 'users'), where('status', '==', 'approved')), function(snap){
      membersById = {};
      snap.forEach(function(docSnap){
        var data = docSnap.data();
        membersById[docSnap.id] = {
          name: data.name,
          account: data.account,
          role: data.role,
          instruments: data.instruments || [],
          phone: data.phone || null,
          birthday: data.birthday || null,
          licensePlate: data.licensePlate || null,
          sectionLeaderFor: data.sectionLeaderFor || []
        };
      });
      membersLoaded = true;
      render();
    }, renderMembersError);
  });
</script>
</body>
</html>
