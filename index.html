<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>布利歐管樂團｜首頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F2EFE5">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<script src="./pwa-register.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --ink:#20242F;
    --ink-soft:#4A4F5C;
    --paper:#F2EFE5;
    --paper-raised:#FBFAF4;
    --line:#DAD3BE;
    --brass:#B8863A;
    --brass-deep:#8F6A2C;
    --burgundy:#7A2331;
    --burgundy-deep:#5C1A26;
    --sage:#5F6E58;
    --sage-bg:#E7EBDF;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-card: 0 1px 2px rgba(32,36,47,.06), 0 8px 24px -12px rgba(32,36,47,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #EFE9D6 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
  }

  button, a{ -webkit-tap-highlight-color: transparent; font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--brass-deep); outline-offset:2px; border-radius:6px; }

  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
  }

  /* ---------- App Bar ---------- */
  .appbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:18px 20px 14px;
  }
  .mark{ width:38px; height:38px; flex:none; object-fit:cover; border-radius:50%; }
  .brandtext{ display:flex; flex-direction:column; line-height:1.1; }
  .brandtext .name{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:19px;
    letter-spacing:.02em;
  }
  .brandtext .sub{
    font-family:'Roboto Mono',monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    color:var(--ink-soft);
    margin-top:3px;
    text-transform:uppercase;
  }
  .appbar .spacer{ flex:1; }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px;
    border:2px solid var(--paper-raised);
    box-shadow:0 0 0 1.5px var(--line);
    padding:0; cursor:pointer;
  }

  /* ---------- Staff-line divider (signature motif) ---------- */
  .staff{
    height:16px;
    margin:0 20px 6px;
    background-image: repeating-linear-gradient(
      var(--line), var(--line) 1px, transparent 1px, transparent 4px
    );
    opacity:.9;
  }

  /* ---------- Announcement ticker ---------- */
  .ticker-wrap{ margin:2px 20px 18px; }
  .ticker{
    background:var(--ink);
    color:#F2EFE5;
    border-radius:var(--radius-md);
    padding:12px 14px;
    display:flex;
    align-items:flex-start;
    gap:10px;
    box-shadow:var(--shadow-card);
  }
  .announce-list{
    margin-top:8px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    overflow:hidden;
  }
  .announce-item{ padding:10px 14px; font-size:12.5px; color:var(--ink); line-height:1.6; white-space:pre-wrap; }
  .announce-item + .announce-item{ border-top:1px solid var(--line); }
  .announce-item .t{ margin-top:4px; font-size:10.5px; color:var(--ink-soft); font-family:'Roboto Mono',monospace; }
  .ticker .ico{
    flex:none; width:20px; height:20px; margin-top:1px;
  }
  .ticker .body{ flex:1; min-width:0; }
  .ticker .headline{
    font-size:13.5px; font-weight:500; line-height:1.5;
  }
  .ticker .meta{
    display:flex; align-items:center; gap:8px;
    margin-top:6px;
    font-family:'Roboto Mono',monospace;
    font-size:10.5px;
    color:#C9C2A8;
  }
  .ticker .meta .more{
    color:var(--brass);
    font-weight:600;
    text-decoration:underline;
    text-underline-offset:2px;
    background:none;border:none;padding:0;cursor:pointer;
    font-family:inherit;font-size:inherit;
  }

  /* ---------- Section label ---------- */
  .section-label{
    display:flex; align-items:baseline; gap:8px;
    margin:0 20px 10px;
  }
  .section-label .tw{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:15.5px;
  }
  .section-label .en{
    font-family:'Roboto Mono',monospace;
    font-size:10px;
    letter-spacing:.12em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }

  /* ---------- Hero: next rehearsal card ---------- */
  .hero{
    margin:0 20px 22px;
    border-radius:var(--radius-lg);
    background:var(--ink);
    color:var(--paper);
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow-card);
  }
  .hero .staff-bg{
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(
      rgba(242,239,229,.09), rgba(242,239,229,.09) 1px, transparent 1px, transparent 9px
    );
    pointer-events:none;
  }
  .hero-inner{ position:relative; padding:20px 20px 18px; }

  .hero-top{
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  .hero-eyebrow{
    font-family:'Roboto Mono',monospace;
    font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--brass);
  }
  .countdown-chip{
    background:var(--brass);
    color:var(--ink);
    font-family:'Roboto Mono',monospace;
    font-weight:600;
    font-size:11px;
    padding:4px 10px;
    border-radius:999px;
  }

  .hero-date{
    display:flex; align-items:baseline; gap:10px;
    margin-top:10px;
  }
  .hero-date .num{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:44px;
    line-height:1;
  }
  .hero-date .dow{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:17px;
    color:#D9D2BC;
  }

  .hero-rows{
    margin-top:16px;
    display:flex; flex-direction:column; gap:9px;
  }
  .hero-row{ display:flex; align-items:center; gap:10px; font-size:13px; }
  .hero-row .ico{ flex:none; width:16px; height:16px; opacity:.85; }
  .hero-row .label{ color:#C9C2A8; font-family:'Roboto Mono',monospace; font-size:10.5px; letter-spacing:.06em; min-width:52px;}
  .hero-row .val{ color:var(--paper); font-weight:500; }

  /* ---------- Ticket-stub check-in CTA ---------- */
  .checkin{
    margin-top:18px;
    border-top:1.5px dashed rgba(242,239,229,.35);
    padding-top:14px;
    position:relative;
  }
  .checkin::before,.checkin::after{
    content:"";
    position:absolute; top:-8px;
    width:16px; height:16px; border-radius:50%;
    background:var(--paper);
  }
  .checkin::before{ left:-28px; }
  .checkin::after{ right:-28px; }

  .checkin-btn{
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--brass);
    color:var(--ink);
    border:none;
    border-radius:var(--radius-md);
    padding:15px 16px;
    font-family:'Noto Sans TC',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .checkin-btn:hover{ background:#C7963F; }
  .checkin-btn:active{ transform:scale(.98); background:var(--brass-deep); }
  .checkin-btn .ico{ width:20px; height:20px; flex:none; }
  .checkin-sub{
    text-align:center;
    margin-top:8px;
    font-size:11.5px;
    color:#B7AF93;
  }

  /* ---------- QR scan overlay ---------- */
  .scan-overlay{
    position:fixed; inset:0; z-index:80;
    background:rgba(15,17,22,.94);
    display:none;
    flex-direction:column; align-items:center; justify-content:center;
    padding:24px; gap:18px;
  }
  .scan-overlay.active{ display:flex; }
  .scan-frame{
    position:relative;
    width:min(84vw, 360px); aspect-ratio:1;
    border-radius:var(--radius-lg);
    overflow:hidden;
    background:#000;
  }
  .scan-frame video{ width:100%; height:100%; object-fit:cover; }
  .scan-guide{
    position:absolute; inset:12%;
    border:3px solid var(--brass);
    border-radius:var(--radius-md);
    box-shadow:0 0 0 999px rgba(0,0,0,.35);
    pointer-events:none;
  }
  .scan-hint{ color:var(--paper); font-size:13px; text-align:center; margin:0; max-width:300px; }
  .scan-cancel{
    background:none; border:1px solid rgba(242,239,229,.4); color:var(--paper);
    border-radius:var(--radius-md); padding:12px 28px;
    font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .scan-cancel:active{ background:rgba(242,239,229,.12); }

  /* ---------- Upcoming events (program listing) ---------- */
  .program{
    margin:0 20px 24px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .program-item{
    display:flex; gap:14px;
    padding:15px 16px;
    align-items:flex-start;
  }
  .program-item + .program-item{ border-top:1px solid var(--line); }

  .measure{
    flex:none;
    font-family:'Roboto Mono',monospace;
    font-size:10px;
    color:var(--brass-deep);
    border:1px solid var(--brass);
    border-radius:5px;
    padding:2px 5px;
    margin-top:2px;
    min-width:26px;
    text-align:center;
  }

  .program-date{
    flex:none;
    width:46px;
    text-align:center;
  }
  .program-date .d{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:20px;
    line-height:1.05;
    color:var(--ink);
  }
  .program-date .m{
    font-family:'Roboto Mono',monospace;
    font-size:9.5px;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }

  .program-body{ flex:1; min-width:0; }
  .program-title{
    font-weight:700; font-size:13.5px; color:var(--ink);
    display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  }
  .kind{
    font-family:'Roboto Mono',monospace;
    font-size:9.5px; letter-spacing:.05em;
    padding:1.5px 6px; border-radius:5px;
    font-weight:600;
  }
  .empty{ padding:36px 20px; text-align:center; font-size:13px; color:var(--ink-soft); }
  .hero-empty{ padding:14px 0 18px; text-align:center; font-size:13px; color:#D9D2BC; }

  .program-meta{
    margin-top:4px;
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.5;
  }

  /* ---------- Bottom tab bar ---------- */
  .tabbar{
    position:sticky;
    bottom:0;
    margin-top:auto;
    background:var(--paper-raised);
    border-top:1px solid var(--line);
    padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
    display:flex;
    justify-content:space-around;
  }
  .tab{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft);
    font-family:'Noto Sans TC',sans-serif;
    font-size:10.5px;
    padding:4px 10px;
  }
  .tab.active{ color:var(--burgundy); }
  .tab .ico{ width:20px; height:20px; }

  @media (prefers-reduced-motion: reduce){
    .checkin-btn{ transition:none; }
  }

  .hidden{ display:none !important; }
  .auth-loading{
    min-height:100vh;
    width:100%;
    max-width:460px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    color:var(--ink-soft);
    font-size:13px;
  }
  .auth-loading .spinner{
    width:22px; height:22px;
    border-radius:50%;
    border:2.5px solid var(--line);
    border-top-color:var(--brass);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="authLoading" class="auth-loading">
  <div class="spinner"></div>
  <p>驗證登入狀態中…</p>
</div>
<div class="app hidden" id="appRoot">

  <!-- App Bar -->
  <div class="appbar">
    <img class="mark" src="assets/BrioLogo.jpg" alt="布利歐管樂團 Logo">
    <div class="brandtext">
      <div class="name">布利歐管樂團</div>
      <div class="sub">Brio Wind Band</div>
    </div>
    <div class="spacer"></div>
    <button class="avatar" id="avatarBtn" type="button" aria-label="帳號選單"></button>
  </div>

  <div class="staff"></div>

  <!-- 公告 Announcement -->
  <div class="ticker-wrap hidden" id="announceWrap">
    <div class="ticker">
      <svg class="ico" viewBox="0 0 24 24" fill="none"><path d="M3 10v4a1 1 0 0 0 1 1h2l6 4V5L6 9H4a1 1 0 0 0-1 1Z" stroke="#B8863A" stroke-width="1.5" stroke-linejoin="round"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="#B8863A" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div class="body">
        <div class="headline" id="announceHeadline"></div>
        <div class="meta">
          <span id="announceMeta"></span>
          <button class="more hidden" id="announceMoreBtn" type="button"></button>
        </div>
      </div>
    </div>
    <div class="announce-list hidden" id="announceList"></div>
  </div>

  <!-- 練習資訊 Hero -->
  <div class="section-label">
    <span class="tw">下一次團練</span>
    <span class="en">Next Rehearsal</span>
  </div>

  <div class="hero">
    <div class="staff-bg"></div>
    <div class="hero-inner">
      <div id="heroContent" class="hidden">
        <div class="hero-top">
          <span class="hero-eyebrow" id="heroEyebrow"></span>
          <span class="countdown-chip" id="heroCountdown"></span>
        </div>

        <div class="hero-date">
          <span class="num" id="heroDateNum"></span>
          <span class="dow" id="heroDateDow"></span>
        </div>

        <div class="hero-rows">
          <div class="hero-row">
            <svg class="ico" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#F2EFE5" stroke-width="1.5"/><path d="M12 7v5l3 2" stroke="#F2EFE5" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span class="label">時間</span>
            <span class="val" id="heroTimeVal"></span>
          </div>
          <div class="hero-row">
            <svg class="ico" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z" stroke="#F2EFE5" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.2" stroke="#F2EFE5" stroke-width="1.5"/></svg>
            <span class="label">地點</span>
            <span class="val" id="heroLocationVal"></span>
          </div>
        </div>
      </div>
      <div class="hero-empty hidden" id="heroEmpty">目前沒有排定的團練</div>

      <div class="checkin">
        <button class="checkin-btn" id="checkinBtn">
          <svg class="ico" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="#20242F" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="#20242F" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="#20242F" stroke-width="1.6"/><path d="M14 14h3v3h-3zM19 14h2v2h-2zM14 19h2v2h-2zM19 19h2v2h-2z" fill="#20242F"/></svg>
          掃描 QR Code 簽到
        </button>
        <div class="checkin-sub" id="checkinSub">請對準現場的簽到 QR Code</div>
      </div>
    </div>
  </div>

  <!-- 即將到來的活動 -->
  <div class="section-label">
    <span class="tw">即將到來的活動</span>
    <span class="en">Upcoming</span>
  </div>

  <div class="program" id="programList"></div>
  <div class="empty hidden" id="programEmpty">目前沒有即將到來的活動</div>

  <!-- Bottom tab bar -->
  <div class="tabbar">
    <button class="tab active">
      <svg class="ico" viewBox="0 0 24 24" fill="none"><path d="M4 11 12 4l8 7" stroke="#7A2331" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke="#7A2331" stroke-width="1.6" stroke-linejoin="round"/></svg>
      首頁
    </button>
    <button class="tab">
      <svg class="ico" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="16" rx="2" stroke="#4A4F5C" stroke-width="1.6"/><path d="M4 10h16M9 3v4M15 3v4" stroke="#4A4F5C" stroke-width="1.6" stroke-linecap="round"/></svg>
      行事曆
    </button>
    <button class="tab">
      <svg class="ico" viewBox="0 0 24 24" fill="none"><path d="M6 4h9l3 3v13H6z" stroke="#4A4F5C" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 11h6M9 14h6M9 17h4" stroke="#4A4F5C" stroke-width="1.6" stroke-linecap="round"/></svg>
      譜夾
    </button>
    <button class="tab">
      <svg class="ico" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="#4A4F5C" stroke-width="1.6"/><path d="M5 20c1.2-3.8 4-5.5 7-5.5s5.8 1.7 7 5.5" stroke="#4A4F5C" stroke-width="1.6" stroke-linecap="round"/></svg>
      我的
    </button>
  </div>

</div>

<div class="scan-overlay" id="scanOverlay">
  <div class="scan-frame">
    <video id="scanVideo" playsinline autoplay muted></video>
    <div class="scan-guide"></div>
  </div>
  <p class="scan-hint" id="scanHint">將 QR Code 對準框內</p>
  <button type="button" class="scan-cancel" id="scanCancelBtn">取消</button>
</div>

<script type="module">
  import { requireApprovedMember } from './auth-guard.js';
  import { initAccountMenu } from './account-menu.js';
  import { subscribeEventTypes, badgeStyle } from './event-types.js';
  import { db } from './firebase-init.js';
  import {
    collection, query, where, orderBy, limit, onSnapshot, Timestamp
  } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  requireApprovedMember().then(function(result){
    if (!result) return; // 未通過驗證，requireApprovedMember 已經處理導轉
    var profile = result.profile;

    document.getElementById('avatarBtn').textContent = profile.name ? profile.name.charAt(0) : '?';
    var isAdmin = profile.role === 'admin' || profile.role === 'owner';
    document.getElementById('authLoading').classList.add('hidden');
    document.getElementById('appRoot').classList.remove('hidden');

    initAccountMenu(profile.name, isAdmin ? 'admin-index.html' : null);

    // 首頁資料：下一次團練 + 即將到來的活動，接 events collection 即時更新
    var WEEKDAY = ['日', '一', '二', '三', '四', '五', '六'];
    var eventTypesById = {};
    var latestEvents = [];

    function formatEventTime(evt){
      if (evt.allDay) return '全天';
      var start = evt.date.toLocaleString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false });
      if (!evt.endTime) return start + ' 開始';
      var end = evt.endTime.toLocaleString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false });
      return start + '–' + end;
    }

    function formatCountdown(date){
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var target = new Date(date);
      target.setHours(0, 0, 0, 0);
      var days = Math.round((target - today) / 86400000);
      if (days <= 0) return '今天';
      if (days === 1) return '明天';
      return days + ' 天後';
    }

    function renderHero(nextRehearsal){
      var content = document.getElementById('heroContent');
      var empty = document.getElementById('heroEmpty');
      if (!nextRehearsal){
        content.classList.add('hidden');
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      content.classList.remove('hidden');
      document.getElementById('heroEyebrow').textContent = nextRehearsal.title;
      document.getElementById('heroCountdown').textContent = formatCountdown(nextRehearsal.date);
      document.getElementById('heroDateNum').textContent =
        (nextRehearsal.date.getMonth() + 1) + '.' + nextRehearsal.date.getDate();
      document.getElementById('heroDateDow').textContent = '星期' + WEEKDAY[nextRehearsal.date.getDay()];
      document.getElementById('heroTimeVal').textContent = formatEventTime(nextRehearsal);
      document.getElementById('heroLocationVal').textContent = nextRehearsal.location || '地點未定';
    }

    function typeBadge(typeId){
      var t = eventTypesById[typeId];
      var label = t ? t.label : typeId;
      return '<span class="kind" style="' + badgeStyle(t ? t.colorKey : null) + '">' + label + '</span>';
    }

    function renderProgram(events){
      var list = document.getElementById('programList');
      var empty = document.getElementById('programEmpty');
      if (events.length === 0){
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      list.innerHTML = events.map(function(evt, i){
        return (
          '<div class="program-item">' +
            '<span class="measure">' + String(i + 1).padStart(2, '0') + '</span>' +
            '<div class="program-date"><div class="d">' + evt.date.getDate() + '</div><div class="m">' + (evt.date.getMonth() + 1) + '月</div></div>' +
            '<div class="program-body">' +
              '<div class="program-title">' + evt.title + typeBadge(evt.type) + '</div>' +
              '<div class="program-meta">' + formatEventTime(evt) + (evt.location ? ' · ' + evt.location : '') + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join('');
    }

    var upcomingQuery = query(
      collection(db, 'events'),
      where('date', '>=', Timestamp.now()),
      orderBy('date', 'asc'),
      limit(20)
    );

    // 活動類型跟活動本身是兩份分開即時更新的資料，先等類型資料到齊過一次才開始畫，
    // 避免類型還沒載入時先顯示原始 ID 的畫面
    var typesLoaded = false;

    function renderEventsSection(){
      if (!typesLoaded) return;
      renderHero(latestEvents.find(function(evt){
        var t = eventTypesById[evt.type];
        return t && t.homeHighlight;
      }) || null);
      renderProgram(latestEvents.slice(0, 5));
    }

    subscribeEventTypes(db, function(types){
      eventTypesById = {};
      types.forEach(function(t){ eventTypesById[t.id] = t; });
      typesLoaded = true;
      renderEventsSection();
    });

    onSnapshot(upcomingQuery, function(snap){
      latestEvents = snap.docs.map(function(docSnap){
        var data = docSnap.data();
        return {
          title: data.title,
          type: data.type,
          date: data.date.toDate(),
          allDay: !!data.allDay,
          endTime: data.endTime && data.endTime.toDate ? data.endTime.toDate() : null,
          location: data.location
        };
      });

      renderEventsSection();
    });

    // 公告：接 announcements collection，最新一則當標題，其餘展開成清單
    function formatRelativeTime(date){
      var diffMs = Date.now() - date.getTime();
      var minutes = Math.floor(diffMs / 60000);
      if (minutes < 1) return '剛剛';
      if (minutes < 60) return minutes + ' 分鐘前';
      var hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + ' 小時前';
      var days = Math.floor(hours / 24);
      if (days === 1) return '昨天';
      if (days < 7) return days + ' 天前';
      return date.toLocaleDateString('zh-TW', { month:'numeric', day:'numeric' });
    }

    var announceMoreBtn = document.getElementById('announceMoreBtn');
    var announceList = document.getElementById('announceList');

    announceMoreBtn.addEventListener('click', function(){
      announceList.classList.toggle('hidden');
    });

    onSnapshot(query(collection(db, 'announcements'), orderBy('createdAt', 'desc'), limit(5)), function(snap){
      var items = snap.docs.map(function(docSnap){
        var data = docSnap.data();
        return {
          content: data.content,
          createdAt: data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : new Date()
        };
      });

      var wrap = document.getElementById('announceWrap');
      if (items.length === 0){
        wrap.classList.add('hidden');
        return;
      }
      wrap.classList.remove('hidden');

      document.getElementById('announceHeadline').textContent = items[0].content;
      document.getElementById('announceMeta').textContent = formatRelativeTime(items[0].createdAt);

      var rest = items.slice(1);
      if (rest.length === 0){
        announceMoreBtn.classList.add('hidden');
        announceList.classList.add('hidden');
        announceList.innerHTML = '';
        return;
      }
      announceMoreBtn.classList.remove('hidden');
      announceMoreBtn.textContent = '還有 ' + rest.length + ' 則公告';
      announceList.innerHTML = rest.map(function(item){
        return (
          '<div class="announce-item">' +
            item.content +
            '<div class="t">' + formatRelativeTime(item.createdAt) + '</div>' +
          '</div>'
        );
      }).join('');
    });

    // 簽到：即時開相機畫面，持續解碼直到找到 QR Code
    var checkinBtn = document.getElementById('checkinBtn');
    var scanOverlay = document.getElementById('scanOverlay');
    var scanVideo = document.getElementById('scanVideo');
    var scanHint = document.getElementById('scanHint');
    var scanCancelBtn = document.getElementById('scanCancelBtn');
    var scanCanvas = document.createElement('canvas');
    var scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });

    var scanStream = null;
    var scanRafId = null;

    function stopScan(){
      if (scanRafId) cancelAnimationFrame(scanRafId);
      scanRafId = null;
      if (scanStream){
        scanStream.getTracks().forEach(function(track){ track.stop(); });
        scanStream = null;
      }
      scanVideo.srcObject = null;
      scanOverlay.classList.remove('active');
    }

    function scanFrame(){
      if (scanVideo.readyState === scanVideo.HAVE_ENOUGH_DATA){
        scanCanvas.width = scanVideo.videoWidth;
        scanCanvas.height = scanVideo.videoHeight;
        scanCtx.drawImage(scanVideo, 0, 0, scanCanvas.width, scanCanvas.height);
        var imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
        var result = jsQR(imageData.data, imageData.width, imageData.height);
        if (result && /checkin\.html\?.*code=/.test(result.data)){
          var target = result.data;
          stopScan();
          location.href = target;
          return;
        }
      }
      scanRafId = requestAnimationFrame(scanFrame);
    }

    async function startScan(){
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        alert('這個瀏覽器不支援相機掃描，請改用其他瀏覽器');
        return;
      }
      scanHint.textContent = '將 QR Code 對準框內';
      scanOverlay.classList.add('active');
      try {
        scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        scanVideo.srcObject = scanStream;
        await scanVideo.play();
        scanRafId = requestAnimationFrame(scanFrame);
      } catch (err){
        scanHint.textContent = '無法開啟相機，請確認已允許相機權限';
      }
    }

    checkinBtn?.addEventListener('click', startScan);
    scanCancelBtn.addEventListener('click', stopScan);
    scanOverlay.addEventListener('click', function(e){
      if (e.target === scanOverlay) stopScan();
    });
  });
</script>
</body>
</html>
