    function closeNotifSheet(){
      notifSheetOverlay.classList.remove('active');
    }

    document.getElementById('notifBtn').addEventListener('click', openNotifSheet);
    document.getElementById('notifSheetClose').addEventListener('click', closeNotifSheet);
    notifSheetOverlay.addEventListener('click', function(e){
      if (e.target === notifSheetOverlay) closeNotifSheet();
    });
    document.getElementById('notifTodoList').addEventListener('click', function(e){
      if (e.target.closest('[data-notif-review]')){
        closeNotifSheet();
        location.href = 'review-admin.html';
        return;
      }
      if (e.target.closest('[data-notif-feedue]')){
        closeNotifSheet();
        document.getElementById('segTabOverview').click();
        document.getElementById('myFeeDuesWrap').scrollIntoView({ behavior: 'smooth' });
        return;
      }
      var btn = e.target.closest('[data-notif-rsvp]');
      if (!btn) return;
      var id = btn.getAttribute('data-notif-rsvp');
      closeNotifSheet();
      openRsvpSheet(id);
    });

    var rsvpSheetOverlay = document.getElementById('rsvpSheetOverlay');
    var rsvpOpenEventId = null;
    var rsvpSelectedStatus = 'attending';

    function updateRsvpStatusUI(){
      document.querySelectorAll('[data-rsvp-status]').forEach(function(btn){
        btn.classList.toggle('selected', btn.getAttribute('data-rsvp-status') === rsvpSelectedStatus);
      });
      document.getElementById('rsvpReasonField').classList.toggle('hidden', rsvpSelectedStatus !== 'leave');
    }

    function openRsvpSheet(eventId){
      var info = rsvpEventCache[eventId];
      if (!info) return;
      rsvpOpenEventId = eventId;
      var existing = rsvpReportsByEvent[eventId];
      rsvpSelectedStatus = existing ? existing.status : 'attending';
      document.getElementById('rsvpSheetTitle').textContent = info.title;
      document.getElementById('rsvpSheetMeta').textContent =
        (info.date ? (info.date.getMonth() + 1) + '/' + info.date.getDate() : '') + (info.location ? ' · ' + info.location : '');
      document.getElementById('rsvpReasonInput').value = existing && existing.reason ? existing.reason : '';
      document.getElementById('rsvpFormError').classList.add('hidden');
      updateRsvpStatusUI();
      rsvpSheetOverlay.classList.add('active');
    }

    function closeRsvpSheet(){
      rsvpSheetOverlay.classList.remove('active');
      rsvpOpenEventId = null;
    }

    document.querySelectorAll('[data-rsvp-status]').forEach(function(btn){
      btn.addEventListener('click', function(){
        rsvpSelectedStatus = btn.getAttribute('data-rsvp-status');
        updateRsvpStatusUI();
      });
    });

    document.getElementById('rsvpCancelBtn').addEventListener('click', closeRsvpSheet);
    document.getElementById('rsvpSheetClose').addEventListener('click', closeRsvpSheet);
    rsvpSheetOverlay.addEventListener('click', function(e){
      if (e.target === rsvpSheetOverlay) closeRsvpSheet();
    });

    document.getElementById('rsvpSubmitBtn').addEventListener('click', function(){
      if (!rsvpOpenEventId || !viewerUid) return;
      var errorEl = document.getElementById('rsvpFormError');
      var reason = document.getElementById('rsvpReasonInput').value.trim();
      errorEl.classList.add('hidden');
      var submitBtn = document.getElementById('rsvpSubmitBtn');
      submitBtn.disabled = true;
      var eventId = rsvpOpenEventId;
      setDoc(doc(db, 'attendanceReports', eventId + '_' + viewerUid), {
        eventId: eventId,
        uid: viewerUid,
        account: viewerProfile.account,
        name: viewerProfile.name,
        status: rsvpSelectedStatus,
        reason: rsvpSelectedStatus === 'leave' ? reason : '',
        respondedAt: serverTimestamp()
      }).then(function(){
        submitBtn.disabled = false;
        closeRsvpSheet();
      }).catch(function(err){
        submitBtn.disabled = false;
        errorEl.textContent = '送出失敗（' + err.code + '），請再試一次';
        errorEl.classList.remove('hidden');
      });
    });

    // 簽到：即時開相機畫面，持續解碼直到找到 QR Code。訪客／審核中時 checkinLockedMessage
    // 會是非 null 的提示文字，點擊只顯示 toast、不會真的開相機（見下方身分驗證區塊設定）
    var checkinBtn = document.getElementById('checkinBtn');
    var scanOverlay = document.getElementById('scanOverlay');
    var scanVideo = document.getElementById('scanVideo');
    var scanHint = document.getElementById('scanHint');
    var scanCancelBtn = document.getElementById('scanCancelBtn');
    var scanCanvas = document.createElement('canvas');
    var scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });

    var scanStream = null;
    var scanRafId = null;

    function stopScan(){
      if (scanRafId) cancelAnimationFrame(scanRafId);
      scanRafId = null;
      if (scanStream){
        scanStream.getTracks().forEach(function(track){ track.stop(); });
        scanStream = null;
      }
      scanVideo.srcObject = null;
      scanOverlay.classList.remove('active');
    }

    function scanFrame(){
      if (scanVideo.readyState === scanVideo.HAVE_ENOUGH_DATA){
        scanCanvas.width = scanVideo.videoWidth;
        scanCanvas.height = scanVideo.videoHeight;
        scanCtx.drawImage(scanVideo, 0, 0, scanCanvas.width, scanCanvas.height);
        var imageData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
        var result = jsQR(imageData.data, imageData.width, imageData.height);
        if (result && /checkin\.html\?.*code=/.test(result.data)){
          var target = result.data;
          stopScan();
          location.href = target;
          return;
        }
      }
      scanRafId = requestAnimationFrame(scanFrame);
    }

    async function startScan(){
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        showToast('這個瀏覽器不支援相機掃描，請改用其他瀏覽器');
        return;
      }
      scanHint.textContent = '將 QR Code 對準框內';
      scanOverlay.classList.add('active');
      try {
        scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        scanVideo.srcObject = scanStream;
        await scanVideo.play();
        scanRafId = requestAnimationFrame(scanFrame);
      } catch (err){
        scanHint.textContent = '無法開啟相機，請確認已允許相機權限';
      }
    }

    checkinBtn?.addEventListener('click', function(){
      if (checkinLockedMessage){ showToast(checkinLockedMessage); return; }
      startScan();
    });
    scanCancelBtn.addEventListener('click', stopScan);
    scanOverlay.addEventListener('click', function(e){
      if (e.target === scanOverlay) stopScan();
    });

    // ---------- 團務總覽：我的音樂會（唯讀） ----------
    // concertRosters.members 是 array<{uid, instrument, name, account}>，沒辦法用 array-contains 查詢直接
    // 篩出「包含我」的文件，這裡整份撈回來前端過濾（跟 checkin-stats-admin.html 撈整份
    // collection 再篩選同一種模式，資料量小，全團音樂會數量不會多）
    async function loadMyConcerts(uid){
      var rosterSnap = await getDocs(collection(db, 'concertRosters'));
      var repertoireSnap = await getDocs(collection(db, 'repertoire'));

      var repertoireById = {};
      repertoireSnap.forEach(function(d){ repertoireById[d.id] = Object.assign({ id: d.id }, d.data()); });

      var myEntries = [];
      rosterSnap.forEach(function(docSnap){
        var members = docSnap.data().members || [];
        var mine = members.filter(function(m){ return m.uid === uid; })[0];
        if (mine) myEntries.push({ concertId: docSnap.id, instruments: mine.instruments || [] });
      });
      if (myEntries.length === 0) return [];

      var concerts = await Promise.all(myEntries.map(async function(entry){
        var concertSnap = await getDoc(doc(db, 'concerts', entry.concertId));
        if (!concertSnap.exists()) return null;

        var piecesSnap = await getDocs(collection(db, 'concerts', entry.concertId, 'pieces'));
        var pieceRefs = piecesSnap.docs.map(function(d){ return { id: d.id, order: d.data().order || 0 }; });
        pieceRefs.sort(function(a, b){ return a.order - b.order; });

        var pieces = await Promise.all(pieceRefs.map(async function(ref){
          var piece = repertoireById[ref.id];
          if (!piece) return { title: '（曲目已刪除）', assignedLabel: null };
          // 同時負責多種樂器時，這首曲子可能只在其中某個樂器的分部文件裡有指派到這個人，
          // 逐一查每個樂器的分部文件，把找到的分部標籤都收集起來
          var labels = [];
          await Promise.all(entry.instruments.map(async function(instrumentName){
            var sectionSnap = await getDoc(doc(db, 'concerts', entry.concertId, 'pieces', ref.id, 'sections', instrumentName));
            if (!sectionSnap.exists()) return;
            (sectionSnap.data().parts || []).forEach(function(part){
              if ((part.members || []).indexOf(uid) !== -1){
                var def = (piece.parts || []).filter(function(p){ return p.partId === part.partId; })[0];
                labels.push(def ? def.label : part.partId);
              }
            });
          }));
          return { title: piece.title, assignedLabel: labels.length ? labels.join('、') : null };
        }));

        return { concertId: entry.concertId, title: concertSnap.data().title, instruments: entry.instruments, pieces: pieces };
      }));

      return concerts.filter(function(c){ return c; });
    }

    function escapeHtmlForOverview(s){
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }

    function renderMyConcerts(concerts){
      if (concerts.length === 0) return; // 保持預設的「目前沒有其他團務資訊」
      document.getElementById('overviewEmptyMsg').classList.add('hidden');
      var wrap = document.getElementById('myConcertsWrap');
      wrap.classList.remove('hidden');
      document.getElementById('myConcertsSlot').innerHTML = concerts.map(function(c){
        var piecesHtml = c.pieces.length === 0
          ? '<div class="my-concert-piece-row"><span class="k">（尚未加入曲目）</span></div>'
          : c.pieces.map(function(p){
              return (
                '<div class="my-concert-piece-row">' +
                  '<span class="k">' + escapeHtmlForOverview(p.title) + '</span>' +
                  '<span class="v">' + (p.assignedLabel ? escapeHtmlForOverview(p.assignedLabel) : '尚未指派') + '</span>' +
                '</div>'
              );
            }).join('');
        return (
          '<div class="my-concert-card">' +
            '<div class="my-concert-title">' + escapeHtmlForOverview(c.title) + '</div>' +
            '<div class="my-concert-instrument">分部：' + escapeHtmlForOverview(c.instruments.join('、') || '未設定') + '</div>' +
            piecesHtml +
          '</div>'
        );
      }).join('');
    }

    // ---------- 團務總覽：我的團費（唯讀，即時監聽，不是一次性載入） ----------
    // 跟「我的音樂會」不同：這裡的資料同時餵給首頁橫幅／通知中心（兩者一進首頁就要看到），
    // 所以訂閱本身是 eager（身分驗證完成就掛），不走 setOverviewLazyLoad 那套延遲載入，
    // 這個函式只是把已經在記憶體裡的資料畫出來，不會另外發查詢
    function renderMyFeeDues(){
      var wrap = document.getElementById('myFeeDuesWrap');
      if (myFeeDuesList.length === 0){
        wrap.classList.add('hidden');
        // 只有「我的音樂會」也沒資料時，才重新顯示空狀態訊息
        if (document.getElementById('myConcertsWrap').classList.contains('hidden')){
          document.getElementById('overviewEmptyMsg').classList.remove('hidden');
        }
        return;
      }
      document.getElementById('overviewEmptyMsg').classList.add('hidden');
      wrap.classList.remove('hidden');
      document.getElementById('myFeeDuesSlot').innerHTML = myFeeDuesList.map(function(due){
        var payment = myFeePaymentsByDueId[due.id];
        var dateVal = payment && payment.paidAt && payment.paidAt.toDate ? payment.paidAt.toDate() : null;
        var dateText = dateVal ? (dateVal.getMonth() + 1) + '/' + dateVal.getDate() : '';
        var statusText = payment
          ? '已繳 $' + payment.amountPaid.toLocaleString('zh-Hant') + (dateText ? '・' + dateText : '')
          : '未繳 $' + feeDueAmountForMe(due).toLocaleString('zh-Hant');
        var rowHtml = (
          '<div class="my-concert-piece-row">' +
            '<span class="k">' + escapeHtmlForOverview(due.title) + '</span>' +
            '<span class="v">' + statusText + '</span>' +
          '</div>'
        );
        // 只有未繳、且這筆項目有填匯款資訊時才顯示，已繳的人不需要再看到匯款方式
        var hasRemit = !payment && due.remittanceBank && due.remittanceAccount && due.remittanceHolder;
        // QR Code 刻意不從 due 本身讀（那份文字資訊才是套用當下的快照），而是拿
        // remittanceAccountId 去帳戶庫即時查目前最新的圖片——這是使用者定案的例外
        var linkedAccount = due.remittanceAccountId ? remittanceAccountsById[due.remittanceAccountId] : null;
        var qrHtml = (hasRemit && linkedAccount && linkedAccount.qrCodeDataUrl)
          ? '<div style="margin-top:8px;text-align:center;"><img class="fee-qr-img" src="' + linkedAccount.qrCodeDataUrl + '" alt="收款 QR Code，點擊放大"></div>'
          : '';
        var remitHtml = hasRemit
          ? '<div class="fee-remit-info">' +
              '<b>銀行</b>：' + escapeHtmlForOverview(due.remittanceBank) + '　<b>帳號</b>：' + escapeHtmlForOverview(due.remittanceAccount) + '　<b>戶名</b>：' + escapeHtmlForOverview(due.remittanceHolder) +
              (due.remittanceNote ? '<br><b>備註</b>：' + escapeHtmlForOverview(due.remittanceNote) : '') +
              qrHtml +
            '</div>'
          : '';
        return rowHtml + remitHtml;
      }).join('');
    }

    // QR Code 放大檢視：比照 event-admin.html 簽到分頁同一套元件，點縮圖放大、點遮罩收合
    var qrZoomOverlay = document.getElementById('qrZoomOverlay');
    var qrZoomImg = document.getElementById('qrZoomImg');
    document.getElementById('myFeeDuesSlot').addEventListener('click', function(e){
      var img = e.target.closest('.fee-qr-img');
      if (!img) return;
      qrZoomImg.src = img.src;
      qrZoomOverlay.classList.add('active');
    });
    qrZoomOverlay.addEventListener('click', function(){
      qrZoomOverlay.classList.remove('active');
    });

    // ---------- 身分驗證：訪客（未登入）／審核中／已核准，決定要不要打開個人化功能 ----------
    resolveMemberAccess().then(function(access){
      if (!access) return; // 未通過驗證（被拒絕/停用等），resolveMemberAccess 已經處理導轉

      // 未登入且沒有主動選過「訪客瀏覽」（login.html 的按鈕才會寫這個旗標）一律先導去登入頁，
      // 避免新團員（例如點到活動分享連結）直接落在首頁、完全看不到註冊入口。這個旗標只存在
      // sessionStorage（分頁關掉就重置），下次重新打開還是會先看到登入頁，持續給機會看到
      // 註冊入口，同一次瀏覽過程中不會反覆被導回登入頁。8/24 討論定案，見 schema.md
      if (access.state === 'guest' && !sessionStorage.getItem('brio_guest_browse')){
        location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname + location.search);
        return;
      }

      viewerState = access.state;
      viewerUid = access.uid;
      viewerProfile = access.profile;
      overviewLocked = (viewerState === 'guest');

      // tabbar「我的」：不論身分一律連到 profile.html——訪客點進去要先看到「登入」按鈕，
      // 不能在首頁這裡就直接跳登入頁，避免誤觸導覽列就被導走，訪客/審核中/已核准的畫面差異
      // 交給 profile.html 自己的守門邏輯處理（HTML 預設值本來就是 profile.html，這裡不用再改）
      // 通知鈴鐺：訪客沒有個人資料可查，整個隱藏；審核中/已核准維持顯示（自然是空狀態）
      document.getElementById('notifBtn').classList.toggle('hidden', viewerState === 'guest');
      // 指揮後台入口：只有 admin/owner/conductor 看得到，跟 profile.html 的
      // canSeeConductorPage 同一套判斷式，角色資料已經在 viewerProfile 裡，不用多查一次
      var canSeeConductorPage = viewerProfile &&
        (viewerProfile.role === 'admin' || viewerProfile.role === 'owner' || viewerProfile.role === 'conductor');
      document.getElementById('conductorBtn').classList.toggle('hidden', !canSeeConductorPage);
      // 審核中狀態橫幅
      document.getElementById('pendingBanner').classList.toggle('hidden', viewerState !== 'pending');

      var checkinSub = document.getElementById('checkinSub');
      if (viewerState === 'guest'){
        checkinLockedMessage = '請先登入後即可簽到';
        checkinBtn.classList.add('locked');
        checkinSub.textContent = '登入後即可掃描 QR Code 簽到';
      } else if (viewerState === 'pending'){
        checkinLockedMessage = '帳號審核中，通過後即可簽到';
        checkinBtn.classList.add('locked');
        checkinSub.textContent = '帳號審核中，通過後即可掃描簽到';
      } else {
        checkinLockedMessage = null;
      }
      syncCheckinLock(); // events 監聽可能比這裡先跑完，補算一次目前這場團練該不該查真正的簽到狀態

      if (viewerState === 'guest'){
        document.getElementById('tabAvatarIcon').classList.remove('skel');
        renderRsvpBanner();
        renderFeeDueBanner();
        renderNotifDot();
        return; // 訪客到此為止，不掛任何個人資料相關的監聽
      }

      var tabAvatarIcon = document.getElementById('tabAvatarIcon');
      tabAvatarIcon.textContent = viewerProfile.name ? viewerProfile.name.charAt(0) : '?';
      tabAvatarIcon.classList.remove('skel');

      renderRsvpBanner();
      renderFeeDueBanner();
      renderNotifDot();
      renderNotifSheet();

      // 審核中也算真團員（讀取權限跟已核准一樣），一併載入，跟團務總覽分頁對審核中開放的既有原則一致。
      // 不在這裡直接跑：這組讀取只有「團務總覽」分頁用得到，掛成 lazy loader，等使用者第一次
      // 切過去才真的發出請求（大多數人只看首頁的「個人焦點」分頁就離開了）
      setOverviewLazyLoad(function(){
        loadMyConcerts(viewerUid).then(renderMyConcerts).catch(function(err){
          console.error('我的音樂會 載入失敗', err);
        });
      });

      // ---------- 通知開關推廣提示：只給已核准會員看，審核中的人已經可以在個人中心自行開通知，
      // 這個首頁主動彈窗留給已核准會員，避免審核中的人一進來就被兩層提示轟炸 ----------
      if (viewerState === 'approved'){
        var NOTIF_PROMPT_DENIED_KEY = 'brio_notif_prompt_denied';
        var NOTIF_PROMPT_LAST_SHOWN_KEY = 'brio_notif_prompt_last_shown';
        var NOTIF_PROMPT_INTERVAL_MS = 24 * 60 * 60 * 1000;

        function shouldShowNotifPrompt(){
          if (viewerProfile.notificationsEnabled) return false;
          if (!('Notification' in window) || !('serviceWorker' in navigator)) return false;
          if (Notification.permission === 'denied') return false;
          if (localStorage.getItem(NOTIF_PROMPT_DENIED_KEY) === 'true') return false;
          if (isIOS() && !isStandalone()) return false;
          var lastShown = Number(localStorage.getItem(NOTIF_PROMPT_LAST_SHOWN_KEY) || 0);
          if (Date.now() - lastShown < NOTIF_PROMPT_INTERVAL_MS) return false;
          return true;
        }

        var notifPromptOverlay = document.getElementById('notifPromptOverlay');
        if (shouldShowNotifPrompt()){
          localStorage.setItem(NOTIF_PROMPT_LAST_SHOWN_KEY, String(Date.now()));
          notifPromptOverlay.classList.add('active');
        }

        document.getElementById('notifPromptLaterBtn').addEventListener('click', function(){
          notifPromptOverlay.classList.remove('active');
        });

        document.getElementById('notifPromptEnableBtn').addEventListener('click', function(){
          notifPromptOverlay.classList.remove('active');
          Notification.requestPermission().then(function(perm){
            if (perm === 'denied'){
              localStorage.setItem(NOTIF_PROMPT_DENIED_KEY, 'true');
              return;
            }
            if (perm !== 'granted') return;
            return navigator.serviceWorker.ready.then(function(reg){
              return reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
              });
            }).then(function(sub){
              return setDoc(doc(db, 'users', viewerUid), {
                notificationsEnabled: true,
                pushSubscription: sub.toJSON(),
                notificationsUpdatedAt: serverTimestamp()
              }, { merge: true });
            });
          }).catch(function(err){ console.error('推播訂閱失敗', err); });
        });
      }

      // 只有已經「發起調查」（surveyOpenedAt 有值）的活動才算待辦，名單存在不等於調查已發起。
      // pending 結構上不會出現在任何名單裡（名單只能從已核准會員裡勾選），這裡維持同一套訂閱邏輯，
      // 不用另外寫，監聽結果自然是空的
      onSnapshot(query(collection(db, 'eventRosters'), where('members', 'array-contains', viewerUid)), function(snap){
        rsvpRosterEventIds = snap.docs.filter(function(d){ return d.data().surveyOpenedAt; }).map(function(d){ return d.id; });
        rsvpRosterEventIds.forEach(function(id){
          ensureRsvpEventInfo(id).then(function(){
            renderRsvpBanner();
            renderNotifDot();
            renderNotifSheet();
          });
        });
        renderRsvpBanner();
        renderNotifDot();
        renderNotifSheet();
      }, function(err){ console.error('eventRosters 監聽失敗', err); });

      onSnapshot(query(collection(db, 'attendanceReports'), where('uid', '==', viewerUid)), function(snap){
        rsvpReportsByEvent = {};
        snap.forEach(function(d){
          var data = d.data();
          rsvpReportsByEvent[data.eventId] = { status: data.status, reason: data.reason };
        });
        renderRsvpBanner();
        renderNotifDot();
        renderNotifSheet();
        renderEventsSection(); // 團練卡片跟活動卡條上的「已回報」標籤也要跟著更新
      }, function(err){ console.error('attendanceReports 監聽失敗', err); });

      // 團費待辦：自己在 memberIds 名單內、且未作廢的應繳項目，跟 eventRosters 同一套
      // array-contains 查詢寫法。這裡是 eager 訂閱（不走 setOverviewLazyLoad），因為橫幅／
      // 通知中心一進首頁就要看到，不能等使用者真的切到「團務總覽」才載入
      onSnapshot(query(collection(db, 'feeDues'), where('memberIds', 'array-contains', viewerUid)), function(snap){
        myFeeDuesList = snap.docs
          .map(function(d){ return Object.assign({ id: d.id }, d.data()); })
          .filter(function(d){ return !d.voided; });
        renderFeeDueBanner();
        renderNotifDot();
        renderNotifSheet();
        renderMyFeeDues();
      }, function(err){ console.error('feeDues 監聽失敗', err); });

      onSnapshot(query(collection(db, 'feePayments'), where('uid', '==', viewerUid)), function(snap){
        myFeePaymentsByDueId = {};
        snap.forEach(function(d){
          var data = d.data();
          if (!data.voided) myFeePaymentsByDueId[data.dueId] = data;
        });
        renderFeeDueBanner();
        renderNotifDot();
        renderNotifSheet();
        renderMyFeeDues();
      }, function(err){ console.error('feePayments 監聽失敗', err); });

      // 匯款帳戶庫：只用來即時查應繳項目連結的帳戶目前最新的 QR Code（不是複製快照，
      // 帳戶之後換圖不用回頭改每一筆歷史應繳項目，這是使用者定案的刻意例外）
      subscribeRemittanceAccounts(db, function(accounts){
        remittanceAccountsById = {};
        accounts.forEach(function(a){ remittanceAccountsById[a.id] = a; });
        renderMyFeeDues();
      }, function(err){ console.error('匯款帳戶監聽失敗', err); });

      // notificationsReadAt 即時監聽（不透過 auth-guard.js 的快取 profile，見上方原因說明）。
      // setDoc 寫入 serverTimestamp() 後，本地端在伺服器確認前會先收到一次 null（Firestore 對
      // 還沒解析的 serverTimestamp 的既有行為），這裡刻意跳過 null、保留當下畫面上的樂觀值，
      // 避免紅點在剛點開通知中心後又閃一下重新出現
      onSnapshot(doc(db, 'users', viewerUid), function(snap){
        var data = snap.data() || {};
        if (data.notificationsReadAt !== undefined && data.notificationsReadAt !== null){
          notificationsReadAt = data.notificationsReadAt.toDate();
          renderNotifDot();
          renderNotifSheet();
        }
      }, function(err){ console.error('users 監聽失敗', err); });

      // 團員審核待辦：只有 admin/owner 訂閱，conductor 沒有審核權限、不會看到這項，
      // firestore.rules 對 users collection 的 list 也只放行 admin-tier，這裡的角色判斷
      // 只是避免非 admin-tier 白打一次一定會被拒絕的查詢
      if (viewerProfile.role === 'admin' || viewerProfile.role === 'owner'){
        onSnapshot(query(collection(db, 'users'), where('status', '==', 'pending')), function(snap){
          pendingReviewCount = snap.size;
          renderNotifDot();
          renderNotifSheet();
        }, function(err){ console.error('pending 團員審核監聽失敗', err); });
      }
    });
</script>
</body>
</html>
