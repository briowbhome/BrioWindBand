<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>布利歐管樂團｜首頁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F2EFE5">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<script src="./pwa-register.js" defer></script>
<script src="./ios-install.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<style>
  :root{
    --ink:#20242F;
    --ink-soft:#4A4F5C;
    --paper:#F2EFE5;
    --paper-raised:#FBFAF4;
    --line:#DAD3BE;
    --brass:#B8863A;
    --brass-deep:#8F6A2C;
    --burgundy:#7A2331;
    --burgundy-deep:#5C1A26;
    --sage:#5F6E58;
    --sage-bg:#E7EBDF;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-card: 0 1px 2px rgba(32,36,47,.06), 0 8px 24px -12px rgba(32,36,47,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #EFE9D6 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
  }

  button, a{ -webkit-tap-highlight-color: transparent; font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--brass-deep); outline-offset:2px; border-radius:6px; }

  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
  }

  /* ---------- App Bar ---------- */
  .appbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding:18px 20px 14px;
  }
  .mark{ width:38px; height:38px; flex:none; object-fit:cover; border-radius:50%; }
  .brandtext{ display:flex; flex-direction:column; line-height:1.1; }
  .brandtext .name{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:19px;
    letter-spacing:.02em;
  }
  .brandtext .sub{
    font-family:'Roboto Mono',monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    color:var(--ink-soft);
    margin-top:3px;
    text-transform:uppercase;
  }
  .appbar .spacer{ flex:1; }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px;
    border:2px solid var(--paper-raised);
    box-shadow:0 0 0 1.5px var(--line);
    padding:0; cursor:pointer;
  }
  .tab-avatar{ width:20px; height:20px; font-size:9.5px; border:none; box-shadow:none; }

  /* 鈴鐺：純線條圖示，跟行事曆/譜夾同一套畫法，不做成填色圓底按鈕 */
  .bell-btn{
    position:relative; width:34px; height:34px; flex:none;
    background:none; border:none; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .notif-dot{
    position:absolute; top:1px; right:1px;
    min-width:15px; height:15px; padding:0 3px; border-radius:50%;
    background:var(--burgundy); border:1.5px solid var(--paper);
    color:#F2EFE5; font-family:'Roboto Mono',monospace; font-size:9px; font-weight:700;
    line-height:15px; text-align:center;
  }

  /* ---------- Staff-line divider (signature motif) ---------- */
  .staff{
    height:16px;
    margin:0 20px 6px;
    background-image: repeating-linear-gradient(
      var(--line), var(--line) 1px, transparent 1px, transparent 4px
    );
    opacity:.9;
  }

  /* ---------- Announcement ticker ---------- */
  .ticker-wrap{ margin:2px 20px 18px; }
  .ticker{
    background:var(--ink);
    color:#F2EFE5;
    border-radius:var(--radius-md);
    padding:12px 14px;
    display:flex;
    align-items:flex-start;
    gap:10px;
    box-shadow:var(--shadow-card);
  }
  .announce-list{
    margin-top:8px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    overflow:hidden;
  }
  .announce-item{ padding:10px 14px; font-size:12.5px; color:var(--ink); line-height:1.6; white-space:pre-wrap; }
  .announce-item + .announce-item{ border-top:1px solid var(--line); }
  .announce-item .t{ margin-top:4px; font-size:10.5px; color:var(--ink-soft); font-family:'Roboto Mono',monospace; }
  .ticker .ico{
    flex:none; width:20px; height:20px; margin-top:1px;
  }
  .ticker .body{ flex:1; min-width:0; }
  .ticker .headline{
    font-size:13.5px; font-weight:500; line-height:1.5;
  }
  .ticker .meta{
    display:flex; align-items:center; gap:8px;
    margin-top:6px;
    font-family:'Roboto Mono',monospace;
    font-size:10.5px;
    color:#C9C2A8;
  }
  .ticker .meta .more{
    color:var(--brass);
    font-weight:600;
    text-decoration:underline;
    text-underline-offset:2px;
    background:none;border:none;padding:0;cursor:pointer;
    font-family:inherit;font-size:inherit;
  }

  /* ---------- Section label ---------- */
  .section-label{
    display:flex; align-items:baseline; gap:8px;
    margin:0 20px 10px;
  }
  .section-label .tw{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:15.5px;
  }

  /* ---------- 個人焦點／團務總覽 分頁 ---------- */
  .seg-tabs{
    display:flex; gap:6px; margin:2px 20px 14px;
    background:var(--sage-bg); padding:4px; border-radius:999px;
  }
  .seg-tab{
    flex:1; text-align:center; padding:8px 4px; border-radius:999px;
    font-family:'Noto Sans TC',sans-serif; font-size:13px; font-weight:500;
    color:var(--sage); background:none; border:none; cursor:pointer;
  }
  .seg-tab.active{ background:var(--ink); color:var(--paper); }
  .seg-panel.hidden{ display:none; }
  .overview-empty{
    margin:0 20px; padding:24px 16px; text-align:center;
    color:var(--ink-soft); font-size:13px;
    border:1px dashed var(--line); border-radius:var(--radius-md);
  }
  .my-concert-card{
    margin:0 20px 14px; background:var(--paper-raised); border:1px solid var(--line);
    border-radius:var(--radius-lg); box-shadow:var(--shadow-card); padding:14px 16px;
  }
  .my-concert-title{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:14.5px; color:var(--ink); }
  .my-concert-instrument{ margin-top:2px; font-size:11.5px; color:var(--ink-soft); }
  .my-concert-piece-row{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    padding:8px 0; font-size:12.5px; border-top:1px solid var(--line);
  }
  .my-concert-piece-row .k{ color:var(--ink); }
  .my-concert-piece-row .v{ color:var(--ink-soft); text-align:right; flex:none; }
  /* 「我的團費」是扁平清單，不像「我的音樂會」每筆包在 .my-concert-card 裡（那個卡片的
     padding 順便讓裡面的 piece-row 有左右留白）。這裡直接補上同樣 20px 的水平留白，
     不動共用的 .my-concert-piece-row 本身，避免影響「我的音樂會」原本的排版 */
  #myFeeDuesSlot .my-concert-piece-row{ margin:0 20px; }
  /* 未繳且該筆項目有填匯款資訊時，才在標題/狀態列下方多顯示這塊，同一份水平留白 */
  #myFeeDuesSlot .fee-remit-info{ margin:0 20px 10px; padding:8px 10px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-sm); font-size:11.5px; line-height:1.6; color:var(--ink-soft); }
  #myFeeDuesSlot .fee-remit-info b{ color:var(--ink); font-weight:600; }
  .fee-qr-img{ width:140px; height:140px; object-fit:contain; border:1px solid var(--line); border-radius:8px; background:#fff; cursor:zoom-in; }

  /* ---------- QR Code 放大檢視：比照 event-admin.html 簽到分頁同一套元件，點縮圖放大、
     點遮罩收合 ---------- */
  .qr-zoom-overlay{
    position:fixed; inset:0; z-index:85;
    background:rgba(32,36,47,.82);
    display:none; align-items:center; justify-content:center;
    padding:32px; cursor:zoom-out;
  }
  .qr-zoom-overlay.active{ display:flex; }
  .qr-zoom-overlay img{
    width:min(84vw, 360px); height:min(84vw, 360px);
    background:#fff; border-radius:var(--radius-lg); padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }

  /* ---------- 回報狀態小標籤（貼著日期，跟現有 status-chip-btn 同一套配色：出席=sage／請假=burgundy） ---------- */
  .rsvp-status-chip{
    margin-left:auto; align-self:center;
    display:inline-flex; align-items:center; gap:4px;
    padding:4px 10px; border-radius:999px;
    font-family:'Noto Sans TC',sans-serif; font-size:11px; font-weight:500;
  }
  .rsvp-status-chip.attending{ background:var(--sage-bg); color:var(--sage); }
  .rsvp-status-chip.leave{ background:rgba(122,35,49,.16); color:#E8A9B4; }

  /* ---------- 簽到狀態（四態：尚未開放／開放中／已過期／已簽到） ---------- */
  .checkin-msg{ text-align:center; font-size:13.5px; font-weight:700; padding:12px 0; }
  .checkin-msg.muted{ color:#C9C2A8; }
  .checkin-msg.warn{ color:#E8A9B4; }
  .checkin-msg.done{ color:var(--brass); }

  /* ---------- Hero: next rehearsal card ---------- */
  .hero{
    margin:0 20px 22px;
    border-radius:var(--radius-lg);
    background:var(--ink);
    color:var(--paper);
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow-card);
  }
  .hero .staff-bg{
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(
      rgba(242,239,229,.09), rgba(242,239,229,.09) 1px, transparent 1px, transparent 9px
    );
    pointer-events:none;
  }
  .hero-inner{ position:relative; padding:20px 20px 18px; }

  .hero-top{
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  .hero-eyebrow{
    font-family:'Roboto Mono',monospace;
    font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--brass);
  }
  .countdown-chip{
    background:var(--brass);
    color:var(--ink);
    font-family:'Roboto Mono',monospace;
    font-weight:600;
    font-size:11px;
    padding:4px 10px;
    border-radius:999px;
  }

  .hero-date{
    display:flex; align-items:baseline; gap:10px;
    margin-top:10px;
  }
  .hero-date .num{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:44px;
    line-height:1;
  }
  .hero-date .dow{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:17px;
    color:#D9D2BC;
  }

  .hero-rows{
    margin-top:16px;
    display:flex; flex-direction:column; gap:9px;
  }
  .hero-row{ display:flex; align-items:center; gap:10px; font-size:13px; }
  .hero-row .ico{ flex:none; width:16px; height:16px; opacity:.85; }
  .hero-row .label{ color:#C9C2A8; font-family:'Roboto Mono',monospace; font-size:10.5px; letter-spacing:.06em; min-width:52px;}
  .hero-row .val{ color:var(--paper); font-weight:500; }

  /* ---------- Ticket-stub check-in CTA ---------- */
  .checkin{
    margin-top:18px;
    border-top:1.5px dashed rgba(242,239,229,.35);
    padding-top:14px;
    position:relative;
  }
  .checkin::before,.checkin::after{
    content:"";
    position:absolute; top:-8px;
    width:16px; height:16px; border-radius:50%;
    background:var(--paper);
  }
  .checkin::before{ left:-28px; }
  .checkin::after{ right:-28px; }

  .checkin-btn{
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--brass);
    color:var(--ink);
    border:none;
    border-radius:var(--radius-md);
    padding:15px 16px;
    font-family:'Noto Sans TC',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .checkin-btn:hover{ background:#C7963F; }
  .checkin-btn:active{ transform:scale(.98); background:var(--brass-deep); }
  .checkin-btn.locked{ opacity:.5; }
  .checkin-btn .ico{ width:20px; height:20px; flex:none; }
  .checkin-sub{
    text-align:center;
    margin-top:8px;
    font-size:11.5px;
    color:#B7AF93;
  }

  /* ---------- QR scan overlay ---------- */
  .scan-overlay{
    position:fixed; inset:0; z-index:80;
    background:rgba(15,17,22,.94);
    display:none;
    flex-direction:column; align-items:center; justify-content:center;
    padding:24px; gap:18px;
  }
  .scan-overlay.active{ display:flex; }
  .scan-frame{
    position:relative;
    width:min(84vw, 360px); aspect-ratio:1;
    border-radius:var(--radius-lg);
    overflow:hidden;
    background:#000;
  }
  .scan-frame video{
    width:100%; height:100%; object-fit:cover;
    /* 部分 iPhone 機型上，video 元素被父層 border-radius+overflow:hidden 裁切時，
       WebKit 的 GPU 合成會出現畫面全黑的已知問題，強制獨立合成層讓它正常渲染 */
    transform:translateZ(0);
    -webkit-transform:translateZ(0);
  }
  .scan-guide{
    position:absolute; inset:12%;
    border:3px solid var(--brass);
    border-radius:var(--radius-md);
    box-shadow:0 0 0 999px rgba(0,0,0,.35);
    pointer-events:none;
  }
  .scan-hint{ color:var(--paper); font-size:13px; text-align:center; margin:0; max-width:300px; }
  .scan-cancel{
    background:none; border:1px solid rgba(242,239,229,.4); color:var(--paper);
    border-radius:var(--radius-md); padding:12px 28px;
    font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .scan-cancel:active{ background:rgba(242,239,229,.12); }

  /* ---------- Upcoming events (program listing) ---------- */
  .program{
    margin:0 20px 24px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .program-item{
    display:flex; gap:14px;
    padding:15px 16px;
    align-items:flex-start;
  }
  .program-item + .program-item{ border-top:1px solid var(--line); }

  .measure{
    flex:none;
    font-family:'Roboto Mono',monospace;
    font-size:10px;
    color:var(--brass-deep);
    border:1px solid var(--brass);
    border-radius:5px;
    padding:2px 5px;
    margin-top:2px;
    min-width:26px;
    text-align:center;
  }

  .program-date{
    flex:none;
    width:46px;
    text-align:center;
  }
  .program-date .d{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    font-size:20px;
    line-height:1.05;
    color:var(--ink);
  }
  .program-date .m{
    font-family:'Roboto Mono',monospace;
    font-size:9.5px;
    color:var(--ink-soft);
    letter-spacing:.05em;
  }

  .program-body{ flex:1; min-width:0; }
  .program-title{
    font-weight:700; font-size:13.5px; color:var(--ink);
    display:flex; align-items:center; gap:7px; flex-wrap:wrap;
  }
  .kind{
    font-family:'Roboto Mono',monospace;
    font-size:9.5px; letter-spacing:.05em;
    padding:1.5px 6px; border-radius:5px;
    font-weight:600;
  }
  .empty{ padding:36px 20px; text-align:center; font-size:13px; color:var(--ink-soft); }
  .hero-empty{ padding:14px 0 18px; text-align:center; font-size:13px; color:#D9D2BC; }

  .program-meta{
    margin-top:4px;
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.5;
  }

  /* ---------- 即將到來：橫向捲動卡條（取代原本直向列表） ---------- */
  .event-strip{
    display:flex; gap:10px; overflow-x:auto;
    margin:0 0 24px; padding:0 20px 4px;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .event-strip::-webkit-scrollbar{ display:none; }
  .event-chip{
    position:relative; flex:0 0 132px;
    background:var(--paper-raised); border:1px solid var(--line);
    border-radius:var(--radius-md); padding:10px; box-shadow:var(--shadow-card);
  }
  .event-chip .d{ font-family:'Roboto Mono',monospace; font-size:10px; color:var(--brass-deep); }
  .event-chip .t{ font-size:12px; font-weight:700; margin-top:3px; line-height:1.35; color:var(--ink); }
  .event-chip .l{ font-size:10.5px; color:var(--ink-soft); margin-top:3px; }
  /* 最近一場用尺寸放大做出差異，不換色，其餘幾場微縮小退居次要 */
  .event-chip:first-child{ flex-basis:158px; padding:13px; }
  .event-chip:first-child .d{ font-size:11px; }
  .event-chip:first-child .t{ font-size:15px; margin-top:5px; }
  .event-chip:first-child .l{ font-size:11px; margin-top:5px; }
  .event-chip:not(:first-child){ opacity:.88; transform:scale(.96); transform-origin:left center; }
  .chip-rsvp{
    position:absolute; top:6px; right:6px; width:16px; height:16px; border-radius:50%;
    font-size:9px; font-weight:700; line-height:16px; text-align:center; color:#F2EFE5;
  }
  .chip-rsvp.attending{ background:var(--sage); }
  .chip-rsvp.leave{ background:var(--burgundy); }

  /* ---------- 出缺席回報橫幅 ---------- */
  /* 深色語彙跟 .ticker 呼應，避免夾在公告 ticker 跟團練 hero 卡片中間時深淺跳動的割裂感；
     只靠左側色條 + 文字色（粉調）區分「這是待辦提醒」不是「這是公告」 */
  .rsvp-banner{
    display:flex; align-items:center; gap:10px;
    margin:2px 20px 18px;
    background:var(--ink); color:#E8A9B4;
    border-radius:var(--radius-md); padding:12px 14px;
    box-shadow:var(--shadow-card); border:none;
    cursor:pointer; text-align:left; width:calc(100% - 40px);
  }
  .rsvp-banner .stripe{ flex:none; width:3px; align-self:stretch; background:#D4788C; border-radius:2px; }
  .rsvp-banner .ico{ flex:none; width:20px; height:20px; }
  .rsvp-banner .txt{ flex:1; font-size:13px; font-weight:500; line-height:1.5; }
  .rsvp-banner .chev{ flex:none; opacity:.7; }

  /* ---------- 審核中狀態橫幅：跟出缺席回報橫幅同一套深色語彙，差別是不可點擊、
     持續顯示到審核通過為止，刻意放在分頁外（跟公告 ticker 同層級），
     不論切到「個人焦點」或「團務總覽」都看得到 ---------- */
  .pending-banner{ cursor:default; margin:2px 20px 18px; }

  /* ---------- 通知中心 sheet ---------- */
  .notif-section-label{
    font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--brass-deep); margin:0 0 8px;
  }
  .notif-section{ margin-bottom:20px; }
  .notif-row{
    display:flex; align-items:center; gap:10px;
    padding:12px 13px; background:var(--paper); border:1px solid var(--line);
    border-radius:12px; margin-bottom:8px; cursor:pointer; text-align:left; width:100%;
  }
  .notif-row .dot{ flex:none; width:7px; height:7px; border-radius:50%; background:var(--burgundy); }
  .notif-row .dot.dot-read{ background:var(--line); }
  .notif-row .body{ flex:1; min-width:0; }
  .notif-row .title{ font-size:12.5px; color:var(--ink); font-weight:700; }
  .notif-row .meta{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .notif-row .chev{ flex:none; color:var(--brass-deep); }
  .notif-empty{ font-size:12px; color:var(--ink-soft); padding:6px 2px 14px; }
  .notif-viewall{
    display:block; width:100%; background:none; border:none;
    text-align:center; font-size:12px; font-weight:700; color:var(--brass-deep);
    padding:6px; cursor:pointer;
  }

  /* ---------- 通知開關推廣提示：這個 App 目前唯一的置中 modal（其他地方都是底部 sheet），
     刻意做成跟平常操作不一樣的樣式，凸顯這是比較重要的一次性提醒。沒有點背景關閉，
     一定要點到其中一顆按鈕才會消失 ---------- */
  .notif-prompt-overlay{
    position:fixed; inset:0; z-index:90;
    background:rgba(32,36,47,.5);
    display:none; align-items:center; justify-content:center;
    padding:0 28px;
  }
  .notif-prompt-overlay.active{ display:flex; }
  .notif-prompt-card{
    width:100%; max-width:320px;
    background:var(--paper-raised);
    border-radius:18px;
    box-shadow:0 20px 40px -12px rgba(32,36,47,.4);
    padding:22px 20px 20px;
  }
  .notif-prompt-card svg{ display:block; margin:0 auto 14px; }
  .notif-prompt-title{
    text-align:center; font-family:'Noto Serif TC',serif; font-weight:700;
    font-size:16px; color:var(--ink); line-height:1.5;
  }
  .notif-prompt-sub{ text-align:center; font-size:12px; color:var(--ink-soft); line-height:1.65; margin-top:8px; }
  .notif-prompt-card .cta-btn{ width:100%; margin-top:20px; }
  .notif-prompt-later{
    display:block; width:100%; margin-top:8px; background:none; border:none;
    text-align:center; color:var(--ink-soft); font-size:12.5px; font-weight:700;
    cursor:pointer; padding:10px 4px;
  }

  /* ---------- RSVP bottom sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0; z-index:80;
    background:rgba(32,36,47,.45);
    display:none; align-items:flex-end; justify-content:center;
  }
  .sheet-overlay.active{ display:flex; }
  .sheet{
    width:100%; max-width:460px; max-height:85vh;
    background:var(--paper-raised);
    border-radius:20px 20px 0 0;
    display:flex; flex-direction:column;
    box-shadow:0 -10px 30px rgba(32,36,47,.3);
  }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:999px; margin:10px auto 2px; }
  .sheet-header{ position:relative; padding:6px 44px 12px 20px; border-bottom:1px solid var(--line); }
  .sheet-header .name{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:16px; }
  .sheet-header .account{ font-family:'Roboto Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .sheet-close{
    position:absolute; top:4px; right:10px;
    width:30px; height:30px; border-radius:50%; border:none; background:none;
    color:var(--ink-soft); font-size:19px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .sheet-close:active{ background:var(--paper); }
  .sheet-body{ overflow-y:auto; padding:16px 20px 8px; }
  .sheet-footer{
    display:flex; gap:10px;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .status-picker{ display:flex; gap:8px; }
  .status-chip-btn{
    flex:1; text-align:center; padding:11px 4px;
    border-radius:var(--radius-sm); border:1px solid var(--line);
    font-size:13px; font-weight:700; color:var(--ink-soft); background:var(--paper); cursor:pointer;
  }
  .status-chip-btn.selected.attending{ background:var(--sage); color:#F2EFE5; border-color:var(--sage); }
  .status-chip-btn.selected.leave{ background:var(--burgundy); color:#F2EFE5; border-color:var(--burgundy); }
  .field{ margin-top:14px; display:flex; flex-direction:column; gap:6px; }
  .field label{
    font-family:'Roboto Mono',monospace; font-size:10.5px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);
  }
  .field textarea{
    border:1px solid var(--line); background:var(--paper);
    border-radius:var(--radius-sm); padding:11px 13px;
    font-size:14px; color:var(--ink); width:100%; font-family:inherit; resize:vertical; min-height:72px;
  }
  .form-error{
    margin-top:12px; font-size:12.5px; color:var(--burgundy);
    background:#FBF3F3; border:1px solid #EFD4D8; border-radius:var(--radius-sm);
    padding:10px 12px;
  }
  .cta-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--brass); color:var(--ink); border:none;
    border-radius:var(--radius-md); padding:13px 16px;
    font-weight:700; font-size:14px; cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .cta-btn:hover{ background:#C7963F; }
  .cta-btn:active{ transform:scale(.98); background:var(--brass-deep); }
  .cta-btn:disabled{ opacity:.55; cursor:default; transform:none; }
  .cta-btn-secondary{ background:var(--paper); color:var(--ink-soft); border:1px solid var(--line); }
  .cta-btn-secondary:hover{ background:var(--paper-raised); }
  .cta-btn-secondary:active{ transform:scale(.98); background:var(--paper); }

  /* ---------- Bottom tab bar ---------- */
  .tabbar{
    position:sticky;
    bottom:0;
    margin-top:auto;
    background:var(--paper-raised);
    border-top:1px solid var(--line);
    padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
    display:flex;
    justify-content:space-around;
  }
  .tab{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; cursor:pointer;
    color:var(--ink-soft); text-decoration:none;
    font-family:'Noto Sans TC',sans-serif;
    font-size:10.5px;
    padding:4px 10px;
  }
  .tab.active{ color:var(--burgundy); }
  .tab .ico{ width:20px; height:20px; }
  .tab.tab-soon{ opacity:.42; }

  @media (prefers-reduced-motion: reduce){
    .checkin-btn{ transition:none; }
  }

  .hidden{ display:none !important; }

  /* ---------- Skeleton placeholders ---------- */
  @keyframes skel-pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  .skel{ background:var(--line); animation:skel-pulse 1.4s ease-in-out infinite; }
  .skel-dark{ background:rgba(242,239,229,.16); animation:skel-pulse 1.4s ease-in-out infinite; }
  .avatar.skel{ animation:skel-pulse 1.4s ease-in-out infinite; }
  .skel-bar{ display:block; border-radius:5px; }
  @media (prefers-reduced-motion: reduce){
    .skel, .skel-dark, .avatar.skel{ animation:none; opacity:.75; }
  }

  .hero-skel-top{ display:flex; justify-content:space-between; align-items:center; }
  .hero-skel-rows{ margin-top:16px; display:flex; flex-direction:column; gap:10px; }

  .program-skel-item{ display:flex; gap:14px; padding:15px 16px; align-items:center; }
  .program-skel-item + .program-skel-item{ border-top:1px solid var(--line); }
  .program-skel-date{ flex:none; width:46px; height:34px; border-radius:6px; }
  .program-skel-body{ flex:1; display:flex; flex-direction:column; gap:7px; }
</style>
</head>
<body>
<div class="app" id="appRoot">

  <!-- App Bar -->
  <div class="appbar">
    <img class="mark" src="assets/BrioLogo.jpg" alt="布利歐管樂團 Logo">
    <div class="brandtext">
      <div class="name">布利歐管樂團</div>
      <div class="sub">Brio Wind Band</div>
    </div>
    <div class="spacer"></div>
    <a class="bell-btn hidden" id="conductorBtn" href="conductor-admin.html" aria-label="指揮後台">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M8.5 16.5 18.5 6.5" stroke="#20242F" stroke-width="1.5" stroke-linecap="round"/><path d="M8.3 16.8C9.455 20.52 10.4 22.5 10.4 23A2.1 2.1 0 1 1 6.2 23C6.2 22.5 7.145 20.52 8.3 16.8Z" fill="#20242F" transform="rotate(45 8.3 16.8)"/></svg>
    </a>
    <button class="bell-btn" id="notifBtn" type="button" aria-label="通知">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M6 9a6 6 0 0 1 12 0v4l1.8 3.2a.6.6 0 0 1-.5.9H4.7a.6.6 0 0 1-.5-.9L6 13V9Z" stroke="#20242F" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 19.5a2.5 2.5 0 0 0 5 0" stroke="#20242F" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="notif-dot hidden" id="notifDot"></span>
    </button>
  </div>

  <div class="staff"></div>

  <!-- 公告 Announcement -->
  <div class="ticker-wrap hidden" id="announceWrap">
    <div class="ticker">
      <svg class="ico" viewBox="0 0 24 24" fill="none"><path d="M3 10v4a1 1 0 0 0 1 1h2l6 4V5L6 9H4a1 1 0 0 0-1 1Z" stroke="#B8863A" stroke-width="1.5" stroke-linejoin="round"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="#B8863A" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div class="body">
        <div class="headline" id="announceHeadline"></div>
        <div class="meta">
          <span id="announceMeta"></span>
          <button class="more hidden" id="announceMoreBtn" type="button"></button>
        </div>
      </div>
    </div>
    <div class="announce-list hidden" id="announceList"></div>
  </div>

  <!-- 審核中狀態橫幅：帳號還在審核中時常駐顯示，刻意放在分頁外，切哪個分頁都看得到 -->
  <div class="rsvp-banner pending-banner hidden" id="pendingBanner">
    <span class="stripe"></span>
    <svg class="ico" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span class="txt">帳號審核中，通過後即可使用完整功能</span>
  </div>

  <!-- 個人焦點／團務總覽 分頁：待辦、團練資訊、活動這些「跟我有關」的放個人焦點，
       非急迫的參考資訊放團務總覽；公告因為可能包含場地異動等時效性資訊，刻意留在分頁外常駐顯示 -->
  <div class="seg-tabs" role="tablist">
    <button type="button" class="seg-tab active" id="segTabPersonal" role="tab" aria-selected="true">個人焦點</button>
    <button type="button" class="seg-tab" id="segTabOverview" role="tab" aria-selected="false">團務總覽</button>
  </div>

  <div class="seg-panel" id="segPanelPersonal">

  <!-- 出缺席回報橫幅：只有自己在某場活動的參與名單內、且尚未回報時才顯示 -->
  <button type="button" class="rsvp-banner hidden" id="rsvpBanner">
    <span class="stripe"></span>
    <svg class="ico" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M4 10h16M9 3v4M15 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9 14l2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="txt" id="rsvpBannerText"></span>
    <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <!-- 團費待辦橫幅：自己在某筆應繳項目名單內、且還沒有對應繳費紀錄時才顯示，
       跟出缺席回報橫幅同一套深色語彙（.rsvp-banner），點擊切到「團務總覽」分頁查詳情 -->
  <button type="button" class="rsvp-banner hidden" id="feeDueBanner">
    <span class="stripe"></span>
    <svg class="ico" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v10M15 9h-4.5a1.5 1.5 0 0 0 0 3h3a1.5 1.5 0 0 1 0 3h-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="txt" id="feeDueBannerText"></span>
    <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <!-- 練習資訊 Hero：卡片本身（深色票券樣式＋大字日期）已經足夠說明這是下一次團練，
       不再另外加一條「下一次團練」標籤，避免每個區塊上面都疊一條小標籤 -->
  <div class="hero">
    <div class="staff-bg"></div>
    <div class="hero-inner">
      <div id="heroSkeleton">
        <div class="hero-skel-top">
          <span class="skel-dark skel-bar" style="width:72px;height:11px;"></span>
          <span class="skel-dark skel-bar" style="width:52px;height:20px;border-radius:999px;"></span>
        </div>
        <div class="hero-skel-rows">
          <span class="skel-dark skel-bar" style="width:96px;height:36px;"></span>
          <span class="skel-dark skel-bar" style="width:100%;height:13px;"></span>
          <span class="skel-dark skel-bar" style="width:70%;height:13px;"></span>
        </div>
      </div>
      <div id="heroContent" class="hidden">
        <div class="hero-top">
          <span class="hero-eyebrow" id="heroEyebrow"></span>
          <span class="countdown-chip" id="heroCountdown"></span>
        </div>

        <div class="hero-date">
          <span class="num" id="heroDateNum"></span>
          <span class="dow" id="heroDateDow"></span>
          <span class="rsvp-status-chip hidden" id="heroRsvpChip"></span>
        </div>

        <div class="hero-rows">
          <div class="hero-row">
            <svg class="ico" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#F2EFE5" stroke-width="1.5"/><path d="M12 7v5l3 2" stroke="#F2EFE5" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span class="label">時間</span>
            <span class="val" id="heroTimeVal"></span>
          </div>
          <div class="hero-row">
            <svg class="ico" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z" stroke="#F2EFE5" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.2" stroke="#F2EFE5" stroke-width="1.5"/></svg>
            <span class="label">地點</span>
            <span class="val" id="heroLocationVal"></span>
          </div>
          <div class="hero-row">
            <svg class="ico" viewBox="0 0 24 24" fill="none"><path d="M9 18V5l12-2v13" stroke="#F2EFE5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="#F2EFE5" stroke-width="1.5"/><circle cx="18" cy="16" r="3" stroke="#F2EFE5" stroke-width="1.5"/></svg>
            <span class="label">曲目</span>
            <span class="val" id="heroRepertoireVal"></span>
          </div>
        </div>
      </div>
      <div class="hero-empty hidden" id="heroEmpty">目前沒有排定的團練</div>

      <div class="checkin" id="checkinBlock">
        <div class="checkin-msg" id="checkinSkeleton">
          <span class="skel-dark skel-bar" style="width:200px;height:44px;border-radius:12px;margin:0 auto;"></span>
          <span class="skel-dark skel-bar" style="width:140px;height:11px;margin:10px auto 0;"></span>
        </div>
        <div class="checkin-msg muted hidden" id="checkinNotOpen">尚未開放簽到</div>
        <div id="checkinOpenState" class="hidden">
          <button class="checkin-btn" id="checkinBtn">
            <svg class="ico" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="#20242F" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="#20242F" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="#20242F" stroke-width="1.6"/><path d="M14 14h3v3h-3zM19 14h2v2h-2zM14 19h2v2h-2zM19 19h2v2h-2z" fill="#20242F"/></svg>
            掃描 QR Code 簽到
          </button>
          <div class="checkin-sub" id="checkinSub">請掃描現場的簽到 QR Code</div>
        </div>
        <div class="checkin-msg muted hidden" id="checkinExpired">尚未開放簽到</div>
        <div class="checkin-msg done hidden" id="checkinDone">已簽到</div>
      </div>
    </div>
  </div>

  <!-- 即將到來的活動 -->
  <div class="section-label">
    <span class="tw">即將到來的活動</span>
  </div>

  <div class="event-strip" id="programSkeleton">
    <div class="event-chip"><span class="skel skel-bar" style="width:100%;height:13px;"></span><span class="skel skel-bar" style="width:70%;height:11px;margin-top:6px;"></span></div>
    <div class="event-chip"><span class="skel skel-bar" style="width:100%;height:13px;"></span><span class="skel skel-bar" style="width:70%;height:11px;margin-top:6px;"></span></div>
    <div class="event-chip"><span class="skel skel-bar" style="width:100%;height:13px;"></span><span class="skel skel-bar" style="width:70%;height:11px;margin-top:6px;"></span></div>
  </div>
  <div class="event-strip hidden" id="programList"></div>
  <div class="empty hidden" id="programEmpty">目前沒有即將到來的活動</div>

  </div>

  <!-- 團務總覽：非急迫的參考資訊，目前有「我的音樂會」，之後如果有團費繳交紀錄、
       行事曆檢視等功能也會放在這裡 -->
  <div class="seg-panel hidden" id="segPanelOverview">
    <div class="overview-empty" id="overviewEmptyMsg">目前沒有其他團務資訊</div>
    <div id="myConcertsWrap" class="hidden">
      <div class="section-label" style="margin:8px 20px 4px;"><span class="tw">我的音樂會</span></div>
      <div id="myConcertsSlot"></div>
    </div>
    <div id="myFeeDuesWrap" class="hidden">
      <div class="section-label" style="margin:8px 20px 4px;"><span class="tw">我的團費</span></div>
      <div id="myFeeDuesSlot"></div>
    </div>
  </div>

  <!-- Bottom tab bar -->
  <div class="tabbar">
    <a class="tab active" href="index.html">
      <svg class="ico" viewBox="0 0 24 24" fill="none"><path d="M4 11 12 4l8 7" stroke="#7A2331" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9h12v-9" stroke="#7A2331" stroke-width="1.6" stroke-linejoin="round"/></svg>
      首頁
    </a>
    <button class="tab tab-soon">
      <svg class="ico" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="16" rx="2" stroke="#4A4F5C" stroke-width="1.6"/><path d="M4 10h16M9 3v4M15 3v4" stroke="#4A4F5C" stroke-width="1.6" stroke-linecap="round"/></svg>
      行事曆
    </button>
    <button class="tab tab-soon">
      <svg class="ico" viewBox="0 0 24 24" fill="none"><path d="M6 4h9l3 3v13H6z" stroke="#4A4F5C" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 11h6M9 14h6M9 17h4" stroke="#4A4F5C" stroke-width="1.6" stroke-linecap="round"/></svg>
      譜夾
    </button>
    <a class="tab" href="profile.html" id="tabProfileLink">
      <span class="avatar tab-avatar skel" id="tabAvatarIcon"></span>
      我的
    </a>
  </div>


</div>

<div class="scan-overlay" id="scanOverlay">
  <div class="scan-frame">
    <video id="scanVideo" playsinline autoplay muted></video>
    <div class="scan-guide"></div>
  </div>
  <p class="scan-hint" id="scanHint">將 QR Code 對準框內</p>
  <button type="button" class="scan-cancel" id="scanCancelBtn">取消</button>
</div>

<!-- 出缺席回報 Bottom Sheet -->
<div class="sheet-overlay" id="rsvpSheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <button type="button" class="sheet-close" id="rsvpSheetClose" aria-label="關閉">×</button>
      <div class="name" id="rsvpSheetTitle">—</div>
      <div class="account" id="rsvpSheetMeta">—</div>
    </div>
    <div class="sheet-body">
      <div class="status-picker">
        <button type="button" class="status-chip-btn attending" data-rsvp-status="attending">出席</button>
        <button type="button" class="status-chip-btn leave" data-rsvp-status="leave">請假</button>
      </div>
      <div class="field hidden" id="rsvpReasonField">
        <label>請假原因(選填)</label>
        <textarea id="rsvpReasonInput" placeholder=""></textarea>
      </div>
      <p class="form-error hidden" id="rsvpFormError"></p>
    </div>
    <div class="sheet-footer">
      <button type="button" class="cta-btn cta-btn-secondary" id="rsvpCancelBtn">取消</button>
      <button type="button" class="cta-btn" id="rsvpSubmitBtn">送出回報</button>
    </div>
  </div>
</div>

<!-- 通知中心 Bottom Sheet -->
<div class="sheet-overlay" id="notifSheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <button type="button" class="sheet-close" id="notifSheetClose" aria-label="關閉">×</button>
      <div class="name">通知</div>
    </div>
    <div class="sheet-body">
      <div class="notif-section">
        <div class="notif-section-label">待辦事項</div>
        <div id="notifTodoList"></div>
      </div>
      <div class="notif-section">
        <div class="notif-section-label">公告</div>
        <div id="notifAnnounceList"></div>
      </div>
    </div>
  </div>
</div>

<!-- 推播通知開關推廣提示：置中 modal，一定要點按鈕才會關閉 -->
<div class="notif-prompt-overlay" id="notifPromptOverlay">
  <div class="notif-prompt-card">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M6 9a6 6 0 0 1 12 0v4l1.8 3.2a.6.6 0 0 1-.5.9H4.7a.6.6 0 0 1-.5-.9L6 13V9Z" stroke="#20242F" stroke-width="1.5" stroke-linejoin="round"/><path d="M9.5 19.5a2.5 2.5 0 0 0 5 0" stroke="#20242F" stroke-width="1.5" stroke-linecap="round"/></svg>
    <div class="notif-prompt-title">推播通知功能即將上線</div>
    <div class="notif-prompt-sub">開啟後可以直接收到出缺席調查、團費繳納或活動通知等推播提醒。在「個人中心」裡也隨時可以調整。</div>
    <button type="button" class="cta-btn" id="notifPromptEnableBtn">立即開啟</button>
    <button type="button" class="notif-prompt-later" id="notifPromptLaterBtn">稍後再說</button>
  </div>

  <img id="qrZoomImg" alt="收款 QR Code 放大">
</div>

<script type="module">
  import { showToast } from './toast.js';
  import { subscribeRemittanceAccounts } from './finance.js';
  import { resolveMemberAccess, peekCachedProfile } from './auth-guard.js';
  import { subscribeEventTypes } from './event-types.js';
  import { db } from './firebase-init.js';
  import { VAPID_PUBLIC_KEY } from './push-config.js';
  import {
    collection, query, where, orderBy, limit, onSnapshot, Timestamp,
    doc, getDoc, getDocs, setDoc, serverTimestamp
  } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  // 還沒做的分頁（行事曆/譜夾）：反灰 + 點擊顯示提示，不依賴登入驗證結果，
  // 跟下面的骨架畫面一樣頁面一開始就能動作。同一顆 toast 也給下面的「鎖定」提示共用，
  // 只是文案不同（訪客/審核中點到鎖住的功能）。改用共用的 toast.js 之後，
  // 這裡原本自己的 showToast()/#soonToast 元件整個拿掉，call site 不用改
  document.querySelectorAll('.tab-soon').forEach(function(btn){
    btn.addEventListener('click', function(){ showToast('即將推出'); });
  });

  // 個人焦點／團務總覽 分頁切換：純畫面狀態。「團務總覽」只鎖訪客（未登入）——
  // 審核中已經是真團員，讀取權限跟已核准一樣，只差在不能做簽到/回報這類寫入操作，
  // 驗證完成前先預設鎖住，避免訪客在畫面剛載入、還不知道身分的瞬間點得進去
  var segTabPersonal = document.getElementById('segTabPersonal');
  var segTabOverview = document.getElementById('segTabOverview');
  var segPanelPersonal = document.getElementById('segPanelPersonal');
  var segPanelOverview = document.getElementById('segPanelOverview');
  var overviewLocked = true;
  // 「我的音樂會」要撈 concertRosters/repertoire/各場曲目+分部，是這一頁最重的一組讀取。
  // 首頁預設停在「個人焦點」分頁，所以改成第一次真的切到「團務總覽」才載入，載過就不再重撈。
  // 載入函式由下方身分驗證完成的區塊掛上來（那裡才拿得到 viewerUid）
  var overviewLazyLoad = null;
  var overviewLazyRequested = false;
  var overviewLazyLoaded = false;

  function runOverviewLazyLoad(){
    overviewLazyRequested = true;
    if (overviewLazyLoaded || !overviewLazyLoad) return;
    overviewLazyLoaded = true;
    overviewLazyLoad();
  }

  // 若使用者在載入函式掛上來之前就已經切到「團務總覽」，掛上的當下立刻補跑一次
  function setOverviewLazyLoad(fn){
    overviewLazyLoad = fn;
    if (overviewLazyRequested) runOverviewLazyLoad();
  }

  function selectSegTab(tab){
    var isPersonal = tab === 'personal';
    segTabPersonal.classList.toggle('active', isPersonal);
    segTabOverview.classList.toggle('active', !isPersonal);
    segTabPersonal.setAttribute('aria-selected', String(isPersonal));
    segTabOverview.setAttribute('aria-selected', String(!isPersonal));
    segPanelPersonal.classList.toggle('hidden', !isPersonal);
    segPanelOverview.classList.toggle('hidden', isPersonal);
  }

  segTabPersonal.addEventListener('click', function(){ selectSegTab('personal'); });
  segTabOverview.addEventListener('click', function(){
    if (overviewLocked){ showToast('請先登入後即可查看'); return; }
    selectSegTab('overview');
    runOverviewLazyLoad();
  });

  // 骨架畫面：頁面一開始就顯示（不等驗證），大頭貼縮寫不是敏感資訊，
  // 有快取先猜著填，猜錯也不影響安全性，真正驗證完成後下面還是會覆寫成正確結果
  var cachedProfile = peekCachedProfile();
  if (cachedProfile && cachedProfile.name){
    var tabAvatarIconEl = document.getElementById('tabAvatarIcon');
    tabAvatarIconEl.textContent = cachedProfile.name.charAt(0);
    tabAvatarIconEl.classList.remove('skel');
  }

  // 比照 ios-install.js 的寫法內聯複製一份，專案慣例：不共用邏輯檔
  function isIOS(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  }
  function isStandalone(){
    return window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;
  }
  function urlBase64ToUint8Array(base64String){
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    var rawData = window.atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for (var i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  // ---------- 公開內容（首頁團練資訊/活動列表/公告）：訪客／審核中／已核准都看得到，
  // 不等身分驗證完成就先掛上監聽，資料本身跟登入狀態無關 ----------
  var WEEKDAY = ['日', '一', '二', '三', '四', '五', '六'];
  var eventTypesById = {};
  var latestEvents = [];
  var rsvpReportsByEvent = {}; // 只有已核准/審核中會員登入後才會真的有資料，訪客維持空物件、畫面自然不顯示回報標籤
  var myFeeDuesList = []; // 自己在 memberIds 名單內、且未作廢的應繳項目
  var myFeePaymentsByDueId = {}; // dueId -> 自己的繳費紀錄（未作廢）
  var remittanceAccountsById = {}; // 匯款帳戶庫，只用來即時查 QR Code（銀行/帳號/戶名走 feeDues 自己的欄位快照）

  var viewerState = null; // 'guest' | 'pending' | 'approved'，身分驗證完成後才有值
  var viewerUid = null;
  var viewerProfile = null;
  // null＝可以正常掃碼，非 null＝鎖住時點擊要顯示的提示文字。預設鎖住（身分驗證還沒有結果前
  // 一律當作鎖住），避免驗證完成前的瞬間被搶先點到，誤觸真的開相機
  var checkinLockedMessage = '驗證身分中，請稍候';

  function formatEventTime(evt){
      if (evt.allDay) return '全天';
      var start = evt.date.toLocaleString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false });
      if (!evt.endTime) return start + ' 開始';
      var end = evt.endTime.toLocaleString('zh-TW', { hour:'2-digit', minute:'2-digit', hour12:false });
      return start + '–' + end;
    }

    function formatCountdown(date){
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var target = new Date(date);
      target.setHours(0, 0, 0, 0);
      var days = Math.round((target - today) / 86400000);
      if (days <= 0) return '今天';
      if (days === 1) return '明天';
      return days + ' 天後';
    }

    function renderRsvpChip(el, eventId){
      var report = rsvpReportsByEvent[eventId];
      if (!report){
        el.classList.add('hidden');
        return;
      }
      el.classList.remove('hidden');
      el.classList.toggle('attending', report.status === 'attending');
      el.classList.toggle('leave', report.status === 'leave');
      el.textContent = report.status === 'leave' ? '已回報：請假' : '已回報：出席';
    }

    var lastCheckinFetchedEventId = null;

    function renderHero(nextRehearsal){
      var content = document.getElementById('heroContent');
      var empty = document.getElementById('heroEmpty');
      document.getElementById('heroSkeleton').classList.add('hidden');
      if (!nextRehearsal){
        content.classList.add('hidden');
        empty.classList.remove('hidden');
        // 沒有下一場團練就沒有簽到的對象，整塊連同骨架一起藏起來，避免卡在骨架屏
        document.getElementById('checkinBlock').classList.add('hidden');
        lastCheckinFetchedEventId = null;
        return;
      }
      empty.classList.add('hidden');
      content.classList.remove('hidden');
      document.getElementById('checkinBlock').classList.remove('hidden');
      document.getElementById('heroEyebrow').textContent = nextRehearsal.title;
      document.getElementById('heroCountdown').textContent = formatCountdown(nextRehearsal.date);
      document.getElementById('heroDateNum').textContent =
        (nextRehearsal.date.getMonth() + 1) + '.' + nextRehearsal.date.getDate();
      document.getElementById('heroDateDow').textContent = '星期' + WEEKDAY[nextRehearsal.date.getDay()];
      document.getElementById('heroTimeVal').textContent = formatEventTime(nextRehearsal);
      document.getElementById('heroLocationVal').textContent = nextRehearsal.location || '地點未定';
      document.getElementById('heroRepertoireVal').textContent =
        nextRehearsal.repertoire.length > 0 ? nextRehearsal.repertoire.join('、') : '曲目未定';
      renderRsvpChip(document.getElementById('heroRsvpChip'), nextRehearsal.id);

      if (lastCheckinFetchedEventId !== nextRehearsal.id){
        lastCheckinFetchedEventId = nextRehearsal.id;
        syncCheckinLock();
      }
    }

    // 簽到狀態四態：已簽到（checkins 有紀錄）優先於其他三態；
    // 其餘看 checkinSessions/{eventId} 存不存在、windowEnd 有沒有過期。
    // 訪客／審核中不查真正的簽到狀態（反正按鈕本身就鎖住），一律借用「開放中」版位顯示鎖定按鈕
    function renderCheckinState(state){
      document.getElementById('checkinSkeleton').classList.add('hidden');
      document.getElementById('checkinNotOpen').classList.toggle('hidden', state !== 'notopen');
      document.getElementById('checkinOpenState').classList.toggle('hidden', state !== 'open');
      document.getElementById('checkinExpired').classList.toggle('hidden', state !== 'expired');
      document.getElementById('checkinDone').classList.toggle('hidden', state !== 'done');
    }

    // 團練卡片換了場、或身分驗證結果剛出爐時都要重新同步一次——這兩個時機點誰先誰後不一定
    // （events 監聽可能比驗證早跑完），只看目前這場團練該不該真的去查簽到狀態
    function syncCheckinLock(){
      if (!lastCheckinFetchedEventId) return;
      // events 監聽（公開讀取）通常比 resolveMemberAccess() 先跑完，這個當下 viewerState
      // 還是預設值 null，不是真的判斷出「訪客/審核中」——原本這裡把「還沒解出身分」誤當成
      // 「非已核准」處理，會在身分驗證完成前就先把骨架屏換成看起來像可以按的簽到按鈕
      if (viewerState === null) return;
      if (viewerState === 'approved') refreshCheckinState(lastCheckinFetchedEventId);
      else renderCheckinState('open');
    }

    async function refreshCheckinState(eventId){
      try {
        var checkinSnap = await getDoc(doc(db, 'checkins', eventId + '_' + viewerUid));
        if (lastCheckinFetchedEventId !== eventId) return; // 這段等待期間團練資訊又換了，捨棄這次結果
        if (checkinSnap.exists()){
          renderCheckinState('done');
          return;
        }
        var sessionSnap = await getDoc(doc(db, 'checkinSessions', eventId));
        if (lastCheckinFetchedEventId !== eventId) return;
        if (!sessionSnap.exists()){
          renderCheckinState('notopen');
          return;
        }
        var windowEnd = sessionSnap.data().windowEnd;
        var stillOpen = windowEnd && windowEnd.toMillis() > Date.now();
        renderCheckinState(stillOpen ? 'open' : 'expired');
      } catch (err){
        console.error('讀取簽到狀態失敗', err);
        renderCheckinState('open'); // 讀取失敗時退回原本一律顯示按鈕的行為，不擋住簽到
      }
    }

    function renderProgram(events){
      var list = document.getElementById('programList');
      var empty = document.getElementById('programEmpty');
      document.getElementById('programSkeleton').classList.add('hidden');
      list.classList.remove('hidden');
      if (events.length === 0){
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      list.innerHTML = events.map(function(evt){
        var report = rsvpReportsByEvent[evt.id];
        var dotHtml = report
          ? '<span class="chip-rsvp ' + (report.status === 'leave' ? 'leave' : 'attending') + '">' + (report.status === 'leave' ? '假' : '✓') + '</span>'
          : '';
        return (
          '<div class="event-chip">' +
            dotHtml +
            '<div class="d">' + (evt.date.getMonth() + 1) + '/' + evt.date.getDate() + '（' + WEEKDAY[evt.date.getDay()] + '）</div>' +
            '<div class="t">' + evt.title + '</div>' +
            '<div class="l">' + (evt.location || '地點未定') + '</div>' +
          '</div>'
        );
      }).join('');
    }

    // 下界用「今天 00:00」而不是 Timestamp.now()——今天已經開始的活動（例如團練已經開始）
    // 還是要繼續留在名單裡，「下一次◯◯」才不會在活動開始的當下就提早切到更後面那場，
    // 而是照使用者定案的規則撐到當天結束（切到隔天 00:00）才換下一場
    var todayStart = new Date();
    todayStart.setHours(0, 0, 0, 0);
    var upcomingQuery = query(
      collection(db, 'events'),
      where('date', '>=', Timestamp.fromDate(todayStart)),
      orderBy('date', 'asc'),
      limit(20)
    );

    // 活動類型跟活動本身是兩份分開即時更新的資料，先等類型資料到齊過一次才開始畫，
    // 避免類型還沒載入時先顯示原始 ID 的畫面
    var typesLoaded = false;

    // 挑「下一次◯◯」要顯示哪一場：today 內如果有好幾場 homeHighlight 活動，不能只看
    // 開始時間排序取最早那場——那場結束後（endTime，沒填就視同開始時間）要換到今天下一場；
    // 今天的活動全部結束了、但還沒跨過午夜，維持顯示今天最後一場（撐到當天結束才換日）；
    // 今天完全沒有活動才會落到最近的未來日期
    function pickHighlightEvent(events){
      var highlightList = events.filter(function(evt){
        var t = eventTypesById[evt.type];
        return t && t.homeHighlight;
      });
      if (highlightList.length === 0) return null;

      var now = new Date();
      var todayStart = new Date(now);
      todayStart.setHours(0, 0, 0, 0);
      var todayEnd = new Date(todayStart);
      todayEnd.setDate(todayEnd.getDate() + 1);

      var todayList = highlightList.filter(function(evt){
        return evt.date >= todayStart && evt.date < todayEnd;
      });
      if (todayList.length === 0) return highlightList[0]; // 已按 date 升冪排序，第一個就是最近的未來活動

      var stillOngoing = todayList.find(function(evt){
        var effectiveEnd = evt.endTime || evt.date;
        return effectiveEnd >= now;
      });
      return stillOngoing || todayList[todayList.length - 1];
    }

    function renderEventsSection(){
      if (!typesLoaded) return;
      renderHero(pickHighlightEvent(latestEvents));
      renderProgram(latestEvents.slice(0, 5));
    }

    // 現場人多網路壅塞時，監聽本身可能失敗（原本沒有處理，會讓骨架屏卡住不動、
    // 就是「畫面一直等待/無法正常顯示」回報的主因之一），失敗時明確告知並讓使用者知道要重新整理
    function renderEventsError(){
      document.getElementById('heroSkeleton').classList.add('hidden');
      var heroEmpty = document.getElementById('heroEmpty');
      heroEmpty.textContent = '讀取失敗，請重新整理再試一次';
      heroEmpty.classList.remove('hidden');

      document.getElementById('programSkeleton').classList.add('hidden');
      var list = document.getElementById('programList');
      list.classList.add('hidden');
      list.innerHTML = '';
      var programEmpty = document.getElementById('programEmpty');
      programEmpty.textContent = '讀取失敗，請重新整理再試一次';
      programEmpty.classList.remove('hidden');
    }

    subscribeEventTypes(db, function(types){
      eventTypesById = {};
      types.forEach(function(t){ eventTypesById[t.id] = t; });
      typesLoaded = true;
      renderEventsSection();
    }, undefined, renderEventsError);

    onSnapshot(upcomingQuery, function(snap){
      latestEvents = snap.docs.map(function(docSnap){
        var data = docSnap.data();
        return {
          id: docSnap.id,
          title: data.title,
          type: data.type,
          date: data.date.toDate(),
          allDay: !!data.allDay,
          endTime: data.endTime && data.endTime.toDate ? data.endTime.toDate() : null,
          location: data.location,
          repertoire: Array.isArray(data.repertoire) ? data.repertoire : []
        };
      });

      renderEventsSection();
    }, renderEventsError);

    // 公告：接 announcements collection，最新一則當標題，其餘展開成清單
    function formatRelativeTime(date){
      var diffMs = Date.now() - date.getTime();
      var minutes = Math.floor(diffMs / 60000);
      if (minutes < 1) return '剛剛';
      if (minutes < 60) return minutes + ' 分鐘前';
      var hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + ' 小時前';
      var days = Math.floor(hours / 24);
      if (days === 1) return '昨天';
      if (days < 7) return days + ' 天前';
      return date.toLocaleDateString('zh-TW', { month:'numeric', day:'numeric' });
    }

    var announceMoreBtn = document.getElementById('announceMoreBtn');
    var announceList = document.getElementById('announceList');

    announceMoreBtn.addEventListener('click', function(){
      announceList.classList.toggle('hidden');
    });

    // 通知中心：最近幾則公告（跟首頁 ticker 共用同一份 limit(5) 監聽資料，不額外查詢）
    // + 未讀判斷（createdAt 晚於 notificationsReadAt 才算未讀，開通知面板時會更新這個時間戳）。
    // notificationsReadAt 刻意用即時監聽讀自己的 users/{uid} 文件，不是拿 auth-guard.js 那份
    // 有 5 分鐘同分頁快取的 profile——那份快取是設計給角色/審核狀態這種低頻變動的欄位用，
    // notificationsReadAt 每次開通知中心就會更新，用快取會導致「讀完馬上重新整理，紅點卻又出現」
    var latestAnnouncements = [];
    var notificationsReadAt = null;
    var NOTIF_ANNOUNCE_LIMIT = 3;

    // 公告清單每一列的紅點：跟鈴鐺數字徽章（renderNotifDot）不同，這裡要凍結成「這次打開
    // 通知中心當下」的未讀快照，而不是每次重繪都重新比對即時的 notificationsReadAt——
    // 開啟通知中心會立刻把 notificationsReadAt 更新成現在，如果紅點也跟著即時比對，
    // 停留期間清單一旦因為監聽觸發重繪（例如剛好有新公告進來），已經看到的紅點會忽然消失，
    // 觀感很奇怪。openNotifSheet() 開啟當下才重新算一次這份快照，關閉前都不會再變
    function computeUnreadAnnounceIds(){
      var set = {};
      latestAnnouncements.forEach(function(item){
        if (!notificationsReadAt || item.createdAt > notificationsReadAt) set[item.id] = true;
      });
      return set;
    }
    var unreadAnnounceIdsAtOpen = computeUnreadAnnounceIds();

    onSnapshot(query(collection(db, 'announcements'), orderBy('createdAt', 'desc'), limit(5)), function(snap){
      var items = snap.docs.map(function(docSnap){
        var data = docSnap.data();
        return {
          id: docSnap.id,
          content: data.content,
          createdAt: data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : new Date()
        };
      });

      latestAnnouncements = items;
      renderNotifDot();
      renderNotifSheet();

      var wrap = document.getElementById('announceWrap');
      if (items.length === 0){
        wrap.classList.add('hidden');
        return;
      }
      wrap.classList.remove('hidden');

      document.getElementById('announceHeadline').textContent = items[0].content;
      document.getElementById('announceMeta').textContent = formatRelativeTime(items[0].createdAt);

      var rest = items.slice(1);
      if (rest.length === 0){
        announceMoreBtn.classList.add('hidden');
        announceList.classList.add('hidden');
        announceList.innerHTML = '';
        return;
      }
      announceMoreBtn.classList.remove('hidden');
      announceMoreBtn.textContent = '還有 ' + rest.length + ' 則公告';
      announceList.innerHTML = rest.map(function(item){
        return (
          '<div class="announce-item">' +
            item.content +
            '<div class="t">' + formatRelativeTime(item.createdAt) + '</div>' +
          '</div>'
        );
      }).join('');
    });

    // 出缺席回報：查詢自己在哪些活動的參與名單內，橫幅提示尚未回報的活動，點擊直接開啟回報 sheet。
    // 訪客沒有 uid、審核中的人結構上不會出現在任何名單裡（見下方身分驗證區塊），
    // 這幾份監聽只有 approved/pending 才會真的訂閱，rsvpReportsByEvent 宣告在檔案上方共用
    var rsvpEventCache = {}; // eventId -> { title, date, location }
    var rsvpRosterEventIds = [];
    // 團員審核待辦：只有 admin/owner 會訂閱這個查詢（見下方身分驗證區塊），一般團員/指揮
    // 維持 0，不會出現在通知中心，也不會多打這個查詢（firestore.rules 對非 admin-tier
    // 本來就不會放行 list 這個 collection）
    var pendingReviewCount = 0;

    async function ensureRsvpEventInfo(eventId){
      if (rsvpEventCache[eventId]) return rsvpEventCache[eventId];
      var snap = await getDoc(doc(db, 'events', eventId));
      if (!snap.exists()) return null;
      var data = snap.data();
      var info = {
        title: data.title,
        date: data.date && data.date.toDate ? data.date.toDate() : null,
        location: data.location
      };
      rsvpEventCache[eventId] = info;
      return info;
    }

    // 待辦（尚未回報出缺席）的活動 id 清單，橫幅跟通知中心共用同一份計算，不重複寫
    function computePendingRsvpIds(){
      var pendingIds = rsvpRosterEventIds.filter(function(id){
        return rsvpEventCache[id] && !rsvpReportsByEvent[id];
      });
      pendingIds.sort(function(a, b){
        var ta = rsvpEventCache[a].date ? rsvpEventCache[a].date.getTime() : 0;
        var tb = rsvpEventCache[b].date ? rsvpEventCache[b].date.getTime() : 0;
        return ta - tb;
      });
      return pendingIds;
    }

    // 橫幅只提示「在名單內但還沒回報」的活動，跟「在名單內」（不論是否已回報）是不同的條件，要分開算。
    // 訪客沒有個人資料可查，這塊整個隱藏——結構上訪客/審核中也不會有資料（見上方說明），這裡只是防呆
    function renderRsvpBanner(){
      var banner = document.getElementById('rsvpBanner');
      if (viewerState !== 'approved' && viewerState !== 'pending'){
        banner.classList.add('hidden');
        return;
      }
      var pendingIds = computePendingRsvpIds();

      if (pendingIds.length === 0){
        banner.classList.add('hidden');
        return;
      }

      var nearestId = pendingIds[0];
      var text = pendingIds.length === 1
        ? '你尚未回報「' + rsvpEventCache[nearestId].title + '」的出缺席'
        : '你有 ' + pendingIds.length + ' 場活動尚未回報出缺席';

      document.getElementById('rsvpBannerText').textContent = text;
      banner.setAttribute('data-rsvp-open', nearestId);
      banner.classList.remove('hidden');
    }

    document.getElementById('rsvpBanner').addEventListener('click', function(){
      var id = this.getAttribute('data-rsvp-open');
      if (id) openRsvpSheet(id);
    });

    // 應繳金額依個別調整（memberOverrides）計算，跟 finance-admin.html 的 overrideAmountFor()
    // 同一套邏輯，這裡另外複製一份（專案慣例：不共用邏輯檔）
    function feeDueAmountForMe(due){
      if (due.memberOverrides && due.memberOverrides[viewerUid] != null) return due.memberOverrides[viewerUid];
      return due.amount;
    }

    // 待辦（尚未繳費）的應繳項目 id 清單，橫幅跟通知中心共用同一份計算，不重複寫
    function computePendingFeeDueIds(){
      return myFeeDuesList
        .filter(function(due){ return !myFeePaymentsByDueId[due.id]; })
        .map(function(due){ return due.id; })
        .sort(function(a, b){
          var da = myFeeDuesList.filter(function(d){ return d.id === a; })[0];
          var db = myFeeDuesList.filter(function(d){ return d.id === b; })[0];
          return (da.title || '').localeCompare(db.title || '', 'zh-Hant');
        });
    }

    // 團費待辦橫幅：只有自己在應繳項目名單內、且還沒繳費時才顯示，訪客沒有個人資料可查、
    // 結構上也不會出現在任何 memberIds 裡，這裡只是防呆
    function renderFeeDueBanner(){
      var banner = document.getElementById('feeDueBanner');
      if (viewerState !== 'approved' && viewerState !== 'pending'){
        banner.classList.add('hidden');
        return;
      }
      var pendingIds = computePendingFeeDueIds();
      if (pendingIds.length === 0){
        banner.classList.add('hidden');
        return;
      }
      var nearest = myFeeDuesList.filter(function(d){ return d.id === pendingIds[0]; })[0];
      var text = pendingIds.length === 1
        ? '你尚未繳納「' + nearest.title + '」的團費'
        : '你有 ' + pendingIds.length + ' 筆團費尚未繳納';
      document.getElementById('feeDueBannerText').textContent = text;
      banner.classList.remove('hidden');
    }

    document.getElementById('feeDueBanner').addEventListener('click', function(){
      document.getElementById('segTabOverview').click();
      document.getElementById('myFeeDuesWrap').scrollIntoView({ behavior: 'smooth' });
    });

    // ---------- 通知中心 ----------
    var notifDot = document.getElementById('notifDot');
    var notifSheetOverlay = document.getElementById('notifSheetOverlay');

    // 訪客沒有個人資料可查，通知鈴鐺整個隱藏（appbar 也會把按鈕本身藏起來，見下方身分驗證區塊）
    function renderNotifDot(){
      if (viewerState !== 'approved' && viewerState !== 'pending'){
        notifDot.classList.add('hidden');
        return;
      }
      var pendingCount = computePendingRsvpIds().length;
      var pendingFeeDueCount = computePendingFeeDueIds().length;
      var unreadAnnounceCount = latestAnnouncements.filter(function(item){
        return !notificationsReadAt || item.createdAt > notificationsReadAt;
      }).length;
      var total = pendingCount + pendingFeeDueCount + unreadAnnounceCount + pendingReviewCount;
      notifDot.textContent = total > 9 ? '9+' : String(total);
      notifDot.classList.toggle('hidden', total === 0);
      document.getElementById('notifBtn').setAttribute('aria-label',
        total === 0 ? '通知中心，沒有未讀' : '通知中心，' + total + ' 則未讀');
    }

    function renderNotifSheet(){
      var todoList = document.getElementById('notifTodoList');
      var pendingIds = computePendingRsvpIds();
      var rowsHtml = [];
      // 團員審核放最前面——只有 admin/owner 會有非 0 值（見下方訂閱條件），一般團員/指揮
      // 這裡永遠是空字串，不影響原本的出缺席回報待辦
      if (pendingReviewCount > 0){
        rowsHtml.push(
          '<button type="button" class="notif-row" data-notif-review="1">' +
            '<span class="dot"></span>' +
            '<span class="body">' +
              '<div class="title">團員審核</div>' +
              '<div class="meta">' + pendingReviewCount + ' 位團員待審核</div>' +
            '</span>' +
            '<span class="chev">›</span>' +
          '</button>'
        );
      }
      rowsHtml = rowsHtml.concat(pendingIds.map(function(id){
        var info = rsvpEventCache[id];
        var dateText = info.date ? (info.date.getMonth() + 1) + '/' + info.date.getDate() : '';
        return (
          '<button type="button" class="notif-row" data-notif-rsvp="' + id + '">' +
            '<span class="dot"></span>' +
            '<span class="body">' +
              '<div class="title">尚未回報出缺席</div>' +
              '<div class="meta">' + (dateText ? dateText + '（' + info.title + '）' : info.title) + '</div>' +
            '</span>' +
            '<span class="chev">›</span>' +
          '</button>'
        );
      }));
      rowsHtml = rowsHtml.concat(computePendingFeeDueIds().map(function(id){
        var due = myFeeDuesList.filter(function(d){ return d.id === id; })[0];
        return (
          '<button type="button" class="notif-row" data-notif-feedue="' + id + '">' +
            '<span class="dot"></span>' +
            '<span class="body">' +
              '<div class="title">尚未繳費</div>' +
              '<div class="meta">' + due.title + '（$' + feeDueAmountForMe(due).toLocaleString('zh-Hant') + '）</div>' +
            '</span>' +
            '<span class="chev">›</span>' +
          '</button>'
        );
      }));
      todoList.innerHTML = rowsHtml.length === 0
        ? '<div class="notif-empty">目前沒有待辦事項</div>'
        : rowsHtml.join('');

      var announceListEl = document.getElementById('notifAnnounceList');
      if (latestAnnouncements.length === 0){
        announceListEl.innerHTML = '<div class="notif-empty">目前沒有公告</div>';
      } else {
        var shown = latestAnnouncements.slice(0, NOTIF_ANNOUNCE_LIMIT);
        var rowsHtml = shown.map(function(item){
          var isUnread = !!unreadAnnounceIdsAtOpen[item.id];
          return (
            '<div class="notif-row" style="cursor:default;">' +
              '<span class="dot' + (isUnread ? '' : ' dot-read') + '"></span>' +
              '<span class="body">' +
                '<div class="title">' + item.content + '</div>' +
                '<div class="meta">' + formatRelativeTime(item.createdAt) + '</div>' +
              '</span>' +
            '</div>'
          );
        }).join('');
        var viewAllHtml = latestAnnouncements.length > NOTIF_ANNOUNCE_LIMIT
          ? '<button type="button" class="notif-viewall" id="notifViewAllBtn">查看全部 ›</button>' : '';
        announceListEl.innerHTML = rowsHtml + viewAllHtml;
        var viewAllBtn = document.getElementById('notifViewAllBtn');
        if (viewAllBtn){
          viewAllBtn.addEventListener('click', goToAnnouncements);
        }
      }
    }

    function goToAnnouncements(){
      closeNotifSheet();
      if (announceList.classList.contains('hidden')) announceMoreBtn.click();
      document.getElementById('announceWrap').scrollIntoView({ behavior: 'smooth' });
    }

    function markNotificationsRead(){
      notificationsReadAt = new Date();
      renderNotifDot();
      if (!viewerUid) return; // 訪客不會走到這裡（鈴鐺已隱藏），防呆用
      setDoc(doc(db, 'users', viewerUid), { notificationsReadAt: serverTimestamp() }, { merge: true })
        .catch(function(err){ console.error('標記通知已讀失敗', err); });
    }

    function openNotifSheet(){
      unreadAnnounceIdsAtOpen = computeUnreadAnnounceIds();
      renderNotifSheet();
      notifSheetOverlay.classList.add('active');
      markNotificationsRead();
