<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>布利歐管樂團｜公告管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F2EFE5">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<script src="./pwa-register.js" defer></script>
<style>
  :root{
    --ink:#20242F;
    --ink-soft:#4A4F5C;
    --paper:#F2EFE5;
    --paper-raised:#FBFAF4;
    --line:#DAD3BE;
    --brass:#B8863A;
    --brass-deep:#8F6A2C;
    --burgundy:#7A2331;
    --burgundy-deep:#5C1A26;
    --sage:#5F6E58;
    --sage-bg:#E7EBDF;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-card: 0 1px 2px rgba(32,36,47,.06), 0 8px 24px -12px rgba(32,36,47,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #EFE9D6 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding: 0 0 calc(48px + env(safe-area-inset-bottom));
  }

  button, a, textarea{ -webkit-tap-highlight-color: transparent; font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--brass-deep); outline-offset:2px; border-radius:6px; }

  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
  }

  .hidden{ display:none !important; }

  /* ---------- Skeleton placeholders ---------- */
  @keyframes skel-pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  .skel{ background:var(--line); animation:skel-pulse 1.4s ease-in-out infinite; }
  .avatar.skel{ animation:skel-pulse 1.4s ease-in-out infinite; }
  .skel-bar{ display:block; border-radius:5px; }
  @media (prefers-reduced-motion: reduce){
    .skel, .avatar.skel{ animation:none; opacity:.75; }
  }

  .appbar{ display:flex; align-items:center; gap:12px; padding:18px 20px 14px; }
  .mark{ width:38px; height:38px; flex:none; object-fit:cover; border-radius:50%; }
  .brandtext{ display:flex; flex-direction:column; line-height:1.1; }
  .brandtext .name{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:19px; letter-spacing:.02em; }
  .brandtext .sub{ font-family:'Roboto Mono',monospace; font-size:10.5px; letter-spacing:.14em; color:var(--ink-soft); margin-top:3px; text-transform:uppercase; }
  .appbar .spacer{ flex:1; }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px;
    border:2px solid var(--paper-raised); box-shadow:0 0 0 1.5px var(--line);
    padding:0; cursor:pointer;
  }

  .back-btn{
    width:30px; height:30px; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); text-decoration:none;
  }
  .brand-link{ display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }

  .staff{
    height:16px; margin:0 20px 6px;
    background-image: repeating-linear-gradient(var(--line), var(--line) 1px, transparent 1px, transparent 4px);
    opacity:.9;
  }


  .section-label{ display:flex; align-items:baseline; gap:8px; margin:20px 20px 4px; }
  .section-label .tw{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:15.5px; }
  .section-label .en{ font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }

  .card{
    margin:14px 20px 20px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:16px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{
    font-family:'Roboto Mono',monospace; font-size:10.5px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);
  }
  .field textarea{
    border:1px solid var(--line); background:var(--paper);
    border-radius:var(--radius-sm); padding:11px 13px;
    font-size:14px; color:var(--ink); width:100%;
    resize:vertical; min-height:80px; line-height:1.6;
  }

  .push-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-top:14px; padding-top:14px; border-top:1px solid var(--line);
  }
  .push-row .push-label{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .push-row .push-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .toggle-switch{
    position:relative; flex:none; width:44px; height:26px; border-radius:999px;
    border:none; padding:0; cursor:pointer; background:var(--line);
    transition:background .15s ease;
  }
  .toggle-switch .knob{
    position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:#fff; box-shadow:0 1px 2px rgba(32,36,47,.25);
    transition:transform .15s ease;
  }
  .toggle-switch.on{ background:var(--sage); }
  .toggle-switch.on .knob{ transform:translateX(18px); }

  .form-buttons{ display:flex; gap:10px; margin-top:14px; }
  .cta-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--brass); color:var(--ink); border:none;
    border-radius:var(--radius-md); padding:14px 16px;
    font-weight:700; font-size:14.5px; cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .cta-btn:hover{ background:#C7963F; }
  .cta-btn:active{ transform:scale(.98); background:var(--brass-deep); }
  .cta-btn:disabled{ opacity:.55; cursor:default; transform:none; }
  .cancel-btn{
    flex:none;
    background:none; border:1px solid var(--line); color:var(--ink-soft);
    border-radius:var(--radius-md); padding:14px 18px;
    font-weight:700; font-size:14px; cursor:pointer;
  }

  .form-error{
    margin-top:12px; font-size:12.5px; color:var(--burgundy);
    background:#FBF3F3; border:1px solid #EFD4D8; border-radius:var(--radius-sm);
    padding:10px 12px; display:none;
  }
  .form-error.show{ display:block; }

  .list{
    margin:0 20px 24px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .ann-item{ padding:14px 16px; }
  .ann-item + .ann-item{ border-top:1px solid var(--line); }
  .ann-text{ font-size:13.5px; color:var(--ink); line-height:1.6; white-space:pre-wrap; }
  .ann-meta{ margin-top:6px; font-size:11px; color:var(--ink-soft); font-family:'Roboto Mono',monospace; }
  .ann-actions{ display:flex; gap:8px; margin-top:10px; }
  .ann-actions button{
    flex:none;
    border-radius:var(--radius-sm); padding:6px 13px;
    font-weight:700; font-size:11.5px; cursor:pointer;
    background:none; border:1px solid var(--line); color:var(--ink-soft);
  }
  .btn-ann-delete{ color:var(--burgundy-deep); }

  .empty{ padding:36px 20px; text-align:center; font-size:13px; color:var(--ink-soft); }
</style>
</head>
<body>
<div class="app" id="appRoot">

  <div class="appbar">
    <a class="back-btn" href="admin-index.html" aria-label="回控制台首頁">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="brand-link" href="index.html">
      <img class="mark" src="assets/BrioLogo.jpg" alt="布利歐管樂團 Logo">
      <div class="brandtext">
        <div class="name">布利歐管樂團</div>
        <div class="sub">Brio Wind Band</div>
      </div>
    </a>
    <div class="spacer"></div>
    <button class="avatar skel" id="avatarBtn" type="button" aria-label="帳號選單"></button>
  </div>

  <div class="staff"></div>

  <div class="section-label">
    <span class="tw" id="formTitle">發布公告</span>
    <span class="en">Announcements</span>
  </div>

  <form class="card" id="annForm">
    <div class="field">
      <label>公告內容</label>
      <textarea id="annContent" placeholder="例如：團練提前至 13:30 開始" required></textarea>
    </div>
    <div class="push-row" id="pushRow">
      <div>
        <div class="push-label">發送推播通知</div>
        <div class="push-hint">開啟後，發布時會通知所有已訂閱推播的團員</div>
      </div>
      <button type="button" class="toggle-switch" id="pushToggle" aria-label="發送推播通知"><span class="knob"></span></button>
    </div>
    <p class="form-error" id="annFormError"></p>
    <div class="form-buttons">
      <button type="submit" class="cta-btn" id="annSubmitBtn">發布公告</button>
      <button type="button" class="cancel-btn hidden" id="annCancelBtn">取消</button>
    </div>
  </form>

  <div class="section-label">
    <span class="tw">所有公告</span>
    <span class="en">All Announcements</span>
  </div>

  <div class="list" id="annList"></div>

</div>

<script type="module">
  import { requireAdmin, peekCachedProfile } from './auth-guard.js';
  import { db } from './firebase-init.js';
  import { initAccountMenu } from './account-menu.js';
  import {
    collection, addDoc, doc, getDoc, updateDoc, deleteDoc, onSnapshot,
    query, orderBy, serverTimestamp
  } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  var annById = {};
  var editingId = null;
  var currentAdminUid = null;

  // 發布者查詢紀錄，供後台查看操作紀錄用（前台不顯示，見 schema.md 公告系統說明）。
  // 用 uid 快取姓名，避免每次 render() 都重新查一次；查詢中先回 null 不顯示，
  // 查到之後補一次 render() 補上名字
  var creatorNameCache = {};
  function getCreatorName(uid){
    if (!uid) return null;
    if (uid in creatorNameCache) return creatorNameCache[uid] || null;
    creatorNameCache[uid] = undefined;
    getDoc(doc(db, 'users', uid)).then(function(snap){
      creatorNameCache[uid] = snap.exists() ? (snap.data().name || snap.data().account || '未知') : '未知';
      render();
    }).catch(function(){
      creatorNameCache[uid] = '未知';
      render();
    });
    return null;
  }

  var SKELETON_ITEMS_HTML = [1, 2, 3].map(function(){
    return (
      '<div class="ann-item">' +
        '<span class="skel skel-bar" style="width:90%;height:13px;"></span>' +
        '<span class="skel skel-bar" style="width:60%;height:13px;margin-top:6px;"></span>' +
        '<span class="skel skel-bar" style="width:70px;height:10px;margin-top:8px;"></span>' +
      '</div>'
    );
  }).join('');

  var cachedProfile = peekCachedProfile();
  if (cachedProfile && cachedProfile.name){
    var avatarBtnEl = document.getElementById('avatarBtn');
    avatarBtnEl.textContent = cachedProfile.name.charAt(0);
    avatarBtnEl.classList.remove('skel');
  }

  var annForm = document.getElementById('annForm');
  var annFormError = document.getElementById('annFormError');
  var annSubmitBtn = document.getElementById('annSubmitBtn');
  var annCancelBtn = document.getElementById('annCancelBtn');
  var formTitle = document.getElementById('formTitle');
  var annList = document.getElementById('annList');
  annList.innerHTML = SKELETON_ITEMS_HTML;

  var pushRow = document.getElementById('pushRow');
  var pushToggle = document.getElementById('pushToggle');
  pushToggle.addEventListener('click', function(){
    pushToggle.classList.toggle('on');
  });

  function showFormError(message){
    annFormError.textContent = message;
    annFormError.classList.toggle('show', !!message);
  }

  function enterCreateMode(){
    editingId = null;
    annForm.reset();
    formTitle.textContent = '發布公告';
    annSubmitBtn.disabled = false;
    annSubmitBtn.textContent = '發布公告';
    annCancelBtn.classList.add('hidden');
    pushRow.classList.remove('hidden');
    pushToggle.classList.remove('on');
    showFormError('');
  }

  function enterEditMode(id){
    var ann = annById[id];
    if (!ann) return;
    editingId = id;
    document.getElementById('annContent').value = ann.content || '';
    formTitle.textContent = '編輯公告';
    annSubmitBtn.disabled = false;
    annSubmitBtn.textContent = '儲存變更';
    annCancelBtn.classList.remove('hidden');
    pushRow.classList.add('hidden');
    showFormError('');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  annCancelBtn.addEventListener('click', enterCreateMode);

  annForm.addEventListener('submit', function(e){
    e.preventDefault();
    showFormError('');

    var content = document.getElementById('annContent').value.trim();
    if (!content){
      showFormError('請輸入公告內容');
      return;
    }

    annSubmitBtn.disabled = true;
    annSubmitBtn.textContent = editingId ? '儲存中…' : '發布中…';

    var task = editingId
      ? updateDoc(doc(db, 'announcements', editingId), { content: content })
      : addDoc(collection(db, 'announcements'), {
          content: content,
          sendPush: pushToggle.classList.contains('on'),
          createdBy: currentAdminUid,
          createdAt: serverTimestamp()
        });

    task.then(function(){
      enterCreateMode();
    }).catch(function(error){
      annSubmitBtn.disabled = false;
      annSubmitBtn.textContent = editingId ? '儲存變更' : '發布公告';
      showFormError('操作失敗（' + error.code + '）');
    });
  });

  function formatRelativeTime(date){
    var diffMs = Date.now() - date.getTime();
    var minutes = Math.floor(diffMs / 60000);
    if (minutes < 1) return '剛剛';
    if (minutes < 60) return minutes + ' 分鐘前';
    var hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + ' 小時前';
    var days = Math.floor(hours / 24);
    if (days === 1) return '昨天';
    if (days < 7) return days + ' 天前';
    return date.toLocaleDateString('zh-TW', { month:'numeric', day:'numeric' });
  }

  // 網路壅塞等原因導致監聽失敗時呼叫，清掉骨架屏並明確告知，不要讓畫面卡住不動
  function renderAnnounceError(){
    annList.innerHTML = '<div class="empty">讀取失敗，請重新整理再試一次</div>';
  }

  function render(){
    var ids = Object.keys(annById);
    if (ids.length === 0){
      annList.innerHTML = '<div class="empty">目前沒有任何公告</div>';
      return;
    }

    ids.sort(function(a, b){
      var da = annById[a].createdAt ? annById[a].createdAt.getTime() : 0;
      var db_ = annById[b].createdAt ? annById[b].createdAt.getTime() : 0;
      return db_ - da;
    });

    annList.innerHTML = ids.map(function(id){
      var ann = annById[id];
      var creatorName = getCreatorName(ann.createdBy);
      var metaText = (ann.createdAt ? formatRelativeTime(ann.createdAt) : '') + (creatorName ? ' · ' + creatorName + ' 新增' : '');
      return (
        '<div class="ann-item">' +
          '<div class="ann-text">' + ann.content + '</div>' +
          '<div class="ann-meta">' + metaText + '</div>' +
          '<div class="ann-actions">' +
            '<button type="button" data-edit="' + id + '">編輯</button>' +
            '<button type="button" class="btn-ann-delete" data-delete="' + id + '">刪除</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  annList.addEventListener('click', function(e){
    var editBtn = e.target.closest('[data-edit]');
    var deleteBtn = e.target.closest('[data-delete]');

    if (editBtn){
      enterEditMode(editBtn.getAttribute('data-edit'));
    }
    if (deleteBtn){
      var id = deleteBtn.getAttribute('data-delete');
      var ok = confirm('確定要刪除這則公告嗎？此動作無法復原。');
      if (!ok) return;
      deleteBtn.disabled = true;
      deleteDoc(doc(db, 'announcements', id)).then(function(){
        if (editingId === id) enterCreateMode();
      }).catch(function(err){
        alert('刪除失敗：' + err.code);
        deleteBtn.disabled = false;
      });
    }
  });

  requireAdmin().then(function(result){
    if (!result) return;
    currentAdminUid = result.uid;

    var avatarBtn = document.getElementById('avatarBtn');
    avatarBtn.textContent = result.profile.name ? result.profile.name.charAt(0) : '?';
    avatarBtn.classList.remove('skel');
    initAccountMenu(result.profile.name);

    onSnapshot(query(collection(db, 'announcements'), orderBy('createdAt', 'desc')), function(snap){
      annById = {};
      snap.forEach(function(docSnap){
        var data = docSnap.data();
        annById[docSnap.id] = {
          content: data.content,
          createdAt: data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : null,
          createdBy: data.createdBy || null
        };
      });
      render();
    }, renderAnnounceError);
  });
</script>
</body>
</html>
