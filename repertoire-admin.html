<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>布利歐管樂團｜藏譜管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#F2EFE5">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<script src="./pwa-register.js" defer></script>
<style>
  :root{
    --ink:#20242F;
    --ink-soft:#4A4F5C;
    --paper:#F2EFE5;
    --paper-raised:#FBFAF4;
    --line:#DAD3BE;
    --brass:#B8863A;
    --brass-deep:#8F6A2C;
    --burgundy:#7A2331;
    --burgundy-deep:#5C1A26;
    --sage:#5F6E58;
    --sage-bg:#E7EBDF;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-card: 0 1px 2px rgba(32,36,47,.06), 0 8px 24px -12px rgba(32,36,47,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, #EFE9D6 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding: 0 0 calc(48px + env(safe-area-inset-bottom));
  }

  button, a, input{ -webkit-tap-highlight-color: transparent; font-family:inherit; }
  :focus-visible{ outline:2.5px solid var(--brass-deep); outline-offset:2px; border-radius:6px; }

  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    padding-top: env(safe-area-inset-top);
  }

  .hidden{ display:none !important; }

  @keyframes skel-pulse{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  .skel{ background:var(--line); animation:skel-pulse 1.4s ease-in-out infinite; }
  .avatar.skel{ animation:skel-pulse 1.4s ease-in-out infinite; }
  .skel-bar{ display:inline-block; border-radius:5px; }
  @media (prefers-reduced-motion: reduce){
    .skel, .avatar.skel{ animation:none; opacity:.75; }
  }
  .rp-skel-lines{ flex:1; display:flex; flex-direction:column; gap:7px; padding-top:2px; }

  .appbar{ display:flex; align-items:center; gap:12px; padding:18px 20px 14px; }
  /* 這頁的漢堡按鈕有 .hidden 擋著、理論上等身分驗證完成後跟 initAdminNav() 同一輪同步
     JS 一起執行，不會有 flash，但為了跟其他 admin-nav 頁面一致（那些頁面沒有 .hidden、
     初次繪製就會露出這顆按鈕，需要這份樣式先擋著避免看到瀏覽器原生方框），這裡也補上
     同一份定義，不依賴 admin-nav.js 動態注入的時機 */
  .admin-nav-btn{ width:30px; height:30px; flex:none; border:none; background:none; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer; padding:0; }
  .admin-nav-btn:active{ background:rgba(32,36,47,.06); }
  .mark{ width:38px; height:38px; flex:none; object-fit:cover; border-radius:50%; }
  .brandtext{ display:flex; flex-direction:column; line-height:1.1; }
  .brandtext .name{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:19px; letter-spacing:.02em; }
  .brandtext .sub{ font-family:'Roboto Mono',monospace; font-size:10.5px; letter-spacing:.14em; color:var(--ink-soft); margin-top:3px; text-transform:uppercase; }
  .appbar .spacer{ flex:1; }
  .avatar{
    width:38px; height:38px; border-radius:50%;
    background:var(--burgundy); color:#F2EFE5;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:14px;
    border:2px solid var(--paper-raised); box-shadow:0 0 0 1.5px var(--line);
    padding:0; cursor:pointer;
  }
  .back-btn{
    width:30px; height:30px; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink); text-decoration:none;
  }
  .brand-link{ display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; }

  .staff{
    height:16px; margin:0 20px 6px;
    background-image: repeating-linear-gradient(var(--line), var(--line) 1px, transparent 1px, transparent 4px);
    opacity:.9;
  }

  .section-label{ display:flex; align-items:baseline; gap:8px; margin:20px 20px 4px; }
  .section-label .tw{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:15.5px; }
  .section-label .en{ font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }
  .lede{ margin:6px 20px 10px; font-size:12.5px; line-height:1.6; color:var(--ink-soft); }
  .add-btn{
    margin-left:auto; align-self:center;
    border:1px solid var(--line); background:var(--paper); color:var(--brass-deep);
    border-radius:999px; padding:6px 14px; font-size:11.5px; font-weight:700; cursor:pointer;
  }
  .add-btn:active{ background:var(--sage-bg); }

  .list{
    margin:0 20px 24px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    overflow:hidden;
  }
  .rp-item{ padding:10px 10px 10px 16px; display:flex; align-items:center; gap:4px; }
  .rp-item + .rp-item{ border-top:1px solid var(--line); }
  .rp-open{ flex:1; min-width:0; background:none; border:none; padding:8px 0; text-align:left; cursor:pointer; }
  .rp-open:active{ opacity:.7; }
  .rp-title{ font-weight:700; font-size:13.5px; color:var(--ink); }
  .rp-meta{ margin-top:3px; font-size:11.5px; color:var(--ink-soft); }
  .empty{ padding:36px 20px; text-align:center; font-size:13px; color:var(--ink-soft); }

  .sheet-overlay{
    position:fixed; inset:0; z-index:80;
    background:rgba(32,36,47,.45);
    display:none; align-items:flex-end; justify-content:center;
  }
  .sheet-overlay.active{ display:flex; }
  .sheet{
    width:100%; max-width:460px; max-height:85vh;
    background:var(--paper-raised);
    border-radius:20px 20px 0 0;
    display:flex; flex-direction:column;
    box-shadow:0 -10px 30px rgba(32,36,47,.3);
  }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:999px; margin:10px auto 2px; }
  .sheet-header{ position:relative; padding:6px 44px 12px 20px; border-bottom:1px solid var(--line); }
  .sheet-header .name{ font-family:'Noto Serif TC',serif; font-weight:700; font-size:16px; }
  .sheet-close{
    position:absolute; top:4px; right:10px;
    width:30px; height:30px; border-radius:50%; border:none; background:none;
    color:var(--ink-soft); font-size:19px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .sheet-close:active{ background:var(--paper); }
  .sheet-body{ overflow-y:auto; padding:14px 20px 8px; }

  .field{ margin-top:12px; display:flex; flex-direction:column; gap:6px; }
  .field:first-child{ margin-top:0; }
  .field label{
    font-family:'Roboto Mono',monospace; font-size:10.5px; font-weight:600;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);
  }
  .field input, .field select{
    border:1px solid var(--line); background:var(--paper);
    border-radius:var(--radius-sm); padding:11px 13px;
    font-size:14px; color:var(--ink); width:100%;
  }

  .info-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:9px 0; font-size:13px; border-bottom:1px solid var(--line); }
  .info-row .k{ flex:none; color:var(--ink-soft); font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.05em; }
  .info-row .v{ font-weight:500; color:var(--ink); text-align:right; }
  .info-edit-btn{
    border:1px solid var(--line); background:var(--paper); color:var(--brass-deep);
    border-radius:999px; padding:8px 18px; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .info-edit-btn:active{ background:var(--sage-bg); }
  .info-edit-row{ display:flex; gap:8px; margin-top:14px; }
  #pieceDeleteBtn{ color:var(--burgundy-deep); border-color:#EFD4D8; }

  .survey-section-label{
    font-family:'Roboto Mono',monospace; font-size:10.5px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);
    margin:16px 0 8px;
  }

  .form-error{
    margin-top:12px; font-size:12.5px; color:var(--burgundy);
    background:#FBF3F3; border:1px solid #EFD4D8; border-radius:var(--radius-sm);
    padding:10px 12px; display:none;
  }
  .form-error.show{ display:block; }

  .part-group-label{
    font-family:'Roboto Mono',monospace; font-size:10px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin:14px 0 4px;
  }
  .part-row{ display:flex; align-items:center; gap:10px; padding:8px 2px; border-bottom:1px solid var(--line); }
  .part-row:last-child{ border-bottom:none; }
  .part-label{ flex:1; font-size:12.5px; color:var(--ink); }
  .part-view-meta{ margin-top:3px; font-size:11px; color:var(--ink-soft); font-weight:400; }
  .part-remove{
    flex:none; width:22px; height:22px; border-radius:50%; border:none; background:none;
    color:var(--ink-soft); cursor:pointer; font-size:15px; line-height:1;
  }
  .part-remove:active{ color:var(--burgundy-deep); }
  .part-add-row{ display:flex; gap:8px; margin-top:10px; }
  .part-add-row select{
    flex:1; border:1px solid var(--line); background:var(--paper);
    border-radius:var(--radius-sm); padding:9px 10px; font-size:13px; color:var(--ink);
  }
  .part-add-row input{
    flex:1; min-width:0; border:1px solid var(--line); background:var(--paper);
    border-radius:var(--radius-sm); padding:9px 10px; font-size:13px; color:var(--ink);
  }
  .part-add-btn{
    flex:none; border:1px solid var(--line); background:var(--paper); color:var(--brass-deep);
    border-radius:var(--radius-sm); padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .part-add-btn:active{ background:var(--sage-bg); }
  .part-empty{ padding:8px 2px; font-size:12px; color:var(--ink-soft); }

  .part-row-view{ justify-content:space-between; }
  .part-sheet-actions{ display:flex; gap:6px; flex:none; }
  .part-sheet-btn{
    border:1px solid var(--line); background:var(--paper); color:var(--brass-deep);
    border-radius:999px; padding:5px 11px; font-size:11px; font-weight:700; cursor:pointer;
    font-family:inherit; white-space:nowrap; text-decoration:none; display:inline-block;
  }
  .part-sheet-btn:active{ background:var(--sage-bg); }
  .part-sheet-btn.view{ color:var(--sage); }
  .part-sheet-btn.danger{ color:var(--burgundy-deep); }
  .part-sheet-btn.upload{ background:var(--brass); color:var(--ink); border-color:var(--brass); }

  .sheet-footer{
    display:flex; gap:10px;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .cta-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--brass); color:var(--ink); border:none;
    border-radius:var(--radius-md); padding:14px 16px;
    font-weight:700; font-size:14.5px; cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .cta-btn:active{ transform:scale(.98); background:var(--brass-deep); }
  .cta-btn:disabled{ opacity:.55; cursor:default; transform:none; }
  .cta-btn-secondary{ background:var(--paper); color:var(--ink-soft); border:1px solid var(--line); }
  .cta-btn-secondary:active{ transform:scale(.98); background:var(--paper); }

  .rp-layout-toggle{
    width:30px; height:30px; flex:none; border-radius:50%; border:none;
    background:none; color:var(--ink); display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0;
  }
  .rp-layout-toggle:active{ background:rgba(32,36,47,.06); }

  .rp-detail-empty{ display:none; }

  /* ---------- 電腦版排版（手動切換，不依螢幕寬度自動判斷）----------
     這輪只做藏譜管理試點：左欄曲目清單、右欄詳情，右欄預設空狀態，點了曲目才顯示內容。
     刻意不用 media query——這是使用者手動開關的正式功能，不是純粹依視窗寬度的 RWD */
  body.layout-desktop .app{ max-width:960px; }
  body.layout-desktop .rp-layout{ display:flex; align-items:stretch; gap:0; }
  body.layout-desktop .list{
    width:300px; flex:none; margin:0; border-radius:0; border:none; border-right:1px solid var(--line);
    box-shadow:none; max-height:calc(100vh - 200px); overflow-y:auto;
  }
  body.layout-desktop .rp-detail-empty.show{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; color:var(--ink-soft); text-align:center; padding:40px;
  }
  body.layout-desktop #pieceSheetOverlay{
    position:static; inset:auto; background:none; display:none; flex:1; align-items:stretch; justify-content:stretch;
  }
  body.layout-desktop #pieceSheetOverlay.active{ display:flex; }
  body.layout-desktop #pieceSheetOverlay .sheet{
    width:100%; max-width:none; max-height:none; border-radius:0; box-shadow:none; border-left:1px solid var(--line);
  }
  body.layout-desktop #pieceSheetOverlay .sheet-handle{ display:none; }
</style>
</head>
<body>
<div class="app" id="appRoot">

  <div class="appbar">
    <button class="admin-nav-btn hidden" id="adminNavBtn" type="button" aria-label="開啟後台導覽選單">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="back-btn" id="backBtn" href="admin-index.html" aria-label="回控制台首頁">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="m15 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="brand-link" href="index.html">
      <img class="mark" src="assets/BrioLogo.jpg" alt="布利歐管樂團 Logo">
      <div class="brandtext">
        <div class="name">布利歐管樂團</div>
        <div class="sub">Brio Wind Band</div>
      </div>
    </a>
    <div class="spacer"></div>
    <button type="button" class="rp-layout-toggle" id="rpLayoutToggleBtn" title="切換手機版／電腦版排版" aria-label="切換手機版／電腦版排版">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M9 4v16" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="avatar skel" id="avatarBtn" type="button" aria-label="帳號選單"></button>
  </div>

  <div class="staff"></div>

  <div class="section-label">
    <span class="tw">藏譜管理</span>
    <span class="en">Repertoire</span>
    <button type="button" class="add-btn" id="createPieceBtn">＋ 新增曲目</button>
  </div>
  <p class="lede">藏譜資料庫，可以直接在這裡設定曲目與分部資訊。</p>

  <div class="rp-layout" id="rpLayout">
    <div class="list" id="pieceList"></div>
    <div class="rp-detail-empty show" id="pieceDetailEmpty">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" opacity=".5"><path d="M9 18V5l11-2v13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.4"/><circle cx="17" cy="16" r="3" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>請先從左側選擇曲目</span>
    </div>
    <div class="sheet-overlay" id="pieceSheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <button type="button" class="sheet-close" id="pieceSheetClose" aria-label="關閉">×</button>
      <div class="name" id="pieceSheetTitle">新增曲目</div>
    </div>
    <div class="sheet-body">
      <div id="pieceViewMode" class="hidden">
        <div class="info-row"><span class="k">作曲/編曲</span><span class="v" id="pieceViewComposer">—</span></div>
        <div class="survey-section-label">分部欄位</div>
        <div id="pieceViewParts"></div>
        <div class="info-edit-row">
          <button type="button" class="info-edit-btn" id="pieceEditBtn">✎ 編輯</button>
          <button type="button" class="info-edit-btn" id="pieceDeleteBtn">刪除</button>
        </div>
      </div>
      <div id="pieceEditForm">
        <div class="field">
          <label>曲名</label>
          <input type="text" id="pieceTitle" placeholder="例如：星際大戰組曲" required>
        </div>
        <div class="field">
          <label>作曲/編曲者（選填）</label>
          <input type="text" id="pieceComposer" placeholder="例如：John Williams">
        </div>
        <div class="field">
          <label>分部欄位</label>
          <div id="partGroups"></div>
          <div class="part-add-row">
            <select id="partInstrumentSelect"></select>
            <input type="text" id="partLabelInput" placeholder="例如：單簧管 1st">
            <button type="button" class="part-add-btn" id="partAddBtn">＋ 新增</button>
          </div>
        </div>
        <p class="form-error" id="pieceFormError"></p>
      </div>
    </div>
    <div class="sheet-footer" id="pieceFormFooter">
      <button type="button" class="cta-btn cta-btn-secondary hidden" id="pieceCancelBtn">取消</button>
      <button type="button" class="cta-btn" id="pieceSaveBtn">建立曲目</button>
    </div>
    </div>
  </div>
</div>
</div>

<input type="file" id="sheetMusicFileInput" accept="application/pdf" class="hidden">

<script type="module">
  import { initAdminNav } from './admin-nav.js';
  import { showToast } from './toast.js';
  import { requireAdminOrSheetMusicManager, peekCachedProfile } from './auth-guard.js';
  import { db, storage } from './firebase-init.js';
  import { initAccountMenu } from './account-menu.js';
  import { subscribeRepertoire, addPiece, updatePiece, deletePiece, randomPartId, uploadPartSheetMusic, deletePartSheetMusic } from './repertoire.js';
  import { subscribeInstruments, FAMILY_LABELS, FAMILY_ORDER } from './instruments.js';

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  // ---------- 電腦版/手機版排版手動切換（正式功能，不依螢幕寬度自動判斷）----------
  // 選過一次之後記住在 localStorage；沒選過時的預設值＝目前視窗實際寬度，讓大部分人
  // 第一次打開就看到符合自己裝置的版面，只有真的要跨版面檢查排版時才需要手動切
  var LAYOUT_MODE_KEY = 'brio_repertoire_layout_mode';

  function getInitialLayoutMode(){
    try {
      var saved = localStorage.getItem(LAYOUT_MODE_KEY);
      if (saved === 'mobile' || saved === 'desktop') return saved;
    } catch (e) {}
    return window.innerWidth >= 900 ? 'desktop' : 'mobile';
  }

  function applyLayoutMode(mode){
    document.body.classList.toggle('layout-desktop', mode === 'desktop');
  }

  var currentLayoutMode = getInitialLayoutMode();
  applyLayoutMode(currentLayoutMode);

  document.getElementById('rpLayoutToggleBtn').addEventListener('click', function(){
    currentLayoutMode = currentLayoutMode === 'desktop' ? 'mobile' : 'desktop';
    applyLayoutMode(currentLayoutMode);
    try { localStorage.setItem(LAYOUT_MODE_KEY, currentLayoutMode); } catch (e) {}
  });

  var SKELETON_ROWS_HTML = [1, 2, 3].map(function(){
    return (
      '<div class="rp-item"><div class="rp-skel-lines">' +
        '<span class="skel skel-bar" style="width:45%;height:13px;"></span>' +
        '<span class="skel skel-bar" style="width:25%;height:10px;"></span>' +
      '</div></div>'
    );
  }).join('');

  var cachedProfile = peekCachedProfile();
  if (cachedProfile && cachedProfile.name){
    var avatarBtnEl = document.getElementById('avatarBtn');
    avatarBtnEl.textContent = cachedProfile.name.charAt(0);
    avatarBtnEl.classList.remove('skel');
  }

  var currentAdminUid = null;
  var piecesById = {};
  var piecesList = [];
  var piecesLoaded = false;
  var editingPieceId = null; // null = 新增模式
  var draftParts = []; // [{partId, instrumentName, label}]，編輯中的分部欄位草稿
  var instrumentsList = [];

  function renderPartInstrumentOptions(){
    var current = document.getElementById('partInstrumentSelect').value;
    document.getElementById('partInstrumentSelect').innerHTML = instrumentsList.map(function(inst){
      return '<option value="' + escapeHtml(inst.name) + '">' + escapeHtml(inst.name) + '</option>';
    }).join('');
    if (current && instrumentsList.some(function(i){ return i.name === current; })){
      document.getElementById('partInstrumentSelect').value = current;
    }
  }

  // 分部欄位依樂器分組（建立/編輯表單跟唯讀摘要共用同一套分組邏輯）
  function groupPartsByInstrument(parts){
    var byInstrument = {};
    var order = [];
    parts.forEach(function(part){
      if (!byInstrument[part.instrumentName]){
        byInstrument[part.instrumentName] = [];
        order.push(part.instrumentName);
      }
      byInstrument[part.instrumentName].push(part);
    });
    return { byInstrument: byInstrument, order: order };
  }

  // 分部欄位依樂器分組顯示（比照 roles-admin.html 樂器清單依 family 分組的做法，這裡是依
  // instrumentName 分組），組內維持新增順序，不提供排序按鈕——這輪範圍不需要
  function renderPartGroups(){
    var container = document.getElementById('partGroups');
    if (draftParts.length === 0){
      container.innerHTML = '<div class="part-empty">還沒有任何分部欄位</div>';
      return;
    }
    var grouped = groupPartsByInstrument(draftParts);
    container.innerHTML = grouped.order.map(function(instrumentName){
      return (
        '<div class="part-group-label">' + escapeHtml(instrumentName) + '</div>' +
        grouped.byInstrument[instrumentName].map(function(part){
          return (
            '<div class="part-row">' +
              '<span class="part-label">' + escapeHtml(part.label) + '</span>' +
              '<button type="button" class="part-remove" data-remove-part="' + part.partId + '" aria-label="刪除分部欄位">×</button>' +
            '</div>'
          );
        }).join('')
      );
    }).join('');
  }

  // 8/26 原本設計是「一個樂器一行」（超過一個分部才補一行小字列標籤），這輪因為每個
  // 分部（partId）各自有獨立的樂譜檔案操作，改成「一個分部一行」才放得下操作按鈕——
  // 這是對已上線版面的必要調整，已用 Artifact 示意稿跟使用者確認過
  function renderPieceViewParts(parts){
    var container = document.getElementById('pieceViewParts');
    if (!parts || parts.length === 0){
      container.innerHTML = '<div class="part-empty">尚未設定分部欄位</div>';
      return;
    }
    var grouped = groupPartsByInstrument(parts);
    container.innerHTML = grouped.order.map(function(instrumentName){
      return (
        '<div class="part-group-label">' + escapeHtml(instrumentName) + '</div>' +
        grouped.byInstrument[instrumentName].map(function(part){
          var actionsHtml = part.sheetMusicUrl
            ? (
                '<a class="part-sheet-btn view" href="' + escapeHtml(part.sheetMusicUrl) + '" target="_blank" rel="noopener">檢視</a>' +
                '<button type="button" class="part-sheet-btn" data-sheet-upload="' + part.partId + '">更換</button>' +
                '<button type="button" class="part-sheet-btn danger" data-sheet-remove="' + part.partId + '">移除</button>'
              )
            : '<button type="button" class="part-sheet-btn upload" data-sheet-upload="' + part.partId + '">上傳樂譜</button>';
          return (
            '<div class="part-row part-row-view">' +
              '<span class="part-label">' + escapeHtml(part.label) + '</span>' +
              '<div class="part-sheet-actions">' + actionsHtml + '</div>' +
            '</div>'
          );
        }).join('')
      );
    }).join('');
  }

  // 大部分樂器同一份譜只有 1 個分部，不需要手動打標籤——選樂器後自動把標籤帶入樂器名稱，
  // 直接按「＋ 新增」即可；只有分部（1st/2nd）時才需要手動改標籤文字。
  // partLabelAutoFilled 記錄「目前標籤欄位是不是還維持著自動帶入、沒被手動改過的值」，
  // 判斷切換樂器時要不要跟著更新自動帶入的文字，或是尊重使用者已經手動輸入的內容
  var partLabelAutoFilled = '';

  function syncPartLabelAutoFill(){
    var select = document.getElementById('partInstrumentSelect');
    var labelInput = document.getElementById('partLabelInput');
    if (labelInput.value === '' || labelInput.value === partLabelAutoFilled){
      partLabelAutoFilled = select.value;
      labelInput.value = select.value;
    }
  }

  function resetPartAddRow(){
    document.getElementById('partLabelInput').value = '';
    partLabelAutoFilled = '';
    syncPartLabelAutoFill();
  }

  // 新增分部欄位後，標籤只清空、不重新帶入樂器名稱——連續新增同一個樂器的多個分部
  // （1st/2nd/3rd）時，如果每次新增完都自動帶回樂器名稱，看起來會像是準備重複新增
  // 一筆一樣的分部。重新帶入的時機只保留在「切換樂器」跟「開啟表單」這兩種情境
  function clearPartLabelAfterAdd(){
    document.getElementById('partLabelInput').value = '';
    partLabelAutoFilled = '';
  }

  document.getElementById('partInstrumentSelect').addEventListener('change', syncPartLabelAutoFill);

  document.getElementById('partAddBtn').addEventListener('click', function(){
    var instrumentName = document.getElementById('partInstrumentSelect').value;
    var label = document.getElementById('partLabelInput').value.trim();
    if (!instrumentName){
      showFormError('請先在「樂器/聲部」新增至少一種樂器才能設定分部欄位');
      return;
    }
    if (!label){
      showFormError('請輸入分部欄位名稱');
      return;
    }
    showFormError('');
    draftParts.push({ partId: randomPartId(), instrumentName: instrumentName, label: label });
    clearPartLabelAfterAdd();
    renderPartGroups();
  });

  document.getElementById('partGroups').addEventListener('click', function(e){
    var btn = e.target.closest('[data-remove-part]');
    if (!btn) return;
    var partId = btn.getAttribute('data-remove-part');
    var removedPart = draftParts.filter(function(p){ return p.partId === partId; })[0];
    draftParts = draftParts.filter(function(p){ return p.partId !== partId; });
    renderPartGroups();
    // 分部欄位本身刪掉了，底下掛的樂譜檔案也一併清掉，不留孤兒檔案；不擋 UI、也不等它
    // 完成——刪除 Storage 檔案失敗不影響「這個分部欄位已經從草稿移除」這件事，使用者按
    // 「儲存變更」後 Firestore 的 parts 陣列本來就不會再有這個 partId
    if (removedPart && removedPart.sheetMusicUrl){
      deletePartSheetMusic(storage, removedPart.sheetMusicUrl).catch(function(err){
        console.error('刪除分部樂譜檔案失敗', err);
      });
    }
  });

  var pieceList = document.getElementById('pieceList');
  pieceList.innerHTML = SKELETON_ROWS_HTML;

  function renderPieceAdminError(){
    pieceList.innerHTML = '<div class="empty">讀取失敗，請重新整理再試一次</div>';
  }

  function renderPieceList(){
    if (!piecesLoaded) return;
    if (piecesList.length === 0){
      pieceList.innerHTML = '<div class="empty">目前還沒有任何曲目</div>';
      return;
    }
    pieceList.innerHTML = piecesList.map(function(p){
      return (
        '<div class="rp-item">' +
          '<button type="button" class="rp-open" data-open-piece="' + p.id + '">' +
            '<div class="rp-title">' + escapeHtml(p.title) + '</div>' +
            '<div class="rp-meta">' + (p.composer ? escapeHtml(p.composer) + ' · ' : '') + (p.parts || []).length + ' 個分部欄位</div>' +
          '</button>' +
        '</div>'
      );
    }).join('');
  }

  function showFormError(message){
    var el = document.getElementById('pieceFormError');
    el.textContent = message;
    el.classList.toggle('show', !!message);
  }

  var pieceSheetOverlay = document.getElementById('pieceSheetOverlay');
  var pieceDetailEmpty = document.getElementById('pieceDetailEmpty');

  // 電腦版排版下，右欄「請先從左側選擇曲目」的空狀態只在 sheet 沒開的時候顯示；
  // 手機版排版下這個元素本來就靠 CSS 一律隱藏（.rp-detail-empty{display:none}），
  // 呼叫這個函式不會有任何畫面差異，兩種排版共用同一套呼叫時機
  function updateDetailEmptyVisibility(){
    pieceDetailEmpty.classList.toggle('show', !pieceSheetOverlay.classList.contains('active'));
  }
  var pieceTitleInput = document.getElementById('pieceTitle');
  var pieceComposerInput = document.getElementById('pieceComposer');
  var pieceSaveBtn = document.getElementById('pieceSaveBtn');
  var pieceDeleteBtn = document.getElementById('pieceDeleteBtn');
  var pieceCancelBtn = document.getElementById('pieceCancelBtn');
  var pieceViewMode = document.getElementById('pieceViewMode');
  var pieceEditForm = document.getElementById('pieceEditForm');
  var pieceFormFooter = document.getElementById('pieceFormFooter');
  var pieceViewComposer = document.getElementById('pieceViewComposer');

  function showPieceView(p){
    pieceViewMode.classList.remove('hidden');
    pieceEditForm.classList.add('hidden');
    pieceFormFooter.classList.add('hidden');
    document.getElementById('pieceSheetTitle').textContent = p.title || '—';
    pieceViewComposer.textContent = p.composer || '未填寫';
    renderPieceViewParts(p.parts || []);
  }

  function showPieceEditForm(){
    pieceViewMode.classList.add('hidden');
    pieceEditForm.classList.remove('hidden');
    pieceFormFooter.classList.remove('hidden');
  }

  function openCreateSheet(){
    editingPieceId = null;
    pieceTitleInput.value = '';
    pieceComposerInput.value = '';
    draftParts = [];
    document.getElementById('pieceSheetTitle').textContent = '新增曲目';
    pieceSaveBtn.textContent = '建立曲目';
    pieceCancelBtn.classList.add('hidden'); // 新增沒有「唯讀」畫面可以取消回去，只有關閉整個 sheet
    showFormError('');
    resetPartAddRow();
    renderPartGroups();
    showPieceEditForm();
    pieceSheetOverlay.classList.add('active');
    updateDetailEmptyVisibility();
  }

  // 點清單裡的曲目，先看唯讀摘要，點「✎ 編輯」才進表單，不會一點開就是可編輯狀態
  function openEditSheet(pieceId){
    var p = piecesById[pieceId];
    if (!p) return;
    editingPieceId = pieceId;
    pieceSaveBtn.textContent = '儲存變更';
    pieceCancelBtn.classList.remove('hidden');
    showFormError('');
    showPieceView(p);
    pieceSheetOverlay.classList.add('active');
    updateDetailEmptyVisibility();
  }

  document.getElementById('pieceEditBtn').addEventListener('click', function(){
    if (!editingPieceId) return;
    var p = piecesById[editingPieceId];
    if (!p) return;
    pieceTitleInput.value = p.title || '';
    pieceComposerInput.value = p.composer || '';
    draftParts = (p.parts || []).slice();
    resetPartAddRow();
    renderPartGroups();
    showPieceEditForm();
  });

  pieceCancelBtn.addEventListener('click', function(){
    if (!editingPieceId) return;
    var p = piecesById[editingPieceId];
    if (p) showPieceView(p); // 放棄未存檔的草稿，回到唯讀摘要
  });

  function closePieceSheet(){
    pieceSheetOverlay.classList.remove('active');
    updateDetailEmptyVisibility();
  }

  document.getElementById('createPieceBtn').addEventListener('click', openCreateSheet);
  document.getElementById('pieceSheetClose').addEventListener('click', closePieceSheet);
  pieceSheetOverlay.addEventListener('click', function(e){
    if (e.target === pieceSheetOverlay) closePieceSheet();
  });

  pieceList.addEventListener('click', function(e){
    var openBtn = e.target.closest('[data-open-piece]');
    if (openBtn) openEditSheet(openBtn.getAttribute('data-open-piece'));
  });

  pieceSaveBtn.addEventListener('click', function(){
    var title = pieceTitleInput.value.trim();
    var composer = pieceComposerInput.value.trim();
    if (!title){
      showFormError('請輸入曲名');
      return;
    }
    showFormError('');
    pieceSaveBtn.disabled = true;

    var task = editingPieceId
      ? updatePiece(db, editingPieceId, title, composer, draftParts)
      : addPiece(db, currentAdminUid, title, composer, draftParts);

    task.then(function(){
      pieceSaveBtn.disabled = false;
      closePieceSheet();
    }).catch(function(err){
      pieceSaveBtn.disabled = false;
      showFormError('操作失敗（' + err.code + '）');
    });
  });

  pieceDeleteBtn.addEventListener('click', function(){
    if (!editingPieceId) return;
    var p = piecesById[editingPieceId];
    var ok = confirm(
      '確定要刪除「' + (p ? p.title : '這首曲目') + '」嗎？\n' +
      '已經在某場音樂會引用過這首曲子的資料不會被清掉，只是往後那場音樂會的曲目管理會顯示「（曲目已刪除）」。\n' +
      '此動作無法復原。'
    );
    if (!ok) return;
    pieceDeleteBtn.disabled = true;
    var sheetMusicUrls = ((p && p.parts) || []).map(function(part){ return part.sheetMusicUrl; }).filter(function(url){ return url; });
    deletePiece(db, editingPieceId).then(function(){
      pieceDeleteBtn.disabled = false;
      closePieceSheet();
      // 曲目文件刪掉之後才清 Storage 檔案：如果曲目本身刪除失敗（例如權限問題），
      // 樂譜檔案不會被誤刪
      sheetMusicUrls.forEach(function(url){
        deletePartSheetMusic(storage, url).catch(function(err){
          console.error('刪除分部樂譜檔案失敗', err);
        });
      });
    }).catch(function(err){
      pieceDeleteBtn.disabled = false;
      showToast('刪除失敗：' + err.code, 'error');
    });
  });

  // 樂譜上傳只在「唯讀摘要」畫面操作（editingPieceId 一定有值，因為只有 openEditSheet()
  // 會顯示 pieceViewMode），跟編輯分部結構（新增/刪除分部欄位）分開流程；編輯模式裡
  // 新增、還沒存檔的草稿分部不會出現在 pieceViewParts 裡，天生就不能上傳，
  // 不會有「取消存檔但 Storage 已經有孤兒檔案」的情況
  var sheetMusicFileInput = document.getElementById('sheetMusicFileInput');
  var pendingSheetPartId = null;
  var sheetMusicUploadInFlight = {}; // partId -> true，避免同一個分部重複點擊上傳

  function validateSheetMusicFile(file){
    if (file.type !== 'application/pdf'){
      showToast('只能上傳 PDF 檔案', 'error');
      return false;
    }
    if (file.size >= 10 * 1024 * 1024){
      showToast('檔案大小不能超過 10MB', 'error');
      return false;
    }
    return true;
  }

  function uploadSheetMusic(partId, file){
    if (sheetMusicUploadInFlight[partId]) return;
    if (!validateSheetMusicFile(file)) return;
    var targetPieceId = editingPieceId;
    var p = piecesById[targetPieceId];
    if (!p) return;
    sheetMusicUploadInFlight[partId] = true;
    uploadPartSheetMusic(storage, targetPieceId, partId, file).then(function(url){
      var updatedParts = p.parts.map(function(part){
        return part.partId === partId
          ? Object.assign({}, part, { sheetMusicUrl: url, sheetMusicUploadedBy: currentAdminUid })
          : part;
      });
      return updatePiece(db, targetPieceId, p.title, p.composer, updatedParts).then(function(){
        if (editingPieceId === targetPieceId) renderPieceViewParts(updatedParts);
        showToast('樂譜已上傳', 'success');
      });
    }).catch(function(err){
      showToast('上傳失敗：' + err.code, 'error');
    }).finally(function(){
      delete sheetMusicUploadInFlight[partId];
    });
  }

  function removeSheetMusic(partId){
    if (sheetMusicUploadInFlight[partId]) return;
    var targetPieceId = editingPieceId;
    var p = piecesById[targetPieceId];
    if (!p) return;
    var part = p.parts.filter(function(x){ return x.partId === partId; })[0];
    if (!part || !part.sheetMusicUrl) return;
    sheetMusicUploadInFlight[partId] = true;
    deletePartSheetMusic(storage, part.sheetMusicUrl).catch(function(err){
      // Storage 物件可能已經不存在（例如手動在 Firebase Console 刪過），
      // 不擋住後續的 Firestore 欄位清理
      console.error('刪除 Storage 檔案失敗', err);
    }).then(function(){
      var updatedParts = p.parts.map(function(x){
        return x.partId === partId
          ? Object.assign({}, x, { sheetMusicUrl: null, sheetMusicUploadedBy: null })
          : x;
      });
      return updatePiece(db, targetPieceId, p.title, p.composer, updatedParts);
    }).then(function(){
      if (editingPieceId === targetPieceId) renderPieceViewParts(p.parts.map(function(x){
        return x.partId === partId ? Object.assign({}, x, { sheetMusicUrl: null, sheetMusicUploadedBy: null }) : x;
      }));
      showToast('樂譜已移除', 'success');
    }).catch(function(err){
      showToast('移除失敗：' + err.code, 'error');
    }).finally(function(){
      delete sheetMusicUploadInFlight[partId];
    });
  }

  document.getElementById('pieceViewParts').addEventListener('click', function(e){
    var uploadBtn = e.target.closest('[data-sheet-upload]');
    if (uploadBtn){
      pendingSheetPartId = uploadBtn.getAttribute('data-sheet-upload');
      sheetMusicFileInput.click();
      return;
    }
    var removeBtn = e.target.closest('[data-sheet-remove]');
    if (removeBtn){
      var ok = confirm('確定要移除這個分部的樂譜檔案嗎？此動作無法復原。');
      if (ok) removeSheetMusic(removeBtn.getAttribute('data-sheet-remove'));
    }
  });

  sheetMusicFileInput.addEventListener('change', function(e){
    var file = e.target.files[0];
    e.target.value = ''; // 清空，允許連續選同一個檔案也能再次觸發 change
    if (file && pendingSheetPartId) uploadSheetMusic(pendingSheetPartId, file);
    pendingSheetPartId = null;
  });

  requireAdminOrSheetMusicManager().then(function(result){
    if (!result) return;
    currentAdminUid = result.uid;

    var avatarBtn = document.getElementById('avatarBtn');
    avatarBtn.textContent = result.profile.name ? result.profile.name.charAt(0) : '?';
    avatarBtn.classList.remove('skel');

    // 非 admin-tier（例如純譜務身分的一般團員）沒有其他 8 個後台頁面的權限：
    // 側滑選單顯示了也大部分點不動，返回箭頭也不能連去 admin-index.html
    // （會被那頁的 requireAdmin() 擋下），比照 conductor-admin.html 既有的雙模式寫法
    var isAdmin = result.profile.role === 'admin' || result.profile.role === 'owner';
    initAccountMenu(result.profile.name, isAdmin ? 'admin-index.html' : null, null);
    if (isAdmin) {
      document.getElementById('adminNavBtn').classList.remove('hidden');
      initAdminNav('repertoire');
    } else {
      var backBtn = document.getElementById('backBtn');
      backBtn.setAttribute('href', 'index.html');
      backBtn.setAttribute('aria-label', '回團員首頁');
    }

    subscribeRepertoire(db, function(pieces){
      piecesById = {};
      piecesList = pieces.slice();
      pieces.forEach(function(p){ piecesById[p.id] = p; });
      piecesList.sort(function(a, b){ return (a.title || '').localeCompare(b.title || '', 'zh-Hant'); });
      piecesLoaded = true;
      renderPieceList();
    }, renderPieceAdminError);

    // 分部欄位的樂器下拉選單來源，跟 roles-admin.html 讀同一份 settings/instruments；
    // 這裡不需要 seedIfMissing（true 的那個參數只給第一次建立清單的頁面用，這裡只是讀取）
    subscribeInstruments(db, function(list){
      instrumentsList = list;
      renderPartInstrumentOptions();
    }, false, function(err){ console.error('instruments 監聽失敗', err); });
  });
</script>
</body>
</html>
